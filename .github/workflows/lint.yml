name: Lint

on:
  push:
    branches: [main, master]
    paths:
      - "src/**/*.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/lint.yml"
  pull_request:
    paths:
      - "src/**/*.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/lint.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      # Only the locked dev tools are installed; the project itself is not needed to lint.
      - name: Ruff lint
        run: uv run --locked --only-group dev --python 3.12 ruff check src/

      - name: Ruff format check
        run: uv run --locked --only-group dev --python 3.12 ruff format --check src/
