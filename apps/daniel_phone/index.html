<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Daniel's iPhone (mocked GUI env)</title>
<!--
  ============================================================================
  Daniel's iPhone — an iOS home screen and Settings app laid over the other
  forty environments in this directory.

  Same two-block contract as every environment here: script#engine is a pure,
  DOM-free state machine on globalThis.GUI_ENGINE; script#ui renders its screen
  tree and exposes window.__ENV__.

  Nothing on the home screen is invented. Every tile's NAME comes from that
  environment's own manifest, and every tile's COLOUR is the --accent this
  build read straight out of that environment's index.html — so the mosaic on
  the home screen is literally the forty brand colours, and the tile you tap is
  the colour of the app you land in. The app-detail page carries a real <a>
  link to ../<env>/index.html: click it in a browser and you are in that
  environment. That link deliberately has no test-id, so elements() and
  bounds() never see it — a human can click it, an agent cannot, and gate G
  stays byte-identical.

  The world here is the one piece of arithmetic every iPhone owner gets wrong:
  DEVICE storage and iCLOUD storage are two different pools, and almost every
  switch moves exactly one of them.

    · Offload App frees the app's binary and keeps its Documents & Data.
      Delete App frees both. So offloading is a much weaker lever than it
      looks: offloading ALL FORTY apps frees 3,620 MB, and the iOS 26.1
      update needs 3,660 MB more than is free. It cannot be done that way.
    · Emptying Recently Deleted frees 2,180 MB — and it is the only action on
      the phone that frees space in BOTH pools at once. After it, the update
      needs 1,480 MB more, and the four largest app binaries come to 1,490.
      Four offloads. Three (1,230) is not enough.
    · Turning off an app's iCloud backup frees iCloud and not one byte of the
      device. Tonight's backup wants 33,044 MB against 12,600 MB free, so five
      of them have to go off — or four, if Recently Deleted was emptied first,
      because that gave iCloud 2,180 MB back too.
    · Optimise iPhone Storage is already on. Switching to Download and Keep
      Originals would want the full 135,200 MB library on a 128 GB phone. The
      switch that looks like the big saving is the one that cannot be flipped.

  The owner is Daniel Okafor, 41, engineering manager at Meridian Labs in
  London — the Daniel Okafor already sitting in covey_contacts, and the London
  end of the same company as 张三 over on sam_phone, who is in his contacts as
  Sam Zhang. Family Sharing carries his partner Ama, and Zoe and Kwame, whose
  iPad is the 18.2 GB backup nobody has looked at in a year.
  ============================================================================
-->
<style>
:root{
  --outer:#d8dae2;
  --bezel:#1c1c1e;
  --bg:#f2f2f7;
  --card:#ffffff;
  --card2:#f2f2f7;
  --line:#e4e4e9;
  --line2:#d1d1d6;
  --press:#e9e9ee;
  --chev:#c7c7cc;
  --ink:#000000;
  --ink2:#3c3c43;
  --muted:#8e8e93;
  --accent:#007aff;
  --accent-d:#0060d0;
  --accent-s:#e8f1ff;
  --on-accent:#ffffff;
  --good:#34c759;
  --good-s:#e6f8ec;
  --warn:#ff9500;
  --warn-s:#fff2e0;
  --bad:#ff3b30;
  --bad-s:#ffecea;
  --bad-line:#ffc9c4;
  --btn:#efeff4;
  --btn-off:#f5f5f8;
  --off:#e4e4e9;
  --appbar:rgba(249,249,249,.86);
  --appbar-ink:#161a27;
  --appbar-line:#d8d8dc;
  --tabbar:#ffffff;
  --scrim:rgba(0,0,0,.35);
  --toast:#1c1c1e;
  --toast-ink:#ffffff;
  --hero:linear-gradient(150deg,#0a84ff,#5ac8fa);
  --hero-line:transparent;
  --hero-ink:#ffffff;
  --disp:-apple-system,"SF Pro Display","SF Pro Text",Inter,"Helvetica Neue",sans-serif;
  --r:10px;
  --r:18px; --r2:12px;
  --shadow:0 1px 2px rgba(16,18,26,.05),0 10px 26px rgba(16,18,26,.07);
  --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{background:var(--outer);color:var(--ink);font:14px/1.55 var(--ui);
  display:flex;align-items:center;justify-content:center;overflow:hidden}

#device{position:relative;width:390px;height:844px;background:var(--bezel);border-radius:46px;padding:5px;
  box-shadow:0 30px 70px rgba(0,0,0,.34);flex:0 0 auto}
#screen{position:relative;width:100%;height:100%;background:var(--bg);border-radius:41px;
  overflow:hidden;display:flex;flex-direction:column}
#notch{position:absolute;top:5px;left:50%;transform:translateX(-50%);width:118px;height:30px;
  background:var(--bezel);border-radius:0 0 18px 18px;z-index:60}
body.bare{background:var(--bg)}
body.bare #device{width:390px;height:844px;padding:0;border-radius:0;box-shadow:none;background:var(--bg)}
body.bare #screen{border-radius:0}
body.bare #notch{display:none}
body.bare .n-sheet{animation:none}

.statusbar{height:44px;flex:0 0 44px;display:flex;align-items:flex-end;justify-content:space-between;
  padding:0 22px 6px;font-size:13px;font-weight:600;z-index:50;color:var(--ink)}
.statusbar .sb-r{display:flex;gap:5px;align-items:center}
.sb-bat{width:22px;height:11px;border:1.3px solid currentColor;border-radius:3px;position:relative;opacity:.9}
.sb-bat:after{content:"";position:absolute;right:-3px;top:3px;width:2px;height:5px;background:currentColor;border-radius:0 1px 1px 0}
.sb-bat i{position:absolute;left:1.3px;top:1.3px;bottom:1.3px;width:78%;background:currentColor;border-radius:1px}

#app{flex:1 1 auto;display:flex;flex-direction:column;min-height:0;position:relative}

.n-appbar{flex:0 0 auto;min-height:52px;display:flex;align-items:center;gap:8px;padding:6px 12px;
  background:var(--appbar);color:var(--appbar-ink);z-index:20;border-bottom:1px solid var(--appbar-line)}
.n-appbar .ab-title{flex:1 1 auto;text-align:center;font:650 17px/1.3 var(--disp);letter-spacing:-.2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.n-appbar .ab-side{flex:0 0 auto;min-width:56px;display:flex;align-items:center;gap:2px}
.n-appbar .ab-side.right{justify-content:flex-end}
.n-appbar .iconbtn{color:var(--appbar-ink);opacity:.85}
.iconbtn{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  color:var(--ink2);cursor:pointer}
.iconbtn:active{background:var(--press)}

.n-scroll{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;padding-bottom:10px}
.n-scroll::-webkit-scrollbar{width:0}

.n-text{padding:2px 18px;color:var(--ink2)}
.n-text.h1{font:700 26px/1.18 var(--disp);color:var(--ink);padding:10px 18px 6px;letter-spacing:-.6px}
.n-text.h2{font:650 18px/1.3 var(--disp);color:var(--ink);padding:12px 18px 2px}
.n-text.body{font-size:13.5px;padding:5px 18px;line-height:1.7}
.n-text.muted{font-size:12.5px;color:var(--muted);padding:6px 18px;line-height:1.6}
.n-text.empty{padding:14px 18px 40px;text-align:center;color:var(--muted);font-size:13.5px}
.n-sec{padding:18px 18px 6px;font:700 11.5px/1 var(--ui);color:var(--muted);letter-spacing:1.3px;
  text-transform:uppercase;display:flex;justify-content:space-between;align-items:center;gap:10px}
.n-space{height:16px}

.n-card{background:var(--card);border-radius:var(--r);margin:9px 16px;overflow:hidden;border:1px solid var(--line)}
.n-card.flush{padding:0}
.n-card.pad{padding:14px 16px}
.n-card.tap{cursor:pointer}
.n-card.tap:active{background:var(--press)}

.n-row{display:flex;align-items:center;gap:13px;padding:12px 16px;border-bottom:1px solid var(--line);min-height:54px}
.n-row:last-child{border-bottom:none}
.n-row.tap{cursor:pointer}
.n-row.tap:active{background:var(--press)}
.n-row .r-lead{flex:0 0 auto;width:26px;color:var(--ink2);display:flex;align-items:center;justify-content:center}
.n-row .r-main{flex:1 1 auto;min-width:0}
.n-row .r-label{font-size:14.5px}
.n-row .r-label.strike{text-decoration:line-through;color:var(--muted)}
.n-row .r-sub{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.5}
.n-row .r-value{flex:0 0 auto;font-size:14px;color:var(--ink2);text-align:right;font-variant-numeric:tabular-nums}
.n-row .r-value.strong{color:var(--ink);font-weight:700}
.n-row .r-value.acc{color:var(--accent);font-weight:700}
.n-row .r-value.good{color:var(--good);font-weight:700}
.n-row .r-value.warn{color:var(--warn);font-weight:700}
.n-row .r-value.bad{color:var(--bad);font-weight:700}
.n-row .r-arrow{flex:0 0 auto;color:var(--chev);display:flex}

.n-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:47px;padding:0 20px;
  border-radius:13px;font:650 15px/1 var(--ui);background:var(--btn);color:var(--ink);
  border:none;cursor:pointer;user-select:none}
.n-btn:active{filter:brightness(.97)}
.n-btn.primary{background:var(--accent);color:var(--on-accent)}
.n-btn.primary.off{background:var(--btn-off);color:var(--muted);cursor:not-allowed}
.n-btn.ghost{background:transparent;border:1px solid var(--line2);height:37px;font-size:13px;padding:0 14px;color:var(--ink2)}
.n-btn.danger{background:transparent;border:1px solid var(--bad-line);color:var(--bad);height:37px;font-size:13px;padding:0 14px}
.n-btn.block{display:flex;width:100%}
.n-btnrow{display:flex;gap:10px;padding:12px 16px;justify-content:flex-end;align-items:center;flex-wrap:wrap}

.n-chips{display:flex;gap:8px;padding:8px 16px;overflow-x:auto}
.n-chips::-webkit-scrollbar{height:0}
.n-chip{flex:0 0 auto;height:34px;padding:0 14px;border-radius:11px;background:var(--card);
  border:1px solid var(--line2);display:flex;align-items:center;font-size:13px;
  color:var(--ink2);cursor:pointer;white-space:nowrap;font-weight:600}
.n-chip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}

.n-input{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line);background:var(--card)}
.n-input .i-label{flex:0 0 78px;font-size:13px;color:var(--muted)}
.n-input input{flex:1 1 auto;border:none;outline:none;background:transparent;font-size:14.5px;
  font-family:inherit;color:var(--ink);min-width:0}
.n-input input::placeholder{color:var(--muted)}
.n-switch{flex:0 0 auto;width:46px;height:27px;border-radius:14px;background:var(--off);position:relative;cursor:pointer;transition:background .16s}
.n-switch.on{background:var(--accent)}
.n-switch i{position:absolute;top:2.5px;left:2.5px;width:22px;height:22px;border-radius:50%;background:#fff;
  transition:transform .16s;box-shadow:0 1px 3px rgba(0,0,0,.22)}
.n-switch.on i{transform:translateX(19px)}
.n-check{flex:0 0 auto;width:23px;height:23px;border-radius:7px;border:1.8px solid var(--off);position:relative;background:var(--card)}
.n-check.on{border-color:var(--accent);background:var(--accent)}
.n-check.on:after{content:"";position:absolute;left:7.5px;top:4px;width:5px;height:10px;
  border:2px solid var(--on-accent);border-top:0;border-left:0;transform:rotate(42deg)}
.n-radio{flex:0 0 auto;width:22px;height:22px;border-radius:50%;border:1.8px solid var(--off);position:relative}
.n-radio.on{border-color:var(--accent);background:var(--accent)}
.n-radio.on:after{content:"";position:absolute;left:7px;top:4px;width:5px;height:9px;
  border:2px solid var(--on-accent);border-top:0;border-left:0;transform:rotate(42deg)}

.tag{display:inline-flex;align-items:center;padding:3px 9px;border-radius:20px;font-size:11px;
  font-weight:700;background:var(--btn);color:var(--ink2)}
.tag.acc{background:var(--accent-s);color:var(--accent)}
.tag.good{background:var(--good-s);color:var(--good)}
.tag.warn{background:var(--warn-s);color:var(--warn)}
.tag.bad{background:var(--bad-s);color:var(--bad)}

.n-tabbar{flex:0 0 auto;height:58px;background:var(--tabbar);border-top:1px solid var(--line);display:flex;z-index:30}
.n-tabbar .tb{flex:1 1 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--muted);font-size:10.5px;cursor:pointer;font-weight:600}
.n-tabbar .tb i{display:flex}
.n-tabbar .tb.on{color:var(--accent)}

.n-mask{position:absolute;inset:0;background:var(--scrim);z-index:70;display:flex;align-items:flex-end}
.n-sheet{width:100%;max-height:80%;background:var(--card);border-radius:22px 22px 0 0;display:flex;
  flex-direction:column;overflow:hidden;animation:up .18s ease-out}
@keyframes up{from{transform:translateY(24px)}to{transform:none}}
.n-sheet .sh-hd{padding:16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.n-sheet .sh-hd .t{font:650 17px/1.2 var(--disp)}
.n-sheet .sh-bd{flex:1 1 auto;overflow-y:auto;min-height:0}
.n-sheet .sh-bd::-webkit-scrollbar{width:0}
.n-toast{position:absolute;left:50%;bottom:118px;transform:translateX(-50%);background:var(--toast);
  color:var(--toast-ink);padding:11px 18px;border-radius:11px;font-size:13px;z-index:90;max-width:84%;text-align:center}
.dialog{margin:auto;width:82%;background:var(--card);border-radius:18px;overflow:hidden;border:1px solid var(--line)}

.stats{display:flex;gap:9px;padding:4px 16px}
.stat{flex:1 1 0;background:var(--card);border:1px solid var(--line);border-radius:var(--r2);padding:13px 12px}
.stat.tap{cursor:pointer}
.stat .st-n{font:800 19px/1.1 var(--disp);letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.stat .st-l{font-size:11px;color:var(--muted);margin-top:6px;line-height:1.4}
.stat.acc .st-n{color:var(--accent)}

.hero{margin:8px 16px 4px;padding:18px;border-radius:var(--r);background:var(--hero);
  border:1px solid var(--hero-line);color:var(--hero-ink)}
.hero.tap{cursor:pointer}
.hero .he-k{font-size:11px;letter-spacing:1.3px;text-transform:uppercase;font-weight:800;opacity:.85}
.hero .he-t{font:800 25px/1.16 var(--disp);margin-top:9px;letter-spacing:-.7px}
.hero .he-s{font-size:13px;margin-top:8px;line-height:1.6;opacity:.9}


/* ---------------------------------------------------------- iOS chrome */
.n-scroll{background:var(--bg)}
.n-appbar{backdrop-filter:saturate(180%) blur(20px)}
.n-sec{font-size:13px;letter-spacing:0;text-transform:none;color:#6c6c70;font-weight:400;
  padding:22px 32px 7px}
.n-card{border:none;box-shadow:none;margin:0 16px;border-radius:10px;overflow:hidden}
.n-row{padding:11px 16px;min-height:44px}
.n-row .r-label{font-size:16px;font-weight:400;letter-spacing:-.2px}
.n-row .r-sub{font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.4}
.n-row .r-value{font-size:16px;color:var(--muted);letter-spacing:-.2px}
.n-switch{width:51px;height:31px;border-radius:16px}
.n-switch i{width:27px;height:27px}
.n-switch.on{background:var(--good)}
.n-switch.on i{transform:translateX(20px)}
.n-btn{border-radius:12px;font-size:16px;font-weight:400;padding:13px}
.n-btn.primary{font-weight:600}
.n-btn.danger{color:var(--bad);background:var(--card)}
.big{padding:6px 16px 2px;font:700 34px/1.15 var(--disp);letter-spacing:-.8px}

/* ---------------------------------------------------------- home screen */
.wall{position:absolute;inset:0;z-index:0}
.wall svg{width:100%;height:100%;display:block}
.hs{position:relative;z-index:1;display:flex;flex-direction:column;min-height:100%;
  background-size:cover;background-position:center;background-repeat:no-repeat;
  background-color:#151a3e}
.hs .grow{flex:1 1 auto}

.wgs{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px 18px 2px}
.wgc{background:rgba(255,255,255,.16);border:.5px solid rgba(255,255,255,.3);border-radius:19px;
  padding:12px 13px;cursor:pointer;backdrop-filter:blur(22px) saturate(160%);
  box-shadow:0 6px 18px rgba(0,0,0,.16);color:#fff;min-height:70px}
.wgc:active{background:rgba(255,255,255,.28)}
.wgc .k{font-size:10px;letter-spacing:.3px;opacity:.85;display:flex;align-items:center;gap:5px}
.wgc .n{font:700 20px/1.1 var(--disp);margin-top:7px;letter-spacing:-.5px}
.wgc .s{font-size:10.5px;opacity:.82;margin-top:5px;line-height:1.4}
.wgc.alert .n{color:#ffd8d4}

.pg{display:grid;grid-template-columns:repeat(4,1fr);gap:13px 4px;padding:7px 14px 2px}
.pg.light .ic-n{color:var(--ink);text-shadow:none}
.ic{display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;position:relative}
.ic:active{transform:scale(.92)}

.tile{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;
  color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.3),0 8px 18px rgba(0,0,0,.16)}
.tile:before{content:"";position:absolute;inset:0;border-radius:inherit;
  background:linear-gradient(180deg,rgba(255,255,255,.34),rgba(255,255,255,0) 52%,rgba(0,0,0,.16))}
.tile:after{content:"";position:absolute;inset:0;border-radius:inherit;
  box-shadow:inset 0 0 0 .5px rgba(255,255,255,.32)}
.tile .ico{position:relative;z-index:1;filter:drop-shadow(0 1px 1px rgba(0,0,0,.22))}
.tile.fold{background:rgba(255,255,255,.24);backdrop-filter:blur(16px);display:grid;
  grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:3px;padding:6px;
  align-items:stretch;justify-items:stretch;border-radius:14px}
.tile.fold i{border-radius:5px;display:block;min-height:0;position:relative;z-index:1}

.ic-n{font-size:11px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.45);max-width:74px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:-.1px}
.ic-d{position:absolute;top:-4px;right:6px;min-width:20px;height:20px;border-radius:10px;
  background:#ff3b30;color:#fff;font:600 11px/20px var(--disp);text-align:center;padding:0 5px;
  box-shadow:0 0 0 1.6px rgba(255,255,255,.85)}

.dots{display:flex;justify-content:center;gap:7px;padding:8px 0 6px}
.dots div{width:7px;height:7px;border-radius:4px;background:rgba(255,255,255,.4);cursor:pointer}
.dots div.on{background:#fff}

.srch{display:flex;justify-content:center;padding:0 0 9px}
.srch .pill{display:inline-flex;align-items:center;gap:5px;padding:6px 14px;border-radius:16px;
  background:rgba(255,255,255,.22);backdrop-filter:blur(18px);color:#fff;font-size:13px;
  border:.5px solid rgba(255,255,255,.22)}
.dock{margin:0 10px 6px;padding:10px 6px;border-radius:26px;background:rgba(255,255,255,.2);
  border:.5px solid rgba(255,255,255,.24);display:grid;grid-template-columns:repeat(4,1fr);
  gap:4px;backdrop-filter:blur(24px) saturate(160%)}

.n-input{background:transparent;border-bottom:none;padding:8px 18px 4px}
.n-input .i-label{display:none}
.n-input{display:flex;justify-content:center}
.n-input input{flex:0 1 auto;max-width:200px;background:rgba(255,255,255,.22);
  border:.5px solid rgba(255,255,255,.26);border-radius:16px;padding:7px 16px;font-size:13.5px;
  color:#fff;text-align:center;backdrop-filter:blur(18px)}
.n-input input::placeholder{color:rgba(255,255,255,.72)}

/* ---------------------------------------------------------- storage bar */
.sbar{margin:14px 16px 0}
.sbar .track{display:flex;height:22px;border-radius:5px;overflow:hidden;background:#e4e4e9}
.sbar .track i{display:block;height:100%}
.sbar .free{font-size:12.5px;color:var(--muted);margin-top:9px;display:flex;
  justify-content:space-between}
.sbar .free b{color:var(--ink);font-weight:600}
.leg{display:flex;flex-wrap:wrap;gap:5px 14px;margin:11px 16px 0}
.leg div{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink2)}
.leg span{width:9px;height:9px;border-radius:3px;flex:0 0 auto}
.leg em{font-style:normal;color:var(--muted);margin-left:2px}

.reco{margin:0 16px;background:var(--card);border-radius:10px;overflow:hidden}
.rc{display:flex;gap:12px;padding:12px 16px;border-bottom:.5px solid var(--line);
  align-items:flex-start}
.rc:last-child{border-bottom:none}
.rc .m{flex:1 1 auto;min-width:0}
.rc .t{font-size:15.5px;letter-spacing:-.2px}
.rc .d{font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.45}
.rc .a{flex:0 0 auto;align-self:center;font-size:15px;color:var(--accent);cursor:pointer;
  padding:4px 2px}
.rc .a.off{color:var(--muted)}
.rc .sz{flex:0 0 auto;align-self:center;font-size:14px;color:var(--muted);
  font-variant-numeric:tabular-nums}

.arow{display:flex;align-items:center;gap:12px;padding:9px 16px;border-bottom:.5px solid var(--line);
  cursor:pointer}
.arow:last-child{border-bottom:none}
.arow .t2{width:30px;height:30px;border-radius:7px;flex:0 0 auto;display:flex;align-items:center;

/* ===========================================================================
 * ENGINE — pure, deterministic, DOM-free.
 * Device storage and iCloud storage are two separate pools measured in whole

 * ======================================================================== */
(function(root){
'use strict';

var ENV_ID  = 'daniel_phone';

/* ------------------------------------------------------------- utilities */
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function pad2(n){ return (n < 10 ? '0' : '') + n; }
function hhmm(m){ m = ((m % 1440) + 1440) % 1440; return pad2(Math.floor(m/60)) + ':' + pad2(m%60); }
function sum(a){ var s = 0; for (var i=0;i<a.length;i++) s += a[i]; return s; }
function clamp(v, lo, hi){ return v < lo ? lo : (v > hi ? hi : v); }
function lcg(seed){ var s=(seed>>>0)||1; return function(){ s=(s*1664525+1013904223)>>>0; return s/4294967296; }; }
function shuffled(list, seed){
  if (!seed) return list.slice();
  var r = lcg(seed), a = list.slice();
  for (var i=a.length-1;i>0;i--){ var j = Math.floor(r()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
function money(p, sym){
  var neg = p < 0; p = Math.abs(p);
  return (neg ? '-' : '') + (sym === undefined ? '\u00a3' : sym) +
         (Math.floor(p/100)).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',') + '.' + pad2(p%100);
}
function getPath(o, path){
  var cur = o, parts = String(path).split('.');
  for (var i=0;i<parts.length;i++){
    var k = parts[i], m = k.match(/^(.*?)\[(\d+)\]$/);
    if (m){ cur = cur ? cur[m[1]] : undefined; cur = cur ? cur[+m[2]] : undefined; }
    else cur = cur ? cur[k] : undefined;
    if (cur === undefined) return undefined;
  }
  return cur;
}
function setPath(o, path, value){
  var parts = String(path).split('.'), cur = o;
  for (var i=0;i<parts.length-1;i++){
    var k = parts[i], m = k.match(/^(.*?)\[(\d+)\]$/);
    cur = m ? cur[m[1]][+m[2]] : (cur[k] = cur[k] || {});
  }
  var lastK = parts[parts.length-1], lm = lastK.match(/^(.*?)\[(\d+)\]$/);
  if (lm) cur[lm[1]][+lm[2]] = value; else cur[lastK] = value;

}

}

}

function pop(st){ if (st.ui.stack.length > 1) st.ui.stack.pop(); }
function toast(st, t){ st.ui.toast = t; }

/* ------------------------------------------------------------- the device
 * Everything is integer megabytes and 1 GB = 1000 MB, the way iOS reports it.
 */
var CAP = 128000, IOSMB = 9140, PHOTOS_DEV = 42600, TRASH0 = 2180, SYSDATA = 9707;
var UPDATE_NEED = 6800, UPDATE_DL = 4820, UPDATE_NAME = 'iOS 26.1';
var ICLOUD_PLAN = 200000, ICLOUD_LIB0 = 135200, ICLOUD_IPAD = 18200,
    ICLOUD_DRIVE = 9400, ICLOUD_CUR = 24600, BAK_BASE = 3100;

function gb(mb){
  if (mb < 1000) return mb + ' MB';
  var v = mb / 1000;
  return (v >= 100 ? v.toFixed(0) : v.toFixed(v >= 10 ? 1 : 2)) + ' GB';
}
function AP(id, short, envName, glyph, where, brand, size, docs, bak, bakOn){
  return {id:id, short:short, envName:envName, glyph:glyph, where:where, brand:brand,
          size:size, docs:docs, bak:bak, bakOn:bakOn, off:false, del:false};
}
var APPS = [

  AP("compass_maps", "Maps", "Maps", "pin", "dock", "#1b6ac9", 480, 980, 180, true),

  AP("umber_photos", "Umber", "Umber", "image", "p1", "#e0a35c", 410, 2760, 2760, true),

  AP("saffron_recipes", "Saffron", "Saffron", "chef", "p2", "#1f6f4a", 95, 1980, 1860, true),

  AP("hearth_home", "Hearth", "Hearth \u00b7 Home", "home", "f_home", "#f0a24b", 33, 360, 320, true),
  AP("meter_energy", "Meter", "\u6284\u8868", "bolt", "f_home", "#1668c8", 24, 70, 50, true),
  AP("willow_meds", "Willow", "Willow", "pill", "f_home", "#2b7f8f", 27, 180, 160, true),
  AP("levain_bake", "Levain", "Levain", "wheat", "f_home", "#e0a33c", 25, 200, 180, true),
  AP("sable_privacy", "Privacy", "Privacy", "shield", "f_util", "#007aff", 14, 20, 10, true),
  AP("tideline_screen", "Screen Time", "\u5c4f\u5e55\u4f7f\u7528\u65f6\u95f4", "hourglass", "f_util", "#5856d6", 15, 50, 30, true),
  AP("kitbag_pack", "Kitbag", "Kitbag", "suitcase", "f_util", "#3c6e47", 28, 520, 480, true),
  AP("grid_puzzle", "Sudoku", "\u6570\u72ec", "grid9", "f_util", "#1b58a6", 16, 60, 40, true),
  AP("pipit_lessons", "Pipit", "Pipit", "cap", "f_util", "#3f9d54", 40, 340, 300, true)
];
function appOf(st, id){
  for (var i=0;i<st.apps.length;i++) if (st.apps[i].id === id) return st.apps[i];
  return null;
}
var FOLDERS = [
  {id:'f_work', name:'Work',      page:'p1'},
  {id:'f_home', name:'Household', page:'p1'},
  {id:'f_util', name:'Utilities', page:'p2'}
];
function folderOf(id){ for (var i=0;i<FOLDERS.length;i++) if (FOLDERS[i].id === id) return FOLDERS[i]; return null; }
var PAGES = ['p1', 'p2'];
var SETTINGS_TILE = {id:'settings_app', short:'Settings', glyph:'gear', brand:'#8e8e93',
                     where:'dock', settings:true};
function inDock(st){
  var out = st.apps.filter(function(a){ return a.where === 'dock' && !a.del; });
  out.push(SETTINGS_TILE);
  return out;
}
function onPage(st, p){ return st.apps.filter(function(a){ return a.where === p && !a.del; }); }
function inFolder(st, f){ return st.apps.filter(function(a){ return a.where === f && !a.del; }); }
function placeName(where){
  if (where === 'dock') return 'the Dock';
  if (where === 'p1') return 'Home Screen page 1';
  if (where === 'p2') return 'Home Screen page 2';
  var f = folderOf(where);
  return f ? 'the ' + f.name + ' folder' : where;
}

/* ------------------------------------------------------------ pool 1: device
 * Offload frees the binary and keeps Documents & Data. Delete frees both.
 */
function appDevice(a){ return a.del ? 0 : (a.off ? a.docs : a.size + a.docs); }
function appsDevice(st){ return sum(st.apps.map(appDevice)); }
function usedDevice(st){ return IOSMB + SYSDATA + PHOTOS_DEV + st.trash + appsDevice(st); }
function freeDevice(st){ return CAP - usedDevice(st); }
function canUpdate(st){ return freeDevice(st) >= UPDATE_NEED; }
function updateShort(st){ return Math.max(0, UPDATE_NEED - freeDevice(st)); }
function offloadableTotal(st){
  return sum(st.apps.filter(function(a){ return !a.del && !a.off; })
                    .map(function(a){ return a.size; }));
}
function bySize(st){
  return st.apps.filter(function(a){ return !a.del; })
    .slice().sort(function(x, y){ return appDevice(y) - appDevice(x) || (x.id < y.id ? -1 : 1); });
}
var CATS = [
  {k:'apps',   name:'Apps',            colour:'#007aff'},
  {k:'photos', name:'Photos',          colour:'#ffcc00'},
  {k:'ios',    name:'iOS',             colour:'#8e8e93'},
  {k:'system', name:'System Data',     colour:'#c7c7cc'},
  {k:'trash',  name:'Recently Deleted', colour:'#ff9500'}
];
function catValue(st, k){
  if (k === 'apps') return appsDevice(st);
  if (k === 'photos') return PHOTOS_DEV;
  if (k === 'ios') return IOSMB;
  if (k === 'system') return SYSDATA;
  return st.trash;
}

/* ------------------------------------------------------------ pool 2: iCloud
 * Turning off an app's backup frees iCloud and not one byte of the device.
 */
function cloudLibrary(st){ return ICLOUD_LIB0 - (TRASH0 - st.trash); }
function usedCloud(st){ return cloudLibrary(st) + ICLOUD_IPAD + ICLOUD_DRIVE + ICLOUD_CUR; }
function freeCloud(st){ return ICLOUD_PLAN - usedCloud(st); }
function backupApps(st){
  return st.apps.filter(function(a){ return !a.del && a.bak > 0; })
    .slice().sort(function(x, y){ return y.bak - x.bak || (x.id < y.id ? -1 : 1); });
}
function nextBackup(st){
  return BAK_BASE + sum(st.apps.filter(function(a){ return !a.del && a.bakOn; })
                                .map(function(a){ return a.bak; }));
}
function backupFits(st){ return nextBackup(st) <= freeCloud(st); }
function backupOver(st){ return Math.max(0, nextBackup(st) - freeCloud(st)); }

/* ------------------------------------------------------------- the owner */
var OWNER = {
  name:'Daniel Okafor', initial:'DO', device:"Daniel's iPhone",
  email:'daniel.okafor@meridianlabs.co.uk',
  job:'Engineering manager · Meridian Labs, London',
  home:'Bellenden Road, Peckham', model:'iPhone 15 Pro · 128 GB',
  family:[
    ['Ama Okafor',   'Partner · GP at the Rye Lane practice · organiser'],
    ['Zoe Okafor',   'Daughter, 11 · the iPad with the 18.2 GB backup'],
    ['Kwame Okafor', 'Son, 7 · Ask to Buy is on for him'],
    ['Grace Okafor', 'Mum · Lagos · Sunday video call']
  ],
  people:[
    ['Femi Okafor',  'Brother · Manchester'],
    ['Sam Zhang',    'Meridian Labs, Shanghai · the other phone in this folder'],
    ['Yuki Tanaka',  'Meridian Labs, Tokyo'],
    ['Sam Lawrence', 'Client · not the same Sam']
  ],
  likes:[
    ['Cycling',      'Peckham to the office along the canal, most days'],
    ['Five-a-side',  'Thursdays — he runs the league table in Pitchside'],
    ['Cooking',      'Saffron is the most-opened app in the Household folder'],
    ['Audiobooks',   'Books is holding 4.24 GB of downloads he has finished']
  ]
};

/* =========================================================== state */
function createInitialState(seed){
  seed = seed || 0;
  return {
    meta:{env:ENV_ID, version:VERSION, seed:seed, steps:0, finished:false, answer:null},
    apps:clone(APPS),
    trash:TRASH0,
    photosMode:'optimise',
    page:'p1',
    openFolder:null,
    query:'',
    updated:false,
    backupDone:false,
    lastBackup:'Yesterday, 03:14',
    /* the seed only permutes the widgets on the home screen */
    order:shuffled(['w_storage', 'w_icloud', 'w_update', 'w_backup'], seed),
    ui:{stack:[{name:'home', params:{}}], sheet:null, confirm:null, inputs:{}, toast:null},
    settings:{cellularBackup:false, autoUpdate:true, shared:true}
  };
}
var SELECT = {
  appOf:appOf, folderOf:folderOf, inDock:inDock, onPage:onPage, inFolder:inFolder,
  placeName:placeName, appDevice:appDevice, usedDevice:usedDevice, freeDevice:freeDevice,
  canUpdate:canUpdate, updateShort:updateShort, offloadableTotal:offloadableTotal,
  bySize:bySize, catValue:catValue, cloudLibrary:cloudLibrary, usedCloud:usedCloud,
  freeCloud:freeCloud, backupApps:backupApps, nextBackup:nextBackup, backupFits:backupFits,
  backupOver:backupOver, gb:gb, apps:APPS, folders:FOLDERS, cats:CATS, owner:OWNER,
  route:route
};

/* =========================================================== reducer */
function reduce(prev, action){
  var st = clone(prev), A = action || {};
  st.ui.toast = null;
  st.meta.steps += 1;

  function stor(){
    return gb(freeDevice(st)) + ' free' + (canUpdate(st) ? ' — enough for ' + UPDATE_NAME
      : ', still ' + gb(updateShort(st)) + ' short of ' + UPDATE_NAME);
  }
  function cloud(){
    return 'Next backup ' + gb(nextBackup(st)) + ' against ' + gb(freeCloud(st)) + ' free'
      + (backupFits(st) ? ' — it fits' : ', ' + gb(backupOver(st)) + ' too big');
  }

  switch (A.type) {

  case 'NOOP': break;
  case 'FINISH': st.meta.finished = true; st.meta.answer = A.answer === undefined ? null : A.answer; break;

  case 'NAV': push(st, A.to, A.params); break;
  case 'BACK':
    if (st.ui.sheet) st.ui.sheet = null;
    else if (st.ui.confirm) st.ui.confirm = null;
    else if (st.openFolder) st.openFolder = null;
    else pop(st);
    break;
  case 'HOME':
    st.ui.stack = [{name:'home', params:{}}];
    st.ui.sheet = null; st.ui.confirm = null; st.openFolder = null; st.page = 'p1'; st.query = '';
    break;
  case 'CONFIRM_NO': st.ui.confirm = null; break;
  case 'CONFIRM_YES': {
    var yes = st.ui.confirm && st.ui.confirm.yes; st.ui.confirm = null;
    if (yes) { var keep = st.meta.steps; var out = reduce(st, yes); out.meta.steps = keep; return out; }
    break;
  }

  /* ---- home screen ---- */
  case 'PAGE': st.page = A.id; st.openFolder = null; break;
  case 'OPEN_FOLDER': st.openFolder = A.id; break;
  case 'CLOSE_FOLDER': st.openFolder = null; break;
  case 'OPEN_APP': st.openFolder = null; push(st, 'app', {id:A.id}); break;
  case 'SEARCH': st.query = A.value === undefined ? '' : A.value; st.ui.inputs.q = st.query; break;
  case 'MOVE_APP': {
    var m = appOf(st, A.id);
    if (!m) break;
    if (A.to === 'dock' && inDock(st).length >= 4 && m.where !== 'dock'){
      toast(st, 'The Dock holds four. Move one out first.');
      break;
    }
    var from = m.where; m.where = A.to; st.openFolder = null;
    toast(st, m.short + ' moved from ' + placeName(from) + ' to ' + placeName(A.to) + '.');
    break;
  }

  /* ---- device storage ---- */
  case 'OFFLOAD': {
    var a = appOf(st, A.id);
    if (!a || a.del) break;
    if (a.off){ toast(st, a.short + ' is already offloaded.'); break; }
    a.off = true;
    toast(st, 'Offloaded ' + a.short + '. ' + gb(a.size) + ' back, its '
              + gb(a.docs) + ' of documents kept. ' + stor());
    break;
  }
  case 'REINSTALL': {
    var a2 = appOf(st, A.id);
    if (!a2 || a2.del || !a2.off) break;
    a2.off = false;
    toast(st, 'Reinstalled ' + a2.short + '. ' + stor());
    break;
  }
  case 'DELETE': {
    var a3 = appOf(st, A.id);
    if (!a3 || a3.del) break;
    st.ui.confirm = {title:'Delete ' + a3.short + '?',
      text:'Deleting removes the app and its ' + gb(a3.docs)
           + ' of documents and data. Offloading keeps the documents.',
      okText:'Delete App', yes:{type:'DELETE_YES', id:A.id}};
    break;
  }
  case 'DELETE_YES': {
    var a4 = appOf(st, A.id);
    if (!a4 || a4.del) break;
    var was = appDevice(a4);
    a4.del = true; a4.off = false;
    if (route(st).name === 'app' && route(st).params.id === A.id) pop(st);
    toast(st, 'Deleted ' + a4.short + ' — ' + gb(was) + ' back on the device. '
              + 'Its iCloud backup went with it. ' + stor());
    break;
  }
  case 'EMPTY_TRASH': {
    if (!st.trash){ toast(st, 'Recently Deleted is already empty.'); break; }
    st.ui.confirm = {title:'Empty Recently Deleted?',
      text:gb(st.trash) + ' of photos and videos will be removed for good — from this iPhone '
           + 'and from iCloud Photos.',
      okText:'Delete Permanently', yes:{type:'EMPTY_TRASH_YES'}};
    break;
  }
  case 'EMPTY_TRASH_YES': {
    var t = st.trash; st.trash = 0;
    toast(st, gb(t) + ' back on the device and ' + gb(t) + ' back in iCloud — the only lever '
              + 'that moves both. ' + stor());
    break;
  }
  case 'SET_PHOTOS': {
    if (A.mode === st.photosMode) break;
    if (A.mode === 'originals'){
      var wanted = cloudLibrary(st) - PHOTOS_DEV;
      if (wanted > freeDevice(st)){
        toast(st, 'Cannot: keeping originals wants the whole ' + gb(cloudLibrary(st))
                  + ' library on a 128 GB iPhone — ' + gb(wanted - freeDevice(st))
                  + ' more than this device has. Optimise stays on.');
        break;
      }
    }
    st.photosMode = A.mode;
    toast(st, A.mode === 'optimise' ? 'Optimise iPhone Storage is on.'
                                    : 'Downloading originals.');
    break;
  }
  case 'INSTALL_UPDATE': {
    if (!canUpdate(st)){
      toast(st, UPDATE_NAME + ' needs ' + gb(UPDATE_NEED) + ' free to install. There is '
                + gb(freeDevice(st)) + ' — ' + gb(updateShort(st)) + ' short.');
      break;
    }
    st.updated = true;
    toast(st, UPDATE_NAME + ' installed.');
    break;
  }

  /* ---- iCloud ---- */
  case 'TOGGLE_BAK': {
    var b = appOf(st, A.id);
    if (!b || b.del) break;
    b.bakOn = !b.bakOn;
    toast(st, b.short + ' backup ' + (b.bakOn ? 'on' : 'off') + '. ' + cloud()
              + '. Device storage did not change.');
    break;
  }
  case 'BACKUP_NOW': {
    if (!backupFits(st)){
      st.backupDone = false;
      toast(st, 'Backup failed: ' + cloud() + '.');
      break;
    }
    st.backupDone = true;
    toast(st, 'Backed up ' + gb(nextBackup(st)) + ' to iCloud.');
    break;
  }

  case 'SET_TOGGLE': st.settings[A.key] = !st.settings[A.key]; break;

  default: break;
  }
  return st;
}

function iconNode(st, a, prefix){
  return N('icon', {id:prefix + a.id, act:(a.settings ? {type:'NAV', to:'settings'}

    name:a.short, glyph:a.glyph, brand:a.brand, off:!!a.off});
}
function folderIcon(st, f){
  var kids = inFolder(st, f.id);
  return N('icon', {id:'fo_' + f.id, act:{type:'OPEN_FOLDER', id:f.id}, name:f.name,
    folder:true, count:kids.length,
    tiles:kids.slice(0, 4).map(function(a){ return a.brand; })});
}
function widgetNode(st, id){
  var w;
  if (id === 'w_storage'){
    w = {k:'iPhone Storage', icon:'chart', n:gb(freeDevice(st)) + ' free',
         s:gb(usedDevice(st)) + ' of 128 GB used · Apps ' + gb(appsDevice(st)),
         alert:!canUpdate(st), act:{type:'NAV', to:'storage'}};
  } else if (id === 'w_icloud'){
    w = {k:'iCloud', icon:'cloud', n:gb(freeCloud(st)) + ' free',
         s:gb(usedCloud(st)) + ' of 200 GB · Photos ' + gb(cloudLibrary(st)),
         alert:false, act:{type:'NAV', to:'icloud'}};
  } else if (id === 'w_update'){
    w = {k:'Software Update', icon:'down', n:(st.updated ? 'Up to date' : UPDATE_NAME),
         s:(st.updated ? 'Installed' : 'Needs ' + gb(UPDATE_NEED) + ' free · '
            + (canUpdate(st) ? 'ready to install' : gb(updateShort(st)) + ' short')),
         alert:!st.updated && !canUpdate(st), act:{type:'NAV', to:'update'}};
  } else {
    w = {k:'iCloud Backup', icon:'cloud', n:(backupFits(st) ? 'Will back up' : 'Will fail'),
         s:'Next backup ' + gb(nextBackup(st)) + ' · '
           + (backupFits(st) ? gb(freeCloud(st)) + ' free' : gb(backupOver(st)) + ' too big'),
         alert:!backupFits(st), act:{type:'NAV', to:'backup'}};

  return N('widget', {id:id, act:w.act, k:w.k, icon:w.icon, n:w.n, s:w.s, alert:!!w.alert});
}

function scrHome(st){
  var body = [], q = st.query.trim().toLowerCase();
  if (q){
    var hits = st.apps.filter(function(a){
      return !a.del && (a.short.toLowerCase().indexOf(q) >= 0 || a.id.indexOf(q) >= 0);
    });
    body.push(N('searchhead', {text:hits.length + ' result' + (hits.length === 1 ? '' : 's')}));
    body.push(N('card', {c:hits.map(function(a){

        glyph:a.glyph, brand:a.brand, sub:placeName(a.where), val:gb(appDevice(a))});

  case 'update':   kids = scrUpdate(st); break;

  case 'backup':   kids = scrBackup(st); break;

        c:[N('grid', {id:'grid_' + f.id, cls:'pg light', c:kidsIn.map(function(a){
          return iconNode(st, a, 'fi_'); })})]})]}));
  }
  if (st.ui.confirm)
    out.push(N('mask', {id:'confirm_mask', c:[N('dialog', {id:'confirm_dialog',
      title:st.ui.confirm.title || '', text:st.ui.confirm.text,

  if (st.ui.toast) out.push(N('toast', {id:'toast', text:st.ui.toast}));
  return N('screen', {c:out, route:r.name});
}

/* =======================================================================
 * TRAVERSAL — element index, GUI action interface, text observation.
 * Identical in every environment here: the screen tree is the only thing
 * that differs, and all three readers below walk that same tree.
 * ==================================================================== */
var SKIP_KEYS = {act:1, minus:1, plus:1, close:1, yes:1, params:1, meta:1, tiles:1, segs:1, bars:1, place:1, family:1, people:1, likes:1};

function labelOf(n){ return n.text || n.title || n.name || n.label || n.main || ''; }

function collect(n, out){
  if (!n || typeof n !== 'object') return;
  if (Array.isArray(n)) { for (var i=0;i<n.length;i++) collect(n[i], out); return; }
  if (n.t === 'appbar' && n.back) out.push({id:'nav_back', act:{type:'BACK'}, text:'Back', t:'back'});
  if (n.id && n.act)              out.push({id:n.id, act:n.act, text:labelOf(n), t:n.t||'el',

function render(n){
  if (!n || typeof n !== 'object') return '';
  if (Array.isArray(n)) return R(n);
  switch (n.t) {
  case 'screen': return R(n.c);

      : '') + R(n.left);

      + '<div class="ab-side right">' + R(n.right) + '</div></div>';
  }
  case 'iconbtn': return '<div class="iconbtn ' + esc(n.cls||'') + '"' + tid(n.id) + bind(n.act) + '>' + icon(n.icon, 19) + '</div>';
  case 'scroll':  return '<div class="n-scroll"' + tid(n.id) + '>' + R(n.c) + '</div>';
  case 'chips':   return '<div class="n-chips"' + tid(n.id) + '>' + R(n.c) + '</div>';
  case 'chip':    return '<div class="n-chip' + (n.on?' on':'') + '"' + tid(n.id) + bind(n.act) + '>' + esc(n.text) + '</div>';
  case 'card':    return '<div class="n-card ' + esc(n.cls||'') + (n.act?' tap':'') + '"' + tid(n.id) + bind(n.act) + '>' + R(n.c) + '</div>';

  case 'text':    return '<div class="n-text ' + esc(n.cls||'') + '">' + esc(n.text) + '</div>';
  case 'space':   return '<div class="n-space"></div>';
  case 'row': {

    (n.c||[]).forEach(function(ch){
      (ch.t==='switch'||ch.t==='radio'||ch.t==='check'||ch.t==='stepper'||ch.t==='btn'||ch.t==='iconbtn')

      + (n.sub ? '<div class="r-sub">' + esc(n.sub) + '</div>' : '') + '</div>'
      + (n.val ? '<div class="r-value ' + esc(n.valCls||'') + '">' + esc(n.val) + '</div>' : '')
      + R(inline)

      + '</div>' + R(below);
  }
  case 'btn':
    return '<div class="n-btn ' + esc(n.cls||'') + (n.disabled?' off':'') + '"' + tid(n.id)
      + (n.disabled?'':bind(n.act)) + '>' + esc(n.text) + '</div>';
  case 'btnrow': return '<div class="n-btnrow"' + tid(n.id) + '>' + R(n.c) + '</div>';
  case 'bar':    return '<div style="flex:0 0 auto;background:var(--card);border-top:1px solid var(--line);'

  case 'switch': return '<div class="n-switch' + (n.on?' on':'') + '"' + tid(n.id) + bind(n.act) + '><i></i></div>';
  case 'check':  return '<div class="n-check' + (n.on?' on':'') + '"' + tid(n.id) + bind(n.act) + '></div>';
  case 'radio':  return '<div class="n-radio' + (n.on?' on':'') + '"' + tid(n.id) + bind(n.act) + '></div>';
  case 'inputrow':
    return '<div class="n-input"><div class="i-label">' + esc(n.label) + '</div>'
      + '<input' + tid(n.id) + bindT(n.act) + ' value="' + esc(n.value) + '" placeholder="'

    return '<div style="display:flex;align-items:center;gap:8px"' + tid(n.id) + '>'

      + '<div class="iconbtn" style="background:var(--btn);width:30px;height:30px"' + tid(n.plusId) + bind(n.plus) + '>' + icon('plus',14) + '</div></div>';
  case 'stats':  return '<div class="stats"' + tid(n.id) + '>' + R(n.c) + '</div>';
  case 'stat':
    return '<div class="stat' + (n.acc?' acc':'') + (n.act?' tap':'') + '"' + tid(n.id) + bind(n.act)
      + '><div class="st-n">' + esc(n.n) + '</div><div class="st-l">' + esc(n.l) + '</div></div>';
  case 'hero':
    return '<div class="hero' + (n.act?' tap':'') + '"' + tid(n.id) + bind(n.act) + '>'
      + '<div class="he-k">' + esc(n.kicker) + '</div>'
      + '<div class="he-t">' + esc(n.title) + '</div>'
      + '<div class="he-s">' + esc(n.sub) + '</div>' + R(n.c) + '</div>';
  case 'pills':

      return '<div class="tb' + (i.on?' on':'') + '"' + tid(i.id) + bind(i.act) + '>'
        + '<i>' + icon(i.icon, 21) + '</i>' + esc(i.text) + '</div>';
    }).join('') + '</div>';
  case 'mask':  return '<div class="n-mask"' + tid(n.id) + bind(n.close) + '>' + R(n.c) + '</div>';
  case 'sheet':
    return '<div class="n-sheet"' + tid(n.id) + ' data-stop="1"><div class="sh-hd">'
      + '<div class="t">' + esc(n.title) + '</div>'
      + '<div class="iconbtn"' + tid(n.closeId) + bind(n.close) + '>' + icon('close',15) + '</div></div>'
      + '<div class="sh-bd">' + R(n.c) + '</div></div>';
  case 'dialog':
    return '<div class="dialog"' + tid(n.id) + ' data-stop="1">'
      + '<div style="padding:22px 20px 16px;text-align:center">'
      + (n.title ? '<div style="font:650 17px/1.3 var(--disp);margin-bottom:8px">' + esc(n.title) + '</div>' : '')
      + '<div style="font-size:13.5px;color:var(--ink2);line-height:1.55">' + esc(n.text) + '</div></div>'
      + '<div style="display:flex;gap:10px;padding:0 16px 16px">'
      + '<div class="n-btn" style="flex:1"' + tid(n.cancel.id) + bind(n.cancel.act) + '>' + esc(n.cancel.text) + '</div>'
      + '<div class="n-btn primary" style="flex:1"' + tid(n.ok.id) + bind(n.ok.act) + '>' + esc(n.ok.text) + '</div>'
      + '</div></div>';
  case 'toast': return '<div class="n-toast"' + tid(n.id) + '>' + esc(n.text) + '</div>';
  default: return renderExtra(n);
  }
}

  if (mb < 1000) return mb + ' MB';
  var v = mb / 1000;
  return (v >= 100 ? v.toFixed(0) : v.toFixed(v >= 10 ? 1 : 2)) + ' GB';
}

var STATE = null;
function paint(){
  ACTS = [];
  app.innerHTML = render(E.screen(STATE));
  var c = '';
  if (c) document.getElementById('sb-clock').textContent = c;
  if (!hud.classList.contains('off')) paintHud();
}
app.addEventListener('click', function(ev){
  var el = ev.target.closest('[data-act]'); if (!el) return;
  if (el.classList.contains('n-mask') && ev.target.closest('[data-stop]')) return;
  var act = ACTS[+el.getAttribute('data-act')]; if (!act) return;
  TRAJ.push({action:'tap', id: el.getAttribute('data-testid') || null});
  STATE = E.reduce(STATE, act); paint();
});
app.addEventListener('input', function(ev){
  var el = ev.target.closest('[data-actt]'); if (!el) return;
  var act = JSON.parse(JSON.stringify(ACTS[+el.getAttribute('data-actt')]));
  for (var k in act) if (act[k] === '$VALUE') act[k] = el.value;
  var id = el.getAttribute('data-testid'), pos = el.selectionStart;
  TRAJ.push({action:'type', id:id, text:el.value});
  STATE = E.reduce(STATE, act); paint();
  var again = id && app.querySelector('[data-testid="' + id + '"]');
  if (again && again.focus) { again.focus(); try { again.setSelectionRange(pos, pos); } catch(e){} }
});

function paintHud(){
  var d = E.derive(STATE);
  hud.innerHTML = '<h4>__ENV__ \u00b7 ' + E.ENV_ID + ' v' + E.VERSION + '</h4>'
    + '<div><span class="k">route</span> ' + d.route + '  <span class="k">step</span> ' + STATE.meta.steps + '</div>'
    + '<div><span class="k">free</span> ' + gbjs(d.freeDevice) + '  <span class="k">short</span> ' + gbjs(d.updateShort) + '  <span class="k">icloud</span> ' + gbjs(d.freeCloud) + '  <span class="k">backup</span> ' + gbjs(d.nextBackup) + '</div>'
    + '<div style="margin-top:8px"><button id="hud-reset">reset</button>'
    + '<button id="hud-a11y">copy a11y</button><button id="hud-state">copy state</button>'
    + '<button id="hud-traj">copy traj</button><button id="hud-hide">hide (h)</button></div>'
    + '<pre>' + esc(E.a11y(STATE)) + '</pre>';
  hud.querySelector('#hud-reset').onclick = function(){ ENVAPI.reset({seed:STATE.meta.seed}); };
  hud.querySelector('#hud-a11y').onclick  = function(){ copy(E.a11y(STATE)); };
  hud.querySelector('#hud-state').onclick = function(){ copy(JSON.stringify(E.snapshot(STATE), null, 2)); };
  hud.querySelector('#hud-traj').onclick  = function(){ copy(JSON.stringify(TRAJ, null, 2)); };
  hud.querySelector('#hud-hide').onclick  = function(){ hud.classList.add('off'); };
}
function copy(t){ try { navigator.clipboard.writeText(t); } catch(e){} }
document.addEventListener('keydown', function(e){
  if (e.key === 'h') { hud.classList.toggle('off'); if (!hud.classList.contains('off')) paintHud(); }
});

var ENVAPI = {
  ENV_ID: E.ENV_ID, VERSION: E.VERSION,
  reset: function(opts){
    opts = opts || {};
    STATE = E.createInitialState(opts.seed || 0);
    if (opts.patch) E.applyPatch(STATE, opts.patch);
    TRAJ = []; paint();
    return E.snapshot(STATE);
  },
  getState:   function(){ return E.snapshot(STATE); },
  setState:   function(s){ STATE = JSON.parse(JSON.stringify(s)); paint(); return true; },
  step:       function(a){ var r = E.step(STATE, a); STATE = r.state; TRAJ.push(a); paint();
                           return {ok:r.ok, error:r.error || null}; },
  dispatch:   function(act){ STATE = E.reduce(STATE, act); paint(); return true; },
  a11y:       function(){ return E.a11y(STATE); },
  elements:   function(){ return E.elements(STATE); },
  route:      function(){ return E.select.route(STATE); },
  trajectory: function(){ return JSON.parse(JSON.stringify(TRAJ)); },
  bounds: function(){
    var base = document.getElementById('screen').getBoundingClientRect(), out = {};
    app.querySelectorAll('[data-testid]').forEach(function(el){
      var r = el.getBoundingClientRect();
      out[el.getAttribute('data-testid')] = {
        x:Math.round(r.left-base.left), y:Math.round(r.top-base.top),
        w:Math.round(r.width), h:Math.round(r.height),
        cx:Math.round(r.left-base.left+r.width/2), cy:Math.round(r.top-base.top+r.height/2)};
    });
    return out;
  }
};
window.__ENV__ = ENVAPI;
var qs = new URLSearchParams(location.search);
if (qs.get('bare') === '1') document.body.classList.add('bare');
if (qs.get('hud')  === '1') hud.classList.remove('off');
ENVAPI.reset({seed: parseInt(qs.get('seed') || '0', 10) || 0});
window.__ENV_READY__ = true;
})();
</script>
