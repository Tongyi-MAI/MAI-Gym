<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Foxglove (mocked GUI env)</title>
<!--
  ============================================================================
  Foxglove — a single-file H5 e-reader for agent research.

  Same two-block contract as every environment here: script#engine is a pure,
  DOM-free state machine on globalThis.GUI_ENGINE; script#ui renders its screen
  tree and exposes window.__ENV__.

  What is new: there are no pages in the data. A book is one long string, and
  the pages are worked out on the spot from how many characters fit — which
  depends on the type size and the margins you have chosen. Make the type
  bigger and the book gets longer: the same words, more pages. Every page break
  is snapped back to the last space, so the walk is exact and repeatable.

  That is why your place is kept as a character offset rather than a page
  number, and why bookmarks and highlights are stored as offsets too. Change
  the type size and a bookmark lands on a different page number but on exactly
  the same sentence, which is the property the tasks here are really about.
  ============================================================================
-->
<style>
:root{
  --outer:#e3e6ee;
  --bezel:#12151f;
  --bg:#f7f4ee;
  --card:#fffdf8;
  --card2:#f2f4f9;
  --line:#e8e0d2;
  --line2:#dad0be;
  --press:#f2ece1;
  --chev:#c8bfae;
  --ink:#221d16;
  --ink2:#5b5145;
  --muted:#948a7c;
  --accent:#8a5a2b;
  --accent-d:#6e4620;
  --accent-s:#f4e9da;
  --on-accent:#fffdf8;
  --good:#3f7d4f;
  --good-s:#e7f1e8;
  --warn:#a8720b;
  --warn-s:#faf0da;
  --bad:#a8443a;
  --bad-s:#f8e9e6;
  --bad-line:#e0c6bf;
  --btn:#efe8db;
  --btn-off:#e2dacb;
  --off:#cec4b2;
  --appbar:#f7f4ee;
  --appbar-ink:#161a27;
  --appbar-line:transparent;
  --tabbar:#fffdf8;
  --scrim:rgba(34,29,22,.44);
  --toast:#221d16;
  --toast-ink:#ffffff;
  --hero:linear-gradient(140deg,#3c2f22,#6b5540);
  --hero-line:transparent;
  --hero-ink:#f7f2e8;
  --disp:Georgia,"Times New Roman",serif;
  --r:18px; --r2:12px;
  --shadow:0 1px 2px rgba(16,18,26,.05),0 10px 26px rgba(16,18,26,.07);
  --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{background:var(--outer);color:var(--ink);font:14px/1.55 var(--ui);
  display:flex;align-items:center;justify-content:center;overflow:hidden}

#device{position:relative;width:390px;height:844px;background:var(--bezel);border-radius:46px;padding:5px;
  box-shadow:0 30px 70px rgba(0,0,0,.34);flex:0 0 auto}
#screen{position:relative;width:100%;height:100%;background:var(--bg);border-radius:41px;
  overflow:hidden;display:flex;flex-direction:column}
#notch{position:absolute;top:5px;left:50%;transform:translateX(-50%);width:118px;height:30px;
  background:var(--bezel);border-radius:0 0 18px 18px;z-index:60}
body.bare{background:var(--bg)}
body.bare #device{width:390px;height:844px;padding:0;border-radius:0;box-shadow:none;background:var(--bg)}
body.bare #screen{border-radius:0}
body.bare #notch{display:none}
body.bare .n-sheet{animation:none}

.statusbar{height:44px;flex:0 0 44px;display:flex;align-items:flex-end;justify-content:space-between;
  padding:0 22px 6px;font-size:13px;font-weight:600;z-index:50;color:var(--ink)}
.statusbar .sb-r{display:flex;gap:5px;align-items:center}
.sb-bat{width:22px;height:11px;border:1.3px solid currentColor;border-radius:3px;position:relative;opacity:.9}
.sb-bat:after{content:"";position:absolute;right:-3px;top:3px;width:2px;height:5px;background:currentColor;border-radius:0 1px 1px 0}
.sb-bat i{position:absolute;left:1.3px;top:1.3px;bottom:1.3px;width:78%;background:currentColor;border-radius:1px}

#app{flex:1 1 auto;display:flex;flex-direction:column;min-height:0;position:relative}

.n-appbar{flex:0 0 auto;min-height:52px;display:flex;align-items:center;gap:8px;padding:6px 12px;
  background:var(--appbar);color:var(--appbar-ink);z-index:20;border-bottom:1px solid var(--appbar-line)}
.n-appbar .ab-title{flex:1 1 auto;text-align:center;font:650 17px/1.3 var(--disp);letter-spacing:-.2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.n-appbar .ab-side{flex:0 0 auto;min-width:56px;display:flex;align-items:center;gap:2px}
.n-appbar .ab-side.right{justify-content:flex-end}
.n-appbar .iconbtn{color:var(--appbar-ink);opacity:.85}
.iconbtn{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  color:var(--ink2);cursor:pointer}
.iconbtn:active{background:var(--press)}

.n-scroll{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;padding-bottom:10px}
.n-scroll::-webkit-scrollbar{width:0}

.n-text{padding:2px 18px;color:var(--ink2)}
.n-text.h1{font:700 26px/1.18 var(--disp);color:var(--ink);padding:10px 18px 6px;letter-spacing:-.6px}
.n-text.h2{font:650 18px/1.3 var(--disp);color:var(--ink);padding:12px 18px 2px}
.n-text.body{font-size:13.5px;padding:5px 18px;line-height:1.7}
.n-text.muted{font-size:12.5px;color:var(--muted);padding:6px 18px;line-height:1.6}
.n-text.empty{padding:14px 18px 40px;text-align:center;color:var(--muted);font-size:13.5px}
.n-sec{padding:18px 18px 6px;font:700 11.5px/1 var(--ui);color:var(--muted);letter-spacing:1.3px;
  text-transform:uppercase;display:flex;justify-content:space-between;align-items:center;gap:10px}
.n-space{height:16px}

.n-card{background:var(--card);border-radius:var(--r);margin:9px 16px;overflow:hidden;border:1px solid var(--line)}
.n-card.flush{padding:0}
.n-card.pad{padding:14px 16px}
.n-card.tap{cursor:pointer}
.n-card.tap:active{background:var(--press)}

.n-row{display:flex;align-items:center;gap:13px;padding:12px 16px;border-bottom:1px solid var(--line);min-height:54px}
.n-row:last-child{border-bottom:none}
.n-row.tap{cursor:pointer}
.n-row.tap:active{background:var(--press)}
.n-row .r-lead{flex:0 0 auto;width:26px;color:var(--ink2);display:flex;align-items:center;justify-content:center}
.n-row .r-main{flex:1 1 auto;min-width:0}
.n-row .r-label{font-size:14.5px}
.n-row .r-label.strike{text-decoration:line-through;color:var(--muted)}
.n-row .r-sub{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.5}
.n-row .r-value{flex:0 0 auto;font-size:14px;color:var(--ink2);text-align:right;font-variant-numeric:tabular-nums}
.n-row .r-value.strong{color:var(--ink);font-weight:700}
.n-row .r-value.acc{color:var(--accent);font-weight:700}
.n-row .r-value.good{color:var(--good);font-weight:700}
.n-row .r-value.warn{color:var(--warn);font-weight:700}
.n-row .r-value.bad{color:var(--bad);font-weight:700}
.n-row .r-arrow{flex:0 0 auto;color:var(--chev);display:flex}

.n-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:47px;padding:0 20px;
  border-radius:13px;font:650 15px/1 var(--ui);background:var(--btn);color:var(--ink);
  border:none;cursor:pointer;user-select:none}
.n-btn:active{filter:brightness(.97)}
.n-btn.primary{background:var(--accent);color:var(--on-accent)}
.n-btn.primary.off{background:var(--btn-off);color:var(--muted);cursor:not-allowed}
.n-btn.ghost{background:transparent;border:1px solid var(--line2);height:37px;font-size:13px;padding:0 14px;color:var(--ink2)}
.n-btn.danger{background:transparent;border:1px solid var(--bad-line);color:var(--bad);height:37px;font-size:13px;padding:0 14px}
.n-btn.block{display:flex;width:100%}
.n-btnrow{display:flex;gap:10px;padding:12px 16px;justify-content:flex-end;align-items:center;flex-wrap:wrap}

.n-chips{display:flex;gap:8px;padding:8px 16px;overflow-x:auto}
.n-chips::-webkit-scrollbar{height:0}
.n-chip{flex:0 0 auto;height:34px;padding:0 14px;border-radius:11px;background:var(--card);
  border:1px solid var(--line2);display:flex;align-items:center;font-size:13px;
  color:var(--ink2);cursor:pointer;white-space:nowrap;font-weight:600}
.n-chip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}

.n-input{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line);background:var(--card)}
.n-input .i-label{flex:0 0 78px;font-size:13px;color:var(--muted)}
.n-input input{flex:1 1 auto;border:none;outline:none;background:transparent;font-size:14.5px;
  font-family:inherit;color:var(--ink);min-width:0}
.n-input input::placeholder{color:var(--muted)}
.n-switch{flex:0 0 auto;width:46px;height:27px;border-radius:14px;background:var(--off);position:relative;cursor:pointer;transition:background .16s}
.n-switch.on{background:var(--accent)}
.n-switch i{position:absolute;top:2.5px;left:2.5px;width:22px;height:22px;border-radius:50%;background:#fff;
  transition:transform .16s;box-shadow:0 1px 3px rgba(0,0,0,.22)}
.n-switch.on i{transform:translateX(19px)}
.n-check{flex:0 0 auto;width:23px;height:23px;border-radius:7px;border:1.8px solid var(--off);position:relative;background:var(--card)}
.n-check.on{border-color:var(--accent);background:var(--accent)}
.n-check.on:after{content:"";position:absolute;left:7.5px;top:4px;width:5px;height:10px;
  border:2px solid var(--on-accent);border-top:0;border-left:0;transform:rotate(42deg)}
.n-radio{flex:0 0 auto;width:22px;height:22px;border-radius:50%;border:1.8px solid var(--off);position:relative}
.n-radio.on{border-color:var(--accent);background:var(--accent)}
.n-radio.on:after{content:"";position:absolute;left:7px;top:4px;width:5px;height:9px;
  border:2px solid var(--on-accent);border-top:0;border-left:0;transform:rotate(42deg)}

.tag{display:inline-flex;align-items:center;padding:3px 9px;border-radius:20px;font-size:11px;
  font-weight:700;background:var(--btn);color:var(--ink2)}
.tag.acc{background:var(--accent-s);color:var(--accent)}
.tag.good{background:var(--good-s);color:var(--good)}
.tag.warn{background:var(--warn-s);color:var(--warn)}
.tag.bad{background:var(--bad-s);color:var(--bad)}

.n-tabbar{flex:0 0 auto;height:58px;background:var(--tabbar);border-top:1px solid var(--line);display:flex;z-index:30}
.n-tabbar .tb{flex:1 1 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--muted);font-size:10.5px;cursor:pointer;font-weight:600}
.n-tabbar .tb i{display:flex}
.n-tabbar .tb.on{color:var(--accent)}

.n-mask{position:absolute;inset:0;background:var(--scrim);z-index:70;display:flex;align-items:flex-end}
.n-sheet{width:100%;max-height:80%;background:var(--card);border-radius:22px 22px 0 0;display:flex;
  flex-direction:column;overflow:hidden;animation:up .18s ease-out}
@keyframes up{from{transform:translateY(24px)}to{transform:none}}
.n-sheet .sh-hd{padding:16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.n-sheet .sh-hd .t{font:650 17px/1.2 var(--disp)}
.n-sheet .sh-bd{flex:1 1 auto;overflow-y:auto;min-height:0}
.n-sheet .sh-bd::-webkit-scrollbar{width:0}
.n-toast{position:absolute;left:50%;bottom:118px;transform:translateX(-50%);background:var(--toast);
  color:var(--toast-ink);padding:11px 18px;border-radius:11px;font-size:13px;z-index:90;max-width:84%;text-align:center}
.dialog{margin:auto;width:82%;background:var(--card);border-radius:18px;overflow:hidden;border:1px solid var(--line)}

.stats{display:flex;gap:9px;padding:4px 16px}
.stat{flex:1 1 0;background:var(--card);border:1px solid var(--line);border-radius:var(--r2);padding:13px 12px}
.stat.tap{cursor:pointer}
.stat .st-n{font:800 19px/1.1 var(--disp);letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.stat .st-l{font-size:11px;color:var(--muted);margin-top:6px;line-height:1.4}
.stat.acc .st-n{color:var(--accent)}

.hero{margin:8px 16px 4px;padding:18px;border-radius:var(--r);background:var(--hero);
  border:1px solid var(--hero-line);color:var(--hero-ink)}
.hero.tap{cursor:pointer}
.hero .he-k{font-size:11px;letter-spacing:1.3px;text-transform:uppercase;font-weight:800;opacity:.85}
.hero .he-t{font:800 25px/1.16 var(--disp);margin-top:9px;letter-spacing:-.7px}
.hero .he-s{font-size:13px;margin-top:8px;line-height:1.6;opacity:.9}


.page{flex:1 1 auto;min-height:0;overflow-y:auto;padding:8px 0 4px}
.page::-webkit-scrollbar{width:0}
.page .pg-text{white-space:pre-wrap;font-family:Georgia,"Times New Roman",serif;color:var(--ink)}
.page .pg-text mark{background:#f6e08a;color:inherit;border-radius:2px;padding:0 1px}
.reader-sepia{background:#f6ecd9}
.reader-dark{background:#191714;color:#e6ded0}
.reader-dark .pg-text{color:#e6ded0}
.reader-dark .pg-text mark{background:#6a5a1e;color:#fff4cf}
.pgfoot{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:10px 18px 14px;font-size:11.5px;color:var(--muted);border-top:1px solid var(--line)}
.pgfoot .pf-b{padding:6px 14px;border-radius:9px;background:var(--btn);color:var(--ink);
  font-size:12.5px;font-weight:650;cursor:pointer}
.pgfoot .pf-b.off{opacity:.35}
.progline{height:4px;background:var(--btn);border-radius:2px;margin:0 18px}
.progline i{display:block;height:100%;background:var(--accent);border-radius:2px}

.shelf{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;padding:10px 16px}
.bk{cursor:pointer}
.bk .bk-c{width:100%;aspect-ratio:2/3;border-radius:6px;overflow:hidden;position:relative;
  box-shadow:0 6px 16px rgba(34,29,22,.22)}
.bk .bk-c svg{display:block;width:100%;height:100%}
.bk .bk-t{font:600 14px/1.3 var(--disp);margin-top:9px}
.bk .bk-a{font-size:11.5px;color:var(--muted);margin-top:3px}
.bk .bk-p{height:3px;background:var(--btn);border-radius:2px;margin-top:7px}
.bk .bk-p i{display:block;height:100%;background:var(--accent);border-radius:2px}

.quote{margin:9px 16px;padding:14px 16px;border-radius:var(--r);background:var(--card);
  border:1px solid var(--line);border-left:3px solid var(--accent);cursor:pointer}
.quote .qt-t{font:italic 400 14.5px/1.6 var(--disp)}
.quote .qt-s{font-size:11.5px;color:var(--muted);margin-top:8px}
.quote.mark{border-left-color:#d8b93c}

</style>
</head>
<body>
<div id="device">
  <div id="notch"></div>
  <div id="screen">
    <div class="statusbar" id="sb">
      <div id="sb-clock">09:41</div>
      <div class="sb-r">
        <svg width="17" height="12" viewBox="0 0 17 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="4.6" y="5.5" width="3" height="6.5" rx="1"/><rect x="9.2" y="3" width="3" height="9" rx="1"/><rect x="13.8" y="0" width="3" height="12" rx="1"/></svg>
        <svg width="15" height="12" viewBox="0 0 15 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M1 4.2a9 9 0 0 1 13 0"/><path d="M3.4 6.9a5.6 5.6 0 0 1 8.2 0"/><circle cx="7.5" cy="10" r=".9" fill="currentColor" stroke="none"/></svg>
        <span class="sb-bat"><i></i></span>
      </div>
    </div>
    <div id="app"></div>
  </div>
</div>
<div id="hud" class="off"></div>

<script id="engine">
/* ===========================================================================
 * ENGINE — pure, deterministic, DOM-free.
 * Pages do not exist in the data. They are walked out of one long string
 * using however many characters fit, and every break snaps to a space.
 * ======================================================================== */
(function(root){
'use strict';

var ENV_ID  = 'foxglove_reader';
var VERSION = '1.0.0';

/* ------------------------------------------------------------- utilities */
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function pad2(n){ return (n < 10 ? '0' : '') + n; }
function hhmm(m){ m = ((m % 1440) + 1440) % 1440; return pad2(Math.floor(m/60)) + ':' + pad2(m%60); }
function sum(a){ var s = 0; for (var i=0;i<a.length;i++) s += a[i]; return s; }
function clamp(v, lo, hi){ return v < lo ? lo : (v > hi ? hi : v); }
function lcg(seed){ var s=(seed>>>0)||1; return function(){ s=(s*1664525+1013904223)>>>0; return s/4294967296; }; }
function shuffled(list, seed){
  if (!seed) return list.slice();
  var r = lcg(seed), a = list.slice();
  for (var i=a.length-1;i>0;i--){ var j = Math.floor(r()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
function money(p, sym){
  var neg = p < 0; p = Math.abs(p);
  return (neg ? '-' : '') + (sym === undefined ? '\u00a3' : sym) +
         (Math.floor(p/100)).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',') + '.' + pad2(p%100);
}
function getPath(o, path){
  var cur = o, parts = String(path).split('.');
  for (var i=0;i<parts.length;i++){
    var k = parts[i], m = k.match(/^(.*?)\[(\d+)\]$/);
    if (m){ cur = cur ? cur[m[1]] : undefined; cur = cur ? cur[+m[2]] : undefined; }
    else cur = cur ? cur[k] : undefined;
    if (cur === undefined) return undefined;
  }
  return cur;
}
function setPath(o, path, value){
  var parts = String(path).split('.'), cur = o;
  for (var i=0;i<parts.length-1;i++){
    var k = parts[i], m = k.match(/^(.*?)\[(\d+)\]$/);
    cur = m ? cur[m[1]][+m[2]] : (cur[k] = cur[k] || {});
  }
  var lastK = parts[parts.length-1], lm = lastK.match(/^(.*?)\[(\d+)\]$/);
  if (lm) cur[lm[1]][+lm[2]] = value; else cur[lastK] = value;
  return o;
}

/* ------------------------------------------- screen-tree node constructors */
function N(t, o){ o = o || {}; o.t = t; return o; }
function txt(s, cls){ return N('text', {text:s, cls:cls || ''}); }
function row(id, text, o){
  o = o || {}; o.id = id; o.text = text;
  if (o.arrow === undefined) o.arrow = !!o.act;
  return N('row', o);
}
function btn(id, text, act, cls, disabled){
  return N('btn', {id:id, text:text, act:act, cls:cls || '', disabled:!!disabled});
}
function iconbtn(id, ic, act, cls){ return N('iconbtn', {id:id, icon:ic, act:act, cls:cls || ''}); }
function appbar(title, o){ o = o || {}; o.title = title; return N('appbar', o); }
function stepper(id, value, minus, plus){
  return N('stepper', {id:id, value:value, minusId:id + '_dec', plusId:id + '_inc',
                       minus:minus, plus:plus});
}
function sheet(id, title, kids){
  return N('sheet', {id:id, title:title, closeId:id + '_close', close:{type:'CLOSE_SHEET'}, c:kids});
}
function route(st){ return st.ui.stack[st.ui.stack.length - 1]; }
function push(st, name, params){ st.ui.stack.push({name:name, params:params || {}}); st.ui.sheet = null; }
function pop(st){ if (st.ui.stack.length > 1) st.ui.stack.pop(); }
function toast(st, t){ st.ui.toast = t; }
var BOOKS = [
  {id:'bk_keeper', title:'The Keeper at Fell Point', author:'H. Marchmont', blurb:'A lighthouse, a wreck, and a tin box of paper that has been in the sea too long.', palette:['#2c3d4f', '#7d94a8', '#e3d9c4'], chapters:[{title:'Chapter one', text:'Chapter one\n\nThe lamp room stood at the head of the stair, and Marta climbed to it twice a night whether the weather asked her to or not. The glass was cold under her palm. Outside, the water moved the way it always moved in October, in long grey shoulders that came in without hurry and left without apology.\n\nShe trimmed the wick. She wrote the time in the book. She wrote the weather in the book, and because the keeper before her had written the weather in the book for eleven years, she used his words for it: fresh, thick, fair, dirty. On the night this account begins she wrote dirty, and underlined it, which was not a thing the book encouraged.\n\nAt half past two the light went round as it had gone round every four seconds since the spring, and Marta saw, in the sweep of it, a shape on the rocks that had not been on the rocks at two.'}, {title:'Chapter two', text:'Chapter two\n\nIt took her nineteen minutes to get down to the shingle with the lantern, and in that time she had decided four separate things about what the shape was, none of which turned out to be right. It was a boat, or it had been. It lay over on its side like something asleep, and the sea was already busy taking it apart with the patience of a thing that has all winter.\n\nThere was nobody in it. There was, in the locker under the seat, a tin box with a lid that had been sealed with candle wax and then sealed again, and Marta carried the box back up the hundred and forty steps without opening it, because she had been raised by a woman who believed that a wet box opened in the wind is a box you have thrown away.\n\nShe put it on the table by the stove and looked at it until the light came.'}, {title:'Chapter three', text:'Chapter three\n\nThe box held paper, which was the worst thing it could have held and the thing she had expected. Forty-one sheets, written on both sides in a hand that leaned hard to the right, and every sheet numbered in the top corner as if the writer had been afraid of exactly what had happened.\n\nSheet one was missing. So were sheets nine to twelve, and the last four, and what remained had been in salt water long enough that whole lines had gone soft and grey.\n\nMarta read what there was twice. Then she took the ledger down from the shelf, turned to the back where the pages were still clean, and began to copy across everything she could still make out, because a keeper writes things down. That is the whole of the job, when you take the lamp out of it.'}, {title:'Chapter four', text:'Chapter four\n\nBy the fourth morning she had a version of it, and the version had a hole in the middle the size of four sheets of paper.\n\nWhat she could tell was this: a crossing that should have taken nine days had taken twenty-two. Something had gone wrong with the water on board on the eleventh day, and after that the writer stopped putting dates at the top and started putting them at the bottom, which Marta thought was the saddest detail in the whole of it, because it meant he had begun writing his entries at the end of the day instead of the start, when he knew whether there would be an end to write about.\n\nShe closed the ledger. The lamp wanted trimming. She went up.'}]},
  {id:'bk_orchard', title:'The Orchard Accounts', author:'E. Fenwold', blurb:'Eleven summers of a farm ledger, and what the numbers stopped saying in the ninth.', palette:['#4a5a2e', '#8fa05c', '#efe6c8'], chapters:[{title:'Chapter one', text:'Chapter one\n\nThe orchard came to us in the wet spring of the year my father stopped keeping the book himself, which is to say it came to me. Eighty-one trees, of which sixty were worth the ladder and the rest were worth the firewood, and a shed with a door that had to be lifted before it would swing.\n\nI wrote the first entry standing up.'}]},
  {id:'bk_transit', title:'Nine Timetables', author:'R. Larkline', blurb:'A history of a city told entirely through the hours its trains were supposed to leave.', palette:['#3a2b46', '#7b5f8d', '#e6d7ea'], chapters:[{title:'Chapter one', text:'Chapter one\n\nA timetable is a promise made by people who will not be there to keep it. The first one printed in this city ran to a single sheet and had, in place of minutes, the words morning, midday and dusk.'}]},
  {id:'bk_bread', title:'Bread, Salt, Water', author:'S. Quay', blurb:'Three things and what people have done with them for six thousand years.', palette:['#7a4a24', '#c58f4e', '#f2e3cb'], chapters:[{title:'Chapter one', text:'Chapter one\n\nSalt is the only rock we eat. That sentence has been in every book on the subject for a century, and it is still the best place to start.'}]}
];

/* how many characters fit on a page: a function of the type size and the
 * margins, and nothing else */
var FONTS = [
  {id:'s',  label:'Small',  px:15, chars:1000},
  {id:'m',  label:'Medium', px:17, chars:800},
  {id:'l',  label:'Large',  px:20, chars:600},
  {id:'xl', label:'Huge',   px:24, chars:420}
];
var MARGINS = [
  {id:'narrow', label:'Narrow', pad:14, factor:110},
  {id:'normal', label:'Normal', pad:22, factor:100},
  {id:'wide',   label:'Wide',   pad:34, factor:82}
];
var THEMES = [
  {id:'paper', label:'Paper'},
  {id:'sepia', label:'Sepia'},
  {id:'night', label:'Night'}
];
function fontOf(id){ for (var i=0;i<FONTS.length;i++) if (FONTS[i].id===id) return FONTS[i]; return FONTS[1]; }
function marginOf(id){ for (var i=0;i<MARGINS.length;i++) if (MARGINS[i].id===id) return MARGINS[i]; return MARGINS[1]; }
function bookOf(id){ for (var i=0;i<BOOKS.length;i++) if (BOOKS[i].id===id) return BOOKS[i]; return null; }

function fullText(b){ return b.chapters.map(function(c){ return c.text; }).join('\n\n'); }
function chapterStarts(b){
  var out = [], n = 0;
  b.chapters.forEach(function(c, i){
    out.push({index:i, title:c.title, start:n, length:c.text.length});
    n += c.text.length + 2;
  });
  return out;
}
function charsPerPage(st){
  return Math.round(fontOf(st.settings.font).chars * marginOf(st.settings.margin).factor / 100);
}
/* the walk: take up to cpp characters, then back off to the last space, so a
 * page never breaks a word. Deterministic, and the whole point of the app. */
function pageBreaks(text, cpp){
  var out = [], at = 0, n = text.length;
  while (at < n){
    var end = at + cpp;
    if (end >= n) { out.push({start:at, end:n}); break; }
    var cut = text.lastIndexOf(' ', end);
    if (cut <= at) cut = end;
    out.push({start:at, end:cut});
    at = cut + 1;
  }
  if (!out.length) out.push({start:0, end:n});
  return out;
}
function pagesOf(st, b){ return pageBreaks(fullText(b), charsPerPage(st)); }
function pageAt(pages, offset){
  for (var i=0;i<pages.length;i++) if (offset >= pages[i].start && offset <= pages[i].end) return i;
  return pages.length - 1;
}
function readingBook(st){ return bookOf(st.reading.book); }
function offsetOf(st){ return st.reading.offset; }
function percentOf(st, b){
  var t = fullText(b).length;
  return t ? Math.round(offsetOf(st) * 100 / t) : 0;
}
function chapterAt(b, offset){
  var cs = chapterStarts(b), out = cs[0];
  cs.forEach(function(c){ if (offset >= c.start) out = c; });
  return out;
}
function quoteAt(b, offset, len){
  var t = fullText(b);
  var s = t.slice(offset, offset + (len || 60)).replace(/\s+/g, ' ').trim();
  return s + (offset + (len || 60) < t.length ? '…' : '');
}
function searchBook(b, q){
  if (!q || q.length < 3) return [];
  var t = fullText(b), k = q.toLowerCase(), lt = t.toLowerCase(), out = [], at = 0;
  while (out.length < 8){
    var i = lt.indexOf(k, at);
    if (i < 0) break;
    out.push({offset:i, quote:t.slice(Math.max(0, i - 30), i + 50).replace(/\s+/g, ' ').trim()});
    at = i + k.length;
  }
  return out;
}
function marksOf(st, kind){
  return st.marks.filter(function(m){ return m.kind === kind && m.book === st.reading.book; });
}

/* =========================================================== state */
function createInitialState(seed){
  seed = seed || 0;
  return {
    meta:{env:ENV_ID, version:VERSION, seed:seed, steps:0, finished:false, answer:null},
    /* the seed permutes the order the shelf is arranged in */
    shelf:shuffled(BOOKS.map(function(b){ return b.id; }), seed),
    reading:{book:'bk_keeper', offset:0},
    progress:{bk_keeper:0, bk_orchard:0, bk_transit:0, bk_bread:0},
    marks:[{id:'mk_1', kind:'bookmark', book:'bk_keeper', offset:0, note:'The start'}],
    ui:{tab:'library', stack:[{name:'library', params:{}}], sheet:null, confirm:null, inputs:{},
        toast:null},
    settings:{font:'m', margin:'normal', theme:'paper', tapToTurn:true, showProgress:true}
  };
}
var SELECT = {
  bookOf:bookOf, fullText:fullText, chapterStarts:chapterStarts, charsPerPage:charsPerPage,
  pageBreaks:pageBreaks, pagesOf:pagesOf, pageAt:pageAt, readingBook:readingBook,
  offsetOf:offsetOf, percentOf:percentOf, chapterAt:chapterAt, quoteAt:quoteAt,
  searchBook:searchBook, marksOf:marksOf, fontOf:fontOf, marginOf:marginOf, route:route
};

/* =========================================================== reducer */
function setOffset(st, off){
  var b = readingBook(st), t = fullText(b).length;
  st.reading.offset = clamp(off, 0, Math.max(0, t - 1));
  st.progress[b.id] = percentOf(st, b);
}
function reduce(prev, action){
  var st = clone(prev), A = action || {};
  st.ui.toast = null;
  st.meta.steps += 1;

  switch (A.type) {

  case 'NOOP': break;
  case 'FINISH': st.meta.finished = true; st.meta.answer = A.answer === undefined ? null : A.answer; break;

  case 'NAV': push(st, A.to, A.params); break;
  case 'BACK':
    if (st.ui.sheet) st.ui.sheet = null;
    else if (st.ui.confirm) st.ui.confirm = null;
    else pop(st);
    break;
  case 'TAB': {
    var roots = {library:'library', marks:'marks', search:'search', settings:'settings'};
    st.ui.tab = A.tab; st.ui.sheet = null; st.ui.confirm = null;
    st.ui.stack = [{name:roots[A.tab] || 'library', params:{}}];
    break;
  }
  case 'HOME':
    st.ui.tab = 'library'; st.ui.stack = [{name:'library', params:{}}];
    st.ui.sheet = null; st.ui.confirm = null;
    break;
  case 'SET_INPUT': st.ui.inputs[A.field] = A.value; break;
  case 'OPEN_SHEET': st.ui.sheet = {type:A.sheet, id:A.id || null}; break;
  case 'CLOSE_SHEET': st.ui.sheet = null; break;
  case 'CONFIRM_NO': st.ui.confirm = null; break;
  case 'CONFIRM_YES': {
    var yes = st.ui.confirm && st.ui.confirm.yes; st.ui.confirm = null;
    if (yes) { var keep = st.meta.steps; var out = reduce(st, yes); out.meta.steps = keep; return out; }
    break;
  }

  /* ---- reading ---- */
  case 'OPEN_BOOK': push(st, 'book', {id:A.id}); break;
  case 'READ': {
    st.reading.book = A.id;
    if (A.offset !== undefined) setOffset(st, A.offset);
    push(st, 'reader', {id:A.id});
    break;
  }
  case 'TURN': {
    var b = readingBook(st), pages = pagesOf(st, b);
    var i = pageAt(pages, offsetOf(st)) + A.d;
    if (i < 0) { toast(st, 'That is the beginning of the book'); break; }
    if (i >= pages.length) { toast(st, 'That is the end of the book'); break; }
    setOffset(st, pages[i].start);
    break;
  }
  case 'GOTO_PAGE': {
    var b2 = readingBook(st), pages2 = pagesOf(st, b2);
    var n = clamp(A.n, 1, pages2.length);
    setOffset(st, pages2[n-1].start);
    toast(st, 'Page ' + n + ' of ' + pages2.length);
    break;
  }
  case 'GOTO_CHAPTER': {
    var b3 = readingBook(st), cs = chapterStarts(b3);
    var c = cs[A.n];
    if (!c) break;
    setOffset(st, c.start);
    if (route(st).name !== 'reader') { st.ui.stack = [{name:'library', params:{}},
                                                      {name:'reader', params:{id:b3.id}}]; }
    else pop(st);
    toast(st, c.title);
    break;
  }
  case 'GOTO_OFFSET': {
    setOffset(st, A.offset);
    if (route(st).name !== 'reader')
      st.ui.stack = [{name:'library', params:{}}, {name:'reader', params:{id:st.reading.book}}];
    break;
  }
  case 'GOTO_PERCENT': {
    var b4 = readingBook(st), t4 = fullText(b4).length;
    setOffset(st, Math.round(t4 * A.pct / 100));
    toast(st, A.pct + '% through');
    break;
  }

  /* ---- marks: stored as offsets, never as page numbers ---- */
  case 'BOOKMARK': {
    var b5 = readingBook(st), off = offsetOf(st);
    var had = st.marks.filter(function(m){
      return m.kind === 'bookmark' && m.book === b5.id && m.offset === off; })[0];
    if (had) {
      st.marks = st.marks.filter(function(m){ return m !== had; });
      toast(st, 'Bookmark removed');
      break;
    }
    st.marks.push({id:'mk_' + (st.marks.length + 1), kind:'bookmark', book:b5.id, offset:off,
                   note:''});
    toast(st, 'Bookmarked');
    break;
  }
  case 'HIGHLIGHT': {
    var b6 = readingBook(st), off6 = offsetOf(st), pages6 = pagesOf(st, b6);
    var pg = pages6[pageAt(pages6, off6)];
    var start = A.offset === undefined ? pg.start : A.offset;
    var len = A.len || 90;
    st.marks.push({id:'mk_' + (st.marks.length + 1), kind:'highlight', book:b6.id,
                   offset:start, len:len, note:''});
    toast(st, 'Highlighted');
    break;
  }
  case 'DELETE_MARK': {
    st.marks = st.marks.filter(function(m){ return m.id !== A.id; });
    toast(st, 'Removed');
    break;
  }

  /* ---- how it looks ---- */
  case 'SET_FONT': st.settings.font = A.id;
    toast(st, fontOf(A.id).label + ' type — ' + pagesOf(st, readingBook(st)).length + ' pages now');
    break;
  case 'SET_MARGIN': st.settings.margin = A.id; break;
  case 'SET_THEME': st.settings.theme = A.id; break;
  case 'SET_TOGGLE': st.settings[A.key] = !st.settings[A.key]; break;

  default: break;
  }
  return st;
}

/* =========================================================== screens */
function tabbar(st){
  var items = [
    {id:'tab_library',  text:'Shelf',    icon:'book',   tab:'library'},
    {id:'tab_marks',    text:'Marks',    icon:'star',   tab:'marks'},
    {id:'tab_search',   text:'Search',   icon:'search', tab:'search'},
    {id:'tab_settings', text:'Reading',  icon:'sliders',tab:'settings'}
  ].map(function(i){
    return {id:i.id, text:i.text, icon:i.icon, on:(st.ui.tab === i.tab), act:{type:'TAB', tab:i.tab}};
  });
  return N('tabbar', {id:'tabbar', items:items});
}

function scrLibrary(st){
  var cur = readingBook(st), pages = pagesOf(st, cur);
  return N('screen', {id:'scr_library', name:'library', c:[
    appbar('Foxglove'),
    N('scroll', {id:'library_scroll', c:[
      N('hero', {id:'continue', kicker:'Where you left off', title:cur.title,
        sub:chapterAt(cur, offsetOf(st)).title + ' · page ' +
            (pageAt(pages, offsetOf(st)) + 1) + ' of ' + pages.length + ' · ' +
            percentOf(st, cur) + '% through',
        act:{type:'READ', id:cur.id}}),
      N('card', {id:'current_ops', cls:'flush', c:[
        row('go_contents', 'Contents', {lead:'list',
          sub:cur.chapters.length + ' chapters · ' + pages.length + ' pages at this size',
          act:{type:'NAV', to:'book', params:{id:cur.id}}}),
        row('go_marks', 'Your marks in this book', {lead:'star',
          val:(marksOf(st, 'bookmark').length + marksOf(st, 'highlight').length) + '',
          act:{type:'TAB', tab:'marks'}}),
        row('go_search', 'Search inside it', {lead:'search', act:{type:'TAB', tab:'search'}})
      ]}),
      N('sec', {text:'On the shelf', side:st.shelf.length + ''}),
      N('shelf', {id:'shelf', c: st.shelf.map(function(id){
        var b = bookOf(id);
        return {id:'book_' + id, title:b.title, author:b.author, palette:b.palette, seed:id,
          pct:st.progress[id] || 0, act:{type:'OPEN_BOOK', id:id}};
      })}),
      txt('A book is one long string of text. The pages you see are worked out from the type size, '
          + 'so they are not the same pages on another setting.', 'muted'),
      N('space', {})
    ]}),
    tabbar(st)
  ]});
}

function scrBook(st, params){
  var b = bookOf(params.id);
  if (!b) return scrLibrary(st);
  var pages = pagesOf(st, b), cs = chapterStarts(b);
  var reading = st.reading.book === b.id;
  return N('screen', {id:'scr_book', name:'book', params:params, c:[
    appbar(b.author, {back:true}),
    N('scroll', {id:'book_scroll', c:[
      N('cover', {id:'cover', palette:b.palette, seed:b.id, title:b.title, author:b.author}),
      txt(b.title, 'h1'),
      txt(b.blurb, 'body'),
      N('pills', {id:'book_pills', items:[
        {text:b.chapters.length + ' chapters', cls:''},
        {text:fullText(b).length + ' characters', cls:''},
        {text:pages.length + ' pages at this size', cls:'acc'}
      ]}),
      N('padded', {c:[btn('read_book', reading ? 'Carry on reading' : 'Start reading',
        {type:'READ', id:b.id}, 'primary block')]}),
      N('sec', {text:'Contents'}),
      N('card', {id:'chapter_list', cls:'flush', c: cs.map(function(c){
        return row('chap_' + c.index, c.title,
          {lead:'book', sub:'starts at character ' + c.start,
           val:'p' + (pageAt(pages, c.start) + 1), valCls:'acc',
           act:{type:'GOTO_CHAPTER', n:c.index}});
      })}),
      N('space', {})
    ]})
  ]});
}

function scrReader(st){
  var b = readingBook(st), pages = pagesOf(st, b);
  var i = pageAt(pages, offsetOf(st)), pg = pages[i];
  var text = fullText(b).slice(pg.start, pg.end);
  var hl = marksOf(st, 'highlight').filter(function(m){
    return m.offset < pg.end && m.offset + m.len > pg.start;
  }).map(function(m){
    return {from:Math.max(0, m.offset - pg.start), to:Math.min(text.length, m.offset + m.len - pg.start)};
  });
  var marked = marksOf(st, 'bookmark').filter(function(m){
    return m.offset >= pg.start && m.offset <= pg.end; }).length > 0;
  return N('screen', {id:'scr_reader', name:'reader', theme:st.settings.theme, c:[
    appbar(chapterAt(b, offsetOf(st)).title, {back:true, right:[
      iconbtn('bookmark', marked ? 'starOn' : 'star', {type:'BOOKMARK'}),
      iconbtn('reader_settings', 'sliders', {type:'TAB', tab:'settings'})]}),
    N('page', {id:'page', text:text, font:fontOf(st.settings.font).px,
      pad:marginOf(st.settings.margin).pad, theme:st.settings.theme, marks:hl,
      act:st.settings.tapToTurn ? {type:'TURN', d:1} : null}),
    N('progline', {id:'progline', pct:percentOf(st, b), show:st.settings.showProgress}),
    N('pgfoot', {id:'pgfoot', page:i + 1, total:pages.length,
      left:'page ' + (i + 1) + ' of ' + pages.length,
      right:percentOf(st, b) + '%',
      minusId:'page_prev', plusId:'page_next',
      minus:{type:'TURN', d:-1}, plus:{type:'TURN', d:1},
      atStart:i === 0, atEnd:i === pages.length - 1}),
    N('bar', {id:'reader_bar', c:[
      N('btnrow', {id:'reader_ops', c:[
        btn('do_highlight', 'Highlight this page', {type:'HIGHLIGHT'}, 'ghost'),
        btn('do_contents', 'Contents', {type:'NAV', to:'book', params:{id:b.id}}, 'ghost')]})]})
  ]});
}

function scrMarks(st){
  var b = readingBook(st);
  var bms = marksOf(st, 'bookmark'), hls = marksOf(st, 'highlight');
  var pages = pagesOf(st, b);
  function markRow(m, kind){
    var pg = pageAt(pages, m.offset) + 1;
    return N('quote', {id:'mark_' + m.id, kind:kind,
      text:quoteAt(b, m.offset, kind === 'highlight' ? m.len : 70),
      sub:kind + ' · character ' + m.offset + ' · page ' + pg + ' at this type size',
      act:{type:'GOTO_OFFSET', offset:m.offset}});
  }
  return N('screen', {id:'scr_marks', name:'marks', c:[
    appbar('Marks'),
    N('scroll', {id:'marks_scroll', c:[
      txt(b.title, 'h2'),
      N('sec', {text:'Bookmarks', side:bms.length + ''}),
      bms.length ? N('div', {c:bms.map(function(m){ return markRow(m, 'bookmark'); })})
                 : txt('No bookmarks in this book.', 'empty'),
      N('sec', {text:'Highlights', side:hls.length + ''}),
      hls.length ? N('div', {c:hls.map(function(m){ return markRow(m, 'highlight'); })})
                 : txt('Nothing highlighted yet.', 'empty'),
      N('sec', {text:'Tidy up'}),
      N('card', {id:'mark_ops', cls:'flush', c: st.marks.filter(function(m){
        return m.book === b.id; }).map(function(m){
          return row('del_' + m.id, m.kind === 'bookmark' ? 'Bookmark at ' + m.offset
                                                          : 'Highlight at ' + m.offset,
            {lead:'trash', val:'remove', valCls:'bad', act:{type:'DELETE_MARK', id:m.id}});
        })}),
      txt('A mark remembers a character, not a page. Change the type size and it moves to a '
          + 'different page number but the same words.', 'muted'),
      N('space', {})
    ]}),
    tabbar(st)
  ]});
}

function scrSearch(st){
  var b = readingBook(st), q = String(st.ui.inputs.q_book || '').trim();
  var hits = searchBook(b, q), pages = pagesOf(st, b);
  return N('screen', {id:'scr_search', name:'search', c:[
    appbar('Search'),
    N('scroll', {id:'search_scroll', c:[
      N('inputrow', {id:'q_book', label:'In book', field:'q_book', value:st.ui.inputs.q_book || '',
        placeholder:'A word or a phrase', act:{type:'SET_INPUT', field:'q_book', value:'$VALUE'}}),
      txt('Searching ' + b.title + ' — ' + fullText(b).length + ' characters.', 'muted'),
      N('sec', {text:q.length < 3 ? 'Type at least three letters' : hits.length + ' matches'}),
      hits.length
        ? N('div', {c:hits.map(function(h, i){
            return N('quote', {id:'hit_' + i, kind:'hit', text:h.quote,
              sub:'character ' + h.offset + ' · page ' + (pageAt(pages, h.offset) + 1),
              act:{type:'GOTO_OFFSET', offset:h.offset}});
          })})
        : txt(q.length < 3 ? 'Nothing searched yet.' : 'No match in this book.', 'empty'),
      N('space', {})
    ]}),
    tabbar(st)
  ]});
}

function scrSettings(st){
  var b = readingBook(st), pages = pagesOf(st, b);
  function sw(id, text, key, sub){
    return row(id, text, {sub:sub, arrow:false,
      c:[N('switch', {id:'set_' + key, on:!!st.settings[key], act:{type:'SET_TOGGLE', key:key}})]});
  }
  return N('screen', {id:'scr_settings', name:'settings', c:[
    appbar('Reading'),
    N('scroll', {id:'settings_scroll', c:[
      N('stats', {id:'page_stats', c:[
        N('stat', {id:'stat_cpp', n:String(charsPerPage(st)), l:'Characters a page', acc:true}),
        N('stat', {id:'stat_pages', n:String(pages.length), l:'Pages in this book'}),
        N('stat', {id:'stat_pct', n:percentOf(st, b) + '%', l:'How far through'})
      ]}),
      N('sec', {text:'Type size'}),
      N('chips', {id:'font_chips', c: FONTS.map(function(f){
        return N('chip', {id:'font_' + f.id, text:f.label, on:st.settings.font === f.id,
          act:{type:'SET_FONT', id:f.id}});

      + (n.avatar ? avatarHtml(n.avatar) : '')
      + (n.thumb && typeof thumbHtml === 'function' ? thumbHtml(n.thumb) : '')
      + '<div class="r-main"><div class="r-label' + (n.strike?' strike':'') + '">' + esc(n.text) + '</div>'
      + (n.sub ? '<div class="r-sub">' + esc(n.sub) + '</div>' : '') + '</div>'
      + (n.val ? '<div class="r-value ' + esc(n.valCls||'') + '">' + esc(n.val) + '</div>' : '')
      + R(inline)
      + (n.arrow && !inline.length ? '<div class="r-arrow">' + icon('arrow',15) + '</div>' : '')
      + '</div>' + R(below);
  }
  case 'btn':
    return '<div class="n-btn ' + esc(n.cls||'') + (n.disabled?' off':'') + '"' + tid(n.id)
      + (n.disabled?'':bind(n.act)) + '>' + esc(n.text) + '</div>';
  case 'btnrow': return '<div class="n-btnrow"' + tid(n.id) + '>' + R(n.c) + '</div>';
  case 'bar':    return '<div style="flex:0 0 auto;background:var(--card);border-top:1px solid var(--line);'
                      + 'padding:12px 16px 16px;z-index:30"' + tid(n.id) + '>' + R(n.c) + '</div>';
  case 'switch': return '<div class="n-switch' + (n.on?' on':'') + '"' + tid(n.id) + bind(n.act) + '><i></i></div>';
  case 'check':  return '<div class="n-check' + (n.on?' on':'') + '"' + tid(n.id) + bind(n.act) + '></div>';
  case 'radio':  return '<div class="n-radio' + (n.on?' on':'') + '"' + tid(n.id) + bind(n.act) + '></div>';
  case 'inputrow':
    return '<div class="n-input"><div class="i-label">' + esc(n.label) + '</div>'
      + '<input' + tid(n.id) + bindT(n.act) + ' value="' + esc(n.value) + '" placeholder="'
      + esc(n.placeholder) + '"></div>';
  case 'stepper':
    return '<div style="display:flex;align-items:center;gap:8px"' + tid(n.id) + '>'
      + '<div class="iconbtn" style="background:var(--btn);width:30px;height:30px"' + tid(n.minusId) + bind(n.minus) + '>' + icon('minus',14) + '</div>'
      + '<div style="min-width:52px;text-align:center;font-weight:700;font-size:12.5px;font-variant-numeric:tabular-nums">'
      + esc(n.value) + '</div>'
      + '<div class="iconbtn" style="background:var(--btn);width:30px;height:30px"' + tid(n.plusId) + bind(n.plus) + '>' + icon('plus',14) + '</div></div>';
  case 'stats':  return '<div class="stats"' + tid(n.id) + '>' + R(n.c) + '</div>';
  case 'stat':
    return '<div class="stat' + (n.acc?' acc':'') + (n.act?' tap':'') + '"' + tid(n.id) + bind(n.act)
      + '><div class="st-n">' + esc(n.n) + '</div><div class="st-l">' + esc(n.l) + '</div></div>';
  case 'hero':
    return '<div class="hero' + (n.act?' tap':'') + '"' + tid(n.id) + bind(n.act) + '>'
      + '<div class="he-k">' + esc(n.kicker) + '</div>'
      + '<div class="he-t">' + esc(n.title) + '</div>'
      + '<div class="he-s">' + esc(n.sub) + '</div>' + R(n.c) + '</div>';
  case 'pills':
    return '<div style="display:flex;gap:7px;flex-wrap:wrap;padding:8px 18px 4px"' + tid(n.id) + '>'
      + tagsHtml(n.items) + '</div>';
  case 'tabbar':
    return '<div class="n-tabbar"' + tid(n.id) + '>' + n.items.map(function(i){
      return '<div class="tb' + (i.on?' on':'') + '"' + tid(i.id) + bind(i.act) + '>'
        + '<i>' + icon(i.icon, 21) + '</i>' + esc(i.text) + '</div>';
    }).join('') + '</div>';
  case 'mask':  return '<div class="n-mask"' + tid(n.id) + bind(n.close) + '>' + R(n.c) + '</div>';
  case 'sheet':
    return '<div class="n-sheet"' + tid(n.id) + ' data-stop="1"><div class="sh-hd">'
      + '<div class="t">' + esc(n.title) + '</div>'
      + '<div class="iconbtn"' + tid(n.closeId) + bind(n.close) + '>' + icon('close',15) + '</div></div>'
      + '<div class="sh-bd">' + R(n.c) + '</div></div>';
  case 'dialog':
    return '<div class="dialog"' + tid(n.id) + ' data-stop="1">'
      + '<div style="padding:22px 20px 16px;text-align:center">'
      + (n.title ? '<div style="font:650 17px/1.3 var(--disp);margin-bottom:8px">' + esc(n.title) + '</div>' : '')
      + '<div style="font-size:13.5px;color:var(--ink2);line-height:1.55">' + esc(n.text) + '</div></div>'
      + '<div style="display:flex;gap:10px;padding:0 16px 16px">'
      + '<div class="n-btn" style="flex:1"' + tid(n.cancel.id) + bind(n.cancel.act) + '>' + esc(n.cancel.text) + '</div>'
      + '<div class="n-btn primary" style="flex:1"' + tid(n.ok.id) + bind(n.ok.act) + '>' + esc(n.ok.text) + '</div>'
      + '</div></div>';
  case 'toast': return '<div class="n-toast"' + tid(n.id) + '>' + esc(n.text) + '</div>';
  default: return renderExtra(n);
  }
}
function avatarHtml(a){
  return '<div class="av" style="width:38px;height:38px;border-radius:50%;flex:0 0 auto;display:flex;'
    + 'align-items:center;justify-content:center;font:700 14px/1 var(--disp);color:#fff;background:hsl('
    + a.hue + ' 52% 46%)">' + esc(a.initial) + '</div>';
}

function renderExtra(n){
  switch (n.t) {
  case 'div': return R(n.c);
  case 'shelf':
    return '<div class="shelf"' + tid(n.id) + '>' + n.c.map(function(b){
      return '<div class="bk"' + tid(b.id) + bind(b.act) + '>'
        + '<div class="bk-c">' + coverSvg(b.palette, b.seed) + '</div>'
        + '<div class="bk-t">' + esc(b.title) + '</div>'
        + '<div class="bk-a">' + esc(b.author) + '</div>'
        + '<div class="bk-p"><i style="width:' + b.pct + '%"></i></div></div>';
    }).join('') + '</div>';
  case 'cover':
    return '<div style="margin:12px auto 4px;width:150px"><div style="width:150px;height:225px;'
      + 'border-radius:6px;overflow:hidden;box-shadow:0 8px 20px rgba(34,29,22,.26)"' + tid(n.id) + '>'
      + coverSvg(n.palette, n.seed) + '</div></div>';
  case 'page':
    return '<div class="page reader-' + esc(n.theme) + '"' + tid(n.id) + bind(n.act) + '>'
      + '<div class="pg-text" style="font-size:' + n.font + 'px;line-height:1.62;padding:6px '
      + n.pad + 'px 14px">' + markUp(n.text, n.marks) + '</div></div>';
  case 'progline':
    return n.show ? '<div class="progline"' + tid(n.id) + '><i style="width:' + n.pct + '%"></i></div>' : '';
  case 'pgfoot':
    return '<div class="pgfoot"' + tid(n.id) + '>'
      + '<div class="pf-b' + (n.atStart?' off':'') + '"' + tid(n.minusId) + bind(n.minus) + '>Back</div>'
      + '<div>' + esc(n.left) + ' · ' + esc(n.right) + '</div>'
      + '<div class="pf-b' + (n.atEnd?' off':'') + '"' + tid(n.plusId) + bind(n.plus) + '>Next</div></div>';
  case 'quote':
    return '<div class="quote' + (n.kind === 'highlight' ? ' mark' : '') + '"' + tid(n.id) + bind(n.act) + '>'
      + '<div class="qt-t">' + esc(n.text) + '</div>'
      + '<div class="qt-s">' + esc(n.sub) + '</div></div>';
  default: return '';
  }
}

var STATE = null;
function paint(){
  ACTS = [];
  app.innerHTML = render(E.screen(STATE));
  var c = '';
  if (c) document.getElementById('sb-clock').textContent = c;
  if (!hud.classList.contains('off')) paintHud();
}
app.addEventListener('click', function(ev){
  var el = ev.target.closest('[data-act]'); if (!el) return;
  if (el.classList.contains('n-mask') && ev.target.closest('[data-stop]')) return;
  var act = ACTS[+el.getAttribute('data-act')]; if (!act) return;
  TRAJ.push({action:'tap', id: el.getAttribute('data-testid') || null});
  STATE = E.reduce(STATE, act); paint();
});
app.addEventListener('input', function(ev){
  var el = ev.target.closest('[data-actt]'); if (!el) return;
  var act = JSON.parse(JSON.stringify(ACTS[+el.getAttribute('data-actt')]));
  for (var k in act) if (act[k] === '$VALUE') act[k] = el.value;
  var id = el.getAttribute('data-testid'), pos = el.selectionStart;
  TRAJ.push({action:'type', id:id, text:el.value});
  STATE = E.reduce(STATE, act); paint();
  var again = id && app.querySelector('[data-testid="' + id + '"]');
  if (again && again.focus) { again.focus(); try { again.setSelectionRange(pos, pos); } catch(e){} }
});

function paintHud(){
  var d = E.derive(STATE);
  hud.innerHTML = '<h4>__ENV__ \u00b7 ' + E.ENV_ID + ' v' + E.VERSION + '</h4>'
    + '<div><span class="k">route</span> ' + d.route + '  <span class="k">step</span> ' + STATE.meta.steps + '</div>'
    + '<div><span class="k">page</span> ' + d.page + '/' + d.pageCount + '  <span class="k">off</span> ' + d.offset + '  <span class="k">cpp</span> ' + d.charsPerPage + '</div>'
    + '<div style="margin-top:8px"><button id="hud-reset">reset</button>'
    + '<button id="hud-a11y">copy a11y</button><button id="hud-state">copy state</button>'
    + '<button id="hud-traj">copy traj</button><button id="hud-hide">hide (h)</button></div>'
    + '<pre>' + esc(E.a11y(STATE)) + '</pre>';
  hud.querySelector('#hud-reset').onclick = function(){ ENVAPI.reset({seed:STATE.meta.seed}); };
  hud.querySelector('#hud-a11y').onclick  = function(){ copy(E.a11y(STATE)); };
  hud.querySelector('#hud-state').onclick = function(){ copy(JSON.stringify(E.snapshot(STATE), null, 2)); };
  hud.querySelector('#hud-traj').onclick  = function(){ copy(JSON.stringify(TRAJ, null, 2)); };
  hud.querySelector('#hud-hide').onclick  = function(){ hud.classList.add('off'); };
}
function copy(t){ try { navigator.clipboard.writeText(t); } catch(e){} }
document.addEventListener('keydown', function(e){
  if (e.key === 'h') { hud.classList.toggle('off'); if (!hud.classList.contains('off')) paintHud(); }
});

var ENVAPI = {
  ENV_ID: E.ENV_ID, VERSION: E.VERSION,
  reset: function(opts){
    opts = opts || {};
    STATE = E.createInitialState(opts.seed || 0);
    if (opts.patch) E.applyPatch(STATE, opts.patch);
    TRAJ = []; paint();
    return E.snapshot(STATE);
  },
  getState:   function(){ return E.snapshot(STATE); },
  setState:   function(s){ STATE = JSON.parse(JSON.stringify(s)); paint(); return true; },
  step:       function(a){ var r = E.step(STATE, a); STATE = r.state; TRAJ.push(a); paint();
                           return {ok:r.ok, error:r.error || null}; },
  dispatch:   function(act){ STATE = E.reduce(STATE, act); paint(); return true; },
  a11y:       function(){ return E.a11y(STATE); },
  elements:   function(){ return E.elements(STATE); },
  route:      function(){ return E.select.route(STATE); },
  trajectory: function(){ return JSON.parse(JSON.stringify(TRAJ)); },
  bounds: function(){
    var base = document.getElementById('screen').getBoundingClientRect(), out = {};
    app.querySelectorAll('[data-testid]').forEach(function(el){
      var r = el.getBoundingClientRect();
      out[el.getAttribute('data-testid')] = {
        x:Math.round(r.left-base.left), y:Math.round(r.top-base.top),
        w:Math.round(r.width), h:Math.round(r.height),
        cx:Math.round(r.left-base.left+r.width/2), cy:Math.round(r.top-base.top+r.height/2)};
    });
    return out;
  }
};
window.__ENV__ = ENVAPI;
var qs = new URLSearchParams(location.search);
if (qs.get('bare') === '1') document.body.classList.add('bare');
if (qs.get('hud')  === '1') hud.classList.remove('off');
ENVAPI.reset({seed: parseInt(qs.get('seed') || '0', 10) || 0});
window.__ENV_READY__ = true;
})();
</script>
