<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Hearth · Home (mocked GUI env)</title>
<!--
  ============================================================================
  Hearth — a single-file H5 smart-home environment for agent research.

  Same two-block contract as every environment in this repo:

    script#engine  ...  pure state machine. No DOM, no Date.now, no Math.random.
                        Exports globalThis.GUI_ENGINE and is loaded verbatim by
                        pipeline/runner.mjs inside a node:vm sandbox.
    script#ui      ...  renders engine.screen(state) -> DOM, exposes __ENV__.

  What is different here on purpose: a dark dashboard, continuous controls
  (brightness sliders, thermostat set-points, blind position, volume), a
  segmented alarm control, a time picker, and a floor plan whose rooms glow
  according to the live device state — so the picture is an observation, not
  decoration.
  ============================================================================
-->
<style>
:root{
  --bg:#12141a; --card:#1b1e26; --card2:#232733; --card3:#2b303d;
  --line:#2a2f3a; --line2:#333a48;
  --ink:#eef1f6; --ink2:#a8b1c2; --muted:#6d7688;
  --accent:#f0a24b; --accent-d:#d4863a; --accent-s:#332617;
  --cool:#5cc8e8; --cool-s:#16303a;
  --good:#4ec9a0; --red:#ec6a5e; --violet:#a78bfa;
  --r:18px; --r2:13px;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.28);
  --disp:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:#07080b;color:var(--ink);
  font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  display:flex;align-items:center;justify-content:center;overflow:hidden;
}

/* ---------------- device frame ---------------- */
#device{position:relative;width:390px;height:844px;background:#000;border-radius:46px;padding:5px;
  box-shadow:0 30px 70px rgba(0,0,0,.6);flex:0 0 auto}
#screen{position:relative;width:100%;height:100%;background:var(--bg);border-radius:41px;
  overflow:hidden;display:flex;flex-direction:column}
#notch{position:absolute;top:5px;left:50%;transform:translateX(-50%);width:118px;height:30px;
  background:#000;border-radius:0 0 18px 18px;z-index:60}
body.bare{background:var(--bg)}
body.bare #device{width:390px;height:844px;padding:0;border-radius:0;box-shadow:none;background:var(--bg)}
body.bare #screen{border-radius:0}
body.bare #notch{display:none}
body.bare .n-sheet{animation:none}

.statusbar{height:44px;flex:0 0 44px;display:flex;align-items:flex-end;justify-content:space-between;
  padding:0 22px 6px;font-size:13px;font-weight:600;z-index:50;color:var(--ink)}
.statusbar .sb-r{display:flex;gap:5px;align-items:center}
.sb-bat{width:22px;height:11px;border:1.3px solid currentColor;border-radius:3px;position:relative;opacity:.9}
.sb-bat:after{content:"";position:absolute;right:-3px;top:3px;width:2px;height:5px;background:currentColor;border-radius:0 1px 1px 0}
.sb-bat i{position:absolute;left:1.3px;top:1.3px;bottom:1.3px;width:74%;background:currentColor;border-radius:1px}

#app{flex:1 1 auto;display:flex;flex-direction:column;min-height:0;position:relative}

/* ---------------- chrome ---------------- */
.n-appbar{flex:0 0 auto;min-height:50px;display:flex;align-items:center;gap:8px;padding:6px 12px;
  background:var(--bg);z-index:20}
.n-appbar .ab-title{flex:1 1 auto;text-align:center;font:650 17px/1.3 var(--disp);letter-spacing:-.2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.n-appbar .ab-side{flex:0 0 auto;min-width:62px;display:flex;align-items:center;gap:6px}
.n-appbar .ab-side.right{justify-content:flex-end}
.iconbtn{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  color:var(--ink);cursor:pointer;background:var(--card2)}
.iconbtn:active{background:var(--card3)}
.iconbtn.plain{background:transparent}
.iconbtn.on{background:var(--accent);color:#1a1207}

.n-scroll{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;padding-bottom:12px}
.n-scroll::-webkit-scrollbar{width:0}

/* ---------------- type ---------------- */
.n-text{padding:2px 18px;color:var(--ink2)}
.n-text.h1{font:700 27px/1.15 var(--disp);color:var(--ink);padding:14px 18px 4px;letter-spacing:-.6px}
.n-text.h2{font:650 18px/1.3 var(--disp);color:var(--ink);padding:16px 18px 4px}
.n-text.body{font-size:13.5px;padding:4px 18px;line-height:1.6}
.n-text.muted{font-size:12.5px;color:var(--muted);padding:4px 18px}
.n-text.eyebrow{font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted);
  font-weight:700;padding:14px 18px 2px}
.n-text.empty{padding:10px 18px 40px;text-align:center;color:var(--muted);font-size:13.5px}
.n-sec{padding:18px 18px 8px;font:650 16px/1.3 var(--disp);color:var(--ink);
  display:flex;align-items:center;justify-content:space-between;gap:10px}
.n-sec .sec-side{font:600 12.5px/1 -apple-system,sans-serif;color:var(--muted)}
.n-space{height:16px}
.n-divider{height:1px;background:var(--line);margin:10px 18px}

/* ---------------- cards ---------------- */
.n-card{background:var(--card);border-radius:var(--r);margin:10px 18px;overflow:hidden;
  border:1px solid var(--line)}
.n-card.pad{padding:16px}
.n-card.tap{cursor:pointer}
.n-card.tap:active{background:var(--card2)}
.n-card.flush{padding:0}
.n-card.glow{border-color:#4a3a20;box-shadow:0 0 0 1px #3a2c17, 0 8px 30px rgba(240,162,75,.12)}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 18px}

/* ---------------- rows ---------------- */
.n-row{display:flex;align-items:center;gap:13px;padding:14px 16px;background:transparent;
  border-bottom:1px solid var(--line);min-height:56px}
.n-row:last-child{border-bottom:none}
.n-row.tap{cursor:pointer}
.n-row.tap:active{background:var(--card2)}
.n-row .r-lead{flex:0 0 auto;width:38px;height:38px;border-radius:12px;background:var(--card2);
  color:var(--ink2);display:flex;align-items:center;justify-content:center}
.n-row .r-lead.lit{background:var(--accent-s);color:var(--accent)}
.n-row .r-lead.cool{background:var(--cool-s);color:var(--cool)}
.n-row .r-main{flex:1 1 auto;min-width:0}
.n-row .r-label{font-size:14.5px;font-weight:550}
.n-row .r-sub{font-size:12px;color:var(--muted);margin-top:3px}
.n-row .r-value{flex:0 0 auto;font-size:13.5px;color:var(--ink2);max-width:150px;text-align:right;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.n-row .r-value.strong{color:var(--ink);font-weight:650}
.n-row .r-value.accent{color:var(--accent);font-weight:650}
.n-row .r-arrow{flex:0 0 auto;color:var(--muted);display:flex}

/* ---------------- buttons ---------------- */
.n-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 20px;
  border-radius:14px;font:650 15px/1 var(--disp);background:var(--card2);color:var(--ink);
  border:1px solid var(--line2);cursor:pointer;user-select:none}
.n-btn:active{filter:brightness(1.15)}
.n-btn.primary{background:var(--accent);color:#1a1207;border-color:transparent}
.n-btn.primary.off{background:var(--card3);color:var(--muted);cursor:not-allowed}
.n-btn.ghost{background:transparent;height:36px;font-size:13px;padding:0 14px;color:var(--ink2)}
.n-btn.danger{background:transparent;border-color:#5a3230;color:var(--red);height:36px;font-size:13px;padding:0 14px}
.n-btn.block{display:flex;width:100%}
.n-btnrow{display:flex;gap:10px;padding:12px 16px;justify-content:flex-end;align-items:center}

.n-chips{display:flex;gap:9px;padding:8px 18px;overflow-x:auto}
.n-chips::-webkit-scrollbar{height:0}
.n-chip{flex:0 0 auto;height:36px;padding:0 15px;border-radius:12px;background:var(--card);
  border:1px solid var(--line);display:flex;align-items:center;gap:7px;font-size:13.5px;
  color:var(--ink2);cursor:pointer;white-space:nowrap;font-weight:550}
.n-chip.on{background:var(--accent);border-color:var(--accent);color:#1a1207;font-weight:700}
.n-chip.cool.on{background:var(--cool);border-color:var(--cool);color:#08222b}

/* ---------------- search ---------------- */
.searchbar{margin:6px 18px 8px;background:var(--card);border:1px solid var(--line);border-radius:14px;
  display:flex;align-items:center;gap:10px;padding:11px 14px}
.searchbar input{flex:1 1 auto;border:none;outline:none;background:transparent;font-size:14.5px;
  font-family:inherit;color:var(--ink);min-width:0}
.searchbar input::placeholder{color:var(--muted)}
.searchbar .sb-clear{flex:0 0 auto;width:22px;height:22px;border-radius:50%;background:var(--card3);
  color:var(--ink2);display:flex;align-items:center;justify-content:center;cursor:pointer}
.searchbar .sb-go{flex:0 0 auto;width:30px;height:30px;border-radius:10px;background:var(--accent);
  color:#1a1207;display:flex;align-items:center;justify-content:center;cursor:pointer}

.n-input{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line)}
.n-input .i-label{flex:0 0 96px;font-size:13px;color:var(--muted)}
.n-input input{flex:1 1 auto;border:none;outline:none;background:transparent;font-size:14.5px;
  font-family:inherit;color:var(--ink);min-width:0}
.n-input input::placeholder{color:var(--muted)}

/* ---------------- toggles & controls ---------------- */
.n-switch{flex:0 0 auto;width:48px;height:28px;border-radius:15px;background:var(--card3);position:relative;
  cursor:pointer;transition:background .16s}
.n-switch.on{background:var(--good)}
.n-switch i{position:absolute;top:2.5px;left:2.5px;width:23px;height:23px;border-radius:50%;background:#fff;
  transition:transform .16s;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.n-switch.on i{transform:translateX(20px)}
.n-radio{flex:0 0 auto;width:22px;height:22px;border-radius:50%;border:1.8px solid var(--line2);position:relative}
.n-radio.on{border-color:var(--accent);background:var(--accent)}
.n-radio.on:after{content:"";position:absolute;left:7px;top:4px;width:5px;height:9px;
  border:2px solid #1a1207;border-top:0;border-left:0;transform:rotate(42deg)}

.n-stepper{display:flex;align-items:center;gap:12px;flex:0 0 auto}
.n-stepper .st-btn{width:32px;height:32px;border-radius:11px;background:var(--card2);border:1px solid var(--line2);
  color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer}
.n-stepper .st-btn.off{opacity:.32;cursor:not-allowed}
.n-stepper .st-val{min-width:30px;text-align:center;font:650 16px/1 var(--disp)}

/* segmented control */
.seg{display:flex;background:var(--card2);border-radius:13px;padding:4px;gap:4px;margin:0 18px}
.seg .seg-i{flex:1 1 0;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  gap:6px;font-size:13.5px;font-weight:600;color:var(--ink2);cursor:pointer}
.seg .seg-i.on{background:var(--card3);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.3)}
.seg .seg-i.on.warn{background:var(--red);color:#fff}
.seg .seg-i.on.good{background:var(--good);color:#08251b}
.seg .seg-i.on.accent{background:var(--accent);color:#1a1207}

/* slider */
.slider{padding:4px 16px 14px}
.slider .sl-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px}
.slider .sl-name{font-size:13px;color:var(--muted)}
.slider .sl-val{font:700 22px/1 var(--disp);color:var(--ink)}
.slider .sl-body{display:flex;align-items:center;gap:12px}
.slider .sl-track{flex:1 1 auto;height:38px;border-radius:12px;background:var(--card3);overflow:hidden;position:relative}
.slider .sl-fill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#8a5f2a,var(--accent));border-radius:12px}
.slider .sl-fill.cool{background:linear-gradient(90deg,#2c6d84,var(--cool))}
.slider .sl-ticks{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 10px}
.slider .sl-ticks i{width:2px;height:8px;border-radius:1px;background:rgba(255,255,255,.16)}
.slider .sl-btn{flex:0 0 auto;width:38px;height:38px;border-radius:12px;background:var(--card2);
  border:1px solid var(--line2);color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer}
.slider .sl-btn.off{opacity:.32;cursor:not-allowed}
.slider .sl-presets{display:flex;gap:7px;margin-top:10px}
.slider .sl-preset{flex:1 1 0;height:30px;border-radius:9px;background:var(--card2);border:1px solid var(--line);
  color:var(--ink2);font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;cursor:pointer}
.slider .sl-preset.on{background:var(--accent-s);border-color:#4a3a20;color:var(--accent)}

/* tone swatches */
.tones{display:flex;gap:9px;padding:6px 16px 14px}
.tones .tone{flex:1 1 0;border-radius:12px;padding:10px 4px;text-align:center;cursor:pointer;
  border:1.6px solid var(--line);font-size:11.5px;font-weight:600;color:var(--ink2)}
.tones .tone .dot{width:22px;height:22px;border-radius:50%;margin:0 auto 6px;border:1px solid rgba(255,255,255,.14)}
.tones .tone.on{border-color:var(--accent);color:var(--ink);background:var(--card2)}

/* ---------------- device tile ---------------- */
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r2);padding:13px;
  cursor:pointer;position:relative;overflow:hidden}
.tile:active{background:var(--card2)}
.tile.on{background:linear-gradient(155deg,#2a2216,#1f1c19);border-color:#4a3a20}
.tile.on.cool{background:linear-gradient(155deg,#152b34,#1a2028);border-color:#2c4c58}
.tile .t-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.tile .t-ico{width:36px;height:36px;border-radius:11px;background:var(--card2);color:var(--ink2);
  display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.tile.on .t-ico{background:var(--accent);color:#1a1207}
.tile.on.cool .t-ico{background:var(--cool);color:#08222b}
.tile .t-name{font-size:13.5px;font-weight:600;margin-top:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .t-sub{font-size:11.5px;color:var(--muted);margin-top:3px}
.tile .t-dot{width:8px;height:8px;border-radius:50%;background:var(--card3);flex:0 0 auto;margin-top:4px}
.tile.on .t-dot{background:var(--good);box-shadow:0 0 8px rgba(78,201,160,.7)}

/* ---------------- stat strip ---------------- */
.stats{display:flex;gap:10px;padding:2px 18px 6px}
.stat{flex:1 1 0;background:var(--card);border:1px solid var(--line);border-radius:var(--r2);padding:12px}
.stat .s-k{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:5px}
.stat .s-v{font:700 20px/1.1 var(--disp);margin-top:7px}
.stat .s-v small{font-size:12px;font-weight:600;color:var(--muted);margin-left:2px}
.stat.tap{cursor:pointer}
.stat.tap:active{background:var(--card2)}

/* ---------------- floor plan ---------------- */
.plan{margin:8px 18px;border-radius:var(--r);overflow:hidden;background:#0e1015;border:1px solid var(--line)}
.plan .p-canvas{position:relative}
.plan svg{width:100%;display:block}
.plan .p-layer{position:absolute;inset:0}
.plan .p-room{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;cursor:pointer;border-radius:9px}
.plan .p-room:active{background:rgba(255,255,255,.05)}
.plan .p-name{font-size:10.5px;font-weight:700;color:#8b94a6;letter-spacing:.2px}
.plan .p-room.lit .p-name{color:#f7bd74}
.plan .p-on{font-size:9.5px;color:#5b6474;font-weight:600}
.plan .p-room.lit .p-on{color:#c79658}
.plan .p-cap{display:flex;align-items:center;gap:7px;padding:10px 14px;font-size:11.5px;color:var(--muted);
  border-top:1px solid var(--line);background:#12151c}

/* ---------------- room cards & hero ---------------- */
.roomcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r2);overflow:hidden;cursor:pointer}
.roomcard:active{filter:brightness(1.15)}
.roomcard.lit{border-color:#4a3a20}
.roomcard .rc-art{height:82px;overflow:hidden}
.roomcard .rc-art svg{width:100%;height:100%;display:block}
.roomcard .rc-body{padding:11px 12px 13px}
.roomcard .rc-name{font-size:13.5px;font-weight:650}
.roomcard .rc-sub{font-size:11.5px;color:var(--muted);margin-top:3px}
.roomcard.lit .rc-sub{color:var(--accent)}
.roomhero{position:relative;height:172px;overflow:hidden}
.roomhero svg{width:100%;height:100%;display:block}
.roomhero .rh-scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,12,18,.1),rgba(10,12,18,.85))}
.roomhero .rh-txt{position:absolute;left:18px;right:18px;bottom:14px}
.roomhero .rh-name{font:700 24px/1.15 var(--disp);letter-spacing:-.4px}
.roomhero .rh-sub{font-size:12.5px;color:var(--ink2);margin-top:4px}

/* ---------------- device header ---------------- */
.devhead{margin:10px 18px;padding:22px 18px;border-radius:var(--r);background:var(--card);
  border:1px solid var(--line);text-align:center}
.devhead.on{background:linear-gradient(160deg,#2c2317,#1e1d20);border-color:#4a3a20}
.devhead .dh-ico{width:58px;height:58px;border-radius:19px;background:var(--card2);color:var(--ink2);
  display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
.devhead.on .dh-ico{background:var(--accent);color:#1a1207}
.devhead .dh-name{font:700 20px/1.2 var(--disp)}
.devhead .dh-sub{font-size:12.5px;color:var(--muted);margin-top:6px}
.devhead .dh-watts{margin-top:12px;display:inline-block;padding:4px 12px;border-radius:20px;
  background:var(--card2);font-size:12px;font-weight:650;color:var(--ink2)}
.devhead.on .dh-watts{background:var(--accent-s);color:var(--accent)}
.shieldart{margin:6px 18px 0;border-radius:var(--r);overflow:hidden;border:1px solid var(--line)}
.shieldart svg{width:100%;display:block}
.tile .t-open{width:26px;height:26px;border-radius:9px;background:rgba(255,255,255,.06);color:var(--muted);
  display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.tile.on .t-open{background:rgba(0,0,0,.22);color:#e6c894}
.ico svg{display:block}

/* ---------------- energy chart ---------------- */
.chart{padding:14px 16px 8px}
.chart .c-bars{display:flex;align-items:flex-end;gap:8px;height:132px}
.chart .c-col{flex:1 1 0;display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer}
.chart .c-bar{width:100%;border-radius:7px 7px 4px 4px;background:linear-gradient(180deg,var(--accent),#8a5f2a);min-height:5px}
.chart .c-col.on .c-bar{background:linear-gradient(180deg,#ffd08a,var(--accent))}
.chart .c-lab{font-size:10.5px;color:var(--muted)}
.chart .c-col.on .c-lab{color:var(--ink);font-weight:700}
.bar-row{display:flex;align-items:center;gap:11px;padding:9px 16px}
.bar-row .b-name{flex:0 0 96px;font-size:13px;color:var(--ink2)}
.bar-row .b-track{flex:1 1 auto;display:block;height:8px;border-radius:4px;background:var(--card3);overflow:hidden}
.bar-row .b-fill{display:block;height:100%;border-radius:4px;background:var(--accent)}
.bar-row .b-val{flex:0 0 62px;text-align:right;font-size:12.5px;font-weight:650}

/* ---------------- misc ---------------- */
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;font-size:11.5px;
  font-weight:650;background:var(--card2);color:var(--ink2)}
.pill.good{background:#15332a;color:var(--good)}
.pill.warn{background:#3a2416;color:var(--accent)}
.pill.bad{background:#3a1f1c;color:var(--red)}
.pill.cool{background:var(--cool-s);color:var(--cool)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 18px;font-size:13.5px;color:var(--ink2)}
.kv .v{color:var(--ink);font-weight:600}
.event{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.event:last-child{border-bottom:none}
.event .e-time{flex:0 0 46px;font-size:12px;color:var(--muted);padding-top:2px}
.event .e-ico{flex:0 0 auto;width:30px;height:30px;border-radius:10px;background:var(--card2);
  color:var(--ink2);display:flex;align-items:center;justify-content:center}
.event .e-txt{flex:1 1 auto;font-size:13.5px;line-height:1.45}
.event .e-txt b{font-weight:650}

.n-tabbar{flex:0 0 auto;height:62px;background:var(--card);border-top:1px solid var(--line);display:flex;z-index:30}
.n-tabbar .tb{flex:1 1 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  color:var(--muted);font-size:10.5px;cursor:pointer;font-weight:600}
.n-tabbar .tb i{display:flex}
.n-tabbar .tb.on{color:var(--accent)}

.n-bar{flex:0 0 auto;background:var(--card);border-top:1px solid var(--line);padding:12px 18px 14px;
  display:flex;align-items:center;gap:14px;z-index:30}

/* overlays */
.n-mask{position:absolute;inset:0;background:rgba(4,6,10,.66);z-index:70;display:flex;align-items:flex-end}
.n-sheet{width:100%;max-height:84%;background:var(--card);border-radius:22px 22px 0 0;display:flex;
  flex-direction:column;overflow:hidden;animation:up .18s ease-out;border-top:1px solid var(--line2)}
@keyframes up{from{transform:translateY(26px)}to{transform:none}}
.n-sheet .sh-hd{padding:16px 16px 12px;display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--line)}
.n-sheet .sh-hd .t{font:650 17px/1.2 var(--disp)}
.n-sheet .sh-bd{flex:1 1 auto;overflow-y:auto;min-height:0}
.n-sheet .sh-bd::-webkit-scrollbar{width:0}
.n-sheet .sh-ft{flex:0 0 auto;border-top:1px solid var(--line);padding:12px 16px 16px}
.n-toast{position:absolute;left:50%;bottom:124px;transform:translateX(-50%);background:#e9edf5;
  color:#12141a;padding:11px 18px;border-radius:12px;font-size:13px;font-weight:600;z-index:90;
  max-width:80%;text-align:center}
.dialog{margin:auto;width:80%;background:var(--card);border:1px solid var(--line2);border-radius:18px;overflow:hidden}

/* dev HUD */
#hud{position:fixed;top:14px;left:14px;width:310px;max-height:calc(100% - 28px);overflow:auto;
  background:#0a0c10;color:#c9d4d1;border-radius:12px;padding:12px;border:1px solid #222a33;
  font:11.5px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;z-index:200}
#hud h4{margin:0 0 8px;font-size:12px;color:#fff;letter-spacing:.4px}
#hud .k{color:#6d7688}
#hud pre{margin:6px 0 0;white-space:pre-wrap;word-break:break-word;color:#9fe0c5;max-height:250px;overflow:auto}
#hud button{background:#1d232c;border:none;color:#c9d4d1;border-radius:6px;padding:5px 9px;margin:2px 4px 2px 0;
  font:inherit;cursor:pointer}
#hud button:hover{background:#2a323d}
#hud.off{display:none}
</style>

        <svg width="15" height="12" viewBox="0 0 15 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M1 4.2a9 9 0 0 1 13 0"/><path d="M3.4 6.9a5.6 5.6 0 0 1 8.2 0"/><circle cx="7.5" cy="10" r=".9" fill="currentColor" stroke="none"/></svg>

<script id="engine">
/* ===========================================================================
 * ENGINE — pure, deterministic, DOM-free.
 * ======================================================================== */
(function (root) {
'use strict';

var VERSION = '1.0.0';
var ENV_ID  = 'hearth_home';

/* ------------------------------------------------------------- catalog */
var ROOMS = [
  {id:'r_living',  name:'Living Room', art:'living',  icon:'sofa'},
  {id:'r_kitchen', name:'Kitchen',     art:'kitchen', icon:'kettle'},
  {id:'r_bed',     name:'Bedroom',     art:'bedroom', icon:'bed'},
  {id:'r_study',   name:'Study',       art:'study',   icon:'desk'},
  {id:'r_hall',    name:'Hallway',     art:'hallway', icon:'door'},
  {id:'r_garden',  name:'Garden',      art:'garden',  icon:'tree'}
];

/* kind determines which controls a device exposes:
   light  -> on, brightness, tone      plug/camera -> on
   speaker-> on, volume                blind -> position
   lock   -> locked                    thermostat -> mode, target            */
var DEVICES = [
  {id:'d_ceiling',    room:'r_living',  kind:'light',      name:'Ceiling Light',    watts:42,   icon:'bulb'},
  {id:'d_floorlamp',  room:'r_living',  kind:'light',      name:'Floor Lamp',       watts:18,   icon:'lamp'},
  {id:'d_tv',         room:'r_living',  kind:'plug',       name:'TV Socket',        watts:120,  icon:'tv'},
  {id:'d_speaker',    room:'r_living',  kind:'speaker',    name:'Living Speaker',   watts:14,   icon:'speaker'},
  {id:'d_blinds_l',   room:'r_living',  kind:'blind',      name:'Living Blinds',    watts:0,    icon:'blind'},
  {id:'d_thermostat', room:'r_living',  kind:'thermostat', name:'Thermostat',       watts:0,    icon:'thermo'},

  {id:'d_kitchen',    room:'r_kitchen', kind:'light',      name:'Kitchen Spots',    watts:36,   icon:'bulb'},
  {id:'d_kettle',     room:'r_kitchen', kind:'plug',       name:'Kettle Socket',    watts:2000, icon:'plug'},
  {id:'d_fridge',     room:'r_kitchen', kind:'plug',       name:'Fridge Socket',    watts:95,   icon:'plug'},

  {id:'d_bed_ceiling',room:'r_bed',     kind:'light',      name:'Bedroom Light',    watts:30,   icon:'bulb'},
  {id:'d_bed_lamp',   room:'r_bed',     kind:'light',      name:'Bedside Lamp',     watts:9,    icon:'lamp'},
  {id:'d_bed_blinds', room:'r_bed',     kind:'blind',      name:'Bedroom Blinds',   watts:0,    icon:'blind'},

  {id:'d_desk_lamp',  room:'r_study',   kind:'light',      name:'Desk Lamp',        watts:12,   icon:'lamp'},
  {id:'d_desk_plug',  room:'r_study',   kind:'plug',       name:'Desk Socket',      watts:180,  icon:'plug'},

  {id:'d_hall',       room:'r_hall',    kind:'light',      name:'Hallway Light',    watts:24,   icon:'bulb'},
  {id:'d_lock',       room:'r_hall',    kind:'lock',       name:'Front Door Lock',  watts:0,    icon:'lock'},
  {id:'d_doorbell',   room:'r_hall',    kind:'camera',     name:'Doorbell Camera',  watts:5,    icon:'cam'},

  {id:'d_porch',      room:'r_garden',  kind:'light',      name:'Porch Light',      watts:15,   icon:'bulb'},
  {id:'d_garden_cam', room:'r_garden',  kind:'camera',     name:'Garden Camera',    watts:6,    icon:'cam'}
];

var TONES = [
  {key:'warm',     label:'Warm',     kelvin:2200, css:'#ffb35c'},
  {key:'soft',     label:'Soft',     kelvin:2700, css:'#ffd09b'},
  {key:'neutral',  label:'Neutral',  kelvin:3500, css:'#ffeed6'},
  {key:'daylight', label:'Daylight', kelvin:5000, css:'#dcecff'}
];

var SCENES = [
  {id:'sc_morning', name:'Good Morning', icon:'sunrise',
   desc:'Blinds up, kitchen and hallway on, heating to 21°',
   actions:[{dev:'d_bed_blinds', set:{position:100}},
            {dev:'d_blinds_l',   set:{position:100}},
            {dev:'d_kitchen',    set:{on:true, brightness:100, tone:'cool'}},
            {dev:'d_hall',       set:{on:true, brightness:60}},
            {dev:'d_thermostat', set:{mode:'heat', target:21}}]},

  {id:'sc_evening', name:'Evening', icon:'moon',
   desc:'Warm low light downstairs, blinds closed, kitchen off',
   actions:[{dev:'d_ceiling',   set:{on:true, brightness:45, tone:'warm'}},
            {dev:'d_floorlamp', set:{on:true, brightness:60, tone:'warm'}},
            {dev:'d_hall',      set:{on:true, brightness:30, tone:'warm'}},
            {dev:'d_blinds_l',  set:{position:0}},
            {dev:'d_kitchen',   set:{on:false}}]},

  {id:'sc_movie', name:'Movie Night', icon:'tv',
   desc:'Ceiling off, floor lamp at 10%, blinds shut, TV and speaker on',
   actions:[{dev:'d_ceiling',   set:{on:false}},
            {dev:'d_floorlamp', set:{on:true, brightness:10, tone:'warm'}},
            {dev:'d_blinds_l',  set:{position:0}},
            {dev:'d_tv',        set:{on:true}},
            {dev:'d_speaker',   set:{on:true, volume:45}}]},

  {id:'sc_focus', name:'Focus', icon:'desk',
   desc:'Desk lamp full and cool, desk socket on, speaker off',
   actions:[{dev:'d_desk_lamp', set:{on:true, brightness:100, tone:'daylight'}},
            {dev:'d_desk_plug', set:{on:true}},
            {dev:'d_speaker',   set:{on:false}}]},

  {id:'sc_away', name:'Away', icon:'away',
   desc:'Everything off but the fridge, door locked, cameras on, alarm armed',
   actions:[{dev:'d_ceiling', set:{on:false}},     {dev:'d_floorlamp', set:{on:false}},
            {dev:'d_tv', set:{on:false}},          {dev:'d_speaker', set:{on:false}},
            {dev:'d_kitchen', set:{on:false}},     {dev:'d_kettle', set:{on:false}},
            {dev:'d_bed_ceiling', set:{on:false}}, {dev:'d_bed_lamp', set:{on:false}},
            {dev:'d_desk_lamp', set:{on:false}},   {dev:'d_desk_plug', set:{on:false}},
            {dev:'d_hall', set:{on:false}},        {dev:'d_porch', set:{on:false}},
            {dev:'d_lock', set:{locked:true}},
            {dev:'d_doorbell', set:{on:true}},     {dev:'d_garden_cam', set:{on:true}},
            {dev:'d_thermostat', set:{mode:'heat', target:16}},
            {home:{alarm:'away'}}]}
];

var AUTOMATIONS = [
  {id:'au_sunset',  name:'Porch light at sunset', icon:'sunset', timed:false,
   when:'At sunset, today 20:14', then:'Turn the Porch Light on at 70%'},
  {id:'au_bedtime', name:'Bedtime',               icon:'moon',   timed:true,
   when:'Every day at',           then:'Lock the front door and turn every light off'},
  {id:'au_cams',    name:'Arm cameras when everyone leaves', icon:'cam', timed:false,
   when:'When the last person leaves', then:'Turn both cameras on and set the alarm to Away'},
  {id:'au_warm',    name:'Warm up the house',     icon:'thermo', timed:true,
   when:'Every day at',           then:'Set the thermostat to 21° in heat mode'}
];

var ENERGY = {
  tariff: 0.28,
  days: [{d:'Mon', kwh:4.9}, {d:'Tue', kwh:5.6}, {d:'Wed', kwh:4.2}, {d:'Thu', kwh:6.1},
         {d:'Fri', kwh:5.4}, {d:'Sat', kwh:4.8}, {d:'Sun', kwh:3.8}],
  rooms: {r_living:8.4, r_kitchen:12.7, r_bed:3.1, r_study:6.9, r_hall:2.8, r_garden:0.9}
};

var CATALOG = {rooms:ROOMS, devices:DEVICES, tones:TONES, scenes:SCENES,
               automations:AUTOMATIONS, energy:ENERGY};

/* ------------------------------------------------------------- helpers */
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function byId(list, id){ for (var i=0;i<list.length;i++) if (list[i].id===id) return list[i]; return null; }
function room(id){ return byId(ROOMS, id); }
function scene(id){ return byId(SCENES, id); }
function automation(id){ return byId(AUTOMATIONS, id); }
function tone(k){ for (var i=0;i<TONES.length;i++) if (TONES[i].key===k) return TONES[i]; return TONES[0]; }
function clampInt(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); }
function round1(n){ return Math.round(n * 10) / 10; }

function lcg(seed){ var s=(seed>>>0)||1; return function(){ s=(s*1664525+1013904223)>>>0; return s/4294967296; }; }
function shuffled(list, seed){
  if (!seed) return list.slice();
  var r=lcg(seed), a=list.slice();
  for (var i=a.length-1;i>0;i--){ var j=Math.floor(r()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
function getPath(obj, path){
  var parts = String(path).replace(/\[(\w+|last|-1)\]/g, '.$1').split('.').filter(Boolean), cur = obj;
  for (var i=0;i<parts.length;i++){
    if (cur == null) return undefined;
    var k = parts[i];
    if (Array.isArray(cur) && (k==='last'||k==='-1')) cur = cur[cur.length-1]; else cur = cur[k];
  }
  return cur;
}
function setPath(obj, path, value){
  var parts = String(path).replace(/\[(\w+)\]/g,'.$1').split('.').filter(Boolean), cur = obj;
  for (var i=0;i<parts.length-1;i++){
    var k = parts[i];
    if (cur[k] == null) cur[k] = /^\d+$/.test(parts[i+1]) ? [] : {};
    cur = cur[k];
  }
  cur[parts[parts.length-1]] = value;
  return obj;
}

/* --------------------------------------------------------- world clock */
var CLOCK0 = {h:19, mi:24, s:0};
var SECONDS_PER_STEP = 5;
function tick(c, n){
  var t = c.s + n; c.s = t % 60;
  var m = c.mi + Math.floor(t/60); c.mi = m % 60;
  c.h = (c.h + Math.floor(m/60)) % 24;
  return c;
}
function hhmm(h, mi){ return (h<10?'0':'') + h + ':' + (mi<10?'0':'') + mi; }
function clockStr(c){ return hhmm(c.h, c.mi); }

/* ------------------------------------------------------ initial state */
function createInitialState(seed){
  seed = seed || 0;
  return {
    meta:{ env:ENV_ID, version:VERSION, seed:seed, clock:clone(CLOCK0), steps:0,
           deviceSeq:1, eventSeq:1, answer:null, finished:false },
    ui:{ stack:[{name:'home', params:{}}], tab:'home', sheet:null, confirm:null, toast:null,
         inputs:{}, query:'', energyDay:3, roomFilter:'all' },
    home:{ name:'Alder Street', alarm:'home', people:['Sam','Mira','Theo'] },
    profile:{ name:'Sam',
              settings:{ units:'C', deviceAlerts:true, energyReports:true, guestAccess:false } },
    devices:{
      d_ceiling:    {on:true,  brightness:80,  tone:'neutral'},
      d_floorlamp:  {on:true,  brightness:60,  tone:'warm'},
      d_tv:         {on:true},
      d_speaker:    {on:true,  volume:35},
      d_blinds_l:   {position:70},
      d_thermostat: {mode:'auto', target:20.5, current:21.4, humidity:46},
      d_kitchen:    {on:true,  brightness:100, tone:'daylight'},
      d_kettle:     {on:false},
      d_fridge:     {on:true},
      d_bed_ceiling:{on:false, brightness:70,  tone:'neutral'},
      d_bed_lamp:   {on:false, brightness:35,  tone:'warm'},
      d_bed_blinds: {position:0},
      d_desk_lamp:  {on:true,  brightness:70,  tone:'daylight'},
      d_desk_plug:  {on:true},
      d_hall:       {on:true,  brightness:40,  tone:'warm'},
      d_lock:       {locked:true},
      d_doorbell:   {on:true},
      d_porch:      {on:false, brightness:70,  tone:'warm'},
      d_garden_cam: {on:true}
    },
    extraDevices:[],                     /* devices the agent adds at run time */
    automations:{
      au_sunset:  {enabled:true},
      au_bedtime: {enabled:true,  h:23, mi:0},
      au_cams:    {enabled:false},
      au_warm:    {enabled:true,  h:6,  mi:30}
    },
    scenesRun:[],                        /* ids, in the order they were applied */
    activity:[
      {id:'ev_1', at:'06:12', icon:'cam',   who:'Garden Camera', what:'detected motion in the garden'},
      {id:'ev_2', at:'06:30', icon:'thermo',who:'Warm up the house', what:'automation ran'},
      {id:'ev_3', at:'12:15', icon:'plug',  who:'Kettle Socket', what:'turned off after 4 minutes'},
      {id:'ev_4', at:'17:40', icon:'tv',    who:'Movie Night', what:'scene was applied by Theo'},
      {id:'ev_5', at:'18:05', icon:'user',  who:'Theo', what:'arrived home'},
      {id:'ev_6', at:'18:31', icon:'cam',   who:'Doorbell Camera', what:'detected motion at the front door'},
      {id:'ev_7', at:'18:42', icon:'lock',  who:'Mira', what:'unlocked the Front Door'},
      {id:'ev_8', at:'19:02', icon:'lamp',  who:'Desk Lamp', what:'turned on'}
    ]
  };
}

/* ------------------------------------------------------------ selectors */
function allDevices(st){ return DEVICES.concat(st.extraDevices || []); }
function device(st, id){ return byId(allDevices(st), id); }
function dstate(st, id){ return st.devices[id] || {}; }
function roomDevices(st, roomId){
  return allDevices(st).filter(function(d){ return d.room === roomId; });
}
function isOn(st, id){
  var d = device(st, id); if (!d) return false;
  var s = dstate(st, id);
  if (d.kind === 'lock')       return !!s.locked;
  if (d.kind === 'blind')      return (s.position || 0) > 0;
  if (d.kind === 'thermostat') return s.mode !== 'off';
  return !!s.on;
}
function deviceWatts(st, id){
  var d = device(st, id); if (!d || !d.watts) return 0;
  var s = dstate(st, id);
  if (!s.on) return 0;
  if (d.kind === 'light') return Math.round(d.watts * (s.brightness || 0) / 100);
  return d.watts;
}
function totalWatts(st){
  var sum = 0;
  allDevices(st).forEach(function(d){ sum += deviceWatts(st, d.id); });
  return sum;
}
function roomWatts(st, roomId){
  var sum = 0;
  roomDevices(st, roomId).forEach(function(d){ sum += deviceWatts(st, d.id); });
  return sum;
}
function roomLit(st, roomId){
  return roomDevices(st, roomId).some(function(d){
    return d.kind === 'light' && dstate(st, d.id).on;
  });
}
function roomOnCount(st, roomId){
  var ds = roomDevices(st, roomId);
  return {on: ds.filter(function(d){ return isOn(st, d.id); }).length, total: ds.length};
}
function lightsOn(st){
  return allDevices(st).filter(function(d){ return d.kind === 'light' && dstate(st, d.id).on; });
}
function fmtTemp(st, c){
  if (st.profile.settings.units === 'F') return Math.round(c * 9 / 5 + 32) + '°F';
  return (Math.round(c * 10) / 10) + '°C';
}
function weekKwh(){ var s = 0; ENERGY.days.forEach(function(d){ s += d.kwh; }); return round1(s); }
function topRoom(){
  var best = null;
  ROOMS.forEach(function(r){ if (!best || ENERGY.rooms[r.id] > ENERGY.rooms[best.id]) best = r; });
  return best;
}
function searchHits(st){
  var q = st.ui.query.toLowerCase().trim();
  if (!q) return {devices:[], rooms:[], scenes:[]};
  var terms = q.split(/\s+/);
  function hit(hay){ hay = hay.toLowerCase(); return terms.every(function(t){ return hay.indexOf(t) >= 0; }); }
  return {
    devices: allDevices(st).filter(function(d){
      return hit(d.name + ' ' + d.kind + ' ' + (room(d.room) || {}).name); }),
    rooms: ROOMS.filter(function(r){ return hit(r.name); }),
    scenes: SCENES.filter(function(s){ return hit(s.name + ' ' + s.desc); })
  };
}
function route(st){ return st.ui.stack[st.ui.stack.length - 1]; }

var SELECT = { allDevices:allDevices, device:device, dstate:dstate, roomDevices:roomDevices,
               isOn:isOn, deviceWatts:deviceWatts, totalWatts:totalWatts, roomWatts:roomWatts,
               roomLit:roomLit, roomOnCount:roomOnCount, lightsOn:lightsOn, fmtTemp:fmtTemp,
               weekKwh:weekKwh, topRoom:topRoom, searchHits:searchHits, route:route,
               clockStr:clockStr, tone:tone };

/* ------------------------------------------------------------- reducer */
function push(st, name, params){ st.ui.stack.push({name:name, params:params||{}}); st.ui.sheet=null; }
function pop(st){ if (st.ui.stack.length > 1) st.ui.stack.pop(); }
function toast(st, t){ st.ui.toast = t; }
function logEvent(st, icon, who, what){
  st.activity.push({id:'ev_n' + st.meta.eventSeq, at:clockStr(st.meta.clock),
                    icon:icon, who:who, what:what});
  st.meta.eventSeq += 1;
}
var STEP = {brightness:10, volume:5, position:25};
var LIMIT = {brightness:[0,100], volume:[0,100], position:[0,100]};
var DEFAULT_WATTS = {light:10, plug:60, camera:5, speaker:10, blind:0, lock:0};
var DEFAULT_ICON  = {light:'bulb', plug:'plug', camera:'cam', speaker:'speaker', blind:'blind', lock:'lock'};

function applySet(st, id, set){
  var s = st.devices[id];
  if (!s) { s = st.devices[id] = {}; }
  for (var k in set) s[k] = set[k];
}

function reduce(prev, action){
  var st = clone(prev), A = action || {};
  st.ui.toast = null;
  st.meta.steps += 1;
  tick(st.meta.clock, SECONDS_PER_STEP);

  switch (A.type) {

  /* ---- navigation ---- */
  case 'NAV':  push(st, A.to, A.params); break;
  case 'BACK':
    if (st.ui.confirm) st.ui.confirm = null;
    else if (st.ui.sheet) st.ui.sheet = null;
    else pop(st);
    break;
  case 'TAB':
    st.ui.tab = A.tab; st.ui.sheet = null; st.ui.confirm = null;
    st.ui.stack = [{name: A.tab, params:{}}];
    break;
  case 'HOME':
    st.ui.tab = 'home'; st.ui.stack = [{name:'home', params:{}}];
    st.ui.sheet = null; st.ui.confirm = null;
    break;

  /* ---- search ---- */
  case 'SET_INPUT': st.ui.inputs[A.field] = A.value; break;
  case 'SUBMIT_SEARCH':
    st.ui.query = String(st.ui.inputs.search || '').trim();
    if (route(st).name !== 'search') push(st, 'search', {});
    break;
  case 'CLEAR_SEARCH': st.ui.query = ''; st.ui.inputs.search = ''; toast(st, 'Search cleared'); break;

  /* ---- device control ---- */
  case 'TOGGLE_DEVICE': {
    var d = device(st, A.id); if (!d) break;
    var s = st.devices[A.id] || (st.devices[A.id] = {});
    if (d.kind === 'lock') {
      s.locked = !s.locked;
      logEvent(st, 'lock', st.profile.name, (s.locked ? 'locked' : 'unlocked') + ' the ' + d.name);
      toast(st, d.name + (s.locked ? ' locked' : ' unlocked'));
    } else if (d.kind === 'blind') {
      s.position = (s.position || 0) > 0 ? 0 : 100;
    } else if (d.kind === 'thermostat') {
      s.mode = s.mode === 'off' ? 'auto' : 'off';
    } else {
      s.on = !s.on;
      if (d.kind === 'light' && s.on && !s.brightness) s.brightness = 100;
    }
    break;
  }
  case 'SET_DEVICE': applySet(st, A.id, A.set || {}); break;
  case 'BUMP': {
    var lim = LIMIT[A.key] || [0, 100], stp = STEP[A.key] || 10;
    var cur = (st.devices[A.id] || {})[A.key] || 0;
    var next = clampInt(cur + A.dir * stp, lim[0], lim[1]);
    applySet(st, A.id, (function(o){ o[A.key] = next; return o; })({}));
    if (A.key === 'brightness' && next > 0) applySet(st, A.id, {on:true});
    if (A.key === 'brightness' && next === 0) applySet(st, A.id, {on:false});
    break;
  }
  case 'SET_TONE': applySet(st, A.id, {tone:A.tone}); break;
  case 'THERMO_MODE': applySet(st, 'd_thermostat', {mode:A.mode}); break;
  case 'THERMO_TARGET': {
    var t = dstate(st, 'd_thermostat').target || 20;
    applySet(st, 'd_thermostat', {target: Math.max(5, Math.min(30, round1(t + A.dir * 0.5)))});
    break;
  }
  case 'ROOM_ALL': {
    var changed = 0;
    roomDevices(st, A.room).forEach(function(dv){
      if (dv.kind === 'light' || dv.kind === 'plug' || dv.kind === 'speaker' || dv.kind === 'camera') {
        var ss = st.devices[dv.id] || (st.devices[dv.id] = {});
        if (!!ss.on !== !!A.on) { ss.on = !!A.on; changed += 1; }
      }
    });
    toast(st, changed + ' device' + (changed === 1 ? '' : 's') + ' turned ' + (A.on ? 'on' : 'off'));
    break;
  }
  case 'ALL_LIGHTS_OFF': {
    var count = lightsOn(st).length;
    if (!count) { toast(st, 'Every light is already off'); break; }
    st.ui.confirm = {title:'Turn every light off?',
                     text:'This switches off all ' + count + ' lights that are currently on.',
                     okText:'Turn them off', yes:{type:'ALL_LIGHTS_OFF_OK'}};
    break;
  }
  case 'ALL_LIGHTS_OFF_OK': {
    var n = 0;
    allDevices(st).forEach(function(dv){
      if (dv.kind === 'light' && st.devices[dv.id] && st.devices[dv.id].on) {
        st.devices[dv.id].on = false; n += 1;
      }
    });
    toast(st, n + ' light' + (n === 1 ? '' : 's') + ' turned off');
    break;
  }

  /* ---- scenes ---- */
  case 'APPLY_SCENE': {
    var sc = scene(A.id); if (!sc) break;
    sc.actions.forEach(function(a){
      if (a.dev) applySet(st, a.dev, a.set);
      if (a.home) for (var k in a.home) st.home[k] = a.home[k];
    });
    st.scenesRun.push(sc.id);
    logEvent(st, sc.icon, sc.name, 'scene was applied by ' + st.profile.name);
    toast(st, sc.name + ' applied');
    break;
  }

  /* ---- automations ---- */
  case 'TOGGLE_AUTOMATION': {
    var au = st.automations[A.id]; if (!au) break;
    au.enabled = !au.enabled;
    toast(st, (automation(A.id) || {}).name + (au.enabled ? ' enabled' : ' disabled'));
    break;
  }
  case 'AUTO_TIME': {
    var a2 = st.automations[A.id]; if (!a2 || a2.h === undefined) break;
    if (A.unit === 'h')  a2.h  = (a2.h  + A.dir + 24) % 24;
    if (A.unit === 'mi') a2.mi = (a2.mi + A.dir * 15 + 60) % 60;
    break;
  }

  /* ---- security ---- */
  case 'SET_ALARM':
    if (st.home.alarm !== A.mode) {
      st.home.alarm = A.mode;
      logEvent(st, 'shield', st.profile.name, 'set the alarm to ' + A.mode);
    }
    toast(st, 'Alarm set to ' + A.mode);
    break;

  /* ---- adding a device ---- */
  case 'DEVICE_NEW':
    st.ui.inputs.dev_name = '';
    st.ui.inputs.dev_room = 'r_living';
    st.ui.inputs.dev_kind = 'light';
    push(st, 'addDevice', {});
    break;
  case 'SET_NEW_FIELD': st.ui.inputs[A.field] = A.value; break;
  case 'DEVICE_SAVE': {
    var nm = String(st.ui.inputs.dev_name || '').trim();
    if (!nm) { toast(st, 'Give the device a name'); break; }
    var kind = st.ui.inputs.dev_kind || 'light';
    var nid = 'd_new' + st.meta.deviceSeq; st.meta.deviceSeq += 1;
    st.extraDevices.push({id:nid, room:st.ui.inputs.dev_room || 'r_living', kind:kind, name:nm,
                          watts:DEFAULT_WATTS[kind], icon:DEFAULT_ICON[kind], added:true});
    st.devices[nid] = kind === 'light' ? {on:false, brightness:100, tone:'neutral'}
                    : kind === 'blind' ? {position:0}
                    : kind === 'lock'  ? {locked:true}
                    : kind === 'speaker' ? {on:false, volume:30}
                    : {on:false};
    logEvent(st, DEFAULT_ICON[kind], nm, 'was added to ' + (room(st.ui.inputs.dev_room) || {}).name);
    pop(st);
    toast(st, nm + ' added');
    break;
  }
  case 'DEVICE_DELETE': {
    var dd = device(st, A.id);
    if (!dd || !dd.added) { toast(st, 'Only devices you added can be removed'); break; }
    st.extraDevices = st.extraDevices.filter(function(x){ return x.id !== A.id; });
    delete st.devices[A.id];
    if (route(st).name === 'device') pop(st);
    toast(st, dd.name + ' removed');
    break;
  }

  /* ---- overlays ---- */
  case 'OPEN_SHEET':  st.ui.sheet = {type:A.sheet, id:A.id || null}; break;
  case 'CLOSE_SHEET': st.ui.sheet = null; break;
  case 'CONFIRM_NO':  st.ui.confirm = null; break;
  case 'CONFIRM_YES': {
    var yes = st.ui.confirm && st.ui.confirm.yes; st.ui.confirm = null;
    if (yes) { var keep = st.meta.steps, kc = clone(st.meta.clock);
               var out = reduce(st, yes); out.meta.steps = keep; out.meta.clock = kc; return out; }
    break;
  }

  /* ---- settings & misc ---- */
  case 'SET_SETTING':    st.profile.settings[A.key] = A.value; break;
  case 'TOGGLE_SETTING': st.profile.settings[A.key] = !st.profile.settings[A.key]; break;
  case 'SET_ENERGY_DAY': st.ui.energyDay = A.idx; break;

  case 'FINISH':
    st.meta.answer = (A.answer === undefined ? null : A.answer);
    st.meta.finished = true;
    break;
  case 'NOOP': default: break;
  }
  return st;
}

/* =======================================================================
 * SCREEN TREE
 * ==================================================================== */
function N(t, o){ o = o || {}; o.t = t; return o; }
function appbar(title, o){
  o = o || {};
  return N('appbar', {id:'appbar', title:title, back:!!o.back, right:o.right||[], left:o.left||[]});
}
function row(id, label, o){
  o = o || {};
  return N('row', {id:id, text:label, sub:o.sub, val:o.val, valCls:o.valCls, lead:o.lead,
                   leadCls:o.leadCls, arrow:o.arrow !== false, act:o.act, c:o.c});
}
function btn(id, text, act, cls, disabled){
  return N('btn', {id:id, text:text, act:act, cls:cls||'', disabled:!!disabled});
}
function txt(text, cls){ return N('text', {text:text, cls:cls||'body'}); }

function tabbar(st){
  var items = [
    {id:'tab_home',     text:'Home',     icon:'house',  tab:'home'},
    {id:'tab_rooms',    text:'Rooms',    icon:'grid',   tab:'rooms'},
    {id:'tab_energy',   text:'Energy',   icon:'bolt',   tab:'energy'},
    {id:'tab_settings', text:'Settings', icon:'sliders', tab:'settings'}
  ].map(function(i){
    return {id:i.id, text:i.text, icon:i.icon, on:(st.ui.tab===i.tab), act:{type:'TAB', tab:i.tab}};
  });
  return N('tabbar', {id:'tabbar', items:items});
}

var ALARM_LABEL = {off:'Disarmed', home:'Home', away:'Away'};

function deviceSub(st, d){
  var s = dstate(st, d.id);
  if (d.kind === 'light')      return s.on ? (s.brightness + '% · ' + tone(s.tone).label) : 'Off';
  if (d.kind === 'plug')       return s.on ? (deviceWatts(st, d.id) + ' W') : 'Off';
  if (d.kind === 'speaker')    return s.on ? ('Volume ' + s.volume + '%') : 'Off';
  if (d.kind === 'blind')      return s.position === 0 ? 'Closed'
                                    : (s.position === 100 ? 'Open' : s.position + '% open');
  if (d.kind === 'lock')       return s.locked ? 'Locked' : 'Unlocked';
  if (d.kind === 'camera')     return s.on ? 'Recording' : 'Off';
  if (d.kind === 'thermostat') return s.mode === 'off' ? 'Off'
                                    : (fmtTemp(st, s.target) + ' · ' + s.mode);
  return '';
}
function deviceTile(st, d, prefix){
  var on = isOn(st, d.id);
  return N('tile', {
    id: (prefix||'') + 'tile_' + d.id, name:d.name, sub:deviceSub(st, d), icon:d.icon,
    on:on, cool:(d.kind === 'blind' || d.kind === 'camera' || d.kind === 'thermostat'),
    act:{type:'TOGGLE_DEVICE', id:d.id},
    openId:(prefix||'') + 'open_' + d.id, openAct:{type:'NAV', to:'device', params:{id:d.id}}
  });
}
function slider(id, name, value, unit, key, devId, o){
  o = o || {};
  var presets = (o.presets || [25, 50, 75, 100]).map(function(v){
    return {id:id + '_' + v, label:v + (unit||''), on:value === v,
            act:{type:'SET_DEVICE', id:devId, set:(function(x){ x[key] = v; if (key==='brightness') x.on = v>0; return x; })({})}};
  });
  return N('slider', {id:id, name:name, value:value, unit:unit||'', cool:!!o.cool,
    minusId:id + '_dec', minus:{type:'BUMP', id:devId, key:key, dir:-1}, minusOff:value <= 0,
    plusId: id + '_inc', plus: {type:'BUMP', id:devId, key:key, dir: 1}, plusOff:value >= 100,
    presets:presets});
}

/* ------------------------------------------------------------- screens */
function scrHome(st){
  var on = allDevices(st).filter(function(d){ return isOn(st, d.id); });
  var th = dstate(st, 'd_thermostat');
  var lit = lightsOn(st);
  var planRooms = ROOMS.map(function(r){
    var c = roomOnCount(st, r.id);
    return {id:'plan_' + r.id, key:r.id, name:r.name, lit:roomLit(st, r.id), on:c.on, total:c.total,
            act:{type:'NAV', to:'room', params:{id:r.id}}};
  });
  return N('screen', {id:'scr_home', name:'home', c:[
    N('appbar', {id:'appbar', title:st.home.name,
      left:[N('iconbtn', {id:'home_search_btn', icon:'search', act:{type:'NAV', to:'search', params:{}}})],
      right:[N('iconbtn', {id:'home_activity', icon:'clock', act:{type:'NAV', to:'activity', params:{}}})]}),
    N('scroll', {id:'home_scroll', c:[
      txt('Good evening, ' + st.profile.name, 'h1'),
      txt(on.length + ' of ' + allDevices(st).length + ' devices are on · ' + totalWatts(st) + ' W right now', 'muted'),
      N('stats', {id:'home_stats', items:[
        {id:'stat_temp',  k:'Indoor',  icon:'thermo', v:fmtTemp(st, th.current),
         sub:th.mode === 'off' ? 'Heating off' : ('Set ' + fmtTemp(st, th.target)),
         act:{type:'NAV', to:'device', params:{id:'d_thermostat'}}},
        {id:'stat_power', k:'Power',   icon:'bolt',   v:totalWatts(st), unit:'W',
         sub:'live draw', act:{type:'TAB', tab:'energy'}},
        {id:'stat_alarm', k:'Alarm',   icon:'shield', v:ALARM_LABEL[st.home.alarm],
         sub:dstate(st, 'd_lock').locked ? 'Door locked' : 'Door unlocked',
         act:{type:'NAV', to:'security', params:{}}}
      ]}),
      N('plan', {id:'floorplan', rooms:planRooms,
                 caption:lit.length ? (lit.length + ' lights on') : 'All lights off'}),
      N('sec', {text:'Scenes', side:'Tap to run'}),
      N('chips', {id:'home_scenes', c:SCENES.map(function(sc){
        return N('chip', {id:'scene_' + sc.id, text:sc.name, icon:sc.icon,
                          on:st.scenesRun.length > 0 && st.scenesRun[st.scenesRun.length-1] === sc.id,
                          act:{type:'APPLY_SCENE', id:sc.id}});
      })}),
      N('sec', {text:'On right now',
                side:(on.length > 6 ? 'showing 6 of ' + on.length : on.length + ' device' + (on.length===1?'':'s'))}),
      N('tilegrid', {id:'home_on', c: shuffled(on.slice(0, 6), st.meta.seed)
        .map(function(d){ return deviceTile(st, d, 'home_'); })}),
      on.length ? N('padded', {c:[btn('all_lights_off', 'Turn every light off',
                                      {type:'ALL_LIGHTS_OFF'}, 'block')]})
                : txt('Everything is off.', 'empty'),
      N('space', {})
    ]}),
    tabbar(st)
  ]});
}

function scrRooms(st){
  return N('screen', {id:'scr_rooms', name:'rooms', c:[
    appbar('Rooms'),
    N('scroll', {id:'rooms_scroll', c:[
      txt('Six rooms · ' + allDevices(st).length + ' devices', 'muted'),
      N('roomgrid', {id:'room_grid', items: ROOMS.map(function(r){
        var c = roomOnCount(st, r.id);
        return {id:'room_' + r.id, name:r.name, art:r.art, icon:r.icon, lit:roomLit(st, r.id),
                on:c.on, total:c.total, watts:roomWatts(st, r.id),
                act:{type:'NAV', to:'room', params:{id:r.id}}};
      })}),
      N('space', {})
    ]}),
    tabbar(st)
  ]});
}

function scrRoom(st, params){
  var r = room(params.id); if (!r) return scrRooms(st);
  var ds = roomDevices(st, r.id);
  var c = roomOnCount(st, r.id);
  var body = [
    N('roomhero', {id:'room_hero', art:r.art, name:r.name, lit:roomLit(st, r.id),
                   sub:c.on + ' of ' + c.total + ' on · ' + roomWatts(st, r.id) + ' W'}),
    N('chips', {id:'room_actions', c:[
      N('chip', {id:'room_all_off', text:'All off', icon:'power', act:{type:'ROOM_ALL', room:r.id, on:false}}),
      N('chip', {id:'room_all_on',  text:'All on',  icon:'power', act:{type:'ROOM_ALL', room:r.id, on:true}})
    ]})
  ];
  if (r.id === 'r_living') {
    var th = dstate(st, 'd_thermostat');
    body.push(N('card', {id:'room_climate', cls:'flush', c:[
      row('climate_row', 'Thermostat', {lead:'thermo', leadCls:'cool',
          sub:'Now ' + fmtTemp(st, th.current) + ' · humidity ' + th.humidity + '%',
          val:th.mode === 'off' ? 'Off' : fmtTemp(st, th.target), valCls:'accent',
          act:{type:'NAV', to:'device', params:{id:'d_thermostat'}}})
    ]}));
  }
  body.push(N('sec', {text:'Devices', side:ds.length + ''}));
  body.push(N('tilegrid', {id:'room_tiles', c: ds.map(function(d){ return deviceTile(st, d, 'room_'); })}));
  body.push(N('space', {}));
  return N('screen', {id:'scr_room', name:'room', params:{id:r.id}, c:[
    appbar(r.name, {back:true,
      right:[N('iconbtn', {id:'room_add', icon:'plus', act:{type:'DEVICE_NEW'}})]}),
    N('scroll', {id:'room_scroll', c:body})
  ]});
}

function scrDevice(st, params){
  var d = device(st, params.id); if (!d) return scrHome(st);
  var s = dstate(st, d.id), rm = room(d.room), body = [];
  var on = isOn(st, d.id);

  body.push(N('devhead', {id:'dev_head', name:d.name, room:rm ? rm.name : '', icon:d.icon,
                          on:on, status:deviceSub(st, d), watts:deviceWatts(st, d.id)}));

  if (d.kind === 'light' || d.kind === 'plug' || d.kind === 'speaker' || d.kind === 'camera') {
    body.push(N('padded', {c:[btn('dev_power', s.on ? 'Turn off' : 'Turn on',
                                  {type:'TOGGLE_DEVICE', id:d.id}, s.on ? 'block' : 'primary block')]}));
  }
  if (d.kind === 'light') {
    body.push(N('card', {id:'dev_bright_card', cls:'flush', c:[
      slider('bright', 'Brightness', s.brightness || 0, '%', 'brightness', d.id)
    ]}));
    body.push(N('sec', {text:'Light tone'}));
    body.push(N('tones', {id:'dev_tones', items: TONES.map(function(t){
      return {id:'tone_' + t.key, label:t.label, kelvin:t.kelvin + 'K', css:t.css,
              on:s.tone === t.key, act:{type:'SET_TONE', id:d.id, tone:t.key}};
    })}));
  }
  if (d.kind === 'speaker') {
    body.push(N('card', {id:'dev_vol_card', cls:'flush', c:[
      slider('volume', 'Volume', s.volume || 0, '%', 'volume', d.id, {cool:true})
    ]}));
  }
  if (d.kind === 'blind') {
    body.push(N('card', {id:'dev_pos_card', cls:'flush', c:[
      slider('position', 'Open position', s.position || 0, '%', 'position', d.id,
             {cool:true, presets:[0, 25, 50, 75, 100]})
    ]}));
  }
  if (d.kind === 'lock') {
    body.push(N('padded', {c:[btn('dev_lock', s.locked ? 'Unlock the door' : 'Lock the door',
                                  {type:'TOGGLE_DEVICE', id:d.id}, s.locked ? 'block' : 'primary block')]}));
    body.push(txt(s.locked ? 'The front door is locked.' : 'The front door is unlocked.', 'muted'));
  }
  if (d.kind === 'thermostat') {
    body.push(N('seg', {id:'thermo_mode', items:['off','heat','cool','auto'].map(function(m){
      return {id:'mode_' + m, text:m.charAt(0).toUpperCase() + m.slice(1), on:s.mode === m,
              cls:(m === 'heat' ? 'accent' : (m === 'cool' ? '' : (m === 'off' ? '' : 'good'))),
              act:{type:'THERMO_MODE', mode:m}};
    })}));
    body.push(N('card', {id:'dev_target_card', cls:'flush', c:[
      row('target_row', 'Target temperature', {arrow:false, lead:'thermo', leadCls:'cool',
        sub:'Currently ' + fmtTemp(st, s.current) + ' · humidity ' + s.humidity + '%',
        c:[N('stepper', {id:'target', value:fmtTemp(st, s.target),
             minusId:'target_dec', plusId:'target_inc',
             minus:{type:'THERMO_TARGET', dir:-1}, plus:{type:'THERMO_TARGET', dir:1}})]})
    ]}));
  }

  body.push(N('sec', {text:'Details'}));
  body.push(N('card', {id:'dev_meta', cls:'flush', c:[
    row('meta_room',  'Room',        {val:rm ? rm.name : '—', arrow:false}),
    row('meta_kind',  'Type',        {val:d.kind, arrow:false}),
    row('meta_watts', 'Rated power', {val:d.watts + ' W', arrow:false}),
    row('meta_draw',  'Drawing now', {val:deviceWatts(st, d.id) + ' W', valCls:'strong', arrow:false}),
    row('meta_id',    'Device id',   {val:d.id, arrow:false})
  ]}));
  if (d.added) body.push(N('btnrow', {id:'dev_ops', c:[
    btn('dev_delete', 'Remove device', {type:'DEVICE_DELETE', id:d.id}, 'danger')]}));
  body.push(N('space', {}));

  return N('screen', {id:'scr_device', name:'device', params:{id:d.id}, c:[
    appbar(d.name, {back:true}),
    N('scroll', {id:'device_scroll', c:body})
  ]});
}

function scrScenes(st){
  return N('screen', {id:'scr_scenes', name:'scenes', c:[
    appbar('Scenes', {back:true}),
    N('scroll', {id:'scenes_scroll', c:[
      txt('A scene sets several devices at once.', 'muted')
    ].concat(SCENES.map(function(sc){
      return N('card', {id:'scenecard_' + sc.id, cls:'flush', c:[
        row('scene_open_' + sc.id, sc.name, {lead:sc.icon, sub:sc.desc,
            act:{type:'NAV', to:'sceneDetail', params:{id:sc.id}}}),
        N('btnrow', {id:'sceneops_' + sc.id, c:[
          N('label', {text: st.scenesRun.indexOf(sc.id) >= 0 ? 'Applied earlier' : ''}),
          btn('scene_run_' + sc.id, 'Run', {type:'APPLY_SCENE', id:sc.id}, 'ghost')]})
      ]});
    })).concat([N('space', {})])})
  ]});
}

function scrSceneDetail(st, params){
  var sc = scene(params.id); if (!sc) return scrScenes(st);
  var lines = sc.actions.map(function(a, i){
    if (a.home) return row('scact_' + i, 'Alarm', {val:ALARM_LABEL[a.home.alarm], arrow:false});
    var d = device(st, a.dev);
    var bits = [];
    if (a.set.on !== undefined)   bits.push(a.set.on ? 'on' : 'off');
    if (a.set.brightness !== undefined) bits.push(a.set.brightness + '%');
    if (a.set.tone)               bits.push(tone(a.set.tone).label);
    if (a.set.volume !== undefined) bits.push('volume ' + a.set.volume + '%');
    if (a.set.position !== undefined) bits.push(a.set.position === 0 ? 'closed'
                                        : (a.set.position === 100 ? 'open' : a.set.position + '% open'));
    if (a.set.locked !== undefined) bits.push(a.set.locked ? 'locked' : 'unlocked');
    if (a.set.mode)               bits.push(a.set.mode);
    if (a.set.target !== undefined) bits.push(fmtTemp(st, a.set.target));
    return row('scact_' + i, d ? d.name : a.dev, {val:bits.join(' · '), arrow:false,
               lead:d ? d.icon : 'bulb'});
  });
  return N('screen', {id:'scr_sceneDetail', name:'sceneDetail', params:{id:sc.id}, c:[
    appbar(sc.name, {back:true}),
    N('scroll', {id:'scene_scroll', c:[
      txt(sc.name, 'h1'), txt(sc.desc, 'body'),
      N('sec', {text:'What it changes', side:sc.actions.length + ' devices'}),
      N('card', {id:'scene_actions', cls:'flush', c:lines}),
      N('space', {}),
      N('padded', {c:[btn('scene_apply', 'Run this scene', {type:'APPLY_SCENE', id:sc.id}, 'primary block')]}),
      N('space', {})
    ]})
  ]});
}

function scrAutomations(st){
  return N('screen', {id:'scr_automations', name:'automations', c:[
    appbar('Automations', {back:true}),
    N('scroll', {id:'auto_scroll', c:[
      txt('Rules that run without you.', 'muted')
    ].concat(AUTOMATIONS.map(function(au){

      var when = au.when + (au.timed ? ' ' + hhmm(s.h, s.mi) : '');

        row('auto_' + au.id, au.name, {lead:au.icon, sub:when,
            arrow:false, act:{type:'NAV', to:'automationDetail', params:{id:au.id}},
            c:[N('switch', {id:'auto_toggle_' + au.id, on:s.enabled,
                            act:{type:'TOGGLE_AUTOMATION', id:au.id}})]})
      ]});
    })).concat([N('space', {})])})
  ]});
}

function scrAutomationDetail(st, params){
  var au = automation(params.id); if (!au) return scrAutomations(st);
  var s = st.automations[au.id];
  var body = [
    txt(au.name, 'h1'),

/* =======================================================================
 * TRAVERSAL — element index, GUI action interface, text observation
 * ==================================================================== */
var SKIP_KEYS = {act:1, minus:1, plus:1, go:1, close:1, clear:1, openAct:1, yes:1,
                 params:1, meta:1, set:1};

function labelOf(n){ return n.text || n.title || n.name || n.label || ''; }

function collect(n, out){
  if (!n || typeof n !== 'object') return;
  if (Array.isArray(n)) { for (var i=0;i<n.length;i++) collect(n[i], out); return; }
  if (n.t === 'appbar' && n.back) out.push({id:'nav_back', act:{type:'BACK'}, text:'Back', t:'back'});
  if (n.id && n.act)              out.push({id:n.id, act:n.act, text:labelOf(n), t:n.t||'el',
                                            disabled:!!n.disabled,
                                            input:(n.t==='searchbar'||n.t==='inputrow')});
  if (n.t === 'mask' && n.close)  out.push({id:n.id, act:n.close, text:'Dismiss overlay', t:'mask'});
  if (n.openId  && n.openAct)     out.push({id:n.openId,  act:n.openAct, text:'Open ' + (n.name||'') + ' settings', t:'btn'});
  if (n.minusId && n.minus)       out.push({id:n.minusId, act:n.minus, text:'decrease', t:'step', disabled:!!n.minusOff});
  if (n.plusId  && n.plus)        out.push({id:n.plusId,  act:n.plus,  text:'increase', t:'step', disabled:!!n.plusOff});
  if (n.goId    && n.go)          out.push({id:n.goId,    act:n.go,    text:'Search', t:'btn'});
  if (n.clearId && n.clear)       out.push({id:n.clearId, act:n.clear, text:'Clear the search', t:'btn'});
  for (var k in n){
    if (SKIP_KEYS[k]) continue;
    var v = n[k];
    if (v && typeof v === 'object') collect(v, out);
  }
}

function elements(st){
  var rootNode = (st && st.t === 'screen') ? st : screen(st);
  var masks = (rootNode.c||[]).filter(function(n){ return n.t === 'mask'; });
  var out = [];
  collect(masks.length ? masks[masks.length-1] : rootNode, out);
  return out;
}
function findEl(st, id){
  var els = elements(st);
  for (var i=0;i<els.length;i++) if (els[i].id === id) return els[i];
  return null;
}
function substitute(act, text){
  var a = clone(act);
  for (var k in a) if (a[k] === '$VALUE') a[k] = text;
  return a;
}

function step(st, a){
  a = a || {};
  var kind = a.action || a.type;
  switch (kind) {
  case 'tap': {
    var el = findEl(st, a.id);
    if (!el) return {state:st, ok:false, error:'ELEMENT_NOT_FOUND: ' + a.id};
    if (el.disabled) return {state:st, ok:false, error:'ELEMENT_DISABLED: ' + a.id};
    return {state:reduce(st, el.act), ok:true};
  }
  case 'type': {
    var e2 = findEl(st, a.id);
    if (!e2) return {state:st, ok:false, error:'ELEMENT_NOT_FOUND: ' + a.id};
    if (!e2.input) return {state:st, ok:false, error:'NOT_A_TEXT_FIELD: ' + a.id};
    return {state:reduce(st, substitute(e2.act, a.text == null ? '' : String(a.text))), ok:true};
  }
  case 'back':   return {state:reduce(st, {type:'BACK'}), ok:true};
  case 'home':   return {state:reduce(st, {type:'HOME'}), ok:true};
  case 'wait':   return {state:reduce(st, {type:'NOOP'}), ok:true};
  case 'finish': return {state:reduce(st, {type:'FINISH', answer:a.answer}), ok:true};
  case 'raw':    return {state:reduce(st, a.act || {}), ok:true};
  default:       return {state:st, ok:false, error:'UNKNOWN_ACTION: ' + kind};
  }
}

/* ------------------------------------------------- text observation (a11y) */
var ROOM_ALT = {
  living:'Illustration: a sofa, floor lamp and window at night',
  kitchen:'Illustration: a counter with spotlights, a kettle and open shelves',
  bedroom:'Illustration: a bed with a bedside lamp and drawn blinds',
  study:'Illustration: a desk, monitor and desk lamp',
  hallway:'Illustration: a front door with a coat rack and a pendant light',
  garden:'Illustration: a porch light, path and planting at dusk'
};

function a11y(st){
  var rootNode = screen(st), lines = [], r = route(st);
  lines.push('# Screen route=' + r.name + (r.params && r.params.id ? '(' + r.params.id + ')' : '') +
             '  ' + clockStr(st.meta.clock) + '  step ' + st.meta.steps);
  var masks = (rootNode.c||[]).filter(function(n){ return n.t==='mask'; });
  if (masks.length) lines.push('# A dialog is open. Nothing behind it can be tapped.');
  walkText(masks.length ? masks[masks.length-1] : rootNode, 0, lines, st);
  (rootNode.c||[]).forEach(function(n){ if (n.t==='toast') lines.push('[Toast] ' + n.text); });
  return lines.join('\n');
}
function tid(n){ return (n && n.id && n.act) ? ' #'+n.id : ''; }
function ind(d){ return new Array(d+1).join('  '); }

function walkText(n, d, out, st){
  if (!n || typeof n !== 'object') return;
  if (Array.isArray(n)) { n.forEach(function(x){ walkText(x, d, out, st); }); return; }
  var line = null;
  switch (n.t) {
  case 'screen': break;
  case 'appbar': line = '[AppBar] ' + (n.title || '') + (n.back ? '   Back #nav_back' : ''); break;
  case 'iconbtn': line = '[IconButton]' + tid(n) + ' ' + n.icon; break;
  case 'searchbar':
    line = '[TextField]' + tid(n) + ' placeholder="' + n.placeholder + '" value="' + (n.value||'') +
           '"   Search #' + n.goId + (n.clearId ? '   Clear #' + n.clearId : ''); break;
  case 'inputrow':
    line = '[TextField]' + tid(n) + ' ' + (n.label||'') + ' value="' + (n.value||'') +
           '" placeholder="' + (n.placeholder||'') + '"'; break;
  case 'chip':   line = '[Chip]' + tid(n) + ' ' + n.text + (n.on ? '  [selected]' : ''); break;
  case 'btn':    line = '[Button]' + (n.id ? ' #'+n.id : '') + ' ' + n.text + (n.disabled ? '  (disabled)' : ''); break;
  case 'row': {
    var s = '[Row]' + tid(n) + ' ' + (n.text||'');
    if (n.val) s += ' = ' + n.val;
    if (n.sub) s += '   (' + n.sub + ')';
    line = s; break;
  }
  case 'switch': line = '[Toggle]' + tid(n) + ' ' + (n.on ? 'ON' : 'OFF'); break;
  case 'radio':  line = '[Radio]' + tid(n) + ' ' + (n.on ? 'selected' : 'not selected'); break;
  case 'stepper':
    line = '[Stepper] value=' + n.value + '  decrease #' + n.minusId + '  increase #' + n.plusId; break;
  case 'stats':
    out.push(ind(d) + '[Status] ' + n.items.map(function(i){
      return i.k + ': ' + i.v + (i.unit || '') + (i.sub ? ' (' + i.sub + ')' : '') + ' #' + i.id;
    }).join('  |  '));
    return;
  case 'plan':
    out.push(ind(d) + '[FloorPlan] ' + (n.caption || ''));
    n.rooms.forEach(function(r){
      out.push(ind(d+1) + r.name + ' #' + r.id + ' — ' + r.on + ' of ' + r.total + ' on, lights ' +
               (r.lit ? 'ON' : 'off'));
    });
    return;
  case 'tile':
    line = '[Device]' + tid(n) + ' ' + n.name + ' — ' + n.sub +
           '   (tap toggles; open settings #' + n.openId + ')'; break;
  case 'roomgrid':
    out.push(ind(d) + '[Rooms]');
    n.items.forEach(function(r){
      out.push(ind(d+1) + r.name + ' #' + r.id + ' — ' + r.on + ' of ' + r.total + ' on, ' +
               r.watts + ' W, lights ' + (r.lit ? 'ON' : 'off'));
    });
    return;
  case 'roomhero':
    out.push(ind(d) + '[Room] ' + n.name + ' — ' + n.sub);
    out.push(ind(d+1) + (ROOM_ALT[n.art] || 'Illustration'));
    return;
  case 'devhead':
    out.push(ind(d) + '[Device] ' + n.name + ' in ' + n.room + ' — ' + n.status +
             ' · drawing ' + n.watts + ' W');
    return;
  case 'slider':
    out.push(ind(d) + '[Slider] ' + n.name + ' = ' + n.value + n.unit +
             '   decrease #' + n.minusId + (n.minusOff ? '(disabled)' : '') +
             '   increase #' + n.plusId + (n.plusOff ? '(disabled)' : ''));
    out.push(ind(d+1) + 'presets: ' + n.presets.map(function(p){
      return p.label + ' #' + p.id + (p.on ? '(current)' : ''); }).join('  '));
    return;
  case 'tones':
    out.push(ind(d) + '[LightTone] ' + n.items.map(function(t){
      return t.label + ' ' + t.kelvin + ' #' + t.id + (t.on ? '(current)' : ''); }).join('  '));
    return;
  case 'seg':
    out.push(ind(d) + '[Segmented] ' + n.items.map(function(i){
      return i.text + ' #' + i.id + (i.on ? '(selected)' : ''); }).join('  '));
    return;
  case 'chart':
    out.push(ind(d) + '[Chart] daily kWh: ' + n.bars.map(function(b){
      return b.label + ' ' + b.value + ' #' + b.id + (b.on ? '(selected)' : ''); }).join('  '));
    return;
  case 'barrow':
    line = '  ' + n.name + ': ' + n.value + n.unit + tid(n); break;
  case 'event':
    line = '  ' + n.at + '  ' + n.who + ' ' + n.what; break;
  case 'shield':
