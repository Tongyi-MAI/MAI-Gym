function artSvg(scene, lit){
  var fn = ART[scene]; if (!fn) return '';
  return '<svg viewBox="0 0 360 180" preserveAspectRatio="xMidYMid slice">'
       + fn('a' + (uidSeq++) + '_', lit) + '</svg>';
}

/* -------------------------------------------------------------- renderer */
var ACTS = [], TRAJ = [];
function bind(a){ if (!a) return ''; ACTS.push(a); return ' data-act="' + (ACTS.length-1) + '"'; }
function bindT(a){ if (!a) return ''; ACTS.push(a); return ' data-actt="' + (ACTS.length-1) + '"'; }
function tid(id){ return id ? ' data-testid="' + esc(id) + '"' : ''; }
function R(list){ return (list||[]).map(render).join(''); }

function render(n){
  if (!n || typeof n !== 'object') return '';
  if (Array.isArray(n)) return R(n);
  switch (n.t) {

  case 'screen': return R(n.c);

  case 'appbar': {
    var left = (n.back
      ? '<div class="iconbtn" data-testid="nav_back"' + bind({type:'BACK'}) + '>' + icon('back',19) + '</div>'
      : '') + R(n.left);
    return '<div class="n-appbar"' + tid(n.id) + '><div class="ab-side">' + left + '</div>'
         + '<div class="ab-title">' + esc(n.title) + '</div>'
         + '<div class="ab-side right">' + R(n.right) + '</div></div>';
  }
  case 'iconbtn':
    return '<div class="iconbtn"' + tid(n.id) + bind(n.act) + '>' + icon(n.icon, 18) + '</div>';

  case 'searchbar': {
    var goIdx = n.go ? (ACTS.push(n.go) - 1) : -1;
    return '<div class="searchbar">' + icon('search', 17)
      + '<input' + tid(n.id) + bindT(n.act) + ' data-enter="' + goIdx + '"'
      + ' value="' + esc(n.value) + '" placeholder="' + esc(n.placeholder) + '">'
      + (n.clearId ? '<div class="sb-clear"' + tid(n.clearId) + bind(n.clear) + '>' + icon('close',12) + '</div>' : '')
      + '<div class="sb-go"' + tid(n.goId) + ' data-act="' + goIdx + '">' + icon('arrow',15) + '</div></div>';
  }
  case 'inputrow':
    return '<div class="n-input"><div class="i-label">' + esc(n.label) + '</div>'
      + '<input' + tid(n.id) + bindT(n.act) + ' value="' + esc(n.value) + '" placeholder="'
      + esc(n.placeholder) + '"></div>';

  case 'scroll':  return '<div class="n-scroll"' + tid(n.id) + '>' + R(n.c) + '</div>';
  case 'chips':   return '<div class="n-chips"' + tid(n.id) + '>' + R(n.c) + '</div>';
  case 'chip':    return '<div class="n-chip' + (n.on?' on':'') + '"' + tid(n.id) + bind(n.act) + '>'
                       + (n.icon ? icon(n.icon, 15) : '') + esc(n.text) + '</div>';
  case 'card':    return '<div class="n-card ' + esc(n.cls||'') + (n.act?' tap':'') + '"' + tid(n.id)
                       + bind(n.act) + '>' + R(n.c) + '</div>';
  case 'padded':  return '<div style="padding:4px 18px">' + R(n.c) + '</div>';
  case 'sec':     return '<div class="n-sec"' + tid(n.id) + '><span>' + esc(n.text) + '</span>'
                       + (n.side ? '<span class="sec-side">' + esc(n.side) + '</span>' : '') + '</div>';
  case 'text':    return '<div class="n-text ' + esc(n.cls||'') + '">' + esc(n.text) + '</div>';
  case 'space':   return '<div class="n-space"></div>';
  case 'divider': return '<div class="n-divider"></div>';
  case 'label':   return '<span style="flex:1 1 auto;font-size:12px;color:var(--muted)">' + esc(n.text||'') + '</span>';
  case 'emptystate': return '<div class="n-text empty">' + esc(n.text) + '</div>';

  case 'row': {
    var inline = [], below = [];
    (n.c||[]).forEach(function(ch){
      (ch.t==='switch'||ch.t==='radio'||ch.t==='stepper'||ch.t==='btn') ? inline.push(ch) : below.push(ch);
    });
    return '<div class="n-row' + (n.act?' tap':'') + '"' + tid(n.id) + bind(n.act) + '>'
      + (n.lead ? '<div class="r-lead ' + esc(n.leadCls||'') + '">' + icon(n.lead, 19) + '</div>' : '')
      + '<div class="r-main"><div class="r-label">' + esc(n.text) + '</div>'
      + (n.sub ? '<div class="r-sub">' + esc(n.sub) + '</div>' : '') + '</div>'
      + (n.val ? '<div class="r-value ' + esc(n.valCls||'') + '">' + esc(n.val) + '</div>' : '')
      + R(inline)
      + (n.arrow && !inline.length ? '<div class="r-arrow">' + icon('arrow', 15) + '</div>' : '')
      + '</div>' + R(below);
  }
  case 'btn':
    return '<div class="n-btn ' + esc(n.cls||'') + (n.disabled?' off':'') + '"' + tid(n.id)
         + (n.disabled ? '' : bind(n.act)) + '>' + esc(n.text) + '</div>';
  case 'btnrow': return '<div class="n-btnrow"' + tid(n.id) + '>' + R(n.c) + '</div>';

  case 'switch': return '<div class="n-switch' + (n.on?' on':'') + '"' + tid(n.id) + bind(n.act) + '><i></i></div>';
  case 'radio':  return '<div class="n-radio' + (n.on?' on':'') + '"' + tid(n.id) + bind(n.act) + '></div>';
  case 'stepper':
    return '<div class="n-stepper"' + tid(n.id) + '>'
      + '<div class="st-btn"' + tid(n.minusId) + bind(n.minus) + '>' + icon('minus',15) + '</div>'
      + '<div class="st-val">' + esc(n.value) + '</div>'
      + '<div class="st-btn"' + tid(n.plusId) + bind(n.plus) + '>' + icon('plus',15) + '</div></div>';

  case 'tabbar':
    return '<div class="n-tabbar"' + tid(n.id) + '>' + n.items.map(function(i){
      return '<div class="tb' + (i.on?' on':'') + '"' + tid(i.id) + bind(i.act) + '>'
           + '<i>' + icon(i.icon, 21) + '</i>' + esc(i.text) + '</div>';
    }).join('') + '</div>';

  case 'stats':
    return '<div class="stats"' + tid(n.id) + '>' + n.items.map(function(i){
      return '<div class="stat tap"' + tid(i.id) + bind(i.act) + '>'
        + '<div class="s-k">' + icon(i.icon, 13) + esc(i.k) + '</div>'
        + '<div class="s-v">' + esc(i.v) + (i.unit ? '<small>' + esc(i.unit) + '</small>' : '') + '</div>'
        + '<div class="s-k" style="margin-top:5px">' + esc(i.sub||'') + '</div></div>';
    }).join('') + '</div>';

  case 'plan': {
    var labels = n.rooms.map(function(r){
      var g = PLAN[r.key]; if (!g) return '';
      return '<div class="p-room' + (r.lit?' lit':'') + '"' + tid(r.id) + bind(r.act)
        + ' style="left:' + ((g.x + g.w/2)/360*100) + '%;top:' + ((g.y + g.h/2)/234*100) + '%;'
        + 'width:' + (g.w/360*100) + '%;height:' + (g.h/234*100) + '%">'
        + '<div class="p-name">' + esc(g.label) + '</div>'
        + '<div class="p-on">' + r.on + '/' + r.total + '</div></div>';
    }).join('');
    return '<div class="plan"' + tid(n.id) + '><div class="p-canvas">' + planSvg(n.rooms)
      + '<div class="p-layer">' + labels + '</div></div>'
      + (n.caption ? '<div class="p-cap">' + icon('bulb',13) + esc(n.caption) + '</div>' : '') + '</div>';
  }

  case 'tilegrid': return '<div class="grid2"' + tid(n.id) + '>' + R(n.c) + '</div>';
  case 'tile':
    return '<div class="tile' + (n.on?' on':'') + (n.cool?' cool':'') + '"' + tid(n.id) + bind(n.act) + '>'
      + '<div class="t-top"><div class="t-ico">' + icon(n.icon, 19) + '</div>'
      + '<div class="t-open"' + tid(n.openId) + bind(n.openAct) + '>' + icon('arrow', 13) + '</div></div>'
      + '<div class="t-name">' + esc(n.name) + '</div>'
      + '<div class="t-sub">' + esc(n.sub) + '</div></div>';

  case 'roomgrid':
    return '<div class="grid2"' + tid(n.id) + '>' + n.items.map(function(r){
      return '<div class="roomcard' + (r.lit?' lit':'') + '"' + tid(r.id) + bind(r.act) + '>'
        + '<div class="rc-art">' + artSvg(r.art, r.lit) + '</div>'
        + '<div class="rc-body"><div class="rc-name">' + esc(r.name) + '</div>'
        + '<div class="rc-sub">' + r.on + '/' + r.total + ' on · ' + r.watts + ' W</div></div></div>';
    }).join('') + '</div>';

  case 'roomhero':
    return '<div class="roomhero"' + tid(n.id) + '>' + artSvg(n.art, n.lit)
      + '<div class="rh-scrim"></div><div class="rh-txt"><div class="rh-name">' + esc(n.name) + '</div>'
      + '<div class="rh-sub">' + esc(n.sub) + '</div></div></div>';

  case 'devhead':
    return '<div class="devhead' + (n.on?' on':'') + '"' + tid(n.id) + '>'
      + '<div class="dh-ico">' + icon(n.icon, 26) + '</div>'
      + '<div class="dh-name">' + esc(n.name) + '</div>'
      + '<div class="dh-sub">' + esc(n.room) + ' · ' + esc(n.status) + '</div>'
      + '<div class="dh-watts">' + n.watts + ' W</div></div>';

  case 'slider':
    return '<div class="slider"' + tid(n.id) + '>'
      + '<div class="sl-head"><span class="sl-name">' + esc(n.name) + '</span>'
      + '<span class="sl-val">' + n.value + esc(n.unit) + '</span></div>'
      + '<div class="sl-body">'
      + '<div class="sl-btn' + (n.minusOff?' off':'') + '"' + tid(n.minusId)
      + (n.minusOff?'':bind(n.minus)) + '>' + icon('minus',16) + '</div>'
      + '<div class="sl-track"><div class="sl-fill' + (n.cool?' cool':'') + '" style="width:'
      + n.value + '%"></div><div class="sl-ticks"><i></i><i></i><i></i><i></i><i></i>'
      + '<i></i><i></i><i></i><i></i></div></div>'
      + '<div class="sl-btn' + (n.plusOff?' off':'') + '"' + tid(n.plusId)
      + (n.plusOff?'':bind(n.plus)) + '>' + icon('plus',16) + '</div></div>'
      + '<div class="sl-presets">' + n.presets.map(function(p){
          return '<div class="sl-preset' + (p.on?' on':'') + '"' + tid(p.id) + bind(p.act) + '>'
               + esc(p.label) + '</div>'; }).join('') + '</div></div>';

  case 'tones':
    return '<div class="tones"' + tid(n.id) + '>' + n.items.map(function(t){
      return '<div class="tone' + (t.on?' on':'') + '"' + tid(t.id) + bind(t.act) + '>'
        + '<div class="dot" style="background:' + t.css + '"></div>' + esc(t.label)
        + '<div style="font-size:10px;color:var(--muted);margin-top:2px">' + esc(t.kelvin) + '</div></div>';
    }).join('') + '</div>';

  case 'seg':
    return '<div class="seg"' + tid(n.id) + '>' + n.items.map(function(i){
      return '<div class="seg-i' + (i.on?' on ':' ') + esc(i.cls||'') + '"' + tid(i.id) + bind(i.act) + '>'
           + esc(i.text) + '</div>';
    }).join('') + '</div>';

  case 'chart':
    return '<div class="chart"' + tid(n.id) + '><div class="c-bars">' + n.bars.map(function(b){
      var h = Math.max(6, Math.round(b.value / n.max * 118));
      return '<div class="c-col' + (b.on?' on':'') + '"' + tid(b.id) + bind(b.act) + '>'
        + '<div class="c-bar" style="height:' + h + 'px"></div>'
        + '<div class="c-lab">' + esc(b.label) + '</div></div>';
    }).join('') + '</div></div>';

  case 'barrow':
    return '<div class="bar-row"' + tid(n.id) + bind(n.act) + '>'
      + '<span class="b-name">' + esc(n.name) + '</span>'
      + '<span class="b-track"><span class="b-fill" style="width:'
      + Math.round(n.value / n.max * 100) + '%"></span></span>'
      + '<span class="b-val">' + n.value + esc(n.unit) + '</span></div>';

  case 'event':
    return '<div class="event"' + tid(n.id) + '><div class="e-time">' + esc(n.at) + '</div>'
      + '<div class="e-ico">' + icon(n.icon, 15) + '</div>'
      + '<div class="e-txt"><b>' + esc(n.who) + '</b> ' + esc(n.what) + '</div></div>';

  case 'shield':
    return '<div class="shieldart"' + tid(n.id) + '>'
      + '<svg viewBox="0 0 360 180" preserveAspectRatio="xMidYMid meet">'
      + ART.shieldArt('s' + (uidSeq++) + '_', n.alarm, n.locked) + '</svg></div>';

  case 'pills':
    return '<div style="display:flex;gap:7px;flex-wrap:wrap;padding:2px 18px 8px"' + tid(n.id) + '>'
      + n.items.map(function(p){ return '<span class="pill ' + (p.cls||'') + '">' + esc(p.text) + '</span>'; }).join('')
      + '</div>';

  case 'kv':
    return '<div class="kv"><span class="k">' + esc(n.k) + '</span><span class="v">' + esc(n.v) + '</span></div>';

  case 'mask':  return '<div class="n-mask"' + tid(n.id) + bind(n.close) + '>' + R(n.c) + '</div>';
  case 'dialog':
    return '<div class="dialog"' + tid(n.id) + ' data-stop="1">'
      + '<div style="padding:22px 20px 16px;text-align:center">'
      + (n.title ? '<div style="font:650 17px/1.3 var(--disp);margin-bottom:8px">' + esc(n.title) + '</div>' : '')
      + '<div style="font-size:13.5px;color:var(--ink2);line-height:1.55">' + esc(n.text) + '</div></div>'
      + '<div style="display:flex;gap:10px;padding:0 16px 16px">'
      + '<div class="n-btn" style="flex:1"' + tid(n.cancel.id) + bind(n.cancel.act) + '>' + esc(n.cancel.text) + '</div>'
      + '<div class="n-btn primary" style="flex:1"' + tid(n.ok.id) + bind(n.ok.act) + '>' + esc(n.ok.text) + '</div>'
      + '</div></div>';
  case 'toast': return '<div class="n-toast"' + tid(n.id) + '>' + esc(n.text) + '</div>';
  default: return '';
  }
}

/* ------------------------------------------------------------------ paint */
var STATE = null;
function paint(){
  ACTS = []; uidSeq = 0;
  var tree = E.screen(STATE);
  app.innerHTML = render(tree);
  document.getElementById('sb-clock').textContent = E.select.clockStr(STATE.meta.clock);
  if (!hud.classList.contains('off')) paintHud();
}

app.addEventListener('click', function(ev){
  var el = ev.target.closest('[data-act]');
  if (!el) return;
  if (el.classList.contains('n-mask') && ev.target.closest('[data-stop]')) return;
  var act = ACTS[+el.getAttribute('data-act')];
  if (!act) return;
  TRAJ.push({action:'tap', id: el.getAttribute('data-testid') || null});
  STATE = E.reduce(STATE, act);
  paint();
});
app.addEventListener('keydown', function(ev){
  if (ev.key !== 'Enter') return;
  var el = ev.target.closest('[data-enter]');
  if (!el) return;
  var idx = +el.getAttribute('data-enter');
  if (idx < 0) return;
  ev.preventDefault();
  var act = ACTS[idx]; if (!act) return;
  TRAJ.push({action:'tap', id:'(enter)'});
  STATE = E.reduce(STATE, act);
  paint();
});
app.addEventListener('input', function(ev){
  var el = ev.target.closest('[data-actt]');
  if (!el) return;
  var act = JSON.parse(JSON.stringify(ACTS[+el.getAttribute('data-actt')]));
  for (var k in act) if (act[k] === '$VALUE') act[k] = el.value;
  var id = el.getAttribute('data-testid'), pos = el.selectionStart;
  TRAJ.push({action:'type', id:id, text:el.value});
  STATE = E.reduce(STATE, act);
  paint();
  var again = id && app.querySelector('[data-testid="' + id + '"]');
  if (again && again.focus) { again.focus(); try { again.setSelectionRange(pos, pos); } catch(e){} }
});

/* ---------------------------------------------------------------- dev HUD */
function paintHud(){
  var d = E.derive(STATE);
  hud.innerHTML = '<h4>__ENV__ · ' + E.ENV_ID + ' v' + E.VERSION + '</h4>'
    + '<div><span class="k">route</span> ' + d.route + '  <span class="k">step</span> ' + STATE.meta.steps
    + '  <span class="k">seed</span> ' + STATE.meta.seed + '</div>'
    + '<div><span class="k">power</span> ' + d.totalWatts + ' W  <span class="k">lights</span> '
    + d.lightsOnCount + '  <span class="k">alarm</span> ' + d.alarm
    + '  <span class="k">lock</span> ' + (d.doorLocked ? 'locked' : 'open') + '</div>'
    + '<div style="margin-top:8px">'
    + '<button id="hud-reset">reset</button><button id="hud-a11y">copy a11y</button>'
    + '<button id="hud-state">copy state</button><button id="hud-traj">copy traj</button>'
    + '<button id="hud-hide">hide (h)</button></div>'
    + '<pre>' + esc(E.a11y(STATE)) + '</pre>';
  hud.querySelector('#hud-reset').onclick = function(){ ENVAPI.reset({seed:STATE.meta.seed}); };
  hud.querySelector('#hud-a11y').onclick  = function(){ copy(E.a11y(STATE)); };
  hud.querySelector('#hud-state').onclick = function(){ copy(JSON.stringify(E.snapshot(STATE), null, 2)); };
  hud.querySelector('#hud-traj').onclick  = function(){ copy(JSON.stringify(TRAJ, null, 2)); };
  hud.querySelector('#hud-hide').onclick  = function(){ hud.classList.add('off'); };
}
function copy(t){ try { navigator.clipboard.writeText(t); } catch(e){} }
document.addEventListener('keydown', function(e){
  if (e.key === 'h') { hud.classList.toggle('off'); if (!hud.classList.contains('off')) paintHud(); }
});

/* ------------------------------------------------------- window.__ENV__ */
var ENVAPI = {
  ENV_ID: E.ENV_ID, VERSION: E.VERSION,
  reset: function(opts){
    opts = opts || {};
    STATE = E.createInitialState(opts.seed || 0);
    if (opts.patch) E.applyPatch(STATE, opts.patch);
    TRAJ = []; paint();
    return E.snapshot(STATE);
  },
  getState:   function(){ return E.snapshot(STATE); },
  setState:   function(s){ STATE = JSON.parse(JSON.stringify(s)); paint(); return true; },
  step:       function(a){ var r = E.step(STATE, a); STATE = r.state; TRAJ.push(a); paint();
                           return {ok:r.ok, error:r.error || null}; },
  dispatch:   function(act){ STATE = E.reduce(STATE, act); paint(); return true; },
  a11y:       function(){ return E.a11y(STATE); },
  elements:   function(){ return E.elements(STATE); },
  route:      function(){ return E.select.route(STATE); },
  trajectory: function(){ return JSON.parse(JSON.stringify(TRAJ)); },
  bounds: function(){
    var base = document.getElementById('screen').getBoundingClientRect(), out = {};
    app.querySelectorAll('[data-testid]').forEach(function(el){
      var r = el.getBoundingClientRect();
      out[el.getAttribute('data-testid')] = {
        x:Math.round(r.left-base.left), y:Math.round(r.top-base.top),
        w:Math.round(r.width), h:Math.round(r.height),
        cx:Math.round(r.left-base.left+r.width/2), cy:Math.round(r.top-base.top+r.height/2)};
    });
    return out;
  }
};
window.__ENV__ = ENVAPI;

var qs = new URLSearchParams(location.search);
if (qs.get('bare') === '1') document.body.classList.add('bare');
if (qs.get('hud')  === '1') hud.classList.remove('off');
ENVAPI.reset({seed: parseInt(qs.get('seed') || '0', 10) || 0});
window.__ENV_READY__ = true;
})();
</script>
