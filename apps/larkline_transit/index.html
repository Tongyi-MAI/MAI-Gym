<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Larkline (mocked GUI env)</title>
<!--
  ============================================================================
  Larkline — a single-file H5 city transit app for agent research.

  Same two-block contract as every environment here: script#engine is a pure,
  DOM-free state machine on globalThis.GUI_ENGINE; script#ui renders its screen
  tree and exposes window.__ENV__.

  What is new: nothing here is a catalogue. There is no list of journeys to
  scroll — there is a timetable (four lines, a first departure and a headway
  each), and every journey on screen is *computed* by a planner that walks it:
  direct services first, then one-change itineraries through an interchange
  with a four-minute connection. Change the departure time by five minutes and
  a different set of trains comes back. Turn on step-free routing and every
  option through Aldergate disappears, because Aldergate has no lift. The line
  status page is not decoration either: the Amber line's delay is added to the
  arrival of any leg that uses it, and the suspended Coral segment removes the
  journeys that would have crossed it.

  The world clock is deliberately frozen at 14:26. Everything on screen is a
  function of the timetable and the plan time, never of how many steps an agent
  has taken to get there, so two agents that reach the same screen by different
  routes read exactly the same departures.
  ============================================================================
-->
<style>
:root{
  --bg:#f3f5f8; --card:#fff; --line:#e4e8ef; --line2:#d7dce6;
  --ink:#0f1725; --ink2:#56617a; --muted:#8d97ac;
  --accent:#0f766e; --accent-d:#115e59; --accent-s:#e6f4f1;
  --nav:#101a2c;
  --good:#0f9d58; --bad:#d64541; --warn:#c2740b;
  --blue:#2563eb; --green:#15803d; --amber:#c2740b; --coral:#e11d48;
  --r:16px; --r2:11px;
  --shadow:0 1px 2px rgba(15,23,37,.05),0 8px 24px rgba(15,23,37,.06);
  --disp:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{background:#dfe4ec;color:var(--ink);
  font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  display:flex;align-items:center;justify-content:center;overflow:hidden}

#device{position:relative;width:390px;height:844px;background:#0b1220;border-radius:46px;padding:5px;
  box-shadow:0 30px 70px rgba(0,0,0,.34);flex:0 0 auto}
#screen{position:relative;width:100%;height:100%;background:var(--bg);border-radius:41px;
  overflow:hidden;display:flex;flex-direction:column}
#notch{position:absolute;top:5px;left:50%;transform:translateX(-50%);width:118px;height:30px;
  background:#0b1220;border-radius:0 0 18px 18px;z-index:60}
body.bare{background:var(--bg)}
body.bare #device{width:390px;height:844px;padding:0;border-radius:0;box-shadow:none;background:var(--bg)}
body.bare #screen{border-radius:0}
body.bare #notch{display:none}
body.bare .n-sheet{animation:none}

.statusbar{height:44px;flex:0 0 44px;display:flex;align-items:flex-end;justify-content:space-between;
  padding:0 22px 6px;font-size:13px;font-weight:600;z-index:50;background:var(--nav);color:#fff}
.statusbar .sb-r{display:flex;gap:5px;align-items:center}
.sb-bat{width:22px;height:11px;border:1.3px solid currentColor;border-radius:3px;position:relative;opacity:.9}
.sb-bat:after{content:"";position:absolute;right:-3px;top:3px;width:2px;height:5px;background:currentColor;border-radius:0 1px 1px 0}
.sb-bat i{position:absolute;left:1.3px;top:1.3px;bottom:1.3px;width:78%;background:currentColor;border-radius:1px}

#app{flex:1 1 auto;display:flex;flex-direction:column;min-height:0;position:relative}

.n-appbar{flex:0 0 auto;min-height:52px;display:flex;align-items:center;gap:8px;padding:6px 12px;
  background:var(--nav);color:#fff;z-index:20}
.n-appbar .ab-title{flex:1 1 auto;text-align:center;font:650 17px/1.3 var(--disp);letter-spacing:-.2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.n-appbar .ab-side{flex:0 0 auto;min-width:56px;display:flex;align-items:center;gap:4px}
.n-appbar .ab-side.right{justify-content:flex-end}
.n-appbar .iconbtn{color:#c9d3e4}
.n-appbar .iconbtn:active{background:rgba(255,255,255,.12)}
.iconbtn{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  color:var(--ink2);cursor:pointer}
.iconbtn:active{background:#eaeef4}

.n-scroll{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;padding-bottom:10px}
.n-scroll::-webkit-scrollbar{width:0}

.n-text{padding:2px 16px;color:var(--ink2)}
.n-text.h1{font:700 25px/1.2 var(--disp);color:var(--ink);padding:12px 16px 4px;letter-spacing:-.5px}
.n-text.body{font-size:13.5px;padding:5px 16px;line-height:1.65}
.n-text.muted{font-size:12.5px;color:var(--muted);padding:6px 16px;line-height:1.6}
.n-text.empty{padding:10px 16px 40px;text-align:center;color:var(--muted);font-size:13.5px}
.n-sec{padding:16px 16px 6px;font:600 12px/1 var(--disp);color:var(--muted);letter-spacing:1.1px;
  text-transform:uppercase;display:flex;justify-content:space-between;align-items:center}
.n-space{height:14px}

.n-card{background:var(--card);border-radius:var(--r);margin:10px 16px;overflow:hidden;border:1px solid var(--line)}
.n-card.flush{padding:0}
.n-card.pad{padding:14px}
.n-card.tap{cursor:pointer}
.n-card.tap:active{background:#f6f8fb}

.n-row{display:flex;align-items:center;gap:13px;padding:13px 16px;border-bottom:1px solid var(--line);min-height:54px}
.n-row:last-child{border-bottom:none}
.n-row.tap{cursor:pointer}
.n-row.tap:active{background:#f6f8fb}
.n-row .r-lead{flex:0 0 auto;width:26px;color:var(--ink2);display:flex;align-items:center;justify-content:center}
.n-row .r-main{flex:1 1 auto;min-width:0}
.n-row .r-label{font-size:14.5px}
.n-row .r-sub{font-size:12px;color:var(--muted);margin-top:3px}
.n-row .r-value{flex:0 0 auto;font-size:14px;color:var(--ink2);text-align:right;font-variant-numeric:tabular-nums}
.n-row .r-value.strong{color:var(--ink);font-weight:700}
.n-row .r-value.good{color:var(--good);font-weight:700}
.n-row .r-value.bad{color:var(--bad);font-weight:700}
.n-row .r-value.warn{color:var(--warn);font-weight:700}
.n-row .r-arrow{flex:0 0 auto;color:#c0c7d4;display:flex}

.n-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 20px;
  border-radius:13px;font:650 15px/1 var(--disp);background:#e9edf3;color:var(--ink);
  border:none;cursor:pointer;user-select:none}
.n-btn:active{filter:brightness(.96)}
.n-btn.primary{background:var(--accent);color:#fff}
.n-btn.primary.off{background:#b9c3c2;cursor:not-allowed}
.n-btn.ghost{background:transparent;border:1px solid var(--line2);height:36px;font-size:13px;padding:0 14px;color:var(--ink2)}
.n-btn.danger{background:transparent;border:1px solid #f0c9c7;color:var(--bad);height:36px;font-size:13px;padding:0 14px}
.n-btn.block{display:flex;width:100%}
.n-btnrow{display:flex;gap:10px;padding:12px 16px;justify-content:flex-end;align-items:center}

.n-chips{display:flex;gap:8px;padding:8px 16px;overflow-x:auto}
.n-chips::-webkit-scrollbar{height:0}
.n-chip{flex:0 0 auto;height:34px;padding:0 14px;border-radius:11px;background:var(--card);
  border:1px solid var(--line2);display:flex;align-items:center;gap:6px;font-size:13px;
  color:var(--ink2);cursor:pointer;white-space:nowrap;font-weight:550}
.n-chip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}

.n-input{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line);background:var(--card)}
.n-input .i-label{flex:0 0 74px;font-size:13px;color:var(--muted)}
.n-input input{flex:1 1 auto;border:none;outline:none;background:transparent;font-size:14.5px;
  font-family:inherit;color:var(--ink);min-width:0}
.n-input input::placeholder{color:var(--muted)}
.n-switch{flex:0 0 auto;width:46px;height:27px;border-radius:14px;background:#cdd4e0;position:relative;cursor:pointer;transition:background .16s}
.n-switch.on{background:var(--accent)}
.n-switch i{position:absolute;top:2.5px;left:2.5px;width:22px;height:22px;border-radius:50%;background:#fff;
  transition:transform .16s;box-shadow:0 1px 3px rgba(0,0,0,.22)}
.n-switch.on i{transform:translateX(19px)}
.n-radio{flex:0 0 auto;width:22px;height:22px;border-radius:50%;border:1.8px solid #c3cad8;position:relative}
.n-radio.on{border-color:var(--accent);background:var(--accent)}
.n-radio.on:after{content:"";position:absolute;left:7px;top:4px;width:5px;height:9px;
  border:2px solid #fff;border-top:0;border-left:0;transform:rotate(42deg)}

/* ---------------- the plan card ---------------- */
.plancard{margin:12px 16px;background:var(--card);border-radius:var(--r);border:1px solid var(--line);
  box-shadow:var(--shadow);position:relative;overflow:hidden}
.plancard .pc-row{display:flex;align-items:center;gap:12px;padding:15px 16px;cursor:pointer;min-height:60px}
.plancard .pc-row+.pc-row{border-top:1px solid var(--line)}
.plancard .pc-row:active{background:#f6f8fb}
.plancard .pc-k{flex:0 0 40px;font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.8px}
.plancard .pc-v{flex:1 1 auto;font:600 16.5px/1.25 var(--disp);letter-spacing:-.2px}
.plancard .pc-v.ghost{color:var(--muted);font-weight:500}
.plancard .pc-z{flex:0 0 auto;font-size:11.5px;color:var(--muted);font-weight:600}
.plancard .swap{position:absolute;right:14px;top:50%;transform:translateY(-50%);width:38px;height:38px;
  border-radius:50%;background:var(--accent-s);color:var(--accent);display:flex;align-items:center;
  justify-content:center;cursor:pointer;border:3px solid var(--card);z-index:3}
.plancard .swap:active{filter:brightness(.95)}

.timerow{display:flex;align-items:center;gap:10px;margin:0 16px 4px;padding:10px 12px;background:var(--card);
  border:1px solid var(--line);border-radius:var(--r2)}
.timerow .tr-lab{flex:1 1 auto;font-size:13px;color:var(--ink2)}
.timerow .tr-val{font:700 19px/1 var(--disp);font-variant-numeric:tabular-nums;min-width:66px;text-align:center}
.timerow .st{width:34px;height:34px;border-radius:10px;background:#eef1f6;color:var(--ink2);display:flex;
  align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto}
.timerow .st:active{background:#e2e7ef}

/* ---------------- journeys ---------------- */
.jcard{margin:9px 16px;background:var(--card);border-radius:var(--r);border:1px solid var(--line);
  padding:14px 15px;cursor:pointer;box-shadow:var(--shadow)}
.jcard:active{background:#f6f8fb}
.jcard.best{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset,var(--shadow)}
.jcard .j-top{display:flex;align-items:baseline;gap:9px}
.jcard .j-time{font:750 22px/1 var(--disp);font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.jcard .j-dash{flex:1 1 auto;height:1px;background:var(--line2);position:relative;top:-4px}
.jcard .j-dur{font-size:12.5px;color:var(--ink2);font-weight:650}
.jcard .j-mid{display:flex;align-items:center;gap:6px;margin-top:11px;flex-wrap:wrap}
.jcard .j-bot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;
  font-size:12px;color:var(--muted)}
.jcard .j-bot b{color:var(--ink);font-weight:700;font-size:13px}

.lchip{display:inline-flex;align-items:center;gap:5px;height:23px;padding:0 9px;border-radius:7px;
  font-size:11.5px;font-weight:750;color:#fff;letter-spacing:.2px}
.lchip.blue{background:var(--blue)} .lchip.green{background:var(--green)}
.lchip.amber{background:var(--amber)} .lchip.coral{background:var(--coral)}
.lchip.walk{background:#7b869c}
.jarrow{color:#b9c1d0;display:flex;align-items:center}

.tag{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:11px;
  font-weight:700;background:#eef1f6;color:var(--ink2)}
.tag.good{background:#e6f6ed;color:var(--good)}
.tag.warn{background:#fdf1de;color:var(--warn)}
.tag.bad{background:#fdecec;color:var(--bad)}
.tag.acc{background:var(--accent-s);color:var(--accent)}

/* ---------------- leg timeline ---------------- */
.legs{margin:10px 16px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:6px 0}
.leg{display:flex;gap:13px;padding:0 16px}
.leg .lg-rail{flex:0 0 14px;display:flex;flex-direction:column;align-items:center;padding-top:5px}
.leg .lg-dot{width:12px;height:12px;border-radius:50%;border:3px solid var(--ink);background:#fff;flex:0 0 auto}
.leg .lg-bar{flex:1 1 auto;width:5px;border-radius:3px;margin:4px 0}
.leg .lg-bar.blue{background:var(--blue)} .leg .lg-bar.green{background:var(--green)}
.leg .lg-bar.amber{background:var(--amber)} .leg .lg-bar.coral{background:var(--coral)}
.leg .lg-bar.walk{background:repeating-linear-gradient(180deg,#aab2c2 0 4px,transparent 4px 9px)}
.leg .lg-main{flex:1 1 auto;min-width:0;padding:2px 0 16px}
.leg .lg-hd{display:flex;gap:10px;align-items:baseline}
.leg .lg-t{font:750 15px/1.2 var(--disp);font-variant-numeric:tabular-nums;flex:0 0 44px}
.leg .lg-st{font:600 15px/1.3 var(--disp);flex:1 1 auto}
.leg .lg-info{margin:7px 0 0 54px;font-size:12.5px;color:var(--ink2);line-height:1.6}
.leg .lg-info .pf{font-weight:700;color:var(--ink)}

/* ---------------- departure board ---------------- */
.board{margin:10px 16px;border-radius:var(--r);overflow:hidden;background:#0f1725;border:1px solid #1d2739}
.board .bd-hd{display:flex;justify-content:space-between;padding:11px 15px;color:#8fa0bd;font-size:11.5px;
  font-weight:700;letter-spacing:1px;text-transform:uppercase;border-bottom:1px solid #1d2739}
.bdrow{display:flex;align-items:center;gap:11px;padding:12px 15px;border-bottom:1px solid #1a2436;cursor:pointer}
.bdrow:last-child{border-bottom:none}
.bdrow:active{background:#18213234}
.bdrow .bd-t{font:750 17px/1 var(--mono);color:#fff;flex:0 0 50px;font-variant-numeric:tabular-nums}
.bdrow .bd-m{flex:1 1 auto;min-width:0}
.bdrow .bd-dest{font-size:14px;color:#eaf0fb;font-weight:600}
.bdrow .bd-sub{font-size:11.5px;color:#7f8ea9;margin-top:3px}
.bdrow .bd-r{flex:0 0 auto;text-align:right}
.bdrow .bd-pf{font-size:11px;color:#8fa0bd}
.bdrow .bd-status{font-size:12px;font-weight:700;color:#5fd39a;margin-top:3px}
.bdrow .bd-status.late{color:#f0b45a}
.bdrow .bd-status.gone{color:#8b98af}

/* ---------------- fares & tickets ---------------- */
.fare{margin:12px 16px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.fare .fa-k{display:flex;justify-content:space-between;font-size:13.5px;color:var(--ink2);padding:5px 0}
.fare .fa-k b{color:var(--ink);font-weight:650;font-variant-numeric:tabular-nums}
.fare .fa-total{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--line);
  margin-top:10px;padding-top:12px}
.fare .fa-total span{font-size:13.5px;font-weight:650}
.fare .fa-total b{font:800 27px/1 var(--disp);letter-spacing:-.8px;font-variant-numeric:tabular-nums}

.tkt{margin:11px 16px;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:var(--card);
  cursor:pointer;box-shadow:var(--shadow)}
.tkt .tk-band{padding:13px 16px;color:#fff;display:flex;justify-content:space-between;align-items:center}
.tkt .tk-band.unused{background:linear-gradient(120deg,#0f766e,#15918a)}
.tkt .tk-band.active{background:linear-gradient(120deg,#0b6b3a,#17a34a)}
.tkt .tk-band.expired{background:linear-gradient(120deg,#5b6478,#7d879b)}
.tkt .tk-name{font:700 15.5px/1.2 var(--disp)}
.tkt .tk-bd{padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.tkt .tk-meta{font-size:12.5px;color:var(--ink2);line-height:1.6}
.tkt .tk-price{font:800 19px/1 var(--disp);font-variant-numeric:tabular-nums}
.tkt .tk-perf{border-top:1px dashed var(--line2);padding:10px 16px;font-size:12px;color:var(--muted);
  display:flex;justify-content:space-between}

.qr{margin:14px auto 4px;width:150px;height:150px;border-radius:12px;background:#0f1725;
  display:grid;grid-template-columns:repeat(9,1fr);grid-template-rows:repeat(9,1fr);gap:2px;padding:10px}
.qr i{border-radius:1px}

.mapart{margin:12px 16px 4px;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:#0f1725}

.n-tabbar{flex:0 0 auto;height:58px;background:var(--card);border-top:1px solid var(--line);display:flex;z-index:30}
.n-tabbar .tb{flex:1 1 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--muted);font-size:10.5px;cursor:pointer;font-weight:600}
.n-tabbar .tb i{display:flex}
.n-tabbar .tb.on{color:var(--accent)}

.n-mask{position:absolute;inset:0;background:rgba(10,16,28,.46);z-index:70;display:flex;align-items:flex-end}
.n-sheet{width:100%;max-height:80%;background:var(--card);border-radius:20px 20px 0 0;display:flex;
  flex-direction:column;overflow:hidden;animation:up .18s ease-out}
@keyframes up{from{transform:translateY(24px)}to{transform:none}}
.n-sheet .sh-hd{padding:16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.n-sheet .sh-hd .t{font:650 17px/1.2 var(--disp)}
.n-sheet .sh-bd{flex:1 1 auto;overflow-y:auto;min-height:0}
.n-sheet .sh-bd::-webkit-scrollbar{width:0}
.n-toast{position:absolute;left:50%;bottom:120px;transform:translateX(-50%);background:#0f1725;color:#fff;
  padding:11px 18px;border-radius:11px;font-size:13px;z-index:90;max-width:82%;text-align:center}
.dialog{margin:auto;width:80%;background:#fff;border-radius:16px;overflow:hidden}
.banner{margin:10px 16px;padding:12px 14px;border-radius:var(--r2);display:flex;gap:11px;align-items:flex-start;
  cursor:pointer;background:#fdf1de;border:1px solid #f4dfb8;color:#7a4d06}
.banner .bn-t{font-weight:700;font-size:13px}
.banner .bn-s{font-size:12px;margin-top:3px;opacity:.9;line-height:1.5}

#hud{position:fixed;top:14px;left:14px;width:310px;max-height:calc(100% - 28px);overflow:auto;
  background:#0f1725;color:#c8cde0;border-radius:12px;padding:12px;
  font:11.5px/1.5 var(--mono);z-index:200;box-shadow:0 10px 30px rgba(0,0,0,.35)}
#hud h4{margin:0 0 8px;font-size:12px;color:#fff}
#hud .k{color:#7b8399}
#hud pre{margin:6px 0 0;white-space:pre-wrap;word-break:break-word;color:#8fd6cd;max-height:250px;overflow:auto}
#hud button{background:#1c2536;border:none;color:#c8cde0;border-radius:6px;padding:5px 9px;margin:2px 4px 2px 0;font:inherit;cursor:pointer}
#hud.off{display:none}
</style>
</head>
<body>
<div id="device">
  <div id="notch"></div>
  <div id="screen">
    <div class="statusbar" id="sb">
      <div id="sb-clock">14:26</div>
      <div class="sb-r">
        <svg width="17" height="12" viewBox="0 0 17 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="4.6" y="5.5" width="3" height="6.5" rx="1"/><rect x="9.2" y="3" width="3" height="9" rx="1"/><rect x="13.8" y="0" width="3" height="12" rx="1"/></svg>
        <svg width="15" height="12" viewBox="0 0 15 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M1 4.2a9 9 0 0 1 13 0"/><path d="M3.4 6.9a5.6 5.6 0 0 1 8.2 0"/><circle cx="7.5" cy="10" r=".9" fill="currentColor" stroke="none"/></svg>
        <span class="sb-bat"><i></i></span>
      </div>
    </div>
    <div id="app"></div>
  </div>
</div>
<div id="hud" class="off"></div>

<script id="engine">
/* ===========================================================================
 * ENGINE — pure, deterministic, DOM-free.
 *
 * Times are integers: minutes since midnight. Money is integers: pence.
 * The whole timetable is four line definitions; every departure on every
 * screen is arithmetic on (first departure + k x headway + offset along the
 * line), so nothing is stored and nothing can drift.
 * ======================================================================== */
(function(root){
'use strict';

var ENV_ID  = 'larkline_transit';
var VERSION = '1.0.0';
var NOW     = 866;               /* 14:26, frozen: see the note in the head */
var SERVICE_START = 300;         /* 05:00 */
var SERVICE_END   = 1430;        /* 23:50 — last departure from any stop */
var TRANSFER  = 4;               /* minutes allowed to change trains */
var PEAK_END  = 570;             /* 09:30 */

/* ------------------------------------------------------------- utilities */
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function pad2(n){ return (n < 10 ? '0' : '') + n; }
function hhmm(m){ m = ((m % 1440) + 1440) % 1440; return pad2(Math.floor(m/60)) + ':' + pad2(m%60); }
function parseHHMM(s){
  var p = String(s || '').match(/^(\d{1,2}):(\d{2})$/);
  if (!p) return null;
  var h = +p[1], mi = +p[2];
  if (h > 23 || mi > 59) return null;
  return h*60 + mi;
}
function dur(m){
  var h = Math.floor(m/60), r = m%60;
  return h ? (h + 'h ' + pad2(r)) : (r + ' min');
}
function money(p){
  var neg = p < 0; p = Math.abs(p);
  return (neg ? '-' : '') + '£' + Math.floor(p/100) + '.' + pad2(p%100);
}
function lcg(seed){ var s=(seed>>>0)||1; return function(){ s=(s*1664525+1013904223)>>>0; return s/4294967296; }; }
function shuffled(list, seed){
  if (!seed) return list.slice();
  var r = lcg(seed), a = list.slice();
  for (var i=a.length-1;i>0;i--){ var j = Math.floor(r()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
function sum(a){ var s=0; for (var i=0;i<a.length;i++) s+=a[i]; return s; }
function uniq(a){ var seen={}, out=[]; a.forEach(function(x){ if(!seen[x]){seen[x]=1;out.push(x);} }); return out; }

function getPath(o, path){
  var cur = o, parts = String(path).split('.');
  for (var i=0;i<parts.length;i++){
    var k = parts[i], m = k.match(/^(.*?)\[(\d+)\]$/);
    if (m){ cur = cur ? cur[m[1]] : undefined; cur = cur ? cur[+m[2]] : undefined; }
    else cur = cur ? cur[k] : undefined;
    if (cur === undefined) return undefined;
  }
  return cur;
}
function setPath(o, path, value){
  var parts = String(path).split('.'), cur = o;
  for (var i=0;i<parts.length-1;i++){
    var k = parts[i], m = k.match(/^(.*?)\[(\d+)\]$/);
    cur = m ? cur[m[1]][+m[2]] : (cur[k] = cur[k] || {});
  }
  var lastK = parts[parts.length-1], lm = lastK.match(/^(.*?)\[(\d+)\]$/);
  if (lm) cur[lm[1]][+lm[2]] = value; else cur[lastK] = value;
  return o;
}

/* ===========================================================================
 * THE NETWORK
 * ======================================================================== */
var STATIONS = [
  {id:'lk', name:'Larkfield Central', zone:1, stepFree:true,  toilets:true,  bikes:true,
   note:'Main interchange. Blue and Green lines, 6 platforms.'},
  {id:'qy', name:'Quay Street',       zone:1, stepFree:true,  toilets:true,  bikes:false,
   note:'Blue and Coral lines meet under the old fish market.'},
  {id:'ag', name:'Aldergate',         zone:1, stepFree:false, toilets:false, bikes:true,
   note:'Steps only between the Blue and Amber platforms — no lift.'},
  {id:'mb', name:'Mossbank',          zone:2, stepFree:true,  toilets:true,  bikes:true,
   note:'Green and Amber lines, level access from the street.'},
  {id:'bp', name:'Brindle Park',      zone:2, stepFree:true,  toilets:false, bikes:true,
   note:'Green and Coral lines. Ramp to both platforms.'},
  {id:'cs', name:'Cinder Street',     zone:2, stepFree:true,  toilets:false, bikes:false,
   note:'Coral line only, single island platform.'},
  {id:'fl', name:'Foxglove Lane',     zone:2, stepFree:true,  toilets:false, bikes:true,
   note:'Amber line terminus for the eastern suburbs.'},
  {id:'hn', name:'Harbour North',     zone:3, stepFree:true,  toilets:true,  bikes:true,
   note:'Blue line terminus, ferry connection.'},
  {id:'wh', name:'Weaver Hill',       zone:3, stepFree:true,  toilets:false, bikes:false,
   note:'Green line terminus on the ridge.'}
];

/* stops: in the outbound direction. hops[i] = minutes from stops[i] to stops[i+1].
 * first / rfirst are the first departure of the day from each end. */
var LINES = [
  {id:'blue',  name:'Blue line',  colour:'blue',
   stops:['lk','qy','ag','hn'], hops:[4,5,9],  first:364, headway:10, rfirst:369, rheadway:10},
  {id:'green', name:'Green line', colour:'green',
   stops:['lk','mb','bp','wh'], hops:[6,5,7],  first:367, headway:12, rfirst:363, rheadway:12},
  {id:'amber', name:'Amber line', colour:'amber',
   stops:['ag','mb','fl'],      hops:[7,6],    first:371, headway:15, rfirst:366, rheadway:15},
  {id:'coral', name:'Coral line', colour:'coral',
   stops:['qy','cs','bp'],      hops:[8,9],    first:362, headway:20, rfirst:372, rheadway:20}
];

/* Live status. A delay is added to the arrival of any leg on that line; a
 * suspension removes every journey that would ride across the named hop. */
var STATUS0 = [
  {line:'blue',  state:'good',      delay:0, text:'A good service on the whole line.'},
  {line:'green', state:'good',      delay:0, text:'A good service on the whole line.'},
  {line:'amber', state:'delays',    delay:6,
   text:'Minor delays after a signal fault at Mossbank. Trains are running about six minutes late in both directions.'},
  {line:'coral', state:'suspended', delay:0, seg:['cs','bp'],
   text:'No service between Cinder Street and Brindle Park while a bridge inspection is carried out. Trains run Quay Street to Cinder Street only.'}
];

var FARES = {
  single: {z1:230, z12:300, z13:380},
  return: {z1:420, z12:560, z13:720},
  day:    {z1:520, z12:620, z13:780}
};
var PEAK_EXTRA = {single:60, return:100, day:140};
var ZONE_BANDS = [
  {id:'z1',  label:'Zone 1 only', max:1},
  {id:'z12', label:'Zones 1-2',   max:2},
  {id:'z13', label:'Zones 1-3',   max:3}
];
var TICKET_TYPES = [
  {id:'single', label:'Single',      note:'One journey, valid for 90 minutes'},
  {id:'return', label:'Return',      note:'Out and back on the same day'},
  {id:'day',    label:'Day ticket',  note:'Unlimited travel until midnight'}
];

function station(id){ for (var i=0;i<STATIONS.length;i++) if (STATIONS[i].id === id) return STATIONS[i]; return null; }
function sname(id){ var s = station(id); return s ? s.name : '?'; }
function lineOf(id){ for (var i=0;i<LINES.length;i++) if (LINES[i].id === id) return LINES[i]; return null; }
function lname(id){ var l = lineOf(id); return l ? l.name : '?'; }
function statusOf(st, lineId){
  var list = st ? st.status : STATUS0;
  for (var i=0;i<list.length;i++) if (list[i].line === lineId) return list[i];
  return {line:lineId, state:'good', delay:0, text:''};
}
function zoneBand(maxZone){ return maxZone <= 1 ? 'z1' : (maxZone <= 2 ? 'z12' : 'z13'); }
function bandLabel(id){ for (var i=0;i<ZONE_BANDS.length;i++) if (ZONE_BANDS[i].id === id) return ZONE_BANDS[i].label; return id; }
function typeLabel(id){ for (var i=0;i<TICKET_TYPES.length;i++) if (TICKET_TYPES[i].id === id) return TICKET_TYPES[i].label; return id; }
function priceOf(type, band, peak){
  var base = (FARES[type] || {})[band] || 0;
  return base + (peak ? (PEAK_EXTRA[type] || 0) : 0);
}

/* ===========================================================================
 * THE TIMETABLE — everything below is arithmetic on the four line definitions
 * ======================================================================== */
var PLATFORMS = {
  lk:{blue:[1,2], green:[3,4]},
  qy:{blue:[1,2], coral:[3,3]},
  ag:{blue:[1,2], amber:[3,4]},
  mb:{green:[1,2], amber:[3,4]},
  bp:{green:[1,2], coral:[3,3]},
  cs:{coral:[1,2]},
  fl:{amber:[1,1]},
  hn:{blue:[1,2]},
  wh:{green:[1,1]}
};
function platformAt(lineId, dir, stnId){
  var m = PLATFORMS[stnId] || {}, p = m[lineId];
  return p ? p[dir] : 1;
}
function dirStops(line, dir){ return dir ? line.stops.slice().reverse() : line.stops.slice(); }
function dirHops(line, dir){ return dir ? line.hops.slice().reverse() : line.hops.slice(); }
function firstDep(line, dir){ return dir ? line.rfirst : line.first; }
function headwayOf(line, dir){ return dir ? line.rheadway : line.headway; }
function offsetAt(line, dir, idx){ return sum(dirHops(line, dir).slice(0, idx)); }

/* every departure from a stop is first + k*headway + offset, so the k-th one
 * after a given minute is a division, not a search */
function departuresFrom(line, dir, stnId, after, count){
  var stops = dirStops(line, dir), i = stops.indexOf(stnId);
  if (i < 0 || i === stops.length - 1) return [];        /* the terminus has none this way */
  var t0 = firstDep(line, dir) + offsetAt(line, dir, i);
  var h  = headwayOf(line, dir);
  var k  = Math.max(0, Math.ceil((after - t0) / h));
  var out = [];
  for (var n = 0; n < count; n++){
    var t = t0 + (k + n) * h;
    if (t > SERVICE_END) break;
    out.push(t);
  }
  return out;
}
function hopSuspended(st, lineId, a, b){
  var s = statusOf(st, lineId);
  if (s.state !== 'suspended' || !s.seg) return false;
  return (s.seg[0] === a && s.seg[1] === b) || (s.seg[0] === b && s.seg[1] === a);
}
function segmentBlocked(st, line, dir, i, j){
  var stops = dirStops(line, dir);
  for (var k = i; k < j; k++) if (hopSuspended(st, line.id, stops[k], stops[k+1])) return true;
  return false;
}
function makeLeg(st, line, dir, fromId, toId, dep){
  var stops = dirStops(line, dir), hops = dirHops(line, dir);
  var i = stops.indexOf(fromId), j = stops.indexOf(toId);
  var ride  = sum(hops.slice(i, j));
  var delay = statusOf(st, line.id).delay || 0;
  return {line:line.id, dir:dir, from:fromId, to:toId, dep:dep, arr:dep + ride + delay,
          ride:ride, delay:delay, platform:platformAt(line.id, dir, fromId),
          calls:stops.slice(i, j + 1), towards:stops[stops.length - 1]};
}
function maxZoneOf(legs){
  var z = 0;
  legs.forEach(function(l){ l.calls.forEach(function(s){ z = Math.max(z, station(s).zone); }); });
  return z;
}
function makeOption(legs){
  var o = {legs:legs, dep:legs[0].dep, arr:legs[legs.length-1].arr, changes:legs.length - 1};
  o.mins    = o.arr - o.dep;
  o.lines   = legs.map(function(l){ return l.line; });
  o.change  = legs.length > 1 ? legs[0].to : null;
  o.maxZone = maxZoneOf(legs);
  o.band    = zoneBand(o.maxZone);
  o.fare    = priceOf('single', o.band, o.dep < PEAK_END);
  o.delayed = legs.some(function(l){ return l.delay > 0; });
  o.id      = 'j' + o.dep + '_' + o.arr + '_' + o.lines.join('-');
  return o;
}

/* Direct services first, then one change through any station both legs touch. */
function rawOptions(st, from, to, after, count){
  var out = [];
  count = count || 3;
  function eachDir(cb){
    LINES.forEach(function(line){ for (var d = 0; d < 2; d++) cb(line, d, dirStops(line, d)); });
  }
  eachDir(function(line, dir, stops){
    var i = stops.indexOf(from), j = stops.indexOf(to);
    if (i < 0 || j < 0 || j <= i) return;
    if (segmentBlocked(st, line, dir, i, j)) return;
    departuresFrom(line, dir, from, after, count).forEach(function(dep){
      out.push(makeOption([makeLeg(st, line, dir, from, to, dep)]));
    });
  });
  STATIONS.forEach(function(x){
    if (x.id === from || x.id === to) return;
    eachDir(function(l1, d1, s1){
      var a = s1.indexOf(from), b = s1.indexOf(x.id);
      if (a < 0 || b < 0 || b <= a) return;
      if (segmentBlocked(st, l1, d1, a, b)) return;
      eachDir(function(l2, d2, s2){
        if (l2.id === l1.id) return;
        var c = s2.indexOf(x.id), e = s2.indexOf(to);
        if (c < 0 || e < 0 || e <= c) return;
        if (segmentBlocked(st, l2, d2, c, e)) return;
        departuresFrom(l1, d1, from, after, count).forEach(function(dep){
          var leg1 = makeLeg(st, l1, d1, from, x.id, dep);
          var d2s  = departuresFrom(l2, d2, x.id, leg1.arr + TRANSFER, 1);
          if (!d2s.length) return;
          out.push(makeOption([leg1, makeLeg(st, l2, d2, x.id, to, d2s[0])]));
        });
      });
    });
  });
  var seen = {}, uniqOut = [];
  out.forEach(function(o){ if (!seen[o.id]) { seen[o.id] = 1; uniqOut.push(o); } });
  return uniqOut;
}
function sortOptions(list, how){
  var a = list.slice();
  a.sort(function(p, q){
    if (how === 'fastest')  return p.mins - q.mins    || p.arr - q.arr || p.dep - q.dep;
    if (how === 'changes')  return p.changes - q.changes || p.arr - q.arr || p.dep - q.dep;
    if (how === 'latest')   return q.dep - p.dep      || p.arr - q.arr;
    return p.arr - q.arr || q.dep - p.dep || p.changes - q.changes;   /* earliest arrival */
  });
  return a;
}
/* "Step-free" here means the change happens somewhere with a lift, which is
 * what the filter says on screen; it never removes a direct train. */
function stepFreeOk(o){ return !o.change || station(o.change).stepFree; }

function planOptions(st){
  var p = st.plan;
  if (!p.from || !p.to || p.from === p.to) return [];
  var list;
  if (p.mode === 'arrive') {
    list = rawOptions(st, p.from, p.to, p.time - 150, 14)
             .filter(function(o){ return o.arr <= p.time; });
    if (p.stepFree) list = list.filter(stepFreeOk);
    return sortOptions(list, p.sort === 'arrival' ? 'latest' : p.sort).slice(0, 5);
  }
  list = rawOptions(st, p.from, p.to, p.time, 3);
  if (p.stepFree) list = list.filter(stepFreeOk);
  return sortOptions(list, p.sort).slice(0, 5);
}

/* The board is the same arithmetic read the other way round: every departure
 * from one station, whatever line it is on. */
function lastReachable(st, line, dir, i){
  var stops = dirStops(line, dir);
  for (var q = i; q < stops.length - 1; q++)
    if (hopSuspended(st, line.id, stops[q], stops[q+1])) return q;
  return stops.length - 1;
}
function boardFor(st, stnId, count){
  var out = [];
  LINES.forEach(function(line){
    for (var dir = 0; dir < 2; dir++){
      var stops = dirStops(line, dir), i = stops.indexOf(stnId);
      if (i < 0 || i === stops.length - 1) continue;
      var reach = lastReachable(st, line, dir, i);
      var blocked = (reach === i);
      var stat = statusOf(st, line.id);
      departuresFrom(line, dir, stnId, st.meta.clock, 4).forEach(function(dep){
        out.push({line:line.id, dir:dir, dep:dep, towards:stops[reach],
                  next:stops[i+1], platform:platformAt(line.id, dir, stnId),
                  delay:blocked ? 0 : (stat.delay || 0), cancelled:blocked,
                  short:reach < stops.length - 1 && !blocked,
                  inMin:dep - st.meta.clock});
      });
    }
  });
  out.sort(function(a, b){ return a.dep - b.dep || a.line.localeCompare(b.line) || a.dir - b.dir; });
  return out.slice(0, count || 8);
}
function serviceCalls(st, lineId, dir, depFromStation, stnId){
  var line = lineOf(lineId), stops = dirStops(line, dir), hops = dirHops(line, dir);
  var i = stops.indexOf(stnId), t = depFromStation, out = [];
  var delay = statusOf(st, lineId).delay || 0;
  var last = lastReachable(st, line, dir, i);
  for (var k = i; k <= last; k++){
    out.push({station:stops[k], time:t + (k > i ? delay : 0), first:k === i});
    if (k < stops.length - 1) t += hops[k];
  }
  return out;
}

/* ===========================================================================
 * STATE
 * ======================================================================== */
function createInitialState(seed){
  seed = seed || 0;
  return {
    meta:{env:ENV_ID, version:VERSION, seed:seed, clock:NOW, steps:0, finished:false, answer:null},
    plan:{from:'lk', to:null, mode:'depart', time:NOW, sort:'arrival', stepFree:false},
    ui:{tab:'plan', stack:[{name:'plan', params:{}}], sheet:null, confirm:null, inputs:{}, toast:null},
    selected:null,
    saved:[{id:'sv_1', from:'lk', to:'hn', label:'Larkfield Central to Harbour North'},
           {id:'sv_2', from:'mb', to:'lk', label:'Mossbank to Larkfield Central'}],
    /* the seed permutes the order of the favourites and nothing else: same stations, same journeys */
    favourites:shuffled(['lk','qy','mb','hn'], seed),
    boardStation:'lk',
    tickets:[{id:'tk_1', type:'single', band:'z12', peak:true, price:360, status:'expired',
              bought:'Yesterday 08:12', activated:'Yesterday 08:14', expires:'Yesterday 09:44'}],
    draft:{type:'single', band:'z12', peak:false},
    status:clone(STATUS0),
    settings:{stepFreeOnly:false, showCrowding:true, notifyDisruption:true, homeStation:'lk'}
  };
}

function route(st){ return st.ui.stack[st.ui.stack.length - 1]; }
function push(st, name, params){ st.ui.stack.push({name:name, params:params || {}}); st.ui.sheet = null; }
function pop(st){ if (st.ui.stack.length > 1) st.ui.stack.pop(); }
function toast(st, t){ st.ui.toast = t; }
function savedOf(st, id){ for (var i=0;i<st.saved.length;i++) if (st.saved[i].id === id) return st.saved[i]; return null; }
function ticketOf(st, id){ for (var i=0;i<st.tickets.length;i++) if (st.tickets[i].id === id) return st.tickets[i]; return null; }
function isFav(st, id){ return st.favourites.indexOf(id) >= 0; }
function planReady(st){ return !!(st.plan.from && st.plan.to && st.plan.from !== st.plan.to); }
function draftPrice(st){ return priceOf(st.draft.type, st.draft.band, st.draft.peak); }

var SELECT = {
  hhmm:hhmm, dur:dur, money:money, station:station, sname:sname, lineOf:lineOf, lname:lname,
  planOptions:planOptions, boardFor:boardFor, serviceCalls:serviceCalls, statusOf:statusOf,
  route:route, clockStr:function(st){ return hhmm(st.meta ? st.meta.clock : st); },
  priceOf:priceOf, draftPrice:draftPrice, zoneBand:zoneBand, bandLabel:bandLabel,
  typeLabel:typeLabel, planReady:planReady, isFav:isFav, rawOptions:rawOptions
};

/* ===========================================================================
 * REDUCER
 * ======================================================================== */
function reduce(prev, action){
  var st = clone(prev), A = action || {};
  st.ui.toast = null;
  st.meta.steps += 1;

  switch (A.type) {

  case 'NOOP': break;
  case 'FINISH': st.meta.finished = true; st.meta.answer = A.answer === undefined ? null : A.answer; break;

  /* ---- navigation ---- */
  case 'NAV': push(st, A.to, A.params); break;
  case 'BACK':
    if (st.ui.sheet) st.ui.sheet = null;
    else if (st.ui.confirm) st.ui.confirm = null;
    else pop(st);
    break;
  case 'TAB': {
    var roots = {plan:'plan', live:'board', wallet:'wallet', alerts:'alerts'};
    st.ui.tab = A.tab; st.ui.sheet = null; st.ui.confirm = null;
    st.ui.stack = [{name:roots[A.tab] || 'plan', params:{}}];
    break;
  }
  case 'HOME':
    st.ui.tab = 'plan'; st.ui.stack = [{name:'plan', params:{}}];
    st.ui.sheet = null; st.ui.confirm = null;
    break;
  case 'SET_INPUT': st.ui.inputs[A.field] = A.value; break;
  case 'CLOSE_SHEET': st.ui.sheet = null; break;
  case 'CONFIRM_NO': st.ui.confirm = null; break;
  case 'CONFIRM_YES': {
    var yes = st.ui.confirm && st.ui.confirm.yes; st.ui.confirm = null;
    if (yes) { var keep = st.meta.steps; var out = reduce(st, yes); out.meta.steps = keep; return out; }
    break;
  }

  /* ---- planning ---- */
  case 'PICK_OPEN': st.ui.inputs.q_station = ''; push(st, 'picker', {field:A.field}); break;
  case 'PICK_STATION': {
    var f = (route(st).params || {}).field;
    if (f === 'from' || f === 'to') {
      if (st.plan[f === 'from' ? 'to' : 'from'] === A.id) {
        /* choosing the other end swaps rather than making an impossible journey */
        st.plan[f === 'from' ? 'to' : 'from'] = st.plan[f];
      }
      st.plan[f] = A.id;
    }
    else if (f === 'board') st.boardStation = A.id;
    else if (f === 'home')  st.settings.homeStation = A.id;
    pop(st);
    break;
  }
  case 'SWAP_ENDS': {
    var a = st.plan.from; st.plan.from = st.plan.to; st.plan.to = a;
    break;
  }
  case 'PLAN_MODE': st.plan.mode = A.mode; break;
  case 'TIME_STEP': {
    /* the first tap snaps onto the five-minute grid, then it moves in fives */
    var t = Math.round((st.plan.time + A.delta) / 5) * 5;
    st.plan.time = ((t % 1440) + 1440) % 1440;
    break;
  }
  case 'TIME_NOW': st.plan.time = st.meta.clock; st.plan.mode = 'depart'; break;
  case 'SEARCH':
    if (!planReady(st)) { toast(st, 'Choose where you are going first'); break; }
    if (st.settings.stepFreeOnly) st.plan.stepFree = true;
    st.selected = null;
    push(st, 'results', {});
    break;
  case 'SET_SORT': st.plan.sort = A.sort; break;
  case 'TOGGLE_STEPFREE': st.plan.stepFree = !st.plan.stepFree; break;
  case 'OPEN_JOURNEY': {
    var opts = planOptions(st);
    if (!opts[A.index]) { toast(st, 'That option is no longer on the board'); break; }
    st.selected = clone(opts[A.index]);
    push(st, 'journey', {});
    break;
  }

  /* ---- saved journeys and favourites ---- */
  case 'SAVE_JOURNEY': {
    var from = st.plan.from, to = st.plan.to;
    if (!from || !to) { toast(st, 'Nothing to save'); break; }
    var dupe = st.saved.filter(function(s){ return s.from === from && s.to === to; })[0];
    if (dupe) { toast(st, 'Already in your saved journeys'); break; }
    st.saved.push({id:'sv_' + (st.saved.length + 1), from:from, to:to,
                   label:sname(from) + ' to ' + sname(to)});
    toast(st, 'Saved ' + sname(from) + ' to ' + sname(to));
    break;
  }
  case 'DELETE_SAVED': {
    var before = st.saved.length;
    st.saved = st.saved.filter(function(s){ return s.id !== A.id; });
    if (st.saved.length < before) toast(st, 'Removed from saved journeys');
    break;
  }
  case 'RUN_SAVED': {
    var s = savedOf(st, A.id);
    if (!s) break;
    st.plan.from = s.from; st.plan.to = s.to;
    st.plan.mode = 'depart'; st.plan.time = st.meta.clock;
    st.selected = null;
    if (st.settings.stepFreeOnly) st.plan.stepFree = true;
    push(st, 'results', {});
    break;
  }
  case 'FAV_TOGGLE': {
    if (isFav(st, A.id)) {
      st.favourites = st.favourites.filter(function(x){ return x !== A.id; });
      toast(st, sname(A.id) + ' removed from favourites');
    } else {
      st.favourites.push(A.id);
      toast(st, sname(A.id) + ' added to favourites');
    }
    break;
  }

  /* ---- the board ---- */
  case 'BOARD_STATION': st.boardStation = A.id; break;
  case 'BOARD_OPEN':
    st.boardStation = A.id || st.boardStation;
    st.ui.tab = 'live'; st.ui.stack = [{name:'board', params:{}}]; st.ui.sheet = null;
    break;
  case 'PLAN_END': {
    if (A.end === 'from' || A.end === 'to') {
      var other = A.end === 'from' ? 'to' : 'from';
      if (st.plan[other] === A.id) st.plan[other] = st.plan[A.end];
      st.plan[A.end] = A.id;
    }
    st.ui.tab = 'plan'; st.ui.stack = [{name:'plan', params:{}}]; st.ui.sheet = null;
    toast(st, sname(A.id) + ' set as ' + (A.end === 'from' ? 'your starting point' : 'your destination'));
    break;
  }
  case 'OPEN_SERVICE': {
    var d = boardFor(st, st.boardStation, 8)[A.index];
    if (!d) break;
    if (d.cancelled) { toast(st, 'That service is cancelled — see Line status'); break; }
    push(st, 'service', {line:d.line, dir:d.dir, dep:d.dep, from:st.boardStation});
    break;
  }

  /* ---- tickets ---- */
  case 'BUY_OPEN':
    /* a journey can suggest the zones and the fare period; the type stays the
     * user's own choice, and A.type is the action name, not a payload */
    if (A.band) st.draft.band = A.band;
    if (A.peak !== undefined) st.draft.peak = !!A.peak;
    push(st, 'tickets', {});
    break;
  case 'DRAFT_TYPE': st.draft.type = A.id; break;
  case 'DRAFT_BAND': st.draft.band = A.id; break;
  case 'DRAFT_PEAK': st.draft.peak = !st.draft.peak; break;
  case 'BUY_CONFIRM': {
    var price = draftPrice(st);
    var tk = {id:'tk_' + (st.tickets.length + 1), type:st.draft.type, band:st.draft.band,
              peak:st.draft.peak, price:price, status:'unused',
              bought:'Today ' + hhmm(st.meta.clock), activated:null, expires:null};
    st.tickets.push(tk);
    st.ui.tab = 'wallet';
    st.ui.stack = [{name:'wallet', params:{}}];
    toast(st, typeLabel(tk.type) + ', ' + bandLabel(tk.band) + ' — ' + money(price));
    break;
  }
  case 'OPEN_TICKET': push(st, 'ticket', {id:A.id}); break;
  case 'ACTIVATE': {
    var t2 = ticketOf(st, A.id);
    if (!t2 || t2.status !== 'unused') break;
    st.ui.confirm = {title:'Activate this ticket?',
      text:'It starts running now and cannot be paused. ' +
           (t2.type === 'day' ? 'A day ticket runs until midnight.'
                              : 'A ' + typeLabel(t2.type).toLowerCase() + ' is valid for 90 minutes.'),
      okText:'Activate', yes:{type:'ACTIVATE_YES', id:A.id}};
    break;
  }
  case 'ACTIVATE_YES': {
    var t3 = ticketOf(st, A.id);
    if (!t3 || t3.status !== 'unused') break;
    t3.status = 'active';
    t3.activated = 'Today ' + hhmm(st.meta.clock);
    t3.expires = t3.type === 'day' ? 'Today 23:59' : 'Today ' + hhmm(st.meta.clock + 90);
    toast(st, 'Ticket active until ' + t3.expires.replace('Today ', ''));
    break;
  }

  /* ---- settings ---- */
  case 'SET_SETTING': st.settings[A.key] = !st.settings[A.key]; break;

  default: break;
  }
  return st;
}

/* ===========================================================================
 * SCREEN TREE — one declarative tree, read by the renderer, the hit-tester
 * and the text observation alike.
 * ======================================================================== */
function N(t, o){ o = o || {}; o.t = t; return o; }
function txt(s, cls){ return N('text', {text:s, cls:cls || ''}); }
function row(id, text, o){
  o = o || {}; o.id = id; o.text = text;
  if (o.arrow === undefined) o.arrow = !!o.act;
  return N('row', o);
}
function btn(id, text, act, cls, disabled){
  return N('btn', {id:id, text:text, act:act, cls:cls || '', disabled:!!disabled});
}
function iconbtn(id, ic, act, cls){ return N('iconbtn', {id:id, icon:ic, act:act, cls:cls || ''}); }
function appbar(title, o){ o = o || {}; o.title = title; return N('appbar', o); }
function lineTag(id){ var l = lineOf(id); return {id:id, text:l.name.replace(' line', ''), colour:l.colour}; }

function tabbar(st){
  var items = [
    {id:'tab_plan',   text:'Plan',    icon:'route',  tab:'plan'},
    {id:'tab_live',   text:'Live',    icon:'clock',  tab:'live'},
    {id:'tab_wallet', text:'Wallet',  icon:'ticket', tab:'wallet'},
    {id:'tab_alerts', text:'Status',  icon:'alert',  tab:'alerts'}
  ].map(function(i){
    return {id:i.id, text:i.text, icon:i.icon, on:(st.ui.tab === i.tab), act:{type:'TAB', tab:i.tab}};
  });
  return N('tabbar', {id:'tabbar', items:items});
}
function disruptions(st){
  return st.status.filter(function(s){ return s.state !== 'good'; });
}

/* --------------------------------------------------------------- plan */
function scrPlan(st){
  var d = disruptions(st), p = st.plan;
  var body = [];
  if (d.length)
    body.push(N('banner', {id:'alert_banner', icon:'alert',
      title:d.length === 1 ? lname(d[0].line) + ': ' + (d[0].state === 'delays' ? 'minor delays' : 'part suspended')
                           : d.length + ' lines are disrupted',
      sub:'Tap for the full line status.', act:{type:'TAB', tab:'alerts'}}));
  body.push(N('plancard', {id:'plan_card',
    from:{id:'pick_from', label:'FROM', value:p.from ? sname(p.from) : 'Choose a station',
          zone:p.from ? 'Zone ' + station(p.from).zone : '', ghost:!p.from,
          act:{type:'PICK_OPEN', field:'from'}},
    to:  {id:'pick_to',   label:'TO',   value:p.to ? sname(p.to) : 'Choose a station',
          zone:p.to ? 'Zone ' + station(p.to).zone : '', ghost:!p.to,
          act:{type:'PICK_OPEN', field:'to'}},
    swap:{id:'swap_ends', act:{type:'SWAP_ENDS'}}}));
  body.push(N('chips', {id:'plan_modes', c:[
    N('chip', {id:'mode_depart', text:'Leave at',  on:p.mode === 'depart', act:{type:'PLAN_MODE', mode:'depart'}}),
    N('chip', {id:'mode_arrive', text:'Arrive by', on:p.mode === 'arrive', act:{type:'PLAN_MODE', mode:'arrive'}}),
    N('chip', {id:'time_now',    text:'Now',       on:false,               act:{type:'TIME_NOW'}})
  ]}));
  body.push(N('timerow', {id:'time_row', label:p.mode === 'depart' ? 'Leave at' : 'Arrive by',
    value:hhmm(p.time), minusId:'time_dec', plusId:'time_inc',
    minus:{type:'TIME_STEP', delta:-5}, plus:{type:'TIME_STEP', delta:5}}));
  body.push(N('padded', {c:[btn('search_go', 'Find journeys', {type:'SEARCH'}, 'primary block',
                             !planReady(st))]}));
  body.push(N('sec', {text:'Saved journeys', side:st.saved.length + ''}));
  body.push(N('card', {id:'saved_list', cls:'flush', c: st.saved.length
    ? st.saved.map(function(s){
        return row('saved_' + s.id, s.label, {lead:'route',
          sub:'Zone ' + station(s.from).zone + ' to zone ' + station(s.to).zone,
          act:{type:'RUN_SAVED', id:s.id}, arrow:false,
          c:[iconbtn('del_' + s.id, 'close', {type:'DELETE_SAVED', id:s.id})]});
      })
    : [txt('No saved journeys yet.', 'empty')]}));
  body.push(N('sec', {text:'Favourite stations'}));
  body.push(N('card', {id:'fav_list', cls:'flush', c: st.favourites.length
    ? st.favourites.map(function(id){
        return row('fav_' + id, sname(id), {lead:'star',
          sub:'Zone ' + station(id).zone + (station(id).stepFree ? ' · step-free' : ' · steps only'),
          act:{type:'NAV', to:'station', params:{id:id}}});
      })
    : [txt('No favourites yet.', 'empty')]}));
  body.push(N('space', {}));
  return N('screen', {id:'scr_plan', name:'plan', c:[
    appbar('Larkline', {right:[iconbtn('open_settings', 'gear', {type:'NAV', to:'settings'})]}),
    N('scroll', {id:'plan_scroll', c:body}),
    tabbar(st)
  ]});
}

/* ------------------------------------------------------------- picker */
function scrPicker(st, params){
  var q = String(st.ui.inputs.q_station || '').trim().toLowerCase();
  var field = params.field || 'from';
  var titles = {from:'Travelling from', to:'Travelling to', board:'Departure board',
                home:'Home station'};
  var list = STATIONS.filter(function(s){
    if (!q) return true;
    return s.name.toLowerCase().indexOf(q) >= 0 || ('zone ' + s.zone).indexOf(q) === 0;
  });
  var body = [N('inputrow', {id:'q_station', label:'Search', field:'q_station',
    value:st.ui.inputs.q_station || '', placeholder:'Station name',
    act:{type:'SET_INPUT', field:'q_station', value:'$VALUE'}})];
  if (!q && st.favourites.length){
    body.push(N('sec', {text:'Favourites'}));
    body.push(N('card', {id:'pick_favs', cls:'flush', c: st.favourites.map(function(id){
      return row('fav_pick_' + id, sname(id), {lead:'star', val:'Zone ' + station(id).zone,
        act:{type:'PICK_STATION', id:id}});
    })}));
  }
  body.push(N('sec', {text:q ? list.length + ' matching stations' : 'All stations'}));
  body.push(N('card', {id:'pick_list', cls:'flush', c: list.length
    ? list.map(function(s){
        var ls = LINES.filter(function(l){ return l.stops.indexOf(s.id) >= 0; })
                      .map(function(l){ return lineTag(l.id); });
        return row('st_' + s.id, s.name, {lead:'pin', val:'Zone ' + s.zone,
          sub:(s.stepFree ? 'Step-free' : 'Steps only') + ' · ' +
              ls.map(function(t){ return t.text; }).join(', '),
          act:{type:'PICK_STATION', id:s.id}});
      })
    : [txt('No station matches "' + (st.ui.inputs.q_station || '') + '".', 'empty')]}));
  body.push(N('space', {}));
  return N('screen', {id:'scr_picker', name:'picker', params:params, c:[
    appbar(titles[field] || 'Choose a station', {back:true}),
    N('scroll', {id:'picker_scroll', c:body})
  ]});
}

/* ------------------------------------------------------------ results */
function scrResults(st){
  var p = st.plan, opts = planOptions(st);
  var body = [
    txt(sname(p.from) + ' to ' + sname(p.to), 'h1'),
    txt((p.mode === 'depart' ? 'Leaving after ' : 'Arriving by ') + hhmm(p.time) +
        ' · ' + opts.length + (opts.length === 1 ? ' option' : ' options'), 'body'),
    N('chips', {id:'sorts', c:[
      N('chip', {id:'sort_arrival', text:'Earliest arrival', on:p.sort === 'arrival',
        act:{type:'SET_SORT', sort:'arrival'}}),
      N('chip', {id:'sort_fastest', text:'Fastest',          on:p.sort === 'fastest',
        act:{type:'SET_SORT', sort:'fastest'}}),
      N('chip', {id:'sort_changes', text:'Fewest changes',   on:p.sort === 'changes',
        act:{type:'SET_SORT', sort:'changes'}})
    ]}),
    N('card', {id:'filters', cls:'flush', c:[
      row('filter_row', 'Step-free changes only',
        {sub:'Hides anything that changes where there is no lift', arrow:false,
         c:[N('switch', {id:'filter_stepfree', on:p.stepFree, act:{type:'TOGGLE_STEPFREE'}})]})
    ]})
  ];
  if (!opts.length){
    body.push(txt(p.stepFree
      ? 'Nothing step-free on this route at that time. Try turning the filter off.'
      : 'No journeys found. Try a different time.', 'empty'));
  } else {
    opts.forEach(function(o, i){
      body.push(N('jcard', {id:'opt_' + i, best:i === 0,
        dep:hhmm(o.dep), arr:hhmm(o.arr), durText:dur(o.mins),
        lines:o.legs.map(function(l){ return lineTag(l.line); }),
        changes:o.changes, changeAt:o.change ? sname(o.change) : null,
        fare:money(o.fare), delayed:o.delayed,
        act:{type:'OPEN_JOURNEY', index:i}}));
    });
  }
  body.push(N('padded', {c:[btn('edit_search', 'Change the search', {type:'BACK'}, 'block')]}));
  body.push(N('space', {}));
  return N('screen', {id:'scr_results', name:'results', c:[
    appbar('Journeys', {back:true,
      right:[iconbtn('results_save', 'star', {type:'SAVE_JOURNEY'})]}),
    N('scroll', {id:'results_scroll', c:body})
  ]});
}

/* ------------------------------------------------------------ journey */
function scrJourney(st){
  var o = st.selected;
  if (!o) return scrPlan(st);
  var legNodes = o.legs.map(function(l, i){
    return N('leg', {id:'leg_' + i, colour:lineOf(l.line).colour,
      depTime:hhmm(l.dep), arrTime:hhmm(l.arr),
      from:sname(l.from), to:sname(l.to),
      line:lineOf(l.line).name, towards:sname(l.towards),
      platform:l.platform, stops:l.calls.length - 1, ride:l.ride,
      delay:l.delay, act:{type:'NAV', to:'station', params:{id:l.from}}});
  });
  legNodes.push(N('leg', {id:'leg_end', colour:'end', depTime:hhmm(o.arr), arrTime:'',
    from:sname(o.legs[o.legs.length-1].to), to:'', line:'', towards:'', platform:0,
    stops:0, ride:0, delay:0, last:true,
    act:{type:'NAV', to:'station', params:{id:o.legs[o.legs.length-1].to}}}));
  var wait = o.changes ? (o.legs[1].dep - o.legs[0].arr) : 0;
  return N('screen', {id:'scr_journey', name:'journey', c:[
    appbar('Your journey', {back:true}),
    N('scroll', {id:'journey_scroll', c:[
      N('jhead', {id:'journey_head', dep:hhmm(o.dep), arr:hhmm(o.arr), durText:dur(o.mins),
        changes:o.changes === 0 ? 'Direct' : (o.changes + (o.changes === 1 ? ' change' : ' changes')),
        changeAt:o.change ? 'Change at ' + sname(o.change) + ', ' + wait + ' min to connect' : '',
        zone:'Zones 1-' + o.maxZone}),
      N('legs', {id:'leg_list', c:legNodes}),
      N('fare', {id:'journey_fare', title:'Single fare', rows:[
        {k:'Zone band', v:bandLabel(o.band)},
        {k:o.dep < PEAK_END ? 'Peak fare' : 'Off-peak fare', v:money(o.fare)}
      ], totalLabel:'Pay as you go', total:money(o.fare)}),
      N('card', {id:'journey_ops', cls:'flush', c:[
        row('journey_board', 'Live departures from ' + sname(o.legs[0].from),
          {lead:'clock', act:{type:'BOARD_OPEN', id:o.legs[0].from}}),
        row('journey_status', 'Line status', {lead:'alert', act:{type:'TAB', tab:'alerts'},
          val:o.delayed ? 'Delays on this route' : 'Good service', valCls:o.delayed ? 'warn' : 'good'})
      ]}),
      N('btnrow', {id:'journey_btns', c:[
        btn('save_journey', 'Save journey', {type:'SAVE_JOURNEY'}, 'ghost'),
        btn('buy_for_journey', 'Buy a ticket',
            {type:'BUY_OPEN', band:o.band, peak:o.dep < PEAK_END}, 'primary')
      ]}),
      N('space', {})
    ]})
  ]});
}

/* -------------------------------------------------------------- board */
function scrBoard(st){
  var deps = boardFor(st, st.boardStation, 8), s = station(st.boardStation);
  return N('screen', {id:'scr_board', name:'board', c:[
    appbar('Live departures', {right:[iconbtn('board_pick', 'search', {type:'PICK_OPEN', field:'board'})]}),
    N('scroll', {id:'board_scroll', c:[
      N('card', {id:'board_head', cls:'flush', c:[
        row('board_station', s.name, {lead:'pin', sub:'Zone ' + s.zone + ' · tap to change station',
          act:{type:'PICK_OPEN', field:'board'}}),
        row('board_info', 'Station information', {lead:'info',
          act:{type:'NAV', to:'station', params:{id:s.id}}})
      ]}),
      N('board', {id:'board_list', head:['Departs', 'Destination', 'Plat'],
        c: deps.map(function(d, i){
          return N('bdrow', {id:'dep_' + i, time:hhmm(d.dep), towards:sname(d.towards),
            line:lineOf(d.line).name + (d.short ? ' · terminates early' : ''),
            colour:lineOf(d.line).colour,
            platform:d.platform, inMin:d.inMin,
            status:d.cancelled ? 'Cancelled' : (d.delay ? '+' + d.delay + ' min' : 'On time'),
            statusCls:d.cancelled ? 'gone' : (d.delay ? 'late' : ''),
            act:{type:'OPEN_SERVICE', index:i}});
        })}),
      txt('Scheduled departures. A delay shown here is added to every stop after this one.', 'muted'),
      N('space', {})
    ]}),
    tabbar(st)
  ]});
}

/* ------------------------------------------------------------ service */
function scrService(st, params){
  var calls = serviceCalls(st, params.line, params.dir, params.dep, params.from);
  var l = lineOf(params.line), stat = statusOf(st, params.line);
  return N('screen', {id:'scr_service', name:'service', params:params, c:[
    appbar(hhmm(params.dep) + ' service', {back:true}),
    N('scroll', {id:'service_scroll', c:[
      txt(l.name + ' to ' + sname(calls[calls.length-1].station), 'h1'),
      N('pills', {id:'service_pills', items:[
        {text:'Platform ' + platformAt(l.id, params.dir, params.from), cls:''},
        {text:stat.delay ? 'Running ' + stat.delay + ' min late' : 'On time',
         cls:stat.delay ? 'warn' : 'good'},
        {text:calls.length - 1 + ' stops', cls:''}
      ]}),
      N('sec', {text:'Calling at'}),
      N('card', {id:'call_list', cls:'flush', c: calls.map(function(c){
        return row('call_' + c.station, sname(c.station),
          {val:hhmm(c.time), valCls:'strong', lead:c.first ? 'route' : 'pin',
           sub:'Zone ' + station(c.station).zone,
           act:{type:'NAV', to:'station', params:{id:c.station}}});
      })}),
      N('space', {})
    ]})
  ]});
}

/* ------------------------------------------------------------- wallet */
function scrWallet(st){
  var live = st.tickets.filter(function(t){ return t.status !== 'expired'; });
  var body = [
    N('sec', {text:'Your tickets', side:live.length + ' usable'}),
    N('padded', {c:[btn('buy_open', 'Buy a ticket', {type:'BUY_OPEN'}, 'primary block')]})
  ];
  if (st.tickets.length) {
    st.tickets.slice().reverse().forEach(function(t){
      body.push(N('tkt', {id:'ticket_' + t.id, status:t.status,
        name:typeLabel(t.type) + ' \u00b7 ' + bandLabel(t.band),
        state:t.status === 'unused' ? 'Not started' : (t.status === 'active' ? 'Active' : 'Used'),
        meta:(t.peak ? 'Peak' : 'Off-peak') + ' \u00b7 bought ' + t.bought,
        price:money(t.price),
        foot:t.status === 'active' ? 'Valid until ' + t.expires
             : (t.status === 'unused' ? 'Starts when you activate it' : 'Expired ' + t.expires),
        act:{type:'OPEN_TICKET', id:t.id}}));
    });
  } else {
    body.push(txt('Your wallet is empty.', 'empty'));
  }
  body.push(txt('A ticket only starts running once you activate it.', 'muted'));
  body.push(N('space', {}));
  return N('screen', {id:'scr_wallet', name:'wallet', c:[
    appbar('Wallet'),
    N('scroll', {id:'wallet_scroll', c:body}),
    tabbar(st)
  ]});
}

/* ---------------------------------------------------------- buy sheet */
function scrTickets(st){
  var d = st.draft, base = priceOf(d.type, d.band, false), extra = draftPrice(st) - base;
  var rows = [{k:typeLabel(d.type) + ', ' + bandLabel(d.band), v:money(base)}];
  if (d.peak) rows.push({k:'Peak surcharge', v:money(extra)});
  return N('screen', {id:'scr_tickets', name:'tickets', c:[
    appbar('Buy a ticket', {back:true}),
    N('scroll', {id:'tickets_scroll', c:[
      N('sec', {text:'Ticket type'}),
      N('card', {id:'type_list', cls:'flush', c: TICKET_TYPES.map(function(t){
        return row('type_' + t.id, t.label, {sub:t.note, arrow:false,
          act:{type:'DRAFT_TYPE', id:t.id},
          c:[N('radio', {id:'radio_' + t.id, on:d.type === t.id, act:{type:'DRAFT_TYPE', id:t.id}})]});
      })}),
      N('sec', {text:'Zones'}),
      N('card', {id:'zone_list', cls:'flush', c: ZONE_BANDS.map(function(z){
        return row('zone_' + z.id, z.label,
          {sub:'Covers everything up to zone ' + z.max, arrow:false,
           val:money(priceOf(d.type, z.id, d.peak)),
           act:{type:'DRAFT_BAND', id:z.id},
           c:[N('radio', {id:'radiz_' + z.id, on:d.band === z.id, act:{type:'DRAFT_BAND', id:z.id}})]});
      })}),
      N('card', {id:'peak_card', cls:'flush', c:[
        row('peak_row', 'Travelling before 09:30',
          {sub:'Peak fares cost more', arrow:false,
           c:[N('switch', {id:'peak_toggle', on:d.peak, act:{type:'DRAFT_PEAK'}})]})
      ]}),
      N('fare', {id:'buy_fare', title:'Fare', rows:rows,
        totalLabel:'Total', total:money(draftPrice(st))}),
      N('space', {})
    ]}),
    N('bar', {id:'buy_bar', c:[
      btn('buy_now', 'Pay ' + money(draftPrice(st)), {type:'BUY_CONFIRM'}, 'primary block')]})
  ]});
}

/* ------------------------------------------------------------- ticket */
function scrTicket(st, params){
  var t = ticketOf(st, params.id);
  if (!t) return scrWallet(st);
  var body = [
    N('tkt', {id:'ticket_hero', status:t.status,
      name:typeLabel(t.type) + ' · ' + bandLabel(t.band),
      state:t.status === 'unused' ? 'Not started' : (t.status === 'active' ? 'Active' : 'Used'),
      meta:(t.peak ? 'Peak' : 'Off-peak') + ' · bought ' + t.bought,
      price:money(t.price),
      foot:t.status === 'active' ? 'Valid until ' + t.expires
           : (t.status === 'unused' ? 'Starts when you activate it' : 'Expired ' + t.expires)})
  ];
  if (t.status === 'active') body.push(N('qr', {id:'ticket_qr', seed:t.id + t.price}));
  body.push(N('card', {id:'ticket_facts', cls:'flush', c:[
    row('fact_type', 'Type', {val:typeLabel(t.type), arrow:false}),
    row('fact_zones', 'Zones', {val:bandLabel(t.band), arrow:false}),
    row('fact_peak', 'Fare', {val:t.peak ? 'Peak' : 'Off-peak', arrow:false}),
    row('fact_price', 'Paid', {val:money(t.price), valCls:'strong', arrow:false}),

var ROUTES = {
  plan:scrPlan, picker:scrPicker, results:scrResults, journey:scrJourney,

function screen(st){

/* =======================================================================
 * TRAVERSAL — element index, GUI action interface, text observation

var SKIP_KEYS = {act:1, minus:1, plus:1, close:1, yes:1, params:1, meta:1, calls:1, seg:1};

function labelOf(n){ return n.text || n.title || n.name || n.label || n.value || ''; }

function collect(n, out){
  if (!n || typeof n !== 'object') return;
  if (Array.isArray(n)) { for (var i=0;i<n.length;i++) collect(n[i], out); return; }
  if (n.t === 'appbar' && n.back) out.push({id:'nav_back', act:{type:'BACK'}, text:'Back', t:'back'});
  if (n.id && n.act)              out.push({id:n.id, act:n.act, text:labelOf(n), t:n.t||'el',
                                            disabled:!!n.disabled,
                                            input:(n.t === 'inputrow')});
  if (n.t === 'mask' && n.close)  out.push({id:n.id, act:n.close, text:'Dismiss overlay', t:'mask'});
  if (n.minusId && n.minus)       out.push({id:n.minusId, act:n.minus, text:'earlier', t:'step'});
  if (n.plusId  && n.plus)        out.push({id:n.plusId,  act:n.plus,  text:'later',   t:'step'});
  if (n.closeId && n.close)       out.push({id:n.closeId, act:n.close, text:'Close', t:'btn'});
  for (var k in n){
    if (SKIP_KEYS[k]) continue;
    var v = n[k];
    if (v && typeof v === 'object') collect(v, out);

function elements(st){
  var rootNode = (st && st.t === 'screen') ? st : screen(st);
  var masks = (rootNode.c || []).filter(function(n){ return n.t === 'mask'; });
  var out = [];
  collect(masks.length ? masks[masks.length-1] : rootNode, out);
  return out;
}
function findEl(st, id){
  var els = elements(st);
  for (var i=0;i<els.length;i++) if (els[i].id === id) return els[i];
  return null;
}
function substitute(act, text){
  var a = clone(act);
  for (var k in a) if (a[k] === '$VALUE') a[k] = text;
  return a;
}
function step(st, a){
  a = a || {};
  var kind = a.action || a.type;
  switch (kind) {
  case 'tap': {
    var el = findEl(st, a.id);
    if (!el) return {state:st, ok:false, error:'ELEMENT_NOT_FOUND: ' + a.id};
    if (el.disabled) return {state:st, ok:false, error:'ELEMENT_DISABLED: ' + a.id};
    return {state:reduce(st, el.act), ok:true};
  }
  case 'type': {
    var e2 = findEl(st, a.id);
    if (!e2) return {state:st, ok:false, error:'ELEMENT_NOT_FOUND: ' + a.id};
    if (!e2.input) return {state:st, ok:false, error:'NOT_A_TEXT_FIELD: ' + a.id};
    return {state:reduce(st, substitute(e2.act, a.text == null ? '' : String(a.text))), ok:true};
  }
  case 'back':   return {state:reduce(st, {type:'BACK'}), ok:true};
  case 'home':   return {state:reduce(st, {type:'HOME'}), ok:true};
  case 'wait':   return {state:reduce(st, {type:'NOOP'}), ok:true};
  case 'finish': return {state:reduce(st, {type:'FINISH', answer:a.answer}), ok:true};
  case 'raw':    return {state:reduce(st, a.act || {}), ok:true};

}

/* ------------------------------------------------- text observation (a11y) */
function a11y(st){
  var rootNode = screen(st), lines = [], r = route(st), p = st.plan;
  lines.push('# Screen route=' + r.name + (r.params && r.params.id ? '(' + r.params.id + ')' : '') +
             '  clock ' + hhmm(st.meta.clock) + '  step ' + st.meta.steps);
  lines.push('# Plan: ' + (p.from ? sname(p.from) : '(nowhere)') + ' to ' +
             (p.to ? sname(p.to) : '(nowhere)') + ', ' +
             (p.mode === 'depart' ? 'leave at ' : 'arrive by ') + hhmm(p.time) +
             ', sorted by ' + p.sort + (p.stepFree ? ', step-free only' : ''));
  var masks = (rootNode.c || []).filter(function(n){ return n.t === 'mask'; });
  if (masks.length) lines.push('# An overlay is open. Nothing behind it can be tapped.');
  walkText(masks.length ? masks[masks.length-1] : rootNode, 0, lines, st);
  (rootNode.c || []).forEach(function(n){ if (n.t === 'toast') lines.push('[Toast] ' + n.text); });
  return lines.join('\n');
}
function tid(n){ return (n && n.id && n.act) ? ' #' + n.id : ''; }
function ind(d){ return new Array(d+1).join('  '); }

function walkText(n, d, out, st){
  if (!n || typeof n !== 'object') return;
  if (Array.isArray(n)) { n.forEach(function(x){ walkText(x, d, out, st); }); return; }
  var line = null;
  switch (n.t) {
  case 'screen': break;
  case 'appbar': line = '[AppBar] ' + (n.title || '') + (n.back ? '   Back #nav_back' : ''); break;
  case 'iconbtn': line = '[IconButton]' + tid(n) + ' ' + n.icon; break;
  case 'inputrow':
    line = '[TextField]' + tid(n) + ' ' + (n.label || '') + ' value="' + (n.value || '') + '"'; break;
  case 'chip':   line = '[Chip]' + tid(n) + ' ' + n.text + (n.on ? '  [selected]' : ''); break;
  case 'btn':    line = '[Button]' + (n.id ? ' #' + n.id : '') + ' ' + n.text + (n.disabled ? ' (disabled)' : ''); break;
  case 'row': {
    var s = '[Row]' + tid(n) + ' ' + (n.text || '');
    if (n.val) s += ' — ' + n.val;
    if (n.sub) s += '   (' + n.sub + ')';
    line = s; break;
  }
  case 'switch': line = '[Toggle]' + tid(n) + ' ' + (n.on ? 'ON' : 'OFF'); break;
  case 'radio':  line = '[Radio]' + tid(n) + ' ' + (n.on ? 'selected' : 'not selected'); break;
  case 'banner': line = '[Alert]' + tid(n) + ' ' + n.title + ' — ' + n.sub; break;
  case 'plancard':
    out.push(ind(d) + '[From] #' + n.from.id + ' ' + n.from.value + (n.from.zone ? ' (' + n.from.zone + ')' : ''));
    out.push(ind(d) + '[To]   #' + n.to.id + ' ' + n.to.value + (n.to.zone ? ' (' + n.to.zone + ')' : ''));
    out.push(ind(d) + '[Swap the two ends] #' + n.swap.id);
    return;
  case 'timerow':
    out.push(ind(d) + '[Time] ' + n.label + ' ' + n.value +
             '   5 min earlier #' + n.minusId + '   5 min later #' + n.plusId);
    return;
  case 'jcard':
    out.push(ind(d) + '[Journey]' + tid(n) + ' ' + n.dep + ' -> ' + n.arr + ', ' + n.durText + ', ' +
             (n.changes ? n.changes + ' change at ' + n.changeAt : 'direct') + ', ' +
             n.lines.map(function(l){ return l.text; }).join(' then ') + ', ' + n.fare +
             (n.delayed ? ', includes a delay' : '') + (n.best ? '  [first on the list]' : ''));
    return;
  case 'jhead':
    out.push(ind(d) + '[Summary] ' + n.dep + ' -> ' + n.arr + ', ' + n.durText + ', ' + n.changes +
             (n.changeAt ? '. ' + n.changeAt : '') + '. ' + n.zone);
    return;
  case 'leg':
    if (n.last) { out.push(ind(d) + '[Arrive]' + tid(n) + ' ' + n.depTime + ' ' + n.from); return; }
    out.push(ind(d) + '[Leg]' + tid(n) + ' ' + n.depTime + ' ' + n.from + ' -> ' + n.arrTime + ' ' + n.to +
             ' on the ' + n.line + ' towards ' + n.towards + ', platform ' + n.platform +
             ', ' + n.stops + (n.stops === 1 ? ' stop' : ' stops') +
             (n.delay ? ', running ' + n.delay + ' min late' : ''));
    return;
  case 'board':
    out.push(ind(d) + '[DepartureBoard] ' + n.head.join(' / '));
    break;
  case 'bdrow':
    out.push(ind(d+1) + '[Departure]' + tid(n) + ' ' + n.time + ' ' + n.line + ' to ' + n.towards +
             ', platform ' + n.platform + ', ' + n.status + ', in ' + n.inMin + ' min');
    return;
  case 'fare':
    out.push(ind(d) + '[Fare] ' + n.title);
    n.rows.forEach(function(r){ out.push(ind(d+1) + r.k + ': ' + r.v); });
    out.push(ind(d+1) + n.totalLabel + ': ' + n.total);
    return;
  case 'tkt':
    out.push(ind(d) + '[Ticket]' + tid(n) + ' ' + n.name + ' — ' + n.state + ', ' + n.price +
             '. ' + n.meta + '. ' + n.foot);
    return;
  case 'qr':      line = '[Barcode] shown at the gateline'; break;
  case 'pills':   line = n.items.map(function(p){ return '[' + p.text + ']'; }).join(' '); break;
  case 'sec':     line = '— ' + n.text + (n.side ? ' (' + n.side + ')' : '') + ' —'; break;
  case 'text':    line = n.text || null; break;
  case 'tabbar':
    out.push(ind(d) + '[TabBar] ' + n.items.map(function(i){
      return i.text + ' #' + i.id + (i.on ? '[current]' : ''); }).join('  '));
    return;
  case 'sheet':   line = '[Sheet] ' + n.title + '   close #' + n.closeId; break;
  case 'dialog':  line = '[Dialog] ' + (n.title ? n.title + ' — ' : '') + n.text; break;
  case 'mask': case 'toast': line = null; break;
  default:        line = null;
  }
  if (line !== null) out.push(ind(d) + line);
  for (var k in n){
    if (SKIP_KEYS[k]) continue;
    var v = n[k];
    if (v && typeof v === 'object') walkText(v, line !== null ? d+1 : d, out, st);
  }
}

/* --------------------------------------------------------- derived view */
function optView(o){
  if (!o) return null;
  return {depart:hhmm(o.dep), arrive:hhmm(o.arr), minutes:o.mins, changes:o.changes,
          lines:o.lines.map(lname), changeAt:o.change ? sname(o.change) : null,
          fare:o.fare, band:o.band, maxZone:o.maxZone, delayed:!!o.delayed,

          platform:o.legs[0].platform};
}

  var last = st.tickets.length ? st.tickets[st.tickets.length-1] : null;
  function tv(t){
    return t ? {type:t.type, zones:t.band, peak:!!t.peak, price:t.price, status:t.status,
                label:typeLabel(t.type) + ' · ' + bandLabel(t.band)} : null;
  }
  return {
    route: route(st).name,
    tab: st.ui.tab,
    plan: {from:st.plan.from ? sname(st.plan.from) : null,
           to:st.plan.to ? sname(st.plan.to) : null,
           mode:st.plan.mode, time:hhmm(st.plan.time), sort:st.plan.sort,
           stepFree:!!st.plan.stepFree},
    optionCount: opts.length,
    options: opts.map(optView),
    selected: optView(st.selected),
    savedCount: st.saved.length,
    savedLabels: st.saved.map(function(s){ return s.label; }),
    favourites: st.favourites.map(sname),
    boardStation: sname(st.boardStation),
    nextDeparture: board.length
      ? {time:hhmm(board[0].dep), line:lname(board[0].line), towards:sname(board[0].towards),
         platform:board[0].platform, cancelled:!!board[0].cancelled}
      : null,
    ticketCount: st.tickets.length,
    usableTickets: live.length,
    activeTickets: st.tickets.filter(function(t){ return t.status === 'active'; }).length,
    tickets: st.tickets.map(tv),
    lastTicket: tv(last),
    walletSpend: st.tickets.reduce(function(a, t){ return a + (t.status === 'expired' ? 0 : t.price); }, 0),
    disruptedLines: st.status.filter(function(s){ return s.state !== 'good'; }).map(function(s){ return lname(s.line); }),
    settings: clone(st.settings),
    finished: !!st.meta.finished,
    answer: st.meta.answer

}
function snapshot(st){ var o = clone(st); o.derived = derive(st); return o; }
function applyPatch(st, patch){
  (patch || []).forEach(function(p){ setPath(st, p.path, clone(p.value)); });
  return st;
}

var ENGINE = {
  ENV_ID: ENV_ID, VERSION: VERSION,
  CATALOG: {stations:STATIONS, lines:LINES, fares:FARES},
  createInitialState: createInitialState,
  reduce: reduce, step: step, screen: screen, a11y: a11y,
  elements: elements, findEl: findEl, applyPatch: applyPatch,
  getPath: getPath, setPath: setPath, clone: clone,
  derive: derive, snapshot: snapshot,
  select: SELECT

root.LARKLINE_ENGINE = ENGINE;
root.GUI_ENGINE      = ENGINE;
