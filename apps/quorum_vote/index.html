<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Quorum (mocked GUI env)</title>
<!--
  ============================================================================
  Quorum — a single-file H5 ranked-ballot app for agent research.

  Same two-block contract as every environment here: script#engine is a pure,
  DOM-free state machine on globalThis.GUI_ENGINE; script#ui renders its screen
  tree and exposes window.__ENV__.

  What is new: the answer is the fixed point of a process, not a lookup. Twenty
  ballots are already in, grouped into six blocs, and the app runs an instant
  runoff over them — count the first preferences, eliminate the lowest, move
  those ballots to their next surviving choice, repeat. Yours is the twenty-
  first ballot, and it is drawn up by ranking candidates rather than picking
  one, so the app re-runs the whole count every time the order changes.

  On these twenty ballots the last round is a dead heat, ten to ten, which
  makes one ballot decisive. Not, however, in the way it looks: who you put
  first is often irrelevant, because your ballot ends up wherever your later
  preferences send it once your earlier ones are knocked out. Ranking the same
  candidate first can elect either finalist depending on who you put second.
  ============================================================================
-->
<style>
:root{
  --outer:#e3e6ee;
  --bezel:#12151f;
  --bg:#f2f2f0;
  --card:#ffffff;
  --card2:#f2f4f9;
  --line:#dcdcd8;
  --line2:#111111;
  --press:#eaeae6;
  --chev:#b6b6b2;
  --ink:#111111;
  --ink2:#4a4a48;
  --muted:#82827e;
  --accent:#c8102e;
  --accent-d:#9c0c23;
  --accent-s:#fbe9ec;
  --on-accent:#ffffff;
  --good:#0f6b3f;
  --good-s:#e6f1ec;
  --warn:#8a6100;
  --warn-s:#f7efdc;
  --bad:#c8102e;
  --bad-s:#fbe9ec;
  --bad-line:#e8c3ca;
  --btn:#eaeae6;
  --btn-off:#dedeD9;
  --off:#c0c0bb;
  --appbar:#ffffff;
  --appbar-ink:#161a27;
  --appbar-line:#111111;
  --tabbar:#ffffff;
  --scrim:rgba(17,17,17,.4);
  --toast:#111111;
  --toast-ink:#ffffff;
  --hero:linear-gradient(140deg,#111111,#39393a);
  --hero-line:transparent;
  --hero-ink:#ffffff;
  --disp:"Helvetica Neue",Helvetica,Arial,sans-serif;
  --r:18px; --r2:12px;
  --shadow:0 1px 2px rgba(16,18,26,.05),0 10px 26px rgba(16,18,26,.07);
  --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{background:var(--outer);color:var(--ink);font:14px/1.55 var(--ui);
  display:flex;align-items:center;justify-content:center;overflow:hidden}

#device{position:relative;width:390px;height:844px;background:var(--bezel);border-radius:46px;padding:5px;
  box-shadow:0 30px 70px rgba(0,0,0,.34);flex:0 0 auto}
#screen{position:relative;width:100%;height:100%;background:var(--bg);border-radius:41px;
  overflow:hidden;display:flex;flex-direction:column}
#notch{position:absolute;top:5px;left:50%;transform:translateX(-50%);width:118px;height:30px;
  background:var(--bezel);border-radius:0 0 18px 18px;z-index:60}
body.bare{background:var(--bg)}
body.bare #device{width:390px;height:844px;padding:0;border-radius:0;box-shadow:none;background:var(--bg)}
body.bare #screen{border-radius:0}
body.bare #notch{display:none}
body.bare .n-sheet{animation:none}

.statusbar{height:44px;flex:0 0 44px;display:flex;align-items:flex-end;justify-content:space-between;
  padding:0 22px 6px;font-size:13px;font-weight:600;z-index:50;color:var(--ink)}
.statusbar .sb-r{display:flex;gap:5px;align-items:center}
.sb-bat{width:22px;height:11px;border:1.3px solid currentColor;border-radius:3px;position:relative;opacity:.9}
.sb-bat:after{content:"";position:absolute;right:-3px;top:3px;width:2px;height:5px;background:currentColor;border-radius:0 1px 1px 0}
.sb-bat i{position:absolute;left:1.3px;top:1.3px;bottom:1.3px;width:78%;background:currentColor;border-radius:1px}

#app{flex:1 1 auto;display:flex;flex-direction:column;min-height:0;position:relative}

.n-appbar{flex:0 0 auto;min-height:52px;display:flex;align-items:center;gap:8px;padding:6px 12px;
  background:var(--appbar);color:var(--appbar-ink);z-index:20;border-bottom:1px solid var(--appbar-line)}
.n-appbar .ab-title{flex:1 1 auto;text-align:center;font:650 17px/1.3 var(--disp);letter-spacing:-.2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.n-appbar .ab-side{flex:0 0 auto;min-width:56px;display:flex;align-items:center;gap:2px}
.n-appbar .ab-side.right{justify-content:flex-end}
.n-appbar .iconbtn{color:var(--appbar-ink);opacity:.85}
.iconbtn{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  color:var(--ink2);cursor:pointer}
.iconbtn:active{background:var(--press)}

.n-scroll{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;padding-bottom:10px}
.n-scroll::-webkit-scrollbar{width:0}

.n-text{padding:2px 18px;color:var(--ink2)}
.n-text.h1{font:700 26px/1.18 var(--disp);color:var(--ink);padding:10px 18px 6px;letter-spacing:-.6px}
.n-text.h2{font:650 18px/1.3 var(--disp);color:var(--ink);padding:12px 18px 2px}
.n-text.body{font-size:13.5px;padding:5px 18px;line-height:1.7}
.n-text.muted{font-size:12.5px;color:var(--muted);padding:6px 18px;line-height:1.6}
.n-text.empty{padding:14px 18px 40px;text-align:center;color:var(--muted);font-size:13.5px}
.n-sec{padding:18px 18px 6px;font:700 11.5px/1 var(--ui);color:var(--muted);letter-spacing:1.3px;
  text-transform:uppercase;display:flex;justify-content:space-between;align-items:center;gap:10px}
.n-space{height:16px}

.n-card{background:var(--card);border-radius:var(--r);margin:9px 16px;overflow:hidden;border:1px solid var(--line)}
.n-card.flush{padding:0}
.n-card.pad{padding:14px 16px}
.n-card.tap{cursor:pointer}
.n-card.tap:active{background:var(--press)}

.n-row{display:flex;align-items:center;gap:13px;padding:12px 16px;border-bottom:1px solid var(--line);min-height:54px}
.n-row:last-child{border-bottom:none}
.n-row.tap{cursor:pointer}
.n-row.tap:active{background:var(--press)}
.n-row .r-lead{flex:0 0 auto;width:26px;color:var(--ink2);display:flex;align-items:center;justify-content:center}
.n-row .r-main{flex:1 1 auto;min-width:0}
.n-row .r-label{font-size:14.5px}
.n-row .r-label.strike{text-decoration:line-through;color:var(--muted)}
.n-row .r-sub{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.5}
.n-row .r-value{flex:0 0 auto;font-size:14px;color:var(--ink2);text-align:right;font-variant-numeric:tabular-nums}
.n-row .r-value.strong{color:var(--ink);font-weight:700}
.n-row .r-value.acc{color:var(--accent);font-weight:700}
.n-row .r-value.good{color:var(--good);font-weight:700}
.n-row .r-value.warn{color:var(--warn);font-weight:700}
.n-row .r-value.bad{color:var(--bad);font-weight:700}
.n-row .r-arrow{flex:0 0 auto;color:var(--chev);display:flex}

.n-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:47px;padding:0 20px;
  border-radius:13px;font:650 15px/1 var(--ui);background:var(--btn);color:var(--ink);
  border:none;cursor:pointer;user-select:none}
.n-btn:active{filter:brightness(.97)}
.n-btn.primary{background:var(--accent);color:var(--on-accent)}
.n-btn.primary.off{background:var(--btn-off);color:var(--muted);cursor:not-allowed}
.n-btn.ghost{background:transparent;border:1px solid var(--line2);height:37px;font-size:13px;padding:0 14px;color:var(--ink2)}
.n-btn.danger{background:transparent;border:1px solid var(--bad-line);color:var(--bad);height:37px;font-size:13px;padding:0 14px}
.n-btn.block{display:flex;width:100%}
.n-btnrow{display:flex;gap:10px;padding:12px 16px;justify-content:flex-end;align-items:center;flex-wrap:wrap}

.n-chips{display:flex;gap:8px;padding:8px 16px;overflow-x:auto}
.n-chips::-webkit-scrollbar{height:0}
.n-chip{flex:0 0 auto;height:34px;padding:0 14px;border-radius:11px;background:var(--card);
  border:1px solid var(--line2);display:flex;align-items:center;font-size:13px;
  color:var(--ink2);cursor:pointer;white-space:nowrap;font-weight:600}
.n-chip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}

.n-input{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line);background:var(--card)}
.n-input .i-label{flex:0 0 78px;font-size:13px;color:var(--muted)}
.n-input input{flex:1 1 auto;border:none;outline:none;background:transparent;font-size:14.5px;
  font-family:inherit;color:var(--ink);min-width:0}
.n-input input::placeholder{color:var(--muted)}
.n-switch{flex:0 0 auto;width:46px;height:27px;border-radius:14px;background:var(--off);position:relative;cursor:pointer;transition:background .16s}
.n-switch.on{background:var(--accent)}
.n-switch i{position:absolute;top:2.5px;left:2.5px;width:22px;height:22px;border-radius:50%;background:#fff;
  transition:transform .16s;box-shadow:0 1px 3px rgba(0,0,0,.22)}
.n-switch.on i{transform:translateX(19px)}
.n-check{flex:0 0 auto;width:23px;height:23px;border-radius:7px;border:1.8px solid var(--off);position:relative;background:var(--card)}
.n-check.on{border-color:var(--accent);background:var(--accent)}
.n-check.on:after{content:"";position:absolute;left:7.5px;top:4px;width:5px;height:10px;
  border:2px solid var(--on-accent);border-top:0;border-left:0;transform:rotate(42deg)}
.n-radio{flex:0 0 auto;width:22px;height:22px;border-radius:50%;border:1.8px solid var(--off);position:relative}
.n-radio.on{border-color:var(--accent);background:var(--accent)}
.n-radio.on:after{content:"";position:absolute;left:7px;top:4px;width:5px;height:9px;
  border:2px solid var(--on-accent);border-top:0;border-left:0;transform:rotate(42deg)}

.tag{display:inline-flex;align-items:center;padding:3px 9px;border-radius:20px;font-size:11px;
  font-weight:700;background:var(--btn);color:var(--ink2)}
.tag.acc{background:var(--accent-s);color:var(--accent)}
.tag.good{background:var(--good-s);color:var(--good)}
.tag.warn{background:var(--warn-s);color:var(--warn)}
.tag.bad{background:var(--bad-s);color:var(--bad)}

.n-tabbar{flex:0 0 auto;height:58px;background:var(--tabbar);border-top:1px solid var(--line);display:flex;z-index:30}
.n-tabbar .tb{flex:1 1 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--muted);font-size:10.5px;cursor:pointer;font-weight:600}
.n-tabbar .tb i{display:flex}
.n-tabbar .tb.on{color:var(--accent)}

.n-mask{position:absolute;inset:0;background:var(--scrim);z-index:70;display:flex;align-items:flex-end}
.n-sheet{width:100%;max-height:80%;background:var(--card);border-radius:22px 22px 0 0;display:flex;
  flex-direction:column;overflow:hidden;animation:up .18s ease-out}
@keyframes up{from{transform:translateY(24px)}to{transform:none}}
.n-sheet .sh-hd{padding:16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.n-sheet .sh-hd .t{font:650 17px/1.2 var(--disp)}
.n-sheet .sh-bd{flex:1 1 auto;overflow-y:auto;min-height:0}
.n-sheet .sh-bd::-webkit-scrollbar{width:0}
.n-toast{position:absolute;left:50%;bottom:118px;transform:translateX(-50%);background:var(--toast);
  color:var(--toast-ink);padding:11px 18px;border-radius:11px;font-size:13px;z-index:90;max-width:84%;text-align:center}
.dialog{margin:auto;width:82%;background:var(--card);border-radius:18px;overflow:hidden;border:1px solid var(--line)}

.stats{display:flex;gap:9px;padding:4px 16px}
.stat{flex:1 1 0;background:var(--card);border:1px solid var(--line);border-radius:var(--r2);padding:13px 12px}
.stat.tap{cursor:pointer}
.stat .st-n{font:800 19px/1.1 var(--disp);letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.stat .st-l{font-size:11px;color:var(--muted);margin-top:6px;line-height:1.4}
.stat.acc .st-n{color:var(--accent)}

.hero{margin:8px 16px 4px;padding:18px;border-radius:var(--r);background:var(--hero);
  border:1px solid var(--hero-line);color:var(--hero-ink)}
.hero.tap{cursor:pointer}
.hero .he-k{font-size:11px;letter-spacing:1.3px;text-transform:uppercase;font-weight:800;opacity:.85}
.hero .he-t{font:800 25px/1.16 var(--disp);margin-top:9px;letter-spacing:-.7px}
.hero .he-s{font-size:13px;margin-top:8px;line-height:1.6;opacity:.9}


.n-card{border-color:var(--line)}
.bal{margin:0 16px;border:2px solid var(--line2);background:var(--card);border-radius:2px;
  overflow:hidden}
.bal-h{padding:12px 14px;border-bottom:2px solid var(--line2);
  font:700 10.5px/1 var(--ui);letter-spacing:2px;text-transform:uppercase}
.bl-r{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line)}
.bl-r:last-child{border-bottom:none}
.bl-box{flex:0 0 auto;width:34px;height:34px;border:2px solid var(--line2);border-radius:2px;
  display:flex;align-items:center;justify-content:center;font:700 15px/1 var(--disp);
  cursor:pointer;background:var(--card)}
.bl-box.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.bl-box:active{background:var(--press)}
.bl-m{flex:1 1 auto;min-width:0}
.bl-n{font-size:14.5px;font-weight:700}
.bl-s{font-size:11.5px;color:var(--muted);margin-top:3px}
.bl-mv{flex:0 0 auto;display:flex;gap:5px}
.bl-mv div{width:27px;height:27px;border:1px solid var(--line);border-radius:2px;display:flex;
  align-items:center;justify-content:center;cursor:pointer;color:var(--ink2)}
.bl-mv div:active{background:var(--press)}
.bal-f{padding:11px 14px;border-top:2px solid var(--line2);font-size:11.5px;color:var(--ink2);
  background:var(--btn)}

.rnd{margin:0 16px;border:1px solid var(--line);background:var(--card);overflow-x:auto}
.rnd table{border-collapse:collapse;width:100%;min-width:330px}
.rnd th,.rnd td{padding:8px 9px;font-size:12px;text-align:right;border-bottom:1px solid var(--line);
  font-variant-numeric:tabular-nums}
.rnd th{font:700 9.5px/1.3 var(--ui);letter-spacing:.9px;text-transform:uppercase;color:var(--muted);
  border-bottom:2px solid var(--line2)}
.rnd td.nm,.rnd th.nm{text-align:left;font-weight:600;font-size:12.5px;white-space:nowrap}
.rnd td.out{color:var(--muted);text-decoration:line-through}
.rnd td.win{background:var(--good-s);color:var(--good);font-weight:800}
.rnd td.gone{color:var(--chev)}
.rnd tr.elim td.nm{color:var(--bad)}
.rnd .tr{font-size:10px;color:var(--accent);display:block;margin-top:2px}

.tally{margin:0 16px}
.ty-r{display:flex;align-items:center;gap:11px;padding:8px 0}
.ty-n{flex:0 0 96px;font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap}
.ty-b{flex:1 1 auto;height:19px;background:var(--btn);border-radius:2px;overflow:hidden}
.ty-b i{display:block;height:100%;background:var(--line2)}
.ty-b i.lead{background:var(--accent)}
.ty-b i.win{background:var(--good)}
.ty-v{flex:0 0 auto;font:700 13px/1 var(--disp);font-variant-numeric:tabular-nums;min-width:44px;
  text-align:right}
.ty-q{border-top:1px dashed var(--line2);margin-top:9px;padding-top:9px;font-size:11.5px;
  color:var(--ink2)}

.verd{margin:12px 16px;padding:16px;border:2px solid var(--line2);background:var(--card)}
.verd .vd-k{font:700 10px/1 var(--ui);letter-spacing:2px;text-transform:uppercase;color:var(--muted)}
.verd .vd-n{font:800 25px/1.15 var(--disp);margin-top:10px;letter-spacing:-.5px}
.verd .vd-s{font-size:12.5px;color:var(--ink2);margin-top:9px;line-height:1.6}
.verd.void{border-color:var(--accent);background:var(--accent-s)}
.verd.void .vd-n{color:var(--accent)}

</style>
</head>
<body>
<div id="device">
  <div id="notch"></div>
  <div id="screen">
    <div class="statusbar" id="sb">
      <div id="sb-clock">20:12</div>
      <div class="sb-r">
        <svg width="17" height="12" viewBox="0 0 17 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="4.6" y="5.5" width="3" height="6.5" rx="1"/><rect x="9.2" y="3" width="3" height="9" rx="1"/><rect x="13.8" y="0" width="3" height="12" rx="1"/></svg>
        <svg width="15" height="12" viewBox="0 0 15 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M1 4.2a9 9 0 0 1 13 0"/><path d="M3.4 6.9a5.6 5.6 0 0 1 8.2 0"/><circle cx="7.5" cy="10" r=".9" fill="currentColor" stroke="none"/></svg>
        <span class="sb-bat"><i></i></span>
      </div>
    </div>
    <div id="app"></div>
  </div>
</div>
<div id="hud" class="off"></div>

<script id="engine">
/* ===========================================================================
 * ENGINE — pure, deterministic, DOM-free.
 * Every count is re-run from the ballots on every action. Elimination
 * ties break on round-one first preferences, then on the name.
 * ======================================================================== */
(function(root){
'use strict';

var ENV_ID  = 'quorum_vote';
var VERSION = '1.0.0';

/* ------------------------------------------------------------- utilities */
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function pad2(n){ return (n < 10 ? '0' : '') + n; }
function hhmm(m){ m = ((m % 1440) + 1440) % 1440; return pad2(Math.floor(m/60)) + ':' + pad2(m%60); }
function sum(a){ var s = 0; for (var i=0;i<a.length;i++) s += a[i]; return s; }
function clamp(v, lo, hi){ return v < lo ? lo : (v > hi ? hi : v); }
function lcg(seed){ var s=(seed>>>0)||1; return function(){ s=(s*1664525+1013904223)>>>0; return s/4294967296; }; }
function shuffled(list, seed){
  if (!seed) return list.slice();
  var r = lcg(seed), a = list.slice();
  for (var i=a.length-1;i>0;i--){ var j = Math.floor(r()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
function money(p, sym){
  var neg = p < 0; p = Math.abs(p);
  return (neg ? '-' : '') + (sym === undefined ? '\u00a3' : sym) +
         (Math.floor(p/100)).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',') + '.' + pad2(p%100);
}
function getPath(o, path){
  var cur = o, parts = String(path).split('.');
  for (var i=0;i<parts.length;i++){
    var k = parts[i], m = k.match(/^(.*?)\[(\d+)\]$/);
    if (m){ cur = cur ? cur[m[1]] : undefined; cur = cur ? cur[+m[2]] : undefined; }
    else cur = cur ? cur[k] : undefined;
    if (cur === undefined) return undefined;
  }
  return cur;
}
function setPath(o, path, value){
  var parts = String(path).split('.'), cur = o;
  for (var i=0;i<parts.length-1;i++){
    var k = parts[i], m = k.match(/^(.*?)\[(\d+)\]$/);
    cur = m ? cur[m[1]][+m[2]] : (cur[k] = cur[k] || {});
  }
  var lastK = parts[parts.length-1], lm = lastK.match(/^(.*?)\[(\d+)\]$/);
  if (lm) cur[lm[1]][+lm[2]] = value; else cur[lastK] = value;
  return o;
}

/* ------------------------------------------- screen-tree node constructors */
function N(t, o){ o = o || {}; o.t = t; return o; }
function txt(s, cls){ return N('text', {text:s, cls:cls || ''}); }
function row(id, text, o){
  o = o || {}; o.id = id; o.text = text;
  if (o.arrow === undefined) o.arrow = !!o.act;
  return N('row', o);
}
function btn(id, text, act, cls, disabled){
  return N('btn', {id:id, text:text, act:act, cls:cls || '', disabled:!!disabled});
}
function iconbtn(id, ic, act, cls){ return N('iconbtn', {id:id, icon:ic, act:act, cls:cls || ''}); }
function appbar(title, o){ o = o || {}; o.title = title; return N('appbar', o); }
function stepper(id, value, minus, plus){
  return N('stepper', {id:id, value:value, minusId:id + '_dec', plusId:id + '_inc',
                       minus:minus, plus:plus});
}
function sheet(id, title, kids){
  return N('sheet', {id:id, title:title, closeId:id + '_close', close:{type:'CLOSE_SHEET'}, c:kids});
}
function route(st){ return st.ui.stack[st.ui.stack.length - 1]; }
function push(st, name, params){ st.ui.stack.push({name:name, params:params || {}}); st.ui.sheet = null; }
function pop(st){ if (st.ui.stack.length > 1) st.ui.stack.pop(); }
function toast(st, t){ st.ui.toast = t; }

/* -------------------------------------------------------- the candidates */
var CANDS = [
  {id:'c_bain',  name:'Morag Bain',   role:'Chair since 2019',
   blurb:'Wants the roof fund left alone and the bin store rebuilt.'},
  {id:'c_owusu', name:'Esi Owusu',    role:'Treasurer',
   blurb:'Would put the roof fund into the courtyard and raise the levy.'},
  {id:'c_wei',   name:'Tan Wei',      role:'Block C rep',
   blurb:'Roof first, courtyard later, no rise in the levy.'},
  {id:'c_raman', name:'Priya Raman',  role:'Stood last year',
   blurb:'Wants the whole thing put to a second vote in the autumn.'},
  {id:'c_fen',   name:'Jude Fenwick', role:'New',
   blurb:'Says the committee should meet in the evening, not at four.'}
];
function candOf(id){ for (var i=0;i<CANDS.length;i++) if (CANDS[i].id === id) return CANDS[i]; return null; }
function candName(id){ var c = candOf(id); return c ? c.name : id; }

/* twenty ballots already cast, grouped so the arithmetic can be checked by eye */
var BLOCS = [
  {id:'b1', n:6, order:['c_bain', 'c_fen',   'c_raman'], who:'Block A, the long-standing lot'},
  {id:'b2', n:3, order:['c_owusu','c_wei',   'c_raman'], who:'Courtyard group'},
  {id:'b3', n:2, order:['c_owusu','c_bain',  'c_wei'],   who:'Courtyard group, older flats'},
  {id:'b4', n:4, order:['c_wei',  'c_owusu', 'c_raman'], who:'Block C'},
  {id:'b5', n:3, order:['c_raman','c_wei',   'c_fen'],   who:'Second-vote group'},
  {id:'b6', n:2, order:['c_fen',  'c_bain',  'c_owusu'], who:'Evening-meeting group'}
];
var QUORUM = 21;

/* ---------------------------------------------------------- the counting */
function allBallots(st){
  var out = [];
  BLOCS.forEach(function(b){ out.push({n:b.n, order:b.order, mine:false}); });
  if (st.submitted && st.ballot.length)
    out.push({n:1, order:st.ballot.slice(), mine:true});
  return out;
}
function previewBallots(st){
  var out = [];
  BLOCS.forEach(function(b){ out.push({n:b.n, order:b.order, mine:false}); });
  if (st.ballot.length) out.push({n:1, order:st.ballot.slice(), mine:true});
  return out;
}
function firstPrefs(ballots){
  var f = {};
  CANDS.forEach(function(c){ f[c.id] = 0; });
  ballots.forEach(function(b){ if (b.order.length) f[b.order[0]] += b.n; });
  return f;
}
/* fewest votes goes out; ties break on round-one first preferences, then on
 * the name, so the whole thing is deterministic without a coin */
function worstOf(count, alive, first){
  var worst = null;
  alive.forEach(function(id){
    if (worst === null) { worst = id; return; }
    if (count[id] < count[worst]) { worst = id; return; }
    if (count[id] === count[worst]) {
      if (first[id] < first[worst]) { worst = id; return; }
      if (first[id] === first[worst] && candName(id) < candName(worst)) worst = id;
    }
  });
  return worst;
}
function betterOf(count, a, b, first){
  if (count[a] !== count[b]) return count[a] > count[b] ? a : b;
  if (first[a] !== first[b]) return first[a] > first[b] ? a : b;
  return candName(a) < candName(b) ? a : b;
}
function runCount(ballots){
  var first = firstPrefs(ballots);
  var alive = CANDS.map(function(c){ return c.id; });
  var rounds = [], out = [], guard = 0, winner = null, byTieBreak = false;
  while (guard++ < 12) {
    var count = {}, exhausted = 0;
    alive.forEach(function(id){ count[id] = 0; });
    ballots.forEach(function(b){
      var i, placed = false;
      for (i = 0; i < b.order.length; i++)
        if (alive.indexOf(b.order[i]) >= 0) { count[b.order[i]] += b.n; placed = true; break; }
      if (!placed) exhausted += b.n;
    });
    var active = 0;
    alive.forEach(function(id){ active += count[id]; });
    var need = Math.floor(active / 2) + 1;
    var lead = null;
    alive.forEach(function(id){ if (lead === null || count[id] > count[lead]) lead = id; });
    var rec = {count:clone(count), alive:alive.slice(), active:active, need:need,
               exhausted:exhausted, eliminated:null, transfers:{}};
    if (count[lead] >= need) {
      rec.winner = lead; rounds.push(rec); winner = lead; break;
    }
    if (alive.length <= 2) {
      var w = betterOf(count, alive[0], alive[1], first);
      rec.winner = w; rec.tieBreak = count[alive[0]] === count[alive[1]];
      byTieBreak = rec.tieBreak; rounds.push(rec); winner = w; break;
    }
    var gone = worstOf(count, alive, first);
    rec.eliminated = gone;
    /* where that candidate's ballots go next */
    var nextAlive = alive.filter(function(id){ return id !== gone; });
    ballots.forEach(function(b){
      var i, cur = null;
      for (i = 0; i < b.order.length; i++)
        if (alive.indexOf(b.order[i]) >= 0) { cur = b.order[i]; break; }
      if (cur !== gone) return;
      var to = null;
      for (i = 0; i < b.order.length; i++)
        if (nextAlive.indexOf(b.order[i]) >= 0) { to = b.order[i]; break; }
      var key = to || 'exhausted';
      rec.transfers[key] = (rec.transfers[key] || 0) + b.n;
    });
    rounds.push(rec);
    out.push(gone);
    alive = nextAlive;
  }
  return {rounds:rounds, winner:winner, order:out, first:first, byTieBreak:byTieBreak,
          turnout:sum(ballots.map(function(b){ return b.n; }))};
}
function preview(st){ return runCount(previewBallots(st)); }
function official(st){ return runCount(allBallots(st)); }
function turnout(st){ return 20 + (st.submitted && st.ballot.length ? 1 : 0); }
function hasQuorum(st){ return turnout(st) >= QUORUM; }
function rankOf(st, id){ var i = st.ballot.indexOf(id); return i < 0 ? 0 : i + 1; }
function pct(n, d){ return d > 0 ? Math.round(n * 1000 / d) / 10 : 0; }

/* =========================================================== state */
function createInitialState(seed){
  seed = seed || 0;
  return {
    meta:{env:ENV_ID, version:VERSION, seed:seed, steps:0, finished:false, answer:null},
    ballot:[],                       /* your preferences, in order */
    submitted:false,
    /* the seed permutes the order the candidates are printed on the paper */
    order:shuffled(CANDS.map(function(c){ return c.id; }), seed),
    ui:{tab:'ballot', stack:[{name:'ballot', params:{}}], sheet:null, confirm:null, inputs:{},
        toast:null, round:0},
    settings:{showTransfers:true, showPercent:false, notifyResult:true}
  };
}
var SELECT = {
  candOf:candOf, candName:candName, runCount:runCount, preview:preview, official:official,
  previewBallots:previewBallots, allBallots:allBallots, firstPrefs:firstPrefs,
  turnout:turnout, hasQuorum:hasQuorum, rankOf:rankOf, blocs:BLOCS, cands:CANDS,
  quorum:QUORUM, route:route
};

/* =========================================================== reducer */
function reduce(prev, action){
  var st = clone(prev), A = action || {};
  st.ui.toast = null;
  st.meta.steps += 1;

  function locked(st){
    if (st.submitted) { toast(st, 'Your ballot is in. Withdraw it first if you want to change it.'); return true; }
    return false;
  }
  function said(st){
    var p = preview(st);
    if (!st.ballot.length) return 'Ballot cleared';
    return 'On this ballot ' + candName(p.winner) + ' takes it';
  }

  switch (A.type) {

  case 'NOOP': break;
  case 'FINISH': st.meta.finished = true; st.meta.answer = A.answer === undefined ? null : A.answer; break;

  case 'NAV': push(st, A.to, A.params); break;
  case 'BACK':
    if (st.ui.sheet) st.ui.sheet = null;
    else if (st.ui.confirm) st.ui.confirm = null;
    else pop(st);
    break;
  case 'TAB': {
    var roots = {ballot:'ballot', rounds:'rounds', who:'who', settings:'settings'};
    st.ui.tab = A.tab; st.ui.sheet = null; st.ui.confirm = null;
    st.ui.stack = [{name:roots[A.tab] || 'ballot', params:{}}];
    break;
  }
  case 'HOME':
    st.ui.tab = 'ballot'; st.ui.stack = [{name:'ballot', params:{}}];
    st.ui.sheet = null; st.ui.confirm = null;
    break;
  case 'SET_INPUT': st.ui.inputs[A.field] = A.value; break;
  case 'OPEN_SHEET': st.ui.sheet = {type:A.sheet, id:A.id || null}; break;
  case 'CLOSE_SHEET': st.ui.sheet = null; break;
  case 'CONFIRM_NO': st.ui.confirm = null; break;
  case 'CONFIRM_YES': {
    var yes = st.ui.confirm && st.ui.confirm.yes; st.ui.confirm = null;
    if (yes) { var keep = st.meta.steps; var out = reduce(st, yes); out.meta.steps = keep; return out; }
    break;
  }
  case 'ROUND': st.ui.round = A.n; break;

  /* ---- filling the paper in ---- */
  case 'RANK': {
    if (locked(st)) break;
    var i = st.ballot.indexOf(A.id);
    if (i >= 0) { st.ballot.splice(i, 1); toast(st, candName(A.id) + ' taken off the paper'); }
    else { st.ballot.push(A.id); toast(st, candName(A.id) + ' is your number '
                                              + st.ballot.length + '. ' + said(st)); }
    break;
  }
  case 'MOVE_UP': {
    if (locked(st)) break;
    var j = st.ballot.indexOf(A.id);
    if (j <= 0) { toast(st, j === 0 ? candName(A.id) + ' is already first' : ''); break; }
    st.ballot[j] = st.ballot[j-1]; st.ballot[j-1] = A.id;
    toast(st, candName(A.id) + ' up to number ' + j + '. ' + said(st));
    break;
  }
  case 'MOVE_DOWN': {
    if (locked(st)) break;
    var k = st.ballot.indexOf(A.id);
    if (k < 0 || k === st.ballot.length - 1) break;
    st.ballot[k] = st.ballot[k+1]; st.ballot[k+1] = A.id;
    toast(st, candName(A.id) + ' down to number ' + (k + 2) + '. ' + said(st));
    break;
  }
  case 'CLEAR': {
    if (locked(st)) break;
    if (!st.ballot.length) { toast(st, 'The paper is already blank'); break; }
    st.ui.confirm = {title:'Start the paper again?', text:'Every preference you have marked goes.',
      okText:'Clear it', yes:{type:'CLEAR_YES'}};
    break;
  }
  case 'CLEAR_YES': st.ballot = []; toast(st, 'Ballot cleared'); break;

  /* ---- putting it in the box ---- */
  case 'SUBMIT': {
    if (st.submitted) { toast(st, 'It is already in the box'); break; }
    if (!st.ballot.length) { toast(st, 'A blank paper cannot be counted — mark at least one'); break; }
    var p = preview(st);
    st.ui.confirm = {title:'Put this ballot in?',
      text:'Ranked ' + st.ballot.map(candName).join(', then ') + '. On these papers that elects '
           + candName(p.winner) + '.',
      okText:'Cast it', yes:{type:'SUBMIT_YES'}};
    break;
  }
  case 'SUBMIT_YES': {
    st.submitted = true;
    var o = official(st);
    toast(st, 'Ballot cast — ' + candName(o.winner) + ' is elected on '
              + o.rounds.length + ' rounds');
    st.ui.tab = 'rounds'; st.ui.stack = [{name:'rounds', params:{}}];
    break;
  }
  case 'WITHDRAW': {
    if (!st.submitted) { toast(st, 'You have not cast it yet'); break; }
    st.ui.confirm = {title:'Take your ballot back out?',
      text:'The count drops to twenty papers, which is one short of the quorum.',
      okText:'Withdraw it', yes:{type:'WITHDRAW_YES'}};
    break;
  }
  case 'WITHDRAW_YES':
    st.submitted = false;
    toast(st, 'Withdrawn — twenty papers counted, one short of quorum');
    break;

  case 'SET_TOGGLE': st.settings[A.key] = !st.settings[A.key]; break;

  default: break;
  }
  return st;
}

/* =========================================================== screens */
function tabbar(st){
  var items = [
    {id:'tab_ballot',   text:'Ballot',   icon:'check',  tab:'ballot'},
    {id:'tab_rounds',   text:'Count',    icon:'chart',  tab:'rounds'},
    {id:'tab_who',      text:'Standing', icon:'user',   tab:'who'},
    {id:'tab_settings', text:'Poll',     icon:'gear',   tab:'settings'}
  ].map(function(i){
    return {id:i.id, text:i.text, icon:i.icon, on:(st.ui.tab === i.tab), act:{type:'TAB', tab:i.tab}};
  });
  return N('tabbar', {id:'tabbar', items:items});
}
function verdict(st){
  var p = preview(st), o = official(st);
  if (!st.submitted)
    return N('verd', {id:'verdict', void:!st.ballot.length,
      kicker:st.ballot.length ? 'If you cast this paper' : 'Nothing marked yet',
      name:st.ballot.length ? candName(p.winner) + ' takes it'
                            : turnout(st) + ' papers, ' + QUORUM + ' needed',
      sub:st.ballot.length
        ? p.rounds.length + ' rounds, finishing ' + p.rounds[p.rounds.length-1].count[p.winner]
          + ' to ' + secondPlace(p)
          + '. Nothing is counted until you put the paper in.'
        : 'Twenty papers are in and the poll needs twenty-one to stand. On those twenty the last '
          + 'round is a dead heat, so the tie-break decides it — your paper does not have to be '
          + 'a tie-break.'});
  return N('verd', {id:'verdict', void:!hasQuorum(st), kicker:'Result',
    name:candName(o.winner) + ' is elected',
    sub:o.rounds.length + ' rounds from ' + o.turnout + ' papers'
        + (o.byTieBreak ? ', on the tie-break' : '')
        + '. Quorum is ' + QUORUM + ' and ' + (hasQuorum(st) ? 'it is met' : 'it is not met')
        + '.'});
}
function secondPlace(res){
  var last = res.rounds[res.rounds.length-1], best = null;
  last.alive.forEach(function(id){
    if (id === res.winner) return;
    if (best === null || last.count[id] > last.count[best]) best = id;
  });
  return best ? last.count[best] : 0;
}
function ballotCard(st){
  var rows = st.order.map(function(id){
    var c = candOf(id), r = rankOf(st, id);
    return {id:'mark_' + id, name:c.name, sub:c.role + ' · ' + c.blurb, rank:r,
      act:{type:'RANK', id:id},
      upId:r > 1 ? 'up_' + id : null, up:r > 1 ? {type:'MOVE_UP', id:id} : null,
      downId:(r > 0 && r < st.ballot.length) ? 'down_' + id : null,
      down:(r > 0 && r < st.ballot.length) ? {type:'MOVE_DOWN', id:id} : null};
  });
  return N('bal', {id:'ballot_paper', head:'Committee chair — mark in order of preference',
    rows:rows, locked:st.submitted,
    foot:st.submitted
      ? 'Cast. ' + (st.ballot.length ? st.ballot.map(candName).join(' → ') : 'blank')
      : (st.ballot.length ? 'Your order: ' + st.ballot.map(candName).join(' → ')
                          : 'Tap a box to mark a first preference. You may rank as many as you like.')});
}

function scrBallot(st){
  return N('screen', {id:'scr_ballot', name:'ballot', c:[
    appbar('Quorum'),
    N('scroll', {id:'ballot_scroll', c:[
      verdict(st),
      ballotCard(st),
      N('padded', {c:[btn('clear_ballot', 'Start again', {type:'CLEAR'}, 'block',
                          st.submitted || !st.ballot.length)]}),
      N('padded', {c:[st.submitted
        ? btn('withdraw', 'Take my ballot back out', {type:'WITHDRAW'}, 'danger block')
        : btn('submit', 'Put it in the box', {type:'SUBMIT'}, 'primary block',
              !st.ballot.length)]}),
      N('sec', {text:'What is already in'}),
      N('card', {id:'bloc_list', cls:'flush', c: BLOCS.map(function(b){
        return row('bloc_' + b.id, b.n + ' × ' + b.order.map(candName).join(' → '),
          {lead:'list', sub:b.who, arrow:false});
      }).concat([row('bloc_total', 'Twenty papers in the box', {lead:'info',
        sub:'quorum is ' + QUORUM + ', so yours is the one that makes it count',
        val:turnout(st) + '/' + QUORUM, valCls:hasQuorum(st) ? 'good' : 'bad', arrow:false})])}),
      N('space', {})
    ]}),
    tabbar(st)
  ]});
}

function scrRounds(st){
  var res = st.submitted ? official(st) : preview(st);
  var live = !st.submitted;
  var n = Math.min(st.ui.round, res.rounds.length - 1);
  var rec = res.rounds[n];
  var lead = null;
  rec.alive.forEach(function(id){ if (lead === null || rec.count[id] > rec.count[lead]) lead = id; });
  return N('screen', {id:'scr_rounds', name:'rounds', c:[
    appbar(live ? 'Count, if you cast it' : 'The count'),
    N('scroll', {id:'rounds_scroll', c:[
      verdict(st),
      N('sec', {text:'Round by round', side:res.rounds.length + ' rounds'}),
      N('rnd', {id:'round_table', cands:CANDS.map(function(c){ return c.name; }),
        ids:CANDS.map(function(c){ return c.id; }),
        showTransfers:st.settings.showTransfers,
        rounds:res.rounds.map(function(r, i){
          return {n:i + 1, need:r.need, active:r.active, exhausted:r.exhausted,
            eliminated:r.eliminated, winner:r.winner || null,
            count:CANDS.map(function(c){
              return r.alive.indexOf(c.id) >= 0 ? r.count[c.id] : null;
            }),
            transfer:CANDS.map(function(c){ return r.transfers[c.id] || 0; })};
        })}),
      N('chips', {id:'round_chips', c: res.rounds.map(function(r, i){
        return N('chip', {id:'rd_' + (i+1), text:'Round ' + (i+1), on:n === i,
          act:{type:'ROUND', n:i}});
      })}),
      N('sec', {text:'Round ' + (n + 1) + (rec.eliminated ? ' — ' + candName(rec.eliminated)
                                                            + ' goes out'
                                                          : ' — decided')}),
      N('tally', {id:'tally', rows:rec.alive.map(function(id){
          return {name:candName(id), v:rec.count[id],
            pctText:st.settings.showPercent ? pct(rec.count[id], rec.active) + '%'
                                            : rec.count[id] + '',
            w:rec.active > 0 ? Math.round(rec.count[id] * 100 / rec.active) : 0,
            lead:id === lead, win:rec.winner === id};
        }),
        quota:'A majority of the ' + rec.active + ' live papers is ' + rec.need
              + (rec.exhausted ? '. ' + rec.exhausted + ' paper' + (rec.exhausted > 1 ? 's have' : ' has')
                                 + ' run out of preferences.' : '.')}),
      N('sec', {text:'Where the eliminated went'}),
      N('card', {id:'elim_list', cls:'flush', c: res.order.length
        ? res.order.map(function(id, i){
            var r = res.rounds[i];
            var to = [];
            CANDS.forEach(function(c){ if (r.transfers[c.id]) to.push(r.transfers[c.id] + ' to ' + c.name); });
            if (r.transfers.exhausted) to.push(r.transfers.exhausted + ' ran out');
            return row('gone_' + id, candName(id),
              {lead:'close', sub:'out in round ' + (i+1) + ' on ' + r.count[id] + ' — '
                 + (to.length ? to.join(', ') : 'nowhere to go'),
               act:{type:'NAV', to:'cand', params:{id:id}}});
          })
        : [txt('Nobody has been eliminated.', 'empty')]}),
      N('space', {})
    ]}),
    tabbar(st)
  ]});
}

function scrWho(st){
  var res = preview(st);
  var first = res.first;
  return N('screen', {id:'scr_who', name:'who', c:[
    appbar('Standing'),
    N('scroll', {id:'who_scroll', c:[
      N('sec', {text:'Five candidates'}),
      N('card', {id:'cand_list', cls:'flush', c: st.order.map(function(id){
        var c = candOf(id);
        return row('cand_' + id, c.name,
          {lead:'user', sub:c.role + ' · ' + first[id] + ' first preferences'
             + (rankOf(st, id) ? ' · your number ' + rankOf(st, id) : ''),
           val:rankOf(st, id) ? '#' + rankOf(st, id) : '', valCls:'acc',
           act:{type:'NAV', to:'cand', params:{id:id}}});
      })}),
      N('sec', {text:'First preferences on the twenty papers'}),
      N('tally', {id:'first_tally', rows:CANDS.map(function(c){
          var f = firstPrefs(previewBallots(st))[c.id];
          return {name:c.name, v:f, pctText:f + '', w:Math.round(f * 100 / turnout(st) || 0),
                  lead:false, win:false};
        }),
        quota:'Leading on first preferences is not the same as winning. It is not, here.'}),
      N('space', {})
    ]}),
    tabbar(st)
  ]});
}

function scrCand(st, params){
  var c = candOf(params.id);
  if (!c) return scrWho(st);
  var res = preview(st);
  var mine = rankOf(st, c.id);
  var firstN = res.first[c.id];
  var outRound = res.order.indexOf(c.id);
  var supporters = BLOCS.filter(function(b){ return b.order[0] === c.id; });
  return N('screen', {id:'scr_cand', name:'cand', params:params, c:[
    appbar(c.name, {back:true}),
    N('scroll', {id:'cand_scroll', c:[
      N('hero', {id:'cand_hero', kicker:c.role.toUpperCase(), title:c.name, sub:c.blurb}),
      N('stats', {id:'cand_stats', c:[
        N('stat', {id:'st_first', n:firstN + '', l:'first preferences'}),
        N('stat', {id:'st_out', n:outRound >= 0 ? 'R' + (outRound + 1)
                                                : (res.winner === c.id ? 'wins' : 'final'),
                   l:outRound >= 0 ? 'knocked out' : 'as it stands',
                   acc:res.winner === c.id}),
        N('stat', {id:'st_mine', n:mine ? '#' + mine : '—', l:'on your paper', acc:!!mine})
      ]}),
      N('padded', {c:[btn('mark_here_' + c.id, mine ? 'Take off my paper' : 'Mark on my paper',
                          {type:'RANK', id:c.id}, mine ? 'block' : 'primary block',
                          st.submitted)]}),
      N('sec', {text:'Papers led by this candidate'}),
      N('card', {id:'sup_list', cls:'flush', c: supporters.length
        ? supporters.map(function(b){
            return row('sup_' + b.id, b.n + ' papers', {lead:'list',
              sub:b.who + ' — then ' + b.order.slice(1).map(candName).join(', then '),
              arrow:false});
          })
        : [txt('No bloc leads with this candidate.', 'empty')]}),
      N('sec', {text:'Papers that would come here next'}),
      N('card', {id:'next_list', cls:'flush', c: (function(){
        var rows = BLOCS.filter(function(b){ return b.order.indexOf(c.id) > 0; });
        return rows.length ? rows.map(function(b){
          return row('nx_' + b.id, b.n + ' papers at number ' + (b.order.indexOf(c.id) + 1),
            {lead:'arrow', sub:b.order.map(candName).join(' → '), arrow:false});
        }) : [txt('Nobody has this candidate as a later preference.', 'empty')];
      })()}),
      N('space', {})
    ]})

      + (n.avatar ? avatarHtml(n.avatar) : '')
      + (n.thumb && typeof thumbHtml === 'function' ? thumbHtml(n.thumb) : '')
      + '<div class="r-main"><div class="r-label' + (n.strike?' strike':'') + '">' + esc(n.text) + '</div>'
      + (n.sub ? '<div class="r-sub">' + esc(n.sub) + '</div>' : '') + '</div>'
      + (n.val ? '<div class="r-value ' + esc(n.valCls||'') + '">' + esc(n.val) + '</div>' : '')
      + R(inline)
      + (n.arrow && !inline.length ? '<div class="r-arrow">' + icon('arrow',15) + '</div>' : '')
      + '</div>' + R(below);
  }
  case 'btn':
    return '<div class="n-btn ' + esc(n.cls||'') + (n.disabled?' off':'') + '"' + tid(n.id)
      + (n.disabled?'':bind(n.act)) + '>' + esc(n.text) + '</div>';
  case 'btnrow': return '<div class="n-btnrow"' + tid(n.id) + '>' + R(n.c) + '</div>';
  case 'bar':    return '<div style="flex:0 0 auto;background:var(--card);border-top:1px solid var(--line);'
                      + 'padding:12px 16px 16px;z-index:30"' + tid(n.id) + '>' + R(n.c) + '</div>';
  case 'switch': return '<div class="n-switch' + (n.on?' on':'') + '"' + tid(n.id) + bind(n.act) + '><i></i></div>';
  case 'check':  return '<div class="n-check' + (n.on?' on':'') + '"' + tid(n.id) + bind(n.act) + '></div>';
  case 'radio':  return '<div class="n-radio' + (n.on?' on':'') + '"' + tid(n.id) + bind(n.act) + '></div>';
  case 'inputrow':
    return '<div class="n-input"><div class="i-label">' + esc(n.label) + '</div>'
      + '<input' + tid(n.id) + bindT(n.act) + ' value="' + esc(n.value) + '" placeholder="'
      + esc(n.placeholder) + '"></div>';
  case 'stepper':
    return '<div style="display:flex;align-items:center;gap:8px"' + tid(n.id) + '>'
      + '<div class="iconbtn" style="background:var(--btn);width:30px;height:30px"' + tid(n.minusId) + bind(n.minus) + '>' + icon('minus',14) + '</div>'
      + '<div style="min-width:52px;text-align:center;font-weight:700;font-size:12.5px;font-variant-numeric:tabular-nums">'
      + esc(n.value) + '</div>'
      + '<div class="iconbtn" style="background:var(--btn);width:30px;height:30px"' + tid(n.plusId) + bind(n.plus) + '>' + icon('plus',14) + '</div></div>';
  case 'stats':  return '<div class="stats"' + tid(n.id) + '>' + R(n.c) + '</div>';
  case 'stat':
    return '<div class="stat' + (n.acc?' acc':'') + (n.act?' tap':'') + '"' + tid(n.id) + bind(n.act)
      + '><div class="st-n">' + esc(n.n) + '</div><div class="st-l">' + esc(n.l) + '</div></div>';
  case 'hero':
    return '<div class="hero' + (n.act?' tap':'') + '"' + tid(n.id) + bind(n.act) + '>'
      + '<div class="he-k">' + esc(n.kicker) + '</div>'
      + '<div class="he-t">' + esc(n.title) + '</div>'
      + '<div class="he-s">' + esc(n.sub) + '</div>' + R(n.c) + '</div>';
  case 'pills':
    return '<div style="display:flex;gap:7px;flex-wrap:wrap;padding:8px 18px 4px"' + tid(n.id) + '>'
      + tagsHtml(n.items) + '</div>';
  case 'tabbar':
    return '<div class="n-tabbar"' + tid(n.id) + '>' + n.items.map(function(i){
      return '<div class="tb' + (i.on?' on':'') + '"' + tid(i.id) + bind(i.act) + '>'
        + '<i>' + icon(i.icon, 21) + '</i>' + esc(i.text) + '</div>';
    }).join('') + '</div>';
  case 'mask':  return '<div class="n-mask"' + tid(n.id) + bind(n.close) + '>' + R(n.c) + '</div>';
  case 'sheet':
    return '<div class="n-sheet"' + tid(n.id) + ' data-stop="1"><div class="sh-hd">'
      + '<div class="t">' + esc(n.title) + '</div>'
      + '<div class="iconbtn"' + tid(n.closeId) + bind(n.close) + '>' + icon('close',15) + '</div></div>'
      + '<div class="sh-bd">' + R(n.c) + '</div></div>';
  case 'dialog':
    return '<div class="dialog"' + tid(n.id) + ' data-stop="1">'
      + '<div style="padding:22px 20px 16px;text-align:center">'
      + (n.title ? '<div style="font:650 17px/1.3 var(--disp);margin-bottom:8px">' + esc(n.title) + '</div>' : '')
      + '<div style="font-size:13.5px;color:var(--ink2);line-height:1.55">' + esc(n.text) + '</div></div>'
      + '<div style="display:flex;gap:10px;padding:0 16px 16px">'
      + '<div class="n-btn" style="flex:1"' + tid(n.cancel.id) + bind(n.cancel.act) + '>' + esc(n.cancel.text) + '</div>'
      + '<div class="n-btn primary" style="flex:1"' + tid(n.ok.id) + bind(n.ok.act) + '>' + esc(n.ok.text) + '</div>'
      + '</div></div>';
  case 'toast': return '<div class="n-toast"' + tid(n.id) + '>' + esc(n.text) + '</div>';
  default: return renderExtra(n);
  }
}
function avatarHtml(a){
  return '<div class="av" style="width:38px;height:38px;border-radius:50%;flex:0 0 auto;display:flex;'
    + 'align-items:center;justify-content:center;font:700 14px/1 var(--disp);color:#fff;background:hsl('
    + a.hue + ' 52% 46%)">' + esc(a.initial) + '</div>';
}

function renderExtra(n){
  switch (n.t) {
  case 'verd':
    return '<div class="verd' + (n.void?' void':'') + '"' + tid(n.id) + '>'
      + '<div class="vd-k">' + esc(n.kicker) + '</div>'
      + '<div class="vd-n">' + esc(n.name) + '</div>'
      + '<div class="vd-s">' + esc(n.sub) + '</div></div>';
  case 'bal':
    return '<div class="bal"' + tid(n.id) + '><div class="bal-h">' + esc(n.head) + '</div>'
      + n.rows.map(function(r){
          return '<div class="bl-r">'
            + '<div class="bl-box' + (r.rank?' on':'') + '"' + tid(r.id) + bind(r.act) + '>'
            + (r.rank ? r.rank : '') + '</div>'
            + '<div class="bl-m"><div class="bl-n">' + esc(r.name) + '</div>'
            + '<div class="bl-s">' + esc(r.sub) + '</div></div>'
            + '<div class="bl-mv">'
            + (r.upId ? '<div' + tid(r.upId) + bind(r.up) + '>' + icon('up',14) + '</div>' : '')
            + (r.downId ? '<div' + tid(r.downId) + bind(r.down) + '>' + icon('down',14) + '</div>' : '')
            + '</div></div>';
        }).join('')
      + '<div class="bal-f">' + esc(n.foot) + '</div></div>';
  case 'rnd': {
    var head = '<tr><th class="nm">Candidate</th>' + n.rounds.map(function(r){
      return '<th>R' + r.n + '</th>'; }).join('') + '</tr>';
    var body = n.cands.map(function(name, ci){
      var elim = n.rounds.some(function(r){ return r.eliminated === n.ids[ci]; });
      return '<tr class="' + (elim?'elim':'') + '"><td class="nm">' + esc(name) + '</td>'
        + n.rounds.map(function(r){
            if (r.count[ci] === null) return '<td class="gone">—</td>';
            var cls = r.winner === n.ids[ci] ? 'win' : (r.eliminated === n.ids[ci] ? 'out' : '');
            return '<td class="' + cls + '">' + r.count[ci]
              + (n.showTransfers && r.transfer[ci] ? '<span class="tr">+' + r.transfer[ci]
                                                     + '</span>' : '') + '</td>';
          }).join('') + '</tr>';
    }).join('');
    return '<div class="rnd"' + tid(n.id) + '><table>' + head + body + '</table></div>';
  }
  case 'tally':
    return '<div class="tally"' + tid(n.id) + '>' + n.rows.map(function(r){
        return '<div class="ty-r"><div class="ty-n">' + esc(r.name) + '</div>'
          + '<div class="ty-b"><i class="' + (r.win?'win':(r.lead?'lead':'')) + '" style="width:'
          + r.w + '%"></i></div>'
          + '<div class="ty-v">' + esc(r.pctText) + '</div></div>';
      }).join('') + '<div class="ty-q">' + esc(n.quota) + '</div></div>';
  default: return '';
  }
}

var STATE = null;
function paint(){
  ACTS = [];
  app.innerHTML = render(E.screen(STATE));
  var c = '';
  if (c) document.getElementById('sb-clock').textContent = c;
  if (!hud.classList.contains('off')) paintHud();
}
app.addEventListener('click', function(ev){
  var el = ev.target.closest('[data-act]'); if (!el) return;
  if (el.classList.contains('n-mask') && ev.target.closest('[data-stop]')) return;
  var act = ACTS[+el.getAttribute('data-act')]; if (!act) return;
  TRAJ.push({action:'tap', id: el.getAttribute('data-testid') || null});
  STATE = E.reduce(STATE, act); paint();
});
app.addEventListener('input', function(ev){
  var el = ev.target.closest('[data-actt]'); if (!el) return;
  var act = JSON.parse(JSON.stringify(ACTS[+el.getAttribute('data-actt')]));
  for (var k in act) if (act[k] === '$VALUE') act[k] = el.value;
  var id = el.getAttribute('data-testid'), pos = el.selectionStart;
  TRAJ.push({action:'type', id:id, text:el.value});
  STATE = E.reduce(STATE, act); paint();
  var again = id && app.querySelector('[data-testid="' + id + '"]');
  if (again && again.focus) { again.focus(); try { again.setSelectionRange(pos, pos); } catch(e){} }
});

function paintHud(){
  var d = E.derive(STATE);
  hud.innerHTML = '<h4>__ENV__ \u00b7 ' + E.ENV_ID + ' v' + E.VERSION + '</h4>'
    + '<div><span class="k">route</span> ' + d.route + '  <span class="k">step</span> ' + STATE.meta.steps + '</div>'
    + '<div><span class="k">winner</span> ' + d.previewWinner + '  <span class="k">turnout</span> ' + d.turnout + '  <span class="k">cast</span> ' + d.submitted + '</div>'
    + '<div style="margin-top:8px"><button id="hud-reset">reset</button>'
    + '<button id="hud-a11y">copy a11y</button><button id="hud-state">copy state</button>'
    + '<button id="hud-traj">copy traj</button><button id="hud-hide">hide (h)</button></div>'
    + '<pre>' + esc(E.a11y(STATE)) + '</pre>';
  hud.querySelector('#hud-reset').onclick = function(){ ENVAPI.reset({seed:STATE.meta.seed}); };
  hud.querySelector('#hud-a11y').onclick  = function(){ copy(E.a11y(STATE)); };
  hud.querySelector('#hud-state').onclick = function(){ copy(JSON.stringify(E.snapshot(STATE), null, 2)); };
  hud.querySelector('#hud-traj').onclick  = function(){ copy(JSON.stringify(TRAJ, null, 2)); };
  hud.querySelector('#hud-hide').onclick  = function(){ hud.classList.add('off'); };
}
function copy(t){ try { navigator.clipboard.writeText(t); } catch(e){} }
document.addEventListener('keydown', function(e){
  if (e.key === 'h') { hud.classList.toggle('off'); if (!hud.classList.contains('off')) paintHud(); }
});

var ENVAPI = {
  ENV_ID: E.ENV_ID, VERSION: E.VERSION,
  reset: function(opts){
    opts = opts || {};
    STATE = E.createInitialState(opts.seed || 0);
    if (opts.patch) E.applyPatch(STATE, opts.patch);
    TRAJ = []; paint();
    return E.snapshot(STATE);
  },
  getState:   function(){ return E.snapshot(STATE); },
  setState:   function(s){ STATE = JSON.parse(JSON.stringify(s)); paint(); return true; },
  step:       function(a){ var r = E.step(STATE, a); STATE = r.state; TRAJ.push(a); paint();
                           return {ok:r.ok, error:r.error || null}; },
  dispatch:   function(act){ STATE = E.reduce(STATE, act); paint(); return true; },
  a11y:       function(){ return E.a11y(STATE); },
  elements:   function(){ return E.elements(STATE); },
  route:      function(){ return E.select.route(STATE); },
  trajectory: function(){ return JSON.parse(JSON.stringify(TRAJ)); },
  bounds: function(){
    var base = document.getElementById('screen').getBoundingClientRect(), out = {};
    app.querySelectorAll('[data-testid]').forEach(function(el){
      var r = el.getBoundingClientRect();
      out[el.getAttribute('data-testid')] = {
        x:Math.round(r.left-base.left), y:Math.round(r.top-base.top),
        w:Math.round(r.width), h:Math.round(r.height),
        cx:Math.round(r.left-base.left+r.width/2), cy:Math.round(r.top-base.top+r.height/2)};
    });
    return out;
  }
};
window.__ENV__ = ENVAPI;
var qs = new URLSearchParams(location.search);
if (qs.get('bare') === '1') document.body.classList.add('bare');
if (qs.get('hud')  === '1') hud.classList.remove('off');
ENVAPI.reset({seed: parseInt(qs.get('seed') || '0', 10) || 0});
window.__ENV_READY__ = true;
})();
</script>
