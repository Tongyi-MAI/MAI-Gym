<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Bastion (mocked GUI env)</title>
<!--
  ============================================================================
  Bastion — a single-file H5 debt planner for agent research.

  Same two-block contract as every environment here: script#engine is a pure,
  DOM-free state machine on globalThis.GUI_ENGINE; script#ui renders its screen
  tree and exposes window.__ENV__.

  What is new: nothing on screen is a formula, it is a simulation. Three
  settings — how much you can find each month, which debt the surplus goes to,
  and whether to move the card onto an interest-free deal — are fed through a
  month-by-month run of both balances, and everything the app shows comes back
  out of that run: when each debt clears, how much interest each one costs,
  what the whole thing comes to.

  The interesting part is that the obvious answer is wrong twice over. Paying
  the expensive debt first is right, but only just, and the interest-free
  transfer costs a fee up front and reverts to a worse rate afterwards, so
  whether it is worth taking depends on how fast you were going to clear the
  card anyway — which depends on the budget, which is the thing you were
  trying to decide.

  Money is integer pence and every month's interest is floored, so the figures
  are exactly reproducible.
  ============================================================================
-->
<style>
:root{
  --outer:#e3e6ee;
  --bezel:#12151f;
  --bg:#f4f4f8;
  --card:#ffffff;
  --card2:#f2f4f9;
  --line:#e2e2ec;
  --line2:#c9c9dc;
  --press:#ececf4;
  --chev:#b6b6cc;
  --ink:#14142b;
  --ink2:#4c4c66;
  --muted:#82829c;
  --accent:#4c3bcf;
  --accent-d:#382a9e;
  --accent-s:#e9e6fb;
  --on-accent:#ffffff;
  --good:#1f7a4d;
  --good-s:#e2f1ea;
  --warn:#8a6300;
  --warn-s:#f8f0da;
  --bad:#b5253c;
  --bad-s:#fbe8eb;
  --bad-line:#e7c4cc;
  --btn:#ececf4;
  --btn-off:#e2e2ec;
  --off:#c2c2d4;
  --appbar:#ffffff;
  --appbar-ink:#161a27;
  --appbar-line:#e2e2ec;
  --tabbar:#ffffff;
  --scrim:rgba(20,20,43,.44);
  --toast:#14142b;
  --toast-ink:#ffffff;
  --hero:linear-gradient(140deg,#241d6b,#5544e0);
  --hero-line:transparent;
  --hero-ink:#ffffff;
  --disp:"SF Pro Display",-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:18px; --r2:12px;
  --shadow:0 1px 2px rgba(16,18,26,.05),0 10px 26px rgba(16,18,26,.07);
  --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{background:var(--outer);color:var(--ink);font:14px/1.55 var(--ui);
  display:flex;align-items:center;justify-content:center;overflow:hidden}

#device{position:relative;width:390px;height:844px;background:var(--bezel);border-radius:46px;padding:5px;
  box-shadow:0 30px 70px rgba(0,0,0,.34);flex:0 0 auto}
#screen{position:relative;width:100%;height:100%;background:var(--bg);border-radius:41px;
  overflow:hidden;display:flex;flex-direction:column}
#notch{position:absolute;top:5px;left:50%;transform:translateX(-50%);width:118px;height:30px;
  background:var(--bezel);border-radius:0 0 18px 18px;z-index:60}
body.bare{background:var(--bg)}
body.bare #device{width:390px;height:844px;padding:0;border-radius:0;box-shadow:none;background:var(--bg)}
body.bare #screen{border-radius:0}
body.bare #notch{display:none}
body.bare .n-sheet{animation:none}

.statusbar{height:44px;flex:0 0 44px;display:flex;align-items:flex-end;justify-content:space-between;
  padding:0 22px 6px;font-size:13px;font-weight:600;z-index:50;color:var(--ink)}
.statusbar .sb-r{display:flex;gap:5px;align-items:center}
.sb-bat{width:22px;height:11px;border:1.3px solid currentColor;border-radius:3px;position:relative;opacity:.9}
.sb-bat:after{content:"";position:absolute;right:-3px;top:3px;width:2px;height:5px;background:currentColor;border-radius:0 1px 1px 0}
.sb-bat i{position:absolute;left:1.3px;top:1.3px;bottom:1.3px;width:78%;background:currentColor;border-radius:1px}

#app{flex:1 1 auto;display:flex;flex-direction:column;min-height:0;position:relative}

.n-appbar{flex:0 0 auto;min-height:52px;display:flex;align-items:center;gap:8px;padding:6px 12px;
  background:var(--appbar);color:var(--appbar-ink);z-index:20;border-bottom:1px solid var(--appbar-line)}
.n-appbar .ab-title{flex:1 1 auto;text-align:center;font:650 17px/1.3 var(--disp);letter-spacing:-.2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.n-appbar .ab-side{flex:0 0 auto;min-width:56px;display:flex;align-items:center;gap:2px}
.n-appbar .ab-side.right{justify-content:flex-end}
.n-appbar .iconbtn{color:var(--appbar-ink);opacity:.85}
.iconbtn{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  color:var(--ink2);cursor:pointer}
.iconbtn:active{background:var(--press)}

.n-scroll{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;padding-bottom:10px}
.n-scroll::-webkit-scrollbar{width:0}

.n-text{padding:2px 18px;color:var(--ink2)}
.n-text.h1{font:700 26px/1.18 var(--disp);color:var(--ink);padding:10px 18px 6px;letter-spacing:-.6px}
.n-text.h2{font:650 18px/1.3 var(--disp);color:var(--ink);padding:12px 18px 2px}
.n-text.body{font-size:13.5px;padding:5px 18px;line-height:1.7}
.n-text.muted{font-size:12.5px;color:var(--muted);padding:6px 18px;line-height:1.6}
.n-text.empty{padding:14px 18px 40px;text-align:center;color:var(--muted);font-size:13.5px}
.n-sec{padding:18px 18px 6px;font:700 11.5px/1 var(--ui);color:var(--muted);letter-spacing:1.3px;
  text-transform:uppercase;display:flex;justify-content:space-between;align-items:center;gap:10px}
.n-space{height:16px}

.n-card{background:var(--card);border-radius:var(--r);margin:9px 16px;overflow:hidden;border:1px solid var(--line)}
.n-card.flush{padding:0}
.n-card.pad{padding:14px 16px}
.n-card.tap{cursor:pointer}
.n-card.tap:active{background:var(--press)}

.n-row{display:flex;align-items:center;gap:13px;padding:12px 16px;border-bottom:1px solid var(--line);min-height:54px}
.n-row:last-child{border-bottom:none}
.n-row.tap{cursor:pointer}
.n-row.tap:active{background:var(--press)}
.n-row .r-lead{flex:0 0 auto;width:26px;color:var(--ink2);display:flex;align-items:center;justify-content:center}
.n-row .r-main{flex:1 1 auto;min-width:0}
.n-row .r-label{font-size:14.5px}
.n-row .r-label.strike{text-decoration:line-through;color:var(--muted)}
.n-row .r-sub{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.5}
.n-row .r-value{flex:0 0 auto;font-size:14px;color:var(--ink2);text-align:right;font-variant-numeric:tabular-nums}
.n-row .r-value.strong{color:var(--ink);font-weight:700}
.n-row .r-value.acc{color:var(--accent);font-weight:700}
.n-row .r-value.good{color:var(--good);font-weight:700}
.n-row .r-value.warn{color:var(--warn);font-weight:700}
.n-row .r-value.bad{color:var(--bad);font-weight:700}
.n-row .r-arrow{flex:0 0 auto;color:var(--chev);display:flex}

.n-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:47px;padding:0 20px;
  border-radius:13px;font:650 15px/1 var(--ui);background:var(--btn);color:var(--ink);
  border:none;cursor:pointer;user-select:none}
.n-btn:active{filter:brightness(.97)}
.n-btn.primary{background:var(--accent);color:var(--on-accent)}
.n-btn.primary.off{background:var(--btn-off);color:var(--muted);cursor:not-allowed}
.n-btn.ghost{background:transparent;border:1px solid var(--line2);height:37px;font-size:13px;padding:0 14px;color:var(--ink2)}
.n-btn.danger{background:transparent;border:1px solid var(--bad-line);color:var(--bad);height:37px;font-size:13px;padding:0 14px}
.n-btn.block{display:flex;width:100%}
.n-btnrow{display:flex;gap:10px;padding:12px 16px;justify-content:flex-end;align-items:center;flex-wrap:wrap}

.n-chips{display:flex;gap:8px;padding:8px 16px;overflow-x:auto}
.n-chips::-webkit-scrollbar{height:0}
.n-chip{flex:0 0 auto;height:34px;padding:0 14px;border-radius:11px;background:var(--card);
  border:1px solid var(--line2);display:flex;align-items:center;font-size:13px;
  color:var(--ink2);cursor:pointer;white-space:nowrap;font-weight:600}
.n-chip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}

.n-input{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line);background:var(--card)}
.n-input .i-label{flex:0 0 78px;font-size:13px;color:var(--muted)}
.n-input input{flex:1 1 auto;border:none;outline:none;background:transparent;font-size:14.5px;
  font-family:inherit;color:var(--ink);min-width:0}
.n-input input::placeholder{color:var(--muted)}
.n-switch{flex:0 0 auto;width:46px;height:27px;border-radius:14px;background:var(--off);position:relative;cursor:pointer;transition:background .16s}
.n-switch.on{background:var(--accent)}
.n-switch i{position:absolute;top:2.5px;left:2.5px;width:22px;height:22px;border-radius:50%;background:#fff;
  transition:transform .16s;box-shadow:0 1px 3px rgba(0,0,0,.22)}
.n-switch.on i{transform:translateX(19px)}
.n-check{flex:0 0 auto;width:23px;height:23px;border-radius:7px;border:1.8px solid var(--off);position:relative;background:var(--card)}
.n-check.on{border-color:var(--accent);background:var(--accent)}
.n-check.on:after{content:"";position:absolute;left:7.5px;top:4px;width:5px;height:10px;
  border:2px solid var(--on-accent);border-top:0;border-left:0;transform:rotate(42deg)}
.n-radio{flex:0 0 auto;width:22px;height:22px;border-radius:50%;border:1.8px solid var(--off);position:relative}
.n-radio.on{border-color:var(--accent);background:var(--accent)}
.n-radio.on:after{content:"";position:absolute;left:7px;top:4px;width:5px;height:9px;
  border:2px solid var(--on-accent);border-top:0;border-left:0;transform:rotate(42deg)}

.tag{display:inline-flex;align-items:center;padding:3px 9px;border-radius:20px;font-size:11px;
  font-weight:700;background:var(--btn);color:var(--ink2)}
.tag.acc{background:var(--accent-s);color:var(--accent)}
.tag.good{background:var(--good-s);color:var(--good)}
.tag.warn{background:var(--warn-s);color:var(--warn)}
.tag.bad{background:var(--bad-s);color:var(--bad)}

.n-tabbar{flex:0 0 auto;height:58px;background:var(--tabbar);border-top:1px solid var(--line);display:flex;z-index:30}
.n-tabbar .tb{flex:1 1 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--muted);font-size:10.5px;cursor:pointer;font-weight:600}
.n-tabbar .tb i{display:flex}
.n-tabbar .tb.on{color:var(--accent)}

.n-mask{position:absolute;inset:0;background:var(--scrim);z-index:70;display:flex;align-items:flex-end}
.n-sheet{width:100%;max-height:80%;background:var(--card);border-radius:22px 22px 0 0;display:flex;
  flex-direction:column;overflow:hidden;animation:up .18s ease-out}
@keyframes up{from{transform:translateY(24px)}to{transform:none}}
.n-sheet .sh-hd{padding:16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.n-sheet .sh-hd .t{font:650 17px/1.2 var(--disp)}
.n-sheet .sh-bd{flex:1 1 auto;overflow-y:auto;min-height:0}
.n-sheet .sh-bd::-webkit-scrollbar{width:0}
.n-toast{position:absolute;left:50%;bottom:118px;transform:translateX(-50%);background:var(--toast);
  color:var(--toast-ink);padding:11px 18px;border-radius:11px;font-size:13px;z-index:90;max-width:84%;text-align:center}
.dialog{margin:auto;width:82%;background:var(--card);border-radius:18px;overflow:hidden;border:1px solid var(--line)}

.stats{display:flex;gap:9px;padding:4px 16px}
.stat{flex:1 1 0;background:var(--card);border:1px solid var(--line);border-radius:var(--r2);padding:13px 12px}
.stat.tap{cursor:pointer}
.stat .st-n{font:800 19px/1.1 var(--disp);letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.stat .st-l{font-size:11px;color:var(--muted);margin-top:6px;line-height:1.4}
.stat.acc .st-n{color:var(--accent)}

.hero{margin:8px 16px 4px;padding:18px;border-radius:var(--r);background:var(--hero);
  border:1px solid var(--hero-line);color:var(--hero-ink)}
.hero.tap{cursor:pointer}
.hero .he-k{font-size:11px;letter-spacing:1.3px;text-transform:uppercase;font-weight:800;opacity:.85}
.hero .he-t{font:800 25px/1.16 var(--disp);margin-top:9px;letter-spacing:-.7px}
.hero .he-s{font-size:13px;margin-top:8px;line-height:1.6;opacity:.9}


.out{margin:12px 16px;padding:17px 16px;background:var(--card);border:1px solid var(--line2);
  border-radius:var(--r);box-shadow:var(--shadow)}
.out .ou-k{font-size:11px;color:var(--muted);letter-spacing:.8px;text-transform:uppercase}
.out .ou-n{font:800 32px/1 var(--disp);letter-spacing:-1.2px;margin-top:10px}
.out .ou-s{font-size:12.5px;color:var(--ink2);margin-top:9px;line-height:1.6}
.out .ou-g{display:flex;gap:18px;margin-top:15px;padding-top:14px;border-top:1px solid var(--line)}
.out .ou-i .v{font:700 16px/1 var(--disp);font-variant-numeric:tabular-nums}
.out .ou-i .l{font-size:10.5px;color:var(--muted);margin-top:5px}
.out .ou-i.hi .v{color:var(--accent)}

.slid{margin:0 16px}
.sl-t{display:flex;gap:3px}
.sl-t div{flex:1 1 0;height:38px;border-radius:4px;background:var(--btn);cursor:pointer;
  position:relative}
.sl-t div:active{background:var(--press)}
.sl-t div.lo{background:var(--btn-off)}
.sl-t div.on{background:var(--accent)}
.sl-t div.pre{background:var(--accent-s)}
.sl-l{display:flex;justify-content:space-between;margin-top:8px;font-size:11px;color:var(--muted)}
.sl-v{text-align:center;font:800 24px/1 var(--disp);margin:11px 0 3px;letter-spacing:-.6px}
.sl-c{text-align:center;font-size:11.5px;color:var(--muted)}

.opt{display:flex;align-items:flex-start;gap:11px;padding:13px 15px;border-bottom:1px solid var(--line);
  cursor:pointer}
.opt:last-child{border-bottom:none}
.opt:active{background:var(--press)}
.opt.on{background:var(--accent-s)}
.op-r{flex:0 0 auto;width:18px;height:18px;border-radius:9px;border:1.5px solid var(--off);
  margin-top:2px}
.opt.on .op-r{border-color:var(--accent);background:var(--accent);box-shadow:inset 0 0 0 3px #fff}
.op-m{flex:1 1 auto;min-width:0}
.op-n{font-size:14px;font-weight:700}
.op-s{font-size:11.5px;color:var(--muted);margin-top:4px;line-height:1.5}
.op-v{flex:0 0 auto;text-align:right}
.op-a{font:700 13.5px/1 var(--disp);font-variant-numeric:tabular-nums}
.op-b{font-size:10.5px;margin-top:4px;color:var(--muted)}
.op-b.best{color:var(--good);font-weight:700}

.chart{margin:0 16px;padding:13px 12px 8px;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r);overflow-x:auto}
.chart .ch-b{display:flex;align-items:flex-end;gap:1px;height:104px}
.chart .ch-b span{flex:1 1 0;min-width:2px;display:flex;flex-direction:column;
  justify-content:flex-end}
.chart .ch-b i{display:block;background:var(--accent);border-radius:1px 1px 0 0}
.chart .ch-b u{display:block;background:var(--bad);border-radius:1px 1px 0 0}
.chart .ch-x{display:flex;justify-content:space-between;margin-top:8px;font-size:10.5px;
  color:var(--muted)}
.chart .ch-k{display:flex;gap:14px;margin-top:9px;font-size:10.5px;color:var(--muted)}
.chart .ch-k span{display:flex;align-items:center;gap:5px}
.chart .ch-k b{width:9px;height:9px;border-radius:2px;display:block}

.sched{margin:0 16px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  overflow-x:auto}
.sched table{border-collapse:collapse;width:100%;min-width:342px}
.sched th,.sched td{padding:7px 8px;font-size:11.5px;text-align:right;
  border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.sched th{font-size:9.5px;letter-spacing:.7px;text-transform:uppercase;color:var(--muted);
  border-bottom:1px solid var(--line2)}
.sched td.m,.sched th.m{text-align:left;color:var(--muted)}
.sched tr.gone td{color:var(--good)}
.sched tr.mark td{background:var(--accent-s);font-weight:700}

</style>
</head>
<body>
<div id="device">
  <div id="notch"></div>
  <div id="screen">
    <div class="statusbar" id="sb">
      <div id="sb-clock">21:38</div>
      <div class="sb-r">
        <svg width="17" height="12" viewBox="0 0 17 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="4.6" y="5.5" width="3" height="6.5" rx="1"/><rect x="9.2" y="3" width="3" height="9" rx="1"/><rect x="13.8" y="0" width="3" height="12" rx="1"/></svg>
        <svg width="15" height="12" viewBox="0 0 15 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M1 4.2a9 9 0 0 1 13 0"/><path d="M3.4 6.9a5.6 5.6 0 0 1 8.2 0"/><circle cx="7.5" cy="10" r=".9" fill="currentColor" stroke="none"/></svg>
        <span class="sb-bat"><i></i></span>
      </div>
    </div>
    <div id="app"></div>
  </div>
</div>
<div id="hud" class="off"></div>

<script id="engine">
/* ===========================================================================
 * ENGINE — pure, deterministic, DOM-free.
 * Money is integer pence and every month's interest is floored, so the
 * simulation reproduces exactly. Nothing here is a closed-form formula.
 * ======================================================================== */
(function(root){
'use strict';

var ENV_ID  = 'bastion_loan';
var VERSION = '1.0.0';

/* ------------------------------------------------------------- utilities */
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function pad2(n){ return (n < 10 ? '0' : '') + n; }
function hhmm(m){ m = ((m % 1440) + 1440) % 1440; return pad2(Math.floor(m/60)) + ':' + pad2(m%60); }
function sum(a){ var s = 0; for (var i=0;i<a.length;i++) s += a[i]; return s; }
function clamp(v, lo, hi){ return v < lo ? lo : (v > hi ? hi : v); }
function lcg(seed){ var s=(seed>>>0)||1; return function(){ s=(s*1664525+1013904223)>>>0; return s/4294967296; }; }
function shuffled(list, seed){
  if (!seed) return list.slice();
  var r = lcg(seed), a = list.slice();
  for (var i=a.length-1;i>0;i--){ var j = Math.floor(r()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
function money(p, sym){
  var neg = p < 0; p = Math.abs(p);
  return (neg ? '-' : '') + (sym === undefined ? '\u00a3' : sym) +
         (Math.floor(p/100)).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',') + '.' + pad2(p%100);
}
function getPath(o, path){
  var cur = o, parts = String(path).split('.');
  for (var i=0;i<parts.length;i++){
    var k = parts[i], m = k.match(/^(.*?)\[(\d+)\]$/);
    if (m){ cur = cur ? cur[m[1]] : undefined; cur = cur ? cur[+m[2]] : undefined; }
    else cur = cur ? cur[k] : undefined;
    if (cur === undefined) return undefined;
  }
  return cur;
}
function setPath(o, path, value){
  var parts = String(path).split('.'), cur = o;
  for (var i=0;i<parts.length-1;i++){
    var k = parts[i], m = k.match(/^(.*?)\[(\d+)\]$/);
    cur = m ? cur[m[1]][+m[2]] : (cur[k] = cur[k] || {});
  }
  var lastK = parts[parts.length-1], lm = lastK.match(/^(.*?)\[(\d+)\]$/);
  if (lm) cur[lm[1]][+lm[2]] = value; else cur[lastK] = value;
  return o;
}

/* ------------------------------------------- screen-tree node constructors */
function N(t, o){ o = o || {}; o.t = t; return o; }
function txt(s, cls){ return N('text', {text:s, cls:cls || ''}); }
function row(id, text, o){
  o = o || {}; o.id = id; o.text = text;
  if (o.arrow === undefined) o.arrow = !!o.act;
  return N('row', o);
}
function btn(id, text, act, cls, disabled){
  return N('btn', {id:id, text:text, act:act, cls:cls || '', disabled:!!disabled});
}
function iconbtn(id, ic, act, cls){ return N('iconbtn', {id:id, icon:ic, act:act, cls:cls || ''}); }
function appbar(title, o){ o = o || {}; o.title = title; return N('appbar', o); }
function stepper(id, value, minus, plus){
  return N('stepper', {id:id, value:value, minusId:id + '_dec', plusId:id + '_inc',
                       minus:minus, plus:plus});
}
function sheet(id, title, kids){
  return N('sheet', {id:id, title:title, closeId:id + '_close', close:{type:'CLOSE_SHEET'}, c:kids});
}
function route(st){ return st.ui.stack[st.ui.stack.length - 1]; }
function push(st, name, params){ st.ui.stack.push({name:name, params:params || {}}); st.ui.sheet = null; }
function pop(st){ if (st.ui.stack.length > 1) st.ui.stack.pop(); }
function toast(st, t){ st.ui.toast = t; }

/* ------------------------------------------------------------ the debts
 * rates are monthly, in hundred-thousandths, so interest is an exact floor */
var CARD = {id:'d_card', name:'Credit card', start:240000, rate:1825, minPct:250, minFloor:2500,
            apr:'21.9% APR', note:'The minimum is 2.5% of the balance or £25, whichever is more.'};
var LOAN = {id:'d_loan', name:'Car loan', start:1800000, rate:492, payment:34800,
            apr:'5.9% APR', note:'£348 a month, contractual. You cannot pay it less.'};
/* the balance-transfer deal */
var XFER = {fee:290, months:18, after:2075, cap:250000,
            note:'Nothing to pay in interest for 18 months, then 24.9%. The fee is 2.9% of what '
                 + 'you move and it goes straight onto the balance.'};

var BUDGETS = [];
for (var _b = 40000; _b <= 70000; _b += 2000) BUDGETS.push(_b);

var TARGETS = [
  {id:'card', name:'Everything spare at the card',
   note:'The dearer debt first. Once it is gone the whole surplus falls on the loan.'},
  {id:'loan', name:'Everything spare at the loan',
   note:'The bigger debt first, and the one with the payment you cannot dodge.'},
  {id:'split', name:'Split the surplus down the middle',
   note:'Half each, until one of them clears.'}
];
function targetOf(id){ for (var i=0;i<TARGETS.length;i++) if (TARGETS[i].id === id) return TARGETS[i]; return null; }

function cardMin(bal){
  if (bal <= 0) return 0;
  var m = Math.max(CARD.minFloor, Math.ceil(bal * CARD.minPct / 10000));
  return Math.min(bal, m);
}
var HORIZON = 180;

/* the whole world: run both balances forward a month at a time */
function simulate(budget, target, transfer){
  var card = transfer ? CARD.start + Math.ceil(CARD.start * XFER.fee / 10000) : CARD.start;
  var loan = LOAN.start;
  var iCard = 0, iLoan = 0, paid = 0;
  var cardMonth = 0, loanMonth = 0, rows = [], feasible = true;
  var m;
  for (m = 1; m <= HORIZON; m++){
    if (card <= 0 && loan <= 0) break;
    var rate = transfer ? (m <= XFER.months ? 0 : XFER.after) : CARD.rate;
    var ci = card > 0 ? Math.floor(card * rate / 100000) : 0;
    var li = loan > 0 ? Math.floor(loan * LOAN.rate / 100000) : 0;
    card += ci; loan += li; iCard += ci; iLoan += li;
    var loanPay = Math.min(loan, LOAN.payment);
    var minPay = cardMin(card);
    var must = loanPay + minPay;
    if (must > budget) { feasible = false; break; }
    var spare = budget - must;
    var toCard = 0, toLoan = 0;
    if (card <= 0) toLoan = spare;
    else if (loan <= 0) toCard = spare;
    else if (target === 'card') toCard = spare;
    else if (target === 'loan') toLoan = spare;
    else { toCard = Math.floor(spare / 2); toLoan = spare - toCard; }
    var payCard = Math.min(card, minPay + toCard);
    var payLoan = Math.min(loan, loanPay + toLoan);
    card -= payCard; loan -= payLoan;
    if (card < 0) card = 0;
    if (loan < 0) loan = 0;
    paid += payCard + payLoan;
    if (card === 0 && !cardMonth) cardMonth = m;
    if (loan === 0 && !loanMonth) loanMonth = m;
    rows.push({m:m, card:card, loan:loan, ci:ci, li:li, payCard:payCard, payLoan:payLoan,
               out:payCard + payLoan});
  }
  return {rows:rows, months:rows.length, cardMonth:cardMonth, loanMonth:loanMonth,
          interestCard:iCard, interestLoan:iLoan, interest:iCard + iLoan,
          fee:transfer ? Math.ceil(CARD.start * XFER.fee / 10000) : 0,
          totalPaid:paid, feasible:feasible,
          cost:iCard + iLoan + (transfer ? Math.ceil(CARD.start * XFER.fee / 10000) : 0)};
}
function run(st){ return simulate(st.budget, st.target, st.transfer); }
function runWith(st, o){
  return simulate(o.budget === undefined ? st.budget : o.budget,
                  o.target === undefined ? st.target : o.target,
                  o.transfer === undefined ? st.transfer : o.transfer);
}
function bestTarget(st){
  var best = null;
  TARGETS.forEach(function(t){
    var r = runWith(st, {target:t.id});
    if (!r.feasible) return;
    if (!best || r.cost < best.r.cost) best = {t:t, r:r};
  });
  return best;
}
function years(m){
  if (!m) return 'never';
  var y = Math.floor(m / 12), r = m % 12;
  return (y ? y + 'y' : '') + (y && r ? ' ' : '') + (r ? r + 'm' : (y ? '' : '0m'));
}
function money(n){
  var neg = n < 0; if (neg) n = -n;
  var w = '' + Math.floor(n / 100), c = n % 100, g = '';
  for (var i = 0; i < w.length; i++){
    if (i > 0 && (w.length - i) % 3 === 0) g += ',';
    g += w[i];
  }
  return (neg ? '-' : '') + '£' + g + '.' + (c < 10 ? '0' : '') + c;
}

/* =========================================================== state */
function createInitialState(seed){
  seed = seed || 0;
  return {
    meta:{env:ENV_ID, version:VERSION, seed:seed, steps:0, finished:false, answer:null},
    budget:52000,            /* £520 a month */
    target:'loan',           /* the wrong one, on purpose */
    transfer:false,
    /* the seed permutes the order the shortcuts are offered in, nothing else */
    order:shuffled(['card', 'loan', 'split'], seed),
    ui:{tab:'plan', stack:[{name:'plan', params:{}}], sheet:null, confirm:null, inputs:{},
        toast:null, month:1},
    settings:{showSchedule:true, showFee:true, notifyCleared:true}
  };
}
var SELECT = {
  simulate:simulate, run:run, runWith:runWith, bestTarget:bestTarget, cardMin:cardMin,
  years:years, money:money, budgets:BUDGETS, targets:TARGETS, card:CARD, loan:LOAN, xfer:XFER,
  route:route
};

/* =========================================================== reducer */
function reduce(prev, action){
  var st = clone(prev), A = action || {};
  st.ui.toast = null;
  st.meta.steps += 1;

  function said(st, was){
    var r = run(st);
    if (!r.feasible) return 'That does not even cover the loan payment and the card minimum';
    return 'Clear in ' + years(r.months) + ', ' + money(r.cost) + ' in interest and fees'
           + (was !== null && st.settings.notifyCleared
              ? (r.cost < was ? ' — ' + money(was - r.cost) + ' better'
                              : (r.cost > was ? ' — ' + money(r.cost - was) + ' worse'
                                              : ' — no different')) : '');
  }

  switch (A.type) {

  case 'NOOP': break;
  case 'FINISH': st.meta.finished = true; st.meta.answer = A.answer === undefined ? null : A.answer; break;

  case 'NAV': push(st, A.to, A.params); break;
  case 'BACK':
    if (st.ui.sheet) st.ui.sheet = null;
    else if (st.ui.confirm) st.ui.confirm = null;
    else pop(st);
    break;
  case 'TAB': {
    var roots = {plan:'plan', sched:'sched', debts:'debts', settings:'settings'};
    st.ui.tab = A.tab; st.ui.sheet = null; st.ui.confirm = null;
    st.ui.stack = [{name:roots[A.tab] || 'plan', params:{}}];
    break;
  }
  case 'HOME':
    st.ui.tab = 'plan'; st.ui.stack = [{name:'plan', params:{}}];
    st.ui.sheet = null; st.ui.confirm = null;
    break;
  case 'SET_INPUT': st.ui.inputs[A.field] = A.value; break;
  case 'OPEN_SHEET': st.ui.sheet = {type:A.sheet, id:A.id || null}; break;
  case 'CLOSE_SHEET': st.ui.sheet = null; break;
  case 'CONFIRM_NO': st.ui.confirm = null; break;
  case 'CONFIRM_YES': {
    var yes = st.ui.confirm && st.ui.confirm.yes; st.ui.confirm = null;
    if (yes) { var keep = st.meta.steps; var out = reduce(st, yes); out.meta.steps = keep; return out; }
    break;
  }
  case 'MONTH': st.ui.month = Math.max(1, Math.min(HORIZON, A.n)); break;

  /* ---- the three levers ---- */
  case 'BUDGET': {
    var was = run(st).feasible ? run(st).cost : null;
    if (BUDGETS.indexOf(A.n) < 0) break;
    if (A.n === st.budget) { toast(st, 'Already ' + money(A.n) + ' a month'); break; }
    st.budget = A.n;
    toast(st, money(A.n) + ' a month — ' + said(st, was));
    break;
  }
  case 'TARGET': {
    if (!targetOf(A.id)) break;
    var was2 = run(st).feasible ? run(st).cost : null;
    if (A.id === st.target) { toast(st, 'The surplus already goes there'); break; }
    st.target = A.id;
    toast(st, targetOf(A.id).name + ' — ' + said(st, was2));
    break;
  }
  case 'TRANSFER': {
    if (st.transfer) {
      st.transfer = false;
      toast(st, 'Transfer dropped — ' + said(st, null));
      break;
    }
    st.ui.confirm = {title:'Move the card to the 0% deal?',
      text:'A fee of ' + money(Math.ceil(CARD.start * XFER.fee / 10000)) + ' goes onto the balance '
           + 'straight away. No interest for ' + XFER.months + ' months, then 24.9%.',
      okText:'Move it', yes:{type:'TRANSFER_YES'}};
    break;
  }
  case 'TRANSFER_YES': {
    var was3 = run(st).feasible ? run(st).cost : null;
    st.transfer = true;
    toast(st, 'Moved — ' + said(st, was3));
    break;
  }

  case 'BEST_TARGET': {
    var b = bestTarget(st);
    if (!b) { toast(st, 'Nothing is affordable at this budget'); break; }
    if (b.t.id === st.target) { toast(st, 'You are already on the best of the three'); break; }
    var was4 = run(st).cost;
    st.target = b.t.id;
    toast(st, 'Switched to ' + b.t.name.toLowerCase() + ' — ' + money(was4 - b.r.cost) + ' better');
    break;
  }

  case 'SET_TOGGLE': st.settings[A.key] = !st.settings[A.key]; break;

  default: break;
  }
  return st;
}

/* =========================================================== screens */
function tabbar(st){
  var items = [
    {id:'tab_plan',     text:'Plan',     icon:'chart',  tab:'plan'},
    {id:'tab_sched',    text:'Month by month', icon:'list', tab:'sched'},
    {id:'tab_debts',    text:'Debts',    icon:'money',  tab:'debts'},
    {id:'tab_settings', text:'Setup',    icon:'gear',   tab:'settings'}
  ].map(function(i){
    return {id:i.id, text:i.text, icon:i.icon, on:(st.ui.tab === i.tab), act:{type:'TAB', tab:i.tab}};
  });
  return N('tabbar', {id:'tabbar', items:items});
}
function outcome(st){
  var r = run(st);
  if (!r.feasible)
    return N('out', {id:'outcome', kicker:'Will not work', amount:money(st.budget) + ' a month',
      sub:'That does not cover the ' + money(LOAN.payment) + ' loan payment and the card minimum '
          + 'on top. Nothing can be planned until it does.',
      grid:[{v:'—', l:'debt free', hi:false}, {v:'—', l:'interest', hi:false},
            {v:'—', l:'total paid', hi:false}]});
  return N('out', {id:'outcome', kicker:'Debt free in', amount:years(r.months),
    sub:'The card goes at month ' + (r.cardMonth || '—') + ' and the loan at month '
        + (r.loanMonth || '—') + '. '
        + (st.transfer ? 'The transfer fee of ' + money(r.fee) + ' is counted in.'
                       : 'On the card as it stands, at 21.9%.'),
    grid:[{v:r.months + ' months', l:'to clear both', hi:true},
          {v:money(r.cost), l:'interest and fees', hi:false},
          {v:money(r.totalPaid), l:'paid in all', hi:false}]});
}
function slider(st){
  var i = BUDGETS.indexOf(st.budget);
  return N('slid', {id:'budget_slider', value:money(st.budget) + ' a month',
    caption:'The loan takes ' + money(LOAN.payment) + ' whatever happens; the card minimum is '
            + money(cardMin(CARD.start)) + ' to start with. Everything above that is yours to aim.',
    lo:money(BUDGETS[0]), hi:money(BUDGETS[BUDGETS.length-1]),
    ticks:BUDGETS.map(function(b, k){
      return {id:'bud_' + (b / 100), on:b === st.budget, pre:k < i,
        low:!simulate(b, st.target, st.transfer).feasible,
        act:{type:'BUDGET', n:b}};
    })});
}
function targetCard(st){
  var best = bestTarget(st);
  return N('card', {id:'target_card', cls:'flush', c: st.order.map(targetOf).map(function(t){
    var r = runWith(st, {target:t.id});
    return N('opt', {id:'tgt_' + t.id, on:st.target === t.id, name:t.name, sub:t.note,
      amount:r.feasible ? years(r.months) : 'not affordable',
      note:r.feasible ? money(r.cost) + ' in interest' : '',
      best:!!(best && best.t.id === t.id),
      act:{type:'TARGET', id:t.id}});
  })});
}

function scrPlan(st){
  var r = run(st), without = runWith(st, {transfer:false}), with_ = runWith(st, {transfer:true});
  return N('screen', {id:'scr_plan', name:'plan', c:[
    appbar('Bastion'),
    N('scroll', {id:'plan_scroll', c:[
      outcome(st),
      N('sec', {text:'What you can find each month'}),
      slider(st),
      N('sec', {text:'Where the surplus goes', side:bestTarget(st)
        ? 'cheapest: ' + bestTarget(st).t.name.split(' ').slice(-1)[0] : ''}),
      targetCard(st),
      N('padded', {c:[btn('use_best', 'Use whichever is cheapest', {type:'BEST_TARGET'}, 'block')]}),
      N('sec', {text:'The 0% offer'}),
      N('card', {id:'xfer_card', cls:'flush', c:[
        row('xfer_row', 'Move the card to 0% for ' + XFER.months + ' months',
          {sub:XFER.note, arrow:false,
           c:[N('switch', {id:'set_transfer', on:st.transfer, act:{type:'TRANSFER'}})]}),
        row('xfer_math', st.transfer ? 'With it' : 'If you took it',
          {lead:'money',
           sub:(st.settings.showFee
                ? 'fee ' + money(Math.ceil(CARD.start * XFER.fee / 10000)) + ' · ' : '')
               + 'clears in ' + years(with_.months) + ' against ' + years(without.months)
               + ' without',
           val:with_.cost < without.cost ? money(without.cost - with_.cost) + ' better'
                                         : money(with_.cost - without.cost) + ' worse',
           valCls:with_.cost < without.cost ? 'good' : 'bad', arrow:false})]}),
      N('sec', {text:'How the balances come down'}),
      N('chart', {id:'balance_chart', months:r.rows.length,
        bars:r.rows.map(function(x){
          var top = Math.max(CARD.start + 20000, LOAN.start);
          return {loan:Math.round(x.loan * 100 / top), card:Math.round(x.card * 100 / top)};
        }),
        lo:'month 1', hi:'month ' + (r.rows.length || 0),
        keys:[{c:'loan', t:'car loan'}, {c:'card', t:'credit card'}]}),
      N('space', {})
    ]}),
    tabbar(st)
  ]});
}

  var start = Math.max(0, Math.min(st.ui.month - 1, Math.max(0, r.rows.length - 12)));
  var slice = r.rows.slice(start, start + 12);
  return N('screen', {id:'scr_sched', name:'sched', c:[
    appbar('Month by month'),
    N('scroll', {id:'sched_scroll', c:[
      outcome(st),
      N('chips', {id:'jump_chips', c:[1, 13, 25, 37, 49].filter(function(m){
          return m <= Math.max(1, r.rows.length);
        }).map(function(m){
          return N('chip', {id:'mo_' + m, text:'from ' + m, on:start + 1 === m,
            act:{type:'MONTH', n:m}});
        })}),
      N('sec', {text:'Months ' + (start + 1) + '–' + (start + slice.length)}),
      (st.settings.showSchedule
        ? N('sched', {id:'schedule', rows:slice.map(function(x){
            return {m:x.m, card:money(x.card), loan:money(x.loan),
              int:money(x.ci + x.li), out:money(x.out),
              gone:x.card === 0 && x.loan === 0,
              mark:x.m === r.cardMonth || x.m === r.loanMonth};
          })})
        : txt('The table is switched off in Setup.', 'empty')),
      txt('Interest is worked out on the balance at the start of the month and added before '
          + 'anything is paid, which is why the first few months barely move.', 'muted'),
      N('sec', {text:'What the interest splits into'}),
      N('card', {id:'split_card', cls:'flush', c:[
        row('int_card', 'On the credit card', {lead:'money', val:money(r.interestCard),
          valCls:'bad', arrow:false,
          sub:r.cardMonth ? 'cleared at month ' + r.cardMonth : 'still running'}),
        row('int_loan', 'On the car loan', {lead:'money', val:money(r.interestLoan),
          valCls:'warn', arrow:false,
          sub:r.loanMonth ? 'cleared at month ' + r.loanMonth : 'still running'}),
        row('int_fee', 'Transfer fee', {lead:'money', val:money(r.fee),
          valCls:r.fee ? 'bad' : '', arrow:false,
          sub:st.transfer ? '2.9% of what was moved' : 'not taken'}),
        row('int_total', 'All in', {lead:'money', val:money(r.cost), valCls:'strong',
          arrow:false})]}),
      N('space', {})
    ]}),
    tabbar(st)
  ]});
}

      + '<div class="he-t">' + esc(n.title) + '</div>'
      + '<div class="he-s">' + esc(n.sub) + '</div>' + R(n.c) + '</div>';
  case 'pills':
    return '<div style="display:flex;gap:7px;flex-wrap:wrap;padding:8px 18px 4px"' + tid(n.id) + '>'
      + tagsHtml(n.items) + '</div>';
  case 'tabbar':
    return '<div class="n-tabbar"' + tid(n.id) + '>' + n.items.map(function(i){
      return '<div class="tb' + (i.on?' on':'') + '"' + tid(i.id) + bind(i.act) + '>'
        + '<i>' + icon(i.icon, 21) + '</i>' + esc(i.text) + '</div>';
    }).join('') + '</div>';
  case 'mask':  return '<div class="n-mask"' + tid(n.id) + bind(n.close) + '>' + R(n.c) + '</div>';
  case 'sheet':
    return '<div class="n-sheet"' + tid(n.id) + ' data-stop="1"><div class="sh-hd">'
      + '<div class="t">' + esc(n.title) + '</div>'
      + '<div class="iconbtn"' + tid(n.closeId) + bind(n.close) + '>' + icon('close',15) + '</div></div>'
      + '<div class="sh-bd">' + R(n.c) + '</div></div>';
  case 'dialog':
    return '<div class="dialog"' + tid(n.id) + ' data-stop="1">'
      + '<div style="padding:22px 20px 16px;text-align:center">'
      + (n.title ? '<div style="font:650 17px/1.3 var(--disp);margin-bottom:8px">' + esc(n.title) + '</div>' : '')
      + '<div style="font-size:13.5px;color:var(--ink2);line-height:1.55">' + esc(n.text) + '</div></div>'
      + '<div style="display:flex;gap:10px;padding:0 16px 16px">'
      + '<div class="n-btn" style="flex:1"' + tid(n.cancel.id) + bind(n.cancel.act) + '>' + esc(n.cancel.text) + '</div>'
      + '<div class="n-btn primary" style="flex:1"' + tid(n.ok.id) + bind(n.ok.act) + '>' + esc(n.ok.text) + '</div>'
      + '</div></div>';
  case 'toast': return '<div class="n-toast"' + tid(n.id) + '>' + esc(n.text) + '</div>';
  default: return renderExtra(n);
  }
}
function avatarHtml(a){
  return '<div class="av" style="width:38px;height:38px;border-radius:50%;flex:0 0 auto;display:flex;'
    + 'align-items:center;justify-content:center;font:700 14px/1 var(--disp);color:#fff;background:hsl('
    + a.hue + ' 52% 46%)">' + esc(a.initial) + '</div>';
}

function renderExtra(n){
  switch (n.t) {
  case 'out':
    return '<div class="out"' + tid(n.id) + '><div class="ou-k">' + esc(n.kicker) + '</div>'
      + '<div class="ou-n">' + esc(n.amount) + '</div>'
      + '<div class="ou-s">' + esc(n.sub) + '</div><div class="ou-g">'
      + n.grid.map(function(g){
          return '<div class="ou-i' + (g.hi?' hi':'') + '"><div class="v">' + esc(g.v)
            + '</div><div class="l">' + esc(g.l) + '</div></div>';
        }).join('') + '</div></div>';
  case 'slid':
    return '<div class="slid"' + tid(n.id) + '><div class="sl-v">' + esc(n.value) + '</div>'
      + '<div class="sl-c">' + esc(n.caption) + '</div>'
      + '<div class="sl-t" style="margin-top:12px">' + n.ticks.map(function(t){
          return '<div class="' + (t.on?'on':(t.low?'lo':(t.pre?'pre':''))) + '"'
            + tid(t.id) + bind(t.act) + '></div>';
        }).join('') + '</div>'
      + '<div class="sl-l"><span>' + esc(n.lo) + '</span><span>' + esc(n.hi) + '</span></div></div>';
  case 'opt':
    return '<div class="opt' + (n.on?' on':'') + '"' + tid(n.id) + bind(n.act) + '>'
      + '<div class="op-r"></div><div class="op-m"><div class="op-n">' + esc(n.name) + '</div>'
      + '<div class="op-s">' + esc(n.sub) + '</div></div>'
      + '<div class="op-v"><div class="op-a">' + esc(n.amount) + '</div>'
      + '<div class="op-b' + (n.best?' best':'') + '">' + esc(n.note) + '</div></div></div>';
  case 'chart':
    return '<div class="chart"' + tid(n.id) + '><div class="ch-b">'
      + n.bars.map(function(b){
          return '<span><u style="height:' + b.card + '%"></u><i style="height:' + b.loan
            + '%"></i></span>';
        }).join('') + '</div>'
      + '<div class="ch-x"><span>' + esc(n.lo) + '</span><span>' + esc(n.hi) + '</span></div>'
      + '<div class="ch-k">' + n.keys.map(function(k){
          return '<span><b style="background:' + (k.c === 'loan' ? 'var(--accent)' : 'var(--bad)')
            + '"></b>' + esc(k.t) + '</span>';
        }).join('') + '</div></div>';
  case 'sched': {
    var head = '<tr><th class="m">Month</th><th>Card</th><th>Loan</th><th>Interest</th>'
      + '<th>Paid</th></tr>';
    var body = n.rows.map(function(r){
      return '<tr class="' + (r.gone?'gone':'') + (r.mark?' mark':'') + '">'
        + '<td class="m">' + r.m + '</td><td>' + esc(r.card) + '</td><td>' + esc(r.loan)
        + '</td><td>' + esc(r.int) + '</td><td>' + esc(r.out) + '</td></tr>';
    }).join('');
    return '<div class="sched"' + tid(n.id) + '><table>' + head + body + '</table></div>';
  }
  default: return '';
  }
}

var STATE = null;
function paint(){
  ACTS = [];
  app.innerHTML = render(E.screen(STATE));
  var c = '';
  if (c) document.getElementById('sb-clock').textContent = c;
  if (!hud.classList.contains('off')) paintHud();
}
app.addEventListener('click', function(ev){
  var el = ev.target.closest('[data-act]'); if (!el) return;
  if (el.classList.contains('n-mask') && ev.target.closest('[data-stop]')) return;
  var act = ACTS[+el.getAttribute('data-act')]; if (!act) return;
  TRAJ.push({action:'tap', id: el.getAttribute('data-testid') || null});
  STATE = E.reduce(STATE, act); paint();
});
app.addEventListener('input', function(ev){
  var el = ev.target.closest('[data-actt]'); if (!el) return;
  var act = JSON.parse(JSON.stringify(ACTS[+el.getAttribute('data-actt')]));
  for (var k in act) if (act[k] === '$VALUE') act[k] = el.value;
  var id = el.getAttribute('data-testid'), pos = el.selectionStart;
  TRAJ.push({action:'type', id:id, text:el.value});
  STATE = E.reduce(STATE, act); paint();
  var again = id && app.querySelector('[data-testid="' + id + '"]');
  if (again && again.focus) { again.focus(); try { again.setSelectionRange(pos, pos); } catch(e){} }
});

function paintHud(){
  var d = E.derive(STATE);
  hud.innerHTML = '<h4>__ENV__ \u00b7 ' + E.ENV_ID + ' v' + E.VERSION + '</h4>'
    + '<div><span class="k">route</span> ' + d.route + '  <span class="k">step</span> ' + STATE.meta.steps + '</div>'
    + '<div><span class="k">months</span> ' + d.months + '  <span class="k">cost</span> ' + d.cost + '  <span class="k">target</span> ' + d.target + '</div>'
    + '<div style="margin-top:8px"><button id="hud-reset">reset</button>'
    + '<button id="hud-a11y">copy a11y</button><button id="hud-state">copy state</button>'
    + '<button id="hud-traj">copy traj</button><button id="hud-hide">hide (h)</button></div>'
    + '<pre>' + esc(E.a11y(STATE)) + '</pre>';
  hud.querySelector('#hud-reset').onclick = function(){ ENVAPI.reset({seed:STATE.meta.seed}); };
  hud.querySelector('#hud-a11y').onclick  = function(){ copy(E.a11y(STATE)); };
  hud.querySelector('#hud-state').onclick = function(){ copy(JSON.stringify(E.snapshot(STATE), null, 2)); };
  hud.querySelector('#hud-traj').onclick  = function(){ copy(JSON.stringify(TRAJ, null, 2)); };
  hud.querySelector('#hud-hide').onclick  = function(){ hud.classList.add('off'); };
}
function copy(t){ try { navigator.clipboard.writeText(t); } catch(e){} }
document.addEventListener('keydown', function(e){
  if (e.key === 'h') { hud.classList.toggle('off'); if (!hud.classList.contains('off')) paintHud(); }
});

var ENVAPI = {
  ENV_ID: E.ENV_ID, VERSION: E.VERSION,
  reset: function(opts){
    opts = opts || {};
    STATE = E.createInitialState(opts.seed || 0);
    if (opts.patch) E.applyPatch(STATE, opts.patch);
    TRAJ = []; paint();
    return E.snapshot(STATE);
  },
  getState:   function(){ return E.snapshot(STATE); },
  setState:   function(s){ STATE = JSON.parse(JSON.stringify(s)); paint(); return true; },
  step:       function(a){ var r = E.step(STATE, a); STATE = r.state; TRAJ.push(a); paint();
                           return {ok:r.ok, error:r.error || null}; },
  dispatch:   function(act){ STATE = E.reduce(STATE, act); paint(); return true; },
  a11y:       function(){ return E.a11y(STATE); },
  elements:   function(){ return E.elements(STATE); },
  route:      function(){ return E.select.route(STATE); },
  trajectory: function(){ return JSON.parse(JSON.stringify(TRAJ)); },
  bounds: function(){
    var base = document.getElementById('screen').getBoundingClientRect(), out = {};
    app.querySelectorAll('[data-testid]').forEach(function(el){
      var r = el.getBoundingClientRect();
      out[el.getAttribute('data-testid')] = {
        x:Math.round(r.left-base.left), y:Math.round(r.top-base.top),
        w:Math.round(r.width), h:Math.round(r.height),
        cx:Math.round(r.left-base.left+r.width/2), cy:Math.round(r.top-base.top+r.height/2)};
    });
    return out;
  }
};
window.__ENV__ = ENVAPI;
var qs = new URLSearchParams(location.search);
if (qs.get('bare') === '1') document.body.classList.add('bare');
if (qs.get('hud')  === '1') hud.classList.remove('off');
ENVAPI.reset({seed: parseInt(qs.get('seed') || '0', 10) || 0});
window.__ENV_READY__ = true;
})();
</script>
