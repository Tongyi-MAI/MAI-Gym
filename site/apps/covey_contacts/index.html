<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>通讯录 (mocked GUI env)</title>
<!--
  ============================================================================
  Contacts — a single-file H5 stock address book for agent research.

  Same two-block contract as every environment here: script#engine is a pure,
  DOM-free state machine on globalThis.GUI_ENGINE; script#ui renders its screen
  tree and exposes window.__ENV__.

  What is new: the duplicates are not a stored list. Every pair of cards is
  compared on every action — numbers normalised to E.164 first, so 07700
  900123 and +44 7700 900123 are the same number and 0800 and +44 800 are the
  same helpline — and what comes back is a set of suggestions with a reason
  attached to each.

  Merging is where it gets interesting. Phones, emails and groups union
  together and need no decision. Company, birthday and the name itself are
  single-valued, so when the two cards disagree the merge cannot proceed until
  something is chosen, field by field. And one of the four suggestions is a
  false positive: two different people who happen to share a name, whose only
  evidence is that name. Merging them destroys a real contact, and the app
  will let you.

  Everything is integer counts and normalised strings, so it reproduces.
  ============================================================================
-->
<style>
:root{
  --outer:#e3e6ee;
  --bezel:#12151f;
  --bg:#f2f2f7;
  --card:#ffffff;
  --card2:#f2f4f9;
  --line:#e4e4e9;
  --line2:#c8c8cd;
  --press:#ececf1;
  --chev:#c4c4c9;
  --ink:#0d0d10;
  --ink2:#48484d;
  --muted:#8a8a8f;
  --accent:#007aff;
  --accent-d:#0056cc;
  --accent-s:#e5f1ff;
  --on-accent:#ffffff;
  --good:#34c759;
  --good-s:#e6f8ec;
  --warn:#ff9500;
  --warn-s:#fff2e0;
  --bad:#ff3b30;
  --bad-s:#ffeae8;
  --bad-line:#f2c8c4;
  --btn:#ececf1;
  --btn-off:#e2e2e8;
  --off:#c8c8cd;
  --appbar:#f9f9fb;
  --appbar-ink:#161a27;
  --appbar-line:#e4e4e9;
  --tabbar:#f9f9fb;
  --scrim:rgba(13,13,16,.4);
  --toast:#0d0d10;
  --toast-ink:#ffffff;
  --hero:linear-gradient(140deg,#007aff,#5ac8fa);
  --hero-line:transparent;
  --hero-ink:#ffffff;
  --disp:-apple-system,"SF Pro Text",Helvetica,Arial,sans-serif;
  --r:18px; --r2:12px;
  --shadow:0 1px 2px rgba(16,18,26,.05),0 10px 26px rgba(16,18,26,.07);
  --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{background:var(--outer);color:var(--ink);font:14px/1.55 var(--ui);
  display:flex;align-items:center;justify-content:center;overflow:hidden}

#device{position:relative;width:390px;height:844px;background:var(--bezel);border-radius:46px;padding:5px;
  box-shadow:0 30px 70px rgba(0,0,0,.34);flex:0 0 auto}
#screen{position:relative;width:100%;height:100%;background:var(--bg);border-radius:41px;
  overflow:hidden;display:flex;flex-direction:column}
#notch{position:absolute;top:5px;left:50%;transform:translateX(-50%);width:118px;height:30px;
  background:var(--bezel);border-radius:0 0 18px 18px;z-index:60}
body.bare{background:var(--bg)}
body.bare #device{width:390px;height:844px;padding:0;border-radius:0;box-shadow:none;background:var(--bg)}
body.bare #screen{border-radius:0}
body.bare #notch{display:none}
body.bare .n-sheet{animation:none}

.statusbar{height:44px;flex:0 0 44px;display:flex;align-items:flex-end;justify-content:space-between;
  padding:0 22px 6px;font-size:13px;font-weight:600;z-index:50;color:var(--ink)}
.statusbar .sb-r{display:flex;gap:5px;align-items:center}
.sb-bat{width:22px;height:11px;border:1.3px solid currentColor;border-radius:3px;position:relative;opacity:.9}
.sb-bat:after{content:"";position:absolute;right:-3px;top:3px;width:2px;height:5px;background:currentColor;border-radius:0 1px 1px 0}
.sb-bat i{position:absolute;left:1.3px;top:1.3px;bottom:1.3px;width:78%;background:currentColor;border-radius:1px}

#app{flex:1 1 auto;display:flex;flex-direction:column;min-height:0;position:relative}

.n-appbar{flex:0 0 auto;min-height:52px;display:flex;align-items:center;gap:8px;padding:6px 12px;
  background:var(--appbar);color:var(--appbar-ink);z-index:20;border-bottom:1px solid var(--appbar-line)}
.n-appbar .ab-title{flex:1 1 auto;text-align:center;font:650 17px/1.3 var(--disp);letter-spacing:-.2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.n-appbar .ab-side{flex:0 0 auto;min-width:56px;display:flex;align-items:center;gap:2px}
.n-appbar .ab-side.right{justify-content:flex-end}
.n-appbar .iconbtn{color:var(--appbar-ink);opacity:.85}
.iconbtn{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  color:var(--ink2);cursor:pointer}
.iconbtn:active{background:var(--press)}

.n-scroll{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;padding-bottom:10px}
.n-scroll::-webkit-scrollbar{width:0}

.n-text{padding:2px 18px;color:var(--ink2)}
.n-text.h1{font:700 26px/1.18 var(--disp);color:var(--ink);padding:10px 18px 6px;letter-spacing:-.6px}
.n-text.h2{font:650 18px/1.3 var(--disp);color:var(--ink);padding:12px 18px 2px}
.n-text.body{font-size:13.5px;padding:5px 18px;line-height:1.7}
.n-text.muted{font-size:12.5px;color:var(--muted);padding:6px 18px;line-height:1.6}
.n-text.empty{padding:14px 18px 40px;text-align:center;color:var(--muted);font-size:13.5px}
.n-sec{padding:18px 18px 6px;font:700 11.5px/1 var(--ui);color:var(--muted);letter-spacing:1.3px;
  text-transform:uppercase;display:flex;justify-content:space-between;align-items:center;gap:10px}
.n-space{height:16px}

.n-card{background:var(--card);border-radius:var(--r);margin:9px 16px;overflow:hidden;border:1px solid var(--line)}
.n-card.flush{padding:0}
.n-card.pad{padding:14px 16px}
.n-card.tap{cursor:pointer}
.n-card.tap:active{background:var(--press)}

.n-row{display:flex;align-items:center;gap:13px;padding:12px 16px;border-bottom:1px solid var(--line);min-height:54px}
.n-row:last-child{border-bottom:none}
.n-row.tap{cursor:pointer}
.n-row.tap:active{background:var(--press)}
.n-row .r-lead{flex:0 0 auto;width:26px;color:var(--ink2);display:flex;align-items:center;justify-content:center}
.n-row .r-main{flex:1 1 auto;min-width:0}
.n-row .r-label{font-size:14.5px}
.n-row .r-label.strike{text-decoration:line-through;color:var(--muted)}
.n-row .r-sub{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.5}
.n-row .r-value{flex:0 0 auto;font-size:14px;color:var(--ink2);text-align:right;font-variant-numeric:tabular-nums}
.n-row .r-value.strong{color:var(--ink);font-weight:700}
.n-row .r-value.acc{color:var(--accent);font-weight:700}
.n-row .r-value.good{color:var(--good);font-weight:700}
.n-row .r-value.warn{color:var(--warn);font-weight:700}
.n-row .r-value.bad{color:var(--bad);font-weight:700}
.n-row .r-arrow{flex:0 0 auto;color:var(--chev);display:flex}

.n-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:47px;padding:0 20px;
  border-radius:13px;font:650 15px/1 var(--ui);background:var(--btn);color:var(--ink);
  border:none;cursor:pointer;user-select:none}
.n-btn:active{filter:brightness(.97)}
.n-btn.primary{background:var(--accent);color:var(--on-accent)}
.n-btn.primary.off{background:var(--btn-off);color:var(--muted);cursor:not-allowed}
.n-btn.ghost{background:transparent;border:1px solid var(--line2);height:37px;font-size:13px;padding:0 14px;color:var(--ink2)}
.n-btn.danger{background:transparent;border:1px solid var(--bad-line);color:var(--bad);height:37px;font-size:13px;padding:0 14px}
.n-btn.block{display:flex;width:100%}
.n-btnrow{display:flex;gap:10px;padding:12px 16px;justify-content:flex-end;align-items:center;flex-wrap:wrap}

.n-chips{display:flex;gap:8px;padding:8px 16px;overflow-x:auto}
.n-chips::-webkit-scrollbar{height:0}
.n-chip{flex:0 0 auto;height:34px;padding:0 14px;border-radius:11px;background:var(--card);
  border:1px solid var(--line2);display:flex;align-items:center;font-size:13px;
  color:var(--ink2);cursor:pointer;white-space:nowrap;font-weight:600}
.n-chip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}

.n-input{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line);background:var(--card)}
.n-input .i-label{flex:0 0 78px;font-size:13px;color:var(--muted)}
.n-input input{flex:1 1 auto;border:none;outline:none;background:transparent;font-size:14.5px;
  font-family:inherit;color:var(--ink);min-width:0}
.n-input input::placeholder{color:var(--muted)}
.n-switch{flex:0 0 auto;width:46px;height:27px;border-radius:14px;background:var(--off);position:relative;cursor:pointer;transition:background .16s}
.n-switch.on{background:var(--accent)}
.n-switch i{position:absolute;top:2.5px;left:2.5px;width:22px;height:22px;border-radius:50%;background:#fff;
  transition:transform .16s;box-shadow:0 1px 3px rgba(0,0,0,.22)}
.n-switch.on i{transform:translateX(19px)}
.n-check{flex:0 0 auto;width:23px;height:23px;border-radius:7px;border:1.8px solid var(--off);position:relative;background:var(--card)}
.n-check.on{border-color:var(--accent);background:var(--accent)}
.n-check.on:after{content:"";position:absolute;left:7.5px;top:4px;width:5px;height:10px;
  border:2px solid var(--on-accent);border-top:0;border-left:0;transform:rotate(42deg)}
.n-radio{flex:0 0 auto;width:22px;height:22px;border-radius:50%;border:1.8px solid var(--off);position:relative}
.n-radio.on{border-color:var(--accent);background:var(--accent)}
.n-radio.on:after{content:"";position:absolute;left:7px;top:4px;width:5px;height:9px;
  border:2px solid var(--on-accent);border-top:0;border-left:0;transform:rotate(42deg)}

.tag{display:inline-flex;align-items:center;padding:3px 9px;border-radius:20px;font-size:11px;
  font-weight:700;background:var(--btn);color:var(--ink2)}
.tag.acc{background:var(--accent-s);color:var(--accent)}
.tag.good{background:var(--good-s);color:var(--good)}
.tag.warn{background:var(--warn-s);color:var(--warn)}
.tag.bad{background:var(--bad-s);color:var(--bad)}

.n-tabbar{flex:0 0 auto;height:58px;background:var(--tabbar);border-top:1px solid var(--line);display:flex;z-index:30}
.n-tabbar .tb{flex:1 1 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--muted);font-size:10.5px;cursor:pointer;font-weight:600}
.n-tabbar .tb i{display:flex}
.n-tabbar .tb.on{color:var(--accent)}

.n-mask{position:absolute;inset:0;background:var(--scrim);z-index:70;display:flex;align-items:flex-end}
.n-sheet{width:100%;max-height:80%;background:var(--card);border-radius:22px 22px 0 0;display:flex;
  flex-direction:column;overflow:hidden;animation:up .18s ease-out}
@keyframes up{from{transform:translateY(24px)}to{transform:none}}
.n-sheet .sh-hd{padding:16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.n-sheet .sh-hd .t{font:650 17px/1.2 var(--disp)}
.n-sheet .sh-bd{flex:1 1 auto;overflow-y:auto;min-height:0}
.n-sheet .sh-bd::-webkit-scrollbar{width:0}
.n-toast{position:absolute;left:50%;bottom:118px;transform:translateX(-50%);background:var(--toast);
  color:var(--toast-ink);padding:11px 18px;border-radius:11px;font-size:13px;z-index:90;max-width:84%;text-align:center}
.dialog{margin:auto;width:82%;background:var(--card);border-radius:18px;overflow:hidden;border:1px solid var(--line)}

.stats{display:flex;gap:9px;padding:4px 16px}
.stat{flex:1 1 0;background:var(--card);border:1px solid var(--line);border-radius:var(--r2);padding:13px 12px}
.stat.tap{cursor:pointer}
.stat .st-n{font:800 19px/1.1 var(--disp);letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.stat .st-l{font-size:11px;color:var(--muted);margin-top:6px;line-height:1.4}
.stat.acc .st-n{color:var(--accent)}

.hero{margin:8px 16px 4px;padding:18px;border-radius:var(--r);background:var(--hero);
  border:1px solid var(--hero-line);color:var(--hero-ink)}
.hero.tap{cursor:pointer}
.hero .he-k{font-size:11px;letter-spacing:1.3px;text-transform:uppercase;font-weight:800;opacity:.85}
.hero .he-t{font:800 25px/1.16 var(--disp);margin-top:9px;letter-spacing:-.7px}
.hero .he-s{font-size:13px;margin-top:8px;line-height:1.6;opacity:.9}


.ctc{display:flex;align-items:center;gap:12px;padding:10px 15px;border-bottom:1px solid var(--line);
  cursor:pointer}
.ctc:last-child{border-bottom:none}
.ctc:active{background:var(--press)}
.ct-a{flex:0 0 auto;width:38px;height:38px;border-radius:19px;background:var(--btn);
  display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;
  color:var(--ink2)}
.ctc.dup .ct-a{background:var(--warn-s);color:var(--warn)}
.ctc.blocked .ct-a{background:var(--bad-s);color:var(--bad)}
.ct-m{flex:1 1 auto;min-width:0}
.ct-n{font-size:15.5px;font-weight:600}
.ct-n em{font-style:normal;font-size:11px;font-weight:600;color:var(--warn);margin-left:7px}
.ct-s{font-size:12.5px;color:var(--muted);margin-top:3px;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap}
.ct-f{flex:0 0 auto;color:var(--warn);font-size:14px}

.letter{padding:5px 16px;font:700 12px/1 var(--disp);color:var(--muted);background:var(--bg);
  letter-spacing:.6px}

.sugg{margin:0 16px 9px;padding:13px 14px;border-radius:var(--r);border:1px solid var(--line2);
  background:var(--card)}
.sg-t{font-size:14.5px;font-weight:700}
.sg-w{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.55}
.sg-w b{color:var(--ink2)}
.sg-c{display:inline-block;margin-top:9px;font-size:10.5px;font-weight:700;padding:3px 9px;
  border-radius:10px;letter-spacing:.4px}
.sg-c.strong{background:var(--good-s);color:var(--good)}
.sg-c.weak{background:var(--warn-s);color:var(--warn)}
.sg-b{display:flex;gap:8px;margin-top:12px}
.sg-b div{flex:1 1 0;padding:9px 0;text-align:center;border-radius:9px;font-size:13px;
  font-weight:600;cursor:pointer;background:var(--btn);color:var(--ink)}
.sg-b div.go{background:var(--accent);color:#fff}
.sg-b div:active{filter:brightness(.94)}

.mrg{margin:0 16px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  overflow:hidden}
.mg-f{padding:12px 14px;border-bottom:1px solid var(--line)}
.mg-f:last-child{border-bottom:none}
.mg-l{font-size:11px;color:var(--muted);letter-spacing:.5px;text-transform:uppercase}
.mg-o{display:flex;gap:8px;margin-top:9px}
.mg-o div{flex:1 1 0;padding:10px 11px;border:1.5px solid var(--line2);border-radius:9px;
  font-size:13.5px;cursor:pointer;background:var(--card);line-height:1.35}
.mg-o div.on{border-color:var(--accent);background:var(--accent-s);color:var(--accent-d);
  font-weight:600}
.mg-o div:active{background:var(--press)}
.mg-u{margin-top:8px;font-size:12.5px;color:var(--ink2);line-height:1.6}
.mg-u b{font-weight:600;color:var(--ink)}
.mg-w{font-size:11.5px;color:var(--warn);margin-top:7px}

</style>
</head>
<body>
<div id="device">
  <div id="notch"></div>
  <div id="screen">
    <div class="statusbar" id="sb">
      <div id="sb-clock">11:32</div>
      <div class="sb-r">
        <svg width="17" height="12" viewBox="0 0 17 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="4.6" y="5.5" width="3" height="6.5" rx="1"/><rect x="9.2" y="3" width="3" height="9" rx="1"/><rect x="13.8" y="0" width="3" height="12" rx="1"/></svg>
        <svg width="15" height="12" viewBox="0 0 15 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M1 4.2a9 9 0 0 1 13 0"/><path d="M3.4 6.9a5.6 5.6 0 0 1 8.2 0"/><circle cx="7.5" cy="10" r=".9" fill="currentColor" stroke="none"/></svg>
        <span class="sb-bat"><i></i></span>
      </div>
    </div>
    <div id="app"></div>
  </div>
</div>
<div id="hud" class="off"></div>

<script id="engine">
/* ===========================================================================
 * ENGINE — pure, deterministic, DOM-free.
 * 号码先规范化成 E.164 再比：默认国家 +44，前导 0 换成 +44。
 * 重复建议每一步都重算，合并时多值字段取并集、单值字段必须挑。
 * ======================================================================== */
(function(root){
'use strict';

var ENV_ID  = 'covey_contacts';
var VERSION = '1.0.0';

/* ------------------------------------------------------------- utilities */
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function pad2(n){ return (n < 10 ? '0' : '') + n; }
function hhmm(m){ m = ((m % 1440) + 1440) % 1440; return pad2(Math.floor(m/60)) + ':' + pad2(m%60); }
function sum(a){ var s = 0; for (var i=0;i<a.length;i++) s += a[i]; return s; }
function clamp(v, lo, hi){ return v < lo ? lo : (v > hi ? hi : v); }
function lcg(seed){ var s=(seed>>>0)||1; return function(){ s=(s*1664525+1013904223)>>>0; return s/4294967296; }; }
function shuffled(list, seed){
  if (!seed) return list.slice();
  var r = lcg(seed), a = list.slice();
  for (var i=a.length-1;i>0;i--){ var j = Math.floor(r()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
function money(p, sym){
  var neg = p < 0; p = Math.abs(p);
  return (neg ? '-' : '') + (sym === undefined ? '\u00a3' : sym) +
         (Math.floor(p/100)).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',') + '.' + pad2(p%100);
}
function getPath(o, path){
  var cur = o, parts = String(path).split('.');
  for (var i=0;i<parts.length;i++){
    var k = parts[i], m = k.match(/^(.*?)\[(\d+)\]$/);
    if (m){ cur = cur ? cur[m[1]] : undefined; cur = cur ? cur[+m[2]] : undefined; }
    else cur = cur ? cur[k] : undefined;
    if (cur === undefined) return undefined;
  }
  return cur;
}
function setPath(o, path, value){
  var parts = String(path).split('.'), cur = o;
  for (var i=0;i<parts.length-1;i++){
    var k = parts[i], m = k.match(/^(.*?)\[(\d+)\]$/);
    cur = m ? cur[m[1]][+m[2]] : (cur[k] = cur[k] || {});
  }
  var lastK = parts[parts.length-1], lm = lastK.match(/^(.*?)\[(\d+)\]$/);
  if (lm) cur[lm[1]][+lm[2]] = value; else cur[lastK] = value;
  return o;
}

/* ------------------------------------------- screen-tree node constructors */
function N(t, o){ o = o || {}; o.t = t; return o; }
function txt(s, cls){ return N('text', {text:s, cls:cls || ''}); }
function row(id, text, o){
  o = o || {}; o.id = id; o.text = text;
  if (o.arrow === undefined) o.arrow = !!o.act;
  return N('row', o);
}
function btn(id, text, act, cls, disabled){
  return N('btn', {id:id, text:text, act:act, cls:cls || '', disabled:!!disabled});
}
function iconbtn(id, ic, act, cls){ return N('iconbtn', {id:id, icon:ic, act:act, cls:cls || ''}); }
function appbar(title, o){ o = o || {}; o.title = title; return N('appbar', o); }
function stepper(id, value, minus, plus){
  return N('stepper', {id:id, value:value, minusId:id + '_dec', plusId:id + '_inc',
                       minus:minus, plus:plus});
}
function sheet(id, title, kids){
  return N('sheet', {id:id, title:title, closeId:id + '_close', close:{type:'CLOSE_SHEET'}, c:kids});
}
function route(st){ return st.ui.stack[st.ui.stack.length - 1]; }
function push(st, name, params){ st.ui.stack.push({name:name, params:params || {}}); st.ui.sheet = null; }
function pop(st){ if (st.ui.stack.length > 1) st.ui.stack.pop(); }
function toast(st, t){ st.ui.toast = t; }

/* ------------------------------------------------------- 号码规范化
 * 默认国家是英国（+44）。去掉空格括号连字符，前导 0 换成 +44，
 * 这样 07700 900123 和 +44 7700 900123 是同一个号。 */
var HOME_CC = '+44';
function normPhone(p){
  var s = ('' + p).replace(/[^0-9+]/g, '');
  if (s.charAt(0) === '+') return s;
  if (s.charAt(0) === '0') return HOME_CC + s.slice(1);
  return HOME_CC + s;
}
function prettyPhone(p){ return p; }
function normEmail(e){ return ('' + e).toLowerCase().trim(); }
function normName(n){ return ('' + n).toLowerCase().replace(/\s+/g, ' ').trim(); }

/* ------------------------------------------------------------ 联系人 */
function C(id, name, phones, emails, company, birthday, source, groups, fav, blocked){
  return {id:id, name:name, phones:phones || [], emails:emails || [], company:company || '',
          birthday:birthday || '', source:source, groups:groups || [],
          fav:!!fav, blocked:!!blocked};
}
var GROUPS = [
  {id:'g_work',   name:'Work'},
  {id:'g_family', name:'Family'},
  {id:'g_clients', name:'Clients'}
];
function groupOf(id){ for (var i=0;i<GROUPS.length;i++) if (GROUPS[i].id === id) return GROUPS[i]; return null; }

function personOf(st, id){
  for (var i=0;i<st.people.length;i++) if (st.people[i].id === id) return st.people[i];
  return null;
}
function initials(name){
  var p = name.split(' ');
  return (p[0].charAt(0) + (p.length > 1 ? p[p.length-1].charAt(0) : '')).toUpperCase();
}
function subtitleOf(c){
  if (c.phones.length) return c.phones[0] + (c.company ? ' · ' + c.company : '');
  if (c.emails.length) return c.emails[0] + (c.company ? ' · ' + c.company : '');
  return c.company || '没有号码也没有邮箱';
}

/* ------------------------------------------------- 重复检测（每次现算） */
function sharedPhone(a, b){
  var out = [];
  a.phones.forEach(function(p){
    b.phones.forEach(function(q){ if (normPhone(p) === normPhone(q)) out.push(normPhone(p)); });
  });
  return out;
}
function sharedEmail(a, b){
  var out = [];
  a.emails.forEach(function(p){
    b.emails.forEach(function(q){ if (normEmail(p) === normEmail(q)) out.push(normEmail(p)); });
  });
  return out;
}
function pairEvidence(a, b){
  var ph = sharedPhone(a, b), em = sharedEmail(a, b);
  var sameName = normName(a.name) === normName(b.name);
  if (ph.length)
    return {strong:true, why:'两张卡上是同一个号码 ' + ph[0]
            + '（' + a.phones[0] + ' 和 ' + b.phones[0] + ' 规范化以后一样）',
            kind:'phone'};
  if (em.length)
    return {strong:true, why:'两张卡上是同一个邮箱 ' + em[0], kind:'email'};
  if (sameName)
    return {strong:false, why:'只是名字一样，号码和邮箱都对不上',
            kind:'name'};
  return null;
}
function suggestions(st){
  var out = [];
  for (var i = 0; i < st.people.length; i++){
    for (var j = i + 1; j < st.people.length; j++){
      var a = st.people[i], b = st.people[j];
      if (st.dismissed.indexOf(a.id + '+' + b.id) >= 0) continue;
      var e = pairEvidence(a, b);
      if (e) out.push({a:a.id, b:b.id, name:a.name, strong:e.strong, why:e.why, kind:e.kind});
    }
  }
  out.sort(function(x, y){
    if (x.strong !== y.strong) return x.strong ? -1 : 1;
    return x.name < y.name ? -1 : 1;
  });
  return out;
}
function strongCount(st){ return suggestions(st).filter(function(s){ return s.strong; }).length; }

/* --------------------------------------------------------------- 合并 */
var SINGLE = [
  {id:'name',     label:'名字'},
  {id:'company',  label:'公司'},
  {id:'birthday', label:'生日'}
];
function conflictsOf(a, b){
  return SINGLE.filter(function(f){
    var x = a[f.id], y = b[f.id];
    return x && y && x !== y;
  }).map(function(f){ return f.id; });
}
function unionPhones(a, b){
  var seen = {}, out = [];
  a.phones.concat(b.phones).forEach(function(p){
    var k = normPhone(p);
    if (!seen[k]){ seen[k] = true; out.push(p); }
  });
  return out;
}
function unionEmails(a, b){
  var seen = {}, out = [];
  a.emails.concat(b.emails).forEach(function(e){
    var k = normEmail(e);
    if (!seen[k]){ seen[k] = true; out.push(e); }
  });
  return out;
}
function unionGroups(a, b){
  var out = a.groups.slice();
  b.groups.forEach(function(g){ if (out.indexOf(g) < 0) out.push(g); });
  return out;
}
function mergePreview(st){
  var m = st.merge;
  if (!m) return null;
  var a = personOf(st, m.a), b = personOf(st, m.b);
  if (!a || !b) return null;
  var picked = {};
  SINGLE.forEach(function(f){
    var x = a[f.id], y = b[f.id];
    if (x && y && x !== y) picked[f.id] = m.pick[f.id] === 'b' ? y : (m.pick[f.id] === 'a' ? x : null);
    else picked[f.id] = x || y || '';
  });
  var need = conflictsOf(a, b).filter(function(f){ return !m.pick[f]; });
  return {a:a, b:b, picked:picked, unresolved:need,
          phones:unionPhones(a, b), emails:unionEmails(a, b), groups:unionGroups(a, b)};
}
function letterOf(c){ return c.name.charAt(0).toUpperCase(); }
function surnameKey(n){
  var p = ('' + n).trim().split(/\s+/);
  return normName(p.length > 1 ? p[p.length - 1] + ' ' + p.slice(0, -1).join(' ') : n);
}
function sortedPeople(st){
  var key = st.settings.sortBySurname ? surnameKey : normName;
  return st.people.slice().sort(function(x, y){
    return key(x.name) < key(y.name) ? -1 : 1;
  });
}
function letterKey(st, c){
  return (st.settings.sortBySurname ? surnameKey(c.name) : c.name).charAt(0).toUpperCase();
}
function groupCount(st, gid){
  return st.people.filter(function(c){ return c.groups.indexOf(gid) >= 0; }).length;
}

/* =========================================================== reducer */
function reduce(prev, action){
  var st = clone(prev), A = action || {};
  st.ui.toast = null;
  st.meta.steps += 1;

  switch (A.type) {

  case 'NOOP': break;
  case 'FINISH': st.meta.finished = true; st.meta.answer = A.answer === undefined ? null : A.answer; break;

  case 'NAV': push(st, A.to, A.params); break;
  case 'BACK':
    if (st.ui.sheet) st.ui.sheet = null;
    else if (st.ui.confirm) st.ui.confirm = null;
    else { if (route(st).name === 'merge') st.merge = null; pop(st); }
    break;
  case 'TAB': {
    var roots = {people:'people', groups:'groups', settings:'settings'};
    st.ui.tab = A.tab; st.ui.sheet = null; st.ui.confirm = null;
    st.ui.stack = [{name:roots[A.tab] || 'people', params:{}}];
    break;
  }
  case 'HOME':
    st.ui.tab = 'people'; st.ui.stack = [{name:'people', params:{}}];
    st.ui.sheet = null; st.ui.confirm = null;
    break;
  case 'SET_INPUT': st.ui.inputs[A.field] = A.value; break;
  case 'OPEN_SHEET': st.ui.sheet = {type:A.sheet, id:A.id || null}; break;
  case 'CLOSE_SHEET': st.ui.sheet = null; break;
  case 'CONFIRM_NO': st.ui.confirm = null; break;
  case 'CONFIRM_YES': {
    var yes = st.ui.confirm && st.ui.confirm.yes; st.ui.confirm = null;
    if (yes) { var keep = st.meta.steps; var out = reduce(st, yes); out.meta.steps = keep; return out; }
    break;
  }
  case 'FILTER': st.filter = A.id; break;

  /* ---- 合并 ---- */
  case 'MERGE_OPEN': {
    var a = personOf(st, A.a), b = personOf(st, A.b);
    if (!a || !b) break;
    st.merge = {a:A.a, b:A.b, pick:{}};
    push(st, 'merge', {});
    break;
  }
  case 'MERGE_PICK': {
    if (!st.merge) break;
    st.merge.pick[A.field] = A.side;
    var p = mergePreview(st);
    if (!p) { st.merge = null; break; }
    toast(st, A.field + ' 选了 ' + (A.side === 'a' ? '左边' : '右边') + '的那个'
              + (p.unresolved.length ? '，还有 ' + p.unresolved.length + ' 处冲突没定'
                                     : '，冲突都定完了'));
    break;
  }
  case 'MERGE_DO': {
    var p2 = mergePreview(st);
    if (!p2) break;
    if (p2.unresolved.length){
      toast(st, '还有 ' + p2.unresolved.length + ' 处冲突没选：'
                + p2.unresolved.join('、') + '。选完才能合。');
      break;
    }
    var keep2 = C(p2.a.id, p2.picked.name, p2.phones, p2.emails, p2.picked.company,
                  p2.picked.birthday, p2.a.source, p2.groups,
                  p2.a.fav || p2.b.fav, p2.a.blocked || p2.b.blocked);
    var bId = p2.b.id;
    st.people = st.people.map(function(x){ return x.id === p2.a.id ? keep2 : x; })
                  .filter(function(x){ return x.id !== bId; });
    st.merged += 1;
    st.merge = null;
    if (route(st).name === 'merge') pop(st);
    toast(st, '合并完成，现在一共 ' + st.people.length + ' 个联系人');
    break;
  }
  case 'MERGE_CANCEL':
    st.merge = null;
    if (route(st).name === 'merge') pop(st);
    toast(st, '没有合并');
    break;
  case 'DISMISS': {
    var key = A.a + '+' + A.b;
    if (st.dismissed.indexOf(key) < 0) st.dismissed.push(key);
    toast(st, '这条建议已经忽略，剩 ' + suggestions(st).length + ' 条');
    break;
  }

  /* ---- 单张卡 ---- */
  case 'TOGGLE_FAV': {
    var c = personOf(st, A.id);
    if (!c) break;
    c.fav = !c.fav;
    toast(st, c.name + (c.fav ? ' 已加入常用' : ' 已移出常用'));
    break;
  }
  case 'TOGGLE_BLOCK': {
    var c2 = personOf(st, A.id);
    if (!c2) break;
    c2.blocked = !c2.blocked;
    toast(st, c2.name + (c2.blocked ? ' 已拦截' : ' 已解除拦截'));
    break;
  }
  case 'TOGGLE_GROUP': {
    var c3 = personOf(st, A.id);
    if (!c3) break;
    var i = c3.groups.indexOf(A.g);
    if (i >= 0) c3.groups.splice(i, 1); else c3.groups.push(A.g);
    toast(st, c3.name + (i >= 0 ? ' 移出 ' : ' 加入 ') + groupOf(A.g).name);
    break;
  }
  case 'DELETE': {
    var c4 = personOf(st, A.id);
    if (!c4) break;
    st.ui.confirm = {title:'删掉 ' + c4.name + '？', text:'这张卡上的号码和邮箱都会没了。',
      okText:'删除', yes:{type:'DELETE_YES', id:A.id}};
    break;
  }
  case 'DELETE_YES': {
    st.people = st.people.filter(function(x){ return x.id !== A.id; });
    if (st.merge && (st.merge.a === A.id || st.merge.b === A.id)) st.merge = null;
    if (route(st).name === 'card') pop(st);
    toast(st, '已删除，现在一共 ' + st.people.length + ' 个联系人');
    break;
  }

  case 'SET_TOGGLE': st.settings[A.key] = !st.settings[A.key]; break;

  default: break;
  }
  return st;
}

  var sugg = st.settings.suggestDupes ? suggestions(st) : [];
  var dupIds = {};
  sugg.forEach(function(s){ dupIds[s.a] = true; dupIds[s.b] = true; });
  var list = sortedPeople(st).filter(function(c){
    if (st.filter === 'fav') return c.fav;
    if (groupOf(st.filter)) return c.groups.indexOf(st.filter) >= 0;
    return true;
  });
  var body = [];
  var letter = '';
  list.forEach(function(c){
    var L = letterKey(st, c);
    if (L !== letter){ letter = L; body.push(N('letter', {text:L})); }
    body.push(contactRow(st, c, dupIds[c.id]));
  });

    appbar('联系人'),
    N('scroll', {id:'people_scroll', c:[
      N('stats', {id:'ct_stats', c:[
        N('stat', {id:'st_total', n:st.people.length + '', l:'联系人'}),
        N('stat', {id:'st_sugg', n:sugg.length + '', l:'合并建议', acc:sugg.length > 0}),
        N('stat', {id:'st_strong', n:strongCount(st) + '', l:'证据充分的'})
      ]}),
      N('sec', {text:'可能重复', side:sugg.length ? sugg.length + ' 组' : '没有了'}),
      N('card', {id:'sugg_wrap', cls:'bare', c: sugg.length
        ? sugg.map(function(s){ return suggCard(st, s); })
        : [txt(st.settings.suggestDupes ? '没有可疑的重复了。' : '重复检测在设置里关掉了。',
               'empty')]}),
      N('chips', {id:'filter_row', c: st.order.map(function(f){
        return N('chip', {id:'f_' + f, text:filterName(f), on:st.filter === f,

    var o = {id:'mf_' + f.id, label:f.label, clash:clash,
      leftText:x || '（空）', rightText:y || '（空）',
      leftOn:clash && st.merge.pick[f.id] === 'a',
      rightOn:clash && st.merge.pick[f.id] === 'b',
      value:clash ? (st.merge.pick[f.id] ? (st.merge.pick[f.id] === 'a' ? x : y) : '还没选')
                  : (x || y || '（两边都空）'),

    N('scroll', {id:'merge_scroll', c:[
      N('sugg', {id:'merge_head', title:p.a.name + ' × 2',

        conf:p.unresolved.length ? '还有 ' + p.unresolved.length + ' 处要选' : '可以合并了',
        strong:p.unresolved.length === 0,
        mergeId:'do_merge', merge:{type:'MERGE_DO'},

      N('mrg', {id:'merge_fields', fields:fields}),

  if (Array.isArray(n)) { for (var i=0;i<n.length;i++) collect(n[i], out); return; }
  if (n.t === 'appbar' && n.back) out.push({id:'nav_back', act:{type:'BACK'}, text:'Back', t:'back'});
  if (n.id && n.act)              out.push({id:n.id, act:n.act, text:labelOf(n), t:n.t||'el',
                                            disabled:!!n.disabled,

      var sib = n[k.slice(0, -2)];
      if (sib && typeof sib === 'object' && sib.type)
        out.push({id:n[k], act:sib, text:k.slice(0, -2), t:'sub'});

    if (el.disabled) return {state:st, ok:false, error:'ELEMENT_DISABLED: ' + a.id};
    return {state:reduce(st, el.act), ok:true};

  case 'type': {
    var e2 = findEl(st, a.id);
    if (!e2) return {state:st, ok:false, error:'ELEMENT_NOT_FOUND: ' + a.id};
    if (!e2.input) return {state:st, ok:false, error:'NOT_A_TEXT_FIELD: ' + a.id};
    return {state:reduce(st, substitute(e2.act, a.text == null ? '' : String(a.text))), ok:true};
  }
  case 'back':   return {state:reduce(st, {type:'BACK'}), ok:true};
  case 'home':   return {state:reduce(st, {type:'HOME'}), ok:true};
  case 'wait':   return {state:reduce(st, {type:'NOOP'}), ok:true};

/* ------------------------------------------------- text observation (a11y) */
function a11y(st){
  var rootNode = screen(st), lines = [], r = route(st);

  var masks = (rootNode.c || []).filter(function(n){ return n.t === 'mask'; });
  if (masks.length) lines.push('# An overlay is open. Nothing behind it can be tapped.');

function tid(n){ return (n && n.id && n.act) ? ' #' + n.id : ''; }

function walkText(n, d, out, st){
  if (!n || typeof n !== 'object') return;
  if (Array.isArray(n)) { n.forEach(function(x){ walkText(x, d, out, st); }); return; }
  var line = null;
  switch (n.t) {
  case 'screen': break;
  case 'appbar': line = '[AppBar] ' + (n.title || '') + (n.back ? '   Back #nav_back' : ''); break;
  case 'iconbtn': line = '[IconButton]' + tid(n) + ' ' + n.icon; break;
  case 'inputrow':
    line = '[TextField]' + tid(n) + ' ' + (n.label || '') + ' value="' + (n.value || '') + '"'; break;
  case 'chip':   line = '[Chip]' + tid(n) + ' ' + n.text + (n.on ? '  [selected]' : ''); break;
  case 'btn':    line = '[Button]' + (n.id ? ' #' + n.id : '') + ' ' + n.text + (n.disabled ? ' (disabled)' : ''); break;
  case 'row': {
    var s = '[Row]' + tid(n) + ' ' + (n.text || '') + (n.strike ? ' (crossed out)' : '');
    if (n.val) s += ' \u2014 ' + n.val;
    if (n.sub) s += '   (' + n.sub + ')';
    line = s; break;
  }
  case 'switch': line = '[Toggle]' + tid(n) + ' ' + (n.on ? 'ON' : 'OFF'); break;
  case 'check':  line = '[Checkbox]' + tid(n) + ' ' + (n.on ? 'ticked' : 'not ticked'); break;
  case 'radio':  line = '[Radio]' + tid(n) + ' ' + (n.on ? 'selected' : 'not selected'); break;
  case 'stepper':
    line = '[Stepper] ' + n.value + '  down #' + n.minusId + '  up #' + n.plusId; break;
  case 'hero':
    out.push(ind(d) + '[Hero]' + tid(n) + ' ' + n.kicker + ' \u2014 ' + n.title + '. ' + n.sub);
    return;
  case 'stat':   line = '[Stat]' + tid(n) + ' ' + n.l + ': ' + n.n; break;
  case 'pills':  line = n.items.map(function(p){ return '[' + p.text + ']'; }).join(' '); break;
  case 'sec':    line = '\u2014 ' + n.text + (n.side ? ' (' + n.side + ')' : '') + ' \u2014'; break;
  case 'text':   line = n.text || null; break;
  case 'tabbar':
    out.push(ind(d) + '[TabBar] ' + n.items.map(function(i){
      return i.text + ' #' + i.id + (i.on ? '[current]' : ''); }).join('  '));
    return;
  case 'sheet':  line = '[Sheet] ' + n.title + '   close #' + n.closeId; break;
  case 'dialog': line = '[Dialog] ' + (n.title ? n.title + ' \u2014 ' : '') + n.text; break;
  case 'mask': case 'toast': line = null; break;

    if (extra === true) return;
    line = extra || null;
  }
  }
  if (line !== null) out.push(ind(d) + line);
  for (var k in n){
    if (SKIP_KEYS[k]) continue;
    var v = n[k];
    if (v && typeof v === 'object') walkText(v, line !== null ? d+1 : d, out, st);
  }
}
/* per-environment nodes: return a string to print, true if already printed,
 * or null to ignore */
function walkExtra(n, d, out, st){

  if (n.t === 'ctc'){
    out.push(ind(d) + '[联系人]' + tid(n) + ' ' + n.name + (n.flag ? ' [' + n.flag + ']' : '')
             + (n.fav ? ' [常用]' : '') + (n.blocked ? ' [已拦截]' : ''));
    out.push(ind(d+1) + n.sub);
    return true;
  }
  if (n.t === 'letter'){ out.push(ind(d) + '— ' + n.text + ' —'); return true; }
  if (n.t === 'sugg'){
    out.push(ind(d) + '[建议] ' + n.title + '   (' + n.conf + ')');
    n.why.split('<br>').forEach(function(x){
      out.push(ind(d+1) + x.replace(/<[^>]+>/g, ''));
    });
    out.push(ind(d+1) + '合并 #' + n.mergeId + '   不是同一个人 #' + n.skipId);
    return true;
  }
  if (n.t === 'mrg'){
    out.push(ind(d) + '[要选的字段]');
    n.fields.forEach(function(f){
      out.push(ind(d+1) + f.label + '：合并后 ' + f.value + (f.warn ? '  ← ' + f.warn : ''));
      if (f.clash)
        out.push(ind(d+2) + '左 ' + f.leftText + ' #' + f.leftId
                 + (f.leftOn ? '*' : '') + '   右 ' + f.rightText + ' #' + f.rightId
                 + (f.rightOn ? '*' : ''));
    });
    return true;
  }

  return null;
}

function derive(st){
  var sugg = suggestions(st);

    tab: st.ui.tab,
    filter: st.filter,
    contactCount: st.people.length,

    listOrder: sortedPeople(st).map(function(c){ return c.name; }),
    nameCounts: byName,

    blocked: st.people.filter(function(c){ return c.blocked; })

    answer: st.meta.answer

  (patch || []).forEach(function(p){ setPath(st, p.path, clone(p.value)); });

}

  var d = SVG[name]; if (!d) return '';
  return '<span class="ico ' + (cls||'') + '" style="width:' + (size||20) + 'px;height:' + (size||20) +
    'px;display:inline-flex;flex:0 0 auto"><svg viewBox="0 0 24 24" width="100%" height="100%" fill="' +
    (FILLED[name] ? 'currentColor' : 'none') + '" stroke="currentColor" stroke-width="1.7" ' +
    'stroke-linecap="round" stroke-linejoin="round">' + d + '</svg></span>';
}

var ACTS = [], TRAJ = [];
function bind(a){ if (!a) return ''; ACTS.push(a); return ' data-act="' + (ACTS.length-1) + '"'; }
function bindT(a){ if (!a) return ''; ACTS.push(a); return ' data-actt="' + (ACTS.length-1) + '"'; }
function tid(id){ return id ? ' data-testid="' + esc(id) + '"' : ''; }
function R(list){ return (list||[]).map(render).join(''); }
function tagsHtml(items){
  return (items||[]).map(function(t){
    return '<span class="tag ' + (t.cls||'') + '">' + esc(t.text) + '</span>'; }).join('');
}

function render(n){
  if (!n || typeof n !== 'object') return '';
  if (Array.isArray(n)) return R(n);
  switch (n.t) {
  case 'screen': return R(n.c);
  case 'appbar': {
    var left = (n.back
      ? '<div class="iconbtn" data-testid="nav_back"' + bind({type:'BACK'}) + '>' + icon('back',19) + '</div>'
      : '') + R(n.left);
    return '<div class="n-appbar"' + tid(n.id) + '><div class="ab-side">' + left + '</div>'
      + '<div class="ab-title">' + esc(n.title) + '</div>'
      + '<div class="ab-side right">' + R(n.right) + '</div></div>';
  }
  case 'iconbtn': return '<div class="iconbtn ' + esc(n.cls||'') + '"' + tid(n.id) + bind(n.act) + '>' + icon(n.icon, 19) + '</div>';
  case 'scroll':  return '<div class="n-scroll"' + tid(n.id) + '>' + R(n.c) + '</div>';
  case 'chips':   return '<div class="n-chips"' + tid(n.id) + '>' + R(n.c) + '</div>';
  case 'chip':    return '<div class="n-chip' + (n.on?' on':'') + '"' + tid(n.id) + bind(n.act) + '>' + esc(n.text) + '</div>';
  case 'card':    return '<div class="n-card ' + esc(n.cls||'') + (n.act?' tap':'') + '"' + tid(n.id) + bind(n.act) + '>' + R(n.c) + '</div>';
  case 'padded':  return '<div style="padding:5px 16px">' + R(n.c) + '</div>';
  case 'sec':     return '<div class="n-sec"' + tid(n.id) + '><span>' + esc(n.text) + '</span>'
                       + (n.side ? '<span>' + esc(n.side) + '</span>' : '') + '</div>';
  case 'text':    return '<div class="n-text ' + esc(n.cls||'') + '">' + esc(n.text) + '</div>';
  case 'space':   return '<div class="n-space"></div>';
  case 'row': {
    var inline = [], below = [];
    (n.c||[]).forEach(function(ch){
      (ch.t==='switch'||ch.t==='radio'||ch.t==='check'||ch.t==='stepper'||ch.t==='btn'||ch.t==='iconbtn')
        ? inline.push(ch) : below.push(ch);
    });
    return '<div class="n-row' + (n.act?' tap':'') + '"' + tid(n.id) + bind(n.act) + '>'
      + (n.lead ? '<div class="r-lead"' + (n.leadColour ? ' style="color:' + esc(n.leadColour) + '"' : '')
                + '>' + icon(n.lead, 19) + '</div>' : '')
      + (n.avatar ? avatarHtml(n.avatar) : '')
      + (n.thumb && typeof thumbHtml === 'function' ? thumbHtml(n.thumb) : '')
      + '<div class="r-main"><div class="r-label' + (n.strike?' strike':'') + '">' + esc(n.text) + '</div>'
      + (n.sub ? '<div class="r-sub">' + esc(n.sub) + '</div>' : '') + '</div>'
      + (n.val ? '<div class="r-value ' + esc(n.valCls||'') + '">' + esc(n.val) + '</div>' : '')
      + R(inline)
      + (n.arrow && !inline.length ? '<div class="r-arrow">' + icon('arrow',15) + '</div>' : '')
      + '</div>' + R(below);
  }
  case 'btn':
    return '<div class="n-btn ' + esc(n.cls||'') + (n.disabled?' off':'') + '"' + tid(n.id)
      + (n.disabled?'':bind(n.act)) + '>' + esc(n.text) + '</div>';
  case 'btnrow': return '<div class="n-btnrow"' + tid(n.id) + '>' + R(n.c) + '</div>';
  case 'bar':    return '<div style="flex:0 0 auto;background:var(--card);border-top:1px solid var(--line);'
                      + 'padding:12px 16px 16px;z-index:30"' + tid(n.id) + '>' + R(n.c) + '</div>';
  case 'switch': return '<div class="n-switch' + (n.on?' on':'') + '"' + tid(n.id) + bind(n.act) + '><i></i></div>';
  case 'check':  return '<div class="n-check' + (n.on?' on':'') + '"' + tid(n.id) + bind(n.act) + '></div>';
  case 'radio':  return '<div class="n-radio' + (n.on?' on':'') + '"' + tid(n.id) + bind(n.act) + '></div>';
  case 'inputrow':
    return '<div class="n-input"><div class="i-label">' + esc(n.label) + '</div>'
      + '<input' + tid(n.id) + bindT(n.act) + ' value="' + esc(n.value) + '" placeholder="'
      + esc(n.placeholder) + '"></div>';
  case 'stepper':
    return '<div style="display:flex;align-items:center;gap:8px"' + tid(n.id) + '>'
      + '<div class="iconbtn" style="background:var(--btn);width:30px;height:30px"' + tid(n.minusId) + bind(n.minus) + '>' + icon('minus',14) + '</div>'
      + '<div style="min-width:52px;text-align:center;font-weight:700;font-size:12.5px;font-variant-numeric:tabular-nums">'
      + esc(n.value) + '</div>'
      + '<div class="iconbtn" style="background:var(--btn);width:30px;height:30px"' + tid(n.plusId) + bind(n.plus) + '>' + icon('plus',14) + '</div></div>';
  case 'stats':  return '<div class="stats"' + tid(n.id) + '>' + R(n.c) + '</div>';
  case 'stat':
    return '<div class="stat' + (n.acc?' acc':'') + (n.act?' tap':'') + '"' + tid(n.id) + bind(n.act)
      + '><div class="st-n">' + esc(n.n) + '</div><div class="st-l">' + esc(n.l) + '</div></div>';
  case 'hero':
    return '<div class="hero' + (n.act?' tap':'') + '"' + tid(n.id) + bind(n.act) + '>'
      + '<div class="he-k">' + esc(n.kicker) + '</div>'
      + '<div class="he-t">' + esc(n.title) + '</div>'
      + '<div class="he-s">' + esc(n.sub) + '</div>' + R(n.c) + '</div>';
  case 'pills':
    return '<div style="display:flex;gap:7px;flex-wrap:wrap;padding:8px 18px 4px"' + tid(n.id) + '>'
      + tagsHtml(n.items) + '</div>';
  case 'tabbar':
    return '<div class="n-tabbar"' + tid(n.id) + '>' + n.items.map(function(i){
      return '<div class="tb' + (i.on?' on':'') + '"' + tid(i.id) + bind(i.act) + '>'
        + '<i>' + icon(i.icon, 21) + '</i>' + esc(i.text) + '</div>';
    }).join('') + '</div>';
  case 'mask':  return '<div class="n-mask"' + tid(n.id) + bind(n.close) + '>' + R(n.c) + '</div>';
  case 'sheet':
    return '<div class="n-sheet"' + tid(n.id) + ' data-stop="1"><div class="sh-hd">'
      + '<div class="t">' + esc(n.title) + '</div>'
      + '<div class="iconbtn"' + tid(n.closeId) + bind(n.close) + '>' + icon('close',15) + '</div></div>'
      + '<div class="sh-bd">' + R(n.c) + '</div></div>';
  case 'dialog':
    return '<div class="dialog"' + tid(n.id) + ' data-stop="1">'
      + '<div style="padding:22px 20px 16px;text-align:center">'
      + (n.title ? '<div style="font:650 17px/1.3 var(--disp);margin-bottom:8px">' + esc(n.title) + '</div>' : '')
      + '<div style="font-size:13.5px;color:var(--ink2);line-height:1.55">' + esc(n.text) + '</div></div>'
      + '<div style="display:flex;gap:10px;padding:0 16px 16px">'
      + '<div class="n-btn" style="flex:1"' + tid(n.cancel.id) + bind(n.cancel.act) + '>' + esc(n.cancel.text) + '</div>'
      + '<div class="n-btn primary" style="flex:1"' + tid(n.ok.id) + bind(n.ok.act) + '>' + esc(n.ok.text) + '</div>'
      + '</div></div>';
  case 'toast': return '<div class="n-toast"' + tid(n.id) + '>' + esc(n.text) + '</div>';
  default: return renderExtra(n);
  }
}
function avatarHtml(a){
  return '<div class="av" style="width:38px;height:38px;border-radius:50%;flex:0 0 auto;display:flex;'
    + 'align-items:center;justify-content:center;font:700 14px/1 var(--disp);color:#fff;background:hsl('
    + a.hue + ' 52% 46%)">' + esc(a.initial) + '</div>';
}

function renderExtra(n){
  switch (n.t) {
  case 'ctc':
    return '<div class="ctc' + (n.dup?' dup':'') + (n.blocked?' blocked':'') + '"' + tid(n.id)
      + bind(n.act) + '><div class="ct-a">' + esc(n.init) + '</div>'
      + '<div class="ct-m"><div class="ct-n">' + esc(n.name)
      + (n.flag ? '<em>' + esc(n.flag) + '</em>' : '') + '</div>'
      + '<div class="ct-s">' + esc(n.sub) + '</div></div>'
      + (n.fav ? '<div class="ct-f">' + icon('star', 15) + '</div>' : '') + '</div>';
  case 'letter':
    return '<div class="letter">' + esc(n.text) + '</div>';
  case 'sugg':
    return '<div class="sugg"' + tid(n.id) + '><div class="sg-t">' + esc(n.title) + '</div>'
      + '<div class="sg-w">' + n.why + '</div>'
      + '<div class="sg-c ' + (n.strong?'strong':'weak') + '">' + esc(n.conf) + '</div>'
      + '<div class="sg-b">'
      + '<div class="go"' + tid(n.mergeId) + bind(n.merge) + '>合并</div>'
      + '<div' + tid(n.skipId) + bind(n.skip) + '>不是同一个人</div></div></div>';
  case 'mrg':
    return '<div class="mrg"' + tid(n.id) + '>' + n.fields.map(function(f){
      return '<div class="mg-f"' + tid(f.id) + '><div class="mg-l">' + esc(f.label) + '</div>'
        + (f.clash
           ? '<div class="mg-o">'
             + '<div class="' + (f.leftOn?'on':'') + '"' + tid(f.leftId) + bind(f.left) + '>'
             + esc(f.leftText) + '</div>'
             + '<div class="' + (f.rightOn?'on':'') + '"' + tid(f.rightId) + bind(f.right) + '>'
             + esc(f.rightText) + '</div></div>'
           : '')
        + '<div class="mg-u">合并后：<b>' + esc(f.value) + '</b></div>'
        + (f.warn ? '<div class="mg-w">' + esc(f.warn) + '</div>' : '') + '</div>';
    }).join('') + '</div>';
  default: return '';
  }
}

var STATE = null;
function paint(){
  ACTS = [];
  app.innerHTML = render(E.screen(STATE));
  var c = '';
  if (c) document.getElementById('sb-clock').textContent = c;
  if (!hud.classList.contains('off')) paintHud();
}
app.addEventListener('click', function(ev){
  var el = ev.target.closest('[data-act]'); if (!el) return;
  if (el.classList.contains('n-mask') && ev.target.closest('[data-stop]')) return;
  var act = ACTS[+el.getAttribute('data-act')]; if (!act) return;
  TRAJ.push({action:'tap', id: el.getAttribute('data-testid') || null});
  STATE = E.reduce(STATE, act); paint();
});
app.addEventListener('input', function(ev){
  var el = ev.target.closest('[data-actt]'); if (!el) return;
  var act = JSON.parse(JSON.stringify(ACTS[+el.getAttribute('data-actt')]));
  for (var k in act) if (act[k] === '$VALUE') act[k] = el.value;
  var id = el.getAttribute('data-testid'), pos = el.selectionStart;
  TRAJ.push({action:'type', id:id, text:el.value});
  STATE = E.reduce(STATE, act); paint();
  var again = id && app.querySelector('[data-testid="' + id + '"]');
  if (again && again.focus) { again.focus(); try { again.setSelectionRange(pos, pos); } catch(e){} }
});

function paintHud(){
  var d = E.derive(STATE);
  hud.innerHTML = '<h4>__ENV__ \u00b7 ' + E.ENV_ID + ' v' + E.VERSION + '</h4>'
    + '<div><span class="k">route</span> ' + d.route + '  <span class="k">step</span> ' + STATE.meta.steps + '</div>'
    + '<div><span class="k">n</span> ' + d.contactCount + '  <span class="k">dupes</span> ' + d.suggestionCount + '  <span class="k">merged</span> ' + d.mergedCount + '</div>'
    + '<div style="margin-top:8px"><button id="hud-reset">reset</button>'
    + '<button id="hud-a11y">copy a11y</button><button id="hud-state">copy state</button>'
    + '<button id="hud-traj">copy traj</button><button id="hud-hide">hide (h)</button></div>'
    + '<pre>' + esc(E.a11y(STATE)) + '</pre>';
  hud.querySelector('#hud-reset').onclick = function(){ ENVAPI.reset({seed:STATE.meta.seed}); };
  hud.querySelector('#hud-a11y').onclick  = function(){ copy(E.a11y(STATE)); };
  hud.querySelector('#hud-state').onclick = function(){ copy(JSON.stringify(E.snapshot(STATE), null, 2)); };
  hud.querySelector('#hud-traj').onclick  = function(){ copy(JSON.stringify(TRAJ, null, 2)); };
  hud.querySelector('#hud-hide').onclick  = function(){ hud.classList.add('off'); };
}
function copy(t){ try { navigator.clipboard.writeText(t); } catch(e){} }
document.addEventListener('keydown', function(e){
  if (e.key === 'h') { hud.classList.toggle('off'); if (!hud.classList.contains('off')) paintHud(); }
});

var ENVAPI = {
  ENV_ID: E.ENV_ID, VERSION: E.VERSION,
  reset: function(opts){
    opts = opts || {};
    STATE = E.createInitialState(opts.seed || 0);
    if (opts.patch) E.applyPatch(STATE, opts.patch);
    TRAJ = []; paint();
    return E.snapshot(STATE);
  },
  getState:   function(){ return E.snapshot(STATE); },
  setState:   function(s){ STATE = JSON.parse(JSON.stringify(s)); paint(); return true; },
  step:       function(a){ var r = E.step(STATE, a); STATE = r.state; TRAJ.push(a); paint();
                           return {ok:r.ok, error:r.error || null}; },
  dispatch:   function(act){ STATE = E.reduce(STATE, act); paint(); return true; },
  a11y:       function(){ return E.a11y(STATE); },
  elements:   function(){ return E.elements(STATE); },
  route:      function(){ return E.select.route(STATE); },
  trajectory: function(){ return JSON.parse(JSON.stringify(TRAJ)); },
  bounds: function(){
    var base = document.getElementById('screen').getBoundingClientRect(), out = {};
    app.querySelectorAll('[data-testid]').forEach(function(el){
      var r = el.getBoundingClientRect();
      out[el.getAttribute('data-testid')] = {
        x:Math.round(r.left-base.left), y:Math.round(r.top-base.top),
        w:Math.round(r.width), h:Math.round(r.height),
        cx:Math.round(r.left-base.left+r.width/2), cy:Math.round(r.top-base.top+r.height/2)};
    });
    return out;
  }
};
window.__ENV__ = ENVAPI;
var qs = new URLSearchParams(location.search);
if (qs.get('bare') === '1') document.body.classList.add('bare');
if (qs.get('hud')  === '1') hud.classList.remove('off');
ENVAPI.reset({seed: parseInt(qs.get('seed') || '0', 10) || 0});
window.__ENV_READY__ = true;
})();
</script>
