<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Ironwood (mocked GUI env)</title>
<!--
  ============================================================================
  Ironwood — a single-file H5 strength-training log for agent research.

  Same two-block contract as every environment here: script#engine is a pure,
  DOM-free state machine on globalThis.GUI_ENGINE; script#ui renders its screen
  tree and exposes window.__ENV__.

  What is new: a session that is *running*. Most of these environments are
  browse-and-commit; this one has a live workout with an exercise you are on, a
  set you are about to log, and a duration that grows out of what you actually
  did — forty-five seconds a set plus whatever rest you took — never out of how
  many taps it took to get there.

  Every mass is an integer in grams, so kilos and pounds are two views of one
  number and switching units cannot lose a gram. Volume is sets x reps x mass,
  a personal best is the heaviest completed set ever logged for a lift, and the
  plate calculator is honest greedy arithmetic on a 20 kg bar. Nothing on any
  screen is stored prose about numbers: it is the numbers.
  ============================================================================
-->
<style>
:root{
  --bg:#0d1014; --card:#161a21; --card2:#1d222b; --line:#242a35; --line2:#2f3745;
  --ink:#f2f5f9; --ink2:#9aa6b8; --muted:#6b7688;
  --accent:#c9f24a; --accent-d:#a8d02c; --accent-s:#1e2618;
  --hot:#ff6b3d; --good:#3ddc84; --bad:#ff5c5c; --gold:#ffc861;
  --r:18px; --r2:12px;
  --disp:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{background:#05070a;color:var(--ink);
  font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  display:flex;align-items:center;justify-content:center;overflow:hidden}

#device{position:relative;width:390px;height:844px;background:#000;border-radius:46px;padding:5px;
  box-shadow:0 30px 70px rgba(0,0,0,.6);flex:0 0 auto}
#screen{position:relative;width:100%;height:100%;background:var(--bg);border-radius:41px;
  overflow:hidden;display:flex;flex-direction:column}
#notch{position:absolute;top:5px;left:50%;transform:translateX(-50%);width:118px;height:30px;
  background:#000;border-radius:0 0 18px 18px;z-index:60}
body.bare{background:var(--bg)}
body.bare #device{width:390px;height:844px;padding:0;border-radius:0;box-shadow:none;background:var(--bg)}
body.bare #screen{border-radius:0}
body.bare #notch{display:none}
body.bare .n-sheet{animation:none}

.statusbar{height:44px;flex:0 0 44px;display:flex;align-items:flex-end;justify-content:space-between;
  padding:0 22px 6px;font-size:13px;font-weight:600;z-index:50;color:var(--ink)}
.statusbar .sb-r{display:flex;gap:5px;align-items:center}
.sb-bat{width:22px;height:11px;border:1.3px solid currentColor;border-radius:3px;position:relative;opacity:.9}
.sb-bat:after{content:"";position:absolute;right:-3px;top:3px;width:2px;height:5px;background:currentColor;border-radius:0 1px 1px 0}
.sb-bat i{position:absolute;left:1.3px;top:1.3px;bottom:1.3px;width:78%;background:currentColor;border-radius:1px}

#app{flex:1 1 auto;display:flex;flex-direction:column;min-height:0;position:relative}

.n-appbar{flex:0 0 auto;min-height:52px;display:flex;align-items:center;gap:8px;padding:6px 12px;
  background:var(--bg);z-index:20}
.n-appbar .ab-title{flex:1 1 auto;text-align:center;font:700 17px/1.3 var(--disp);letter-spacing:-.2px}
.n-appbar .ab-side{flex:0 0 auto;min-width:56px;display:flex;align-items:center;gap:4px}
.n-appbar .ab-side.right{justify-content:flex-end}
.iconbtn{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  color:var(--ink2);cursor:pointer}
.iconbtn:active{background:var(--card2)}

.n-scroll{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;padding-bottom:10px}
.n-scroll::-webkit-scrollbar{width:0}

.n-text{padding:2px 18px;color:var(--ink2)}
.n-text.h1{font:800 27px/1.15 var(--disp);color:var(--ink);padding:10px 18px 4px;letter-spacing:-.8px}
.n-text.body{font-size:13.5px;padding:5px 18px;line-height:1.65}
.n-text.muted{font-size:12.5px;color:var(--muted);padding:6px 18px;line-height:1.6}
.n-text.empty{padding:12px 18px 40px;text-align:center;color:var(--muted);font-size:13.5px}
.n-sec{padding:18px 18px 8px;font:700 11.5px/1 var(--disp);color:var(--muted);letter-spacing:1.4px;
  text-transform:uppercase;display:flex;justify-content:space-between;align-items:center}
.n-space{height:16px}

.n-card{background:var(--card);border-radius:var(--r);margin:9px 16px;overflow:hidden;border:1px solid var(--line)}
.n-card.flush{padding:0}
.n-card.tap{cursor:pointer}
.n-card.tap:active{background:var(--card2)}

.n-row{display:flex;align-items:center;gap:13px;padding:13px 16px;border-bottom:1px solid var(--line);min-height:54px}
.n-row:last-child{border-bottom:none}
.n-row.tap{cursor:pointer}
.n-row.tap:active{background:var(--card2)}
.n-row .r-lead{flex:0 0 auto;width:26px;color:var(--ink2);display:flex;align-items:center;justify-content:center}
.n-row .r-main{flex:1 1 auto;min-width:0}
.n-row .r-label{font-size:14.5px;font-weight:550}
.n-row .r-sub{font-size:12px;color:var(--muted);margin-top:3px}
.n-row .r-value{flex:0 0 auto;font-size:14px;color:var(--ink2);text-align:right;font-variant-numeric:tabular-nums}
.n-row .r-value.strong{color:var(--ink);font-weight:700}
.n-row .r-value.acc{color:var(--accent);font-weight:800}
.n-row .r-value.good{color:var(--good);font-weight:700}
.n-row .r-value.bad{color:var(--bad);font-weight:700}
.n-row .r-arrow{flex:0 0 auto;color:#49525f;display:flex}

.n-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 20px;
  border-radius:14px;font:750 15px/1 var(--disp);background:var(--card2);color:var(--ink);
  border:none;cursor:pointer;user-select:none}
.n-btn:active{filter:brightness(1.15)}
.n-btn.primary{background:var(--accent);color:#111}
.n-btn.primary.off{background:#39412c;color:#7d8a63;cursor:not-allowed}
.n-btn.hot{background:var(--hot);color:#fff}
.n-btn.ghost{background:transparent;border:1px solid var(--line2);height:38px;font-size:13px;padding:0 14px;color:var(--ink2)}
.n-btn.danger{background:transparent;border:1px solid #55282a;color:var(--bad);height:38px;font-size:13px;padding:0 14px}
.n-btn.block{display:flex;width:100%}
.n-btnrow{display:flex;gap:10px;padding:12px 16px;justify-content:flex-end;align-items:center}

.n-chips{display:flex;gap:8px;padding:8px 16px;overflow-x:auto}
.n-chips::-webkit-scrollbar{height:0}
.n-chip{flex:0 0 auto;height:34px;padding:0 14px;border-radius:11px;background:var(--card);
  border:1px solid var(--line2);display:flex;align-items:center;font-size:13px;
  color:var(--ink2);cursor:pointer;white-space:nowrap;font-weight:600}
.n-chip.on{background:var(--accent);border-color:var(--accent);color:#111;font-weight:800}

.n-input{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line);background:var(--card)}
.n-input .i-label{flex:0 0 74px;font-size:13px;color:var(--muted)}
.n-input input{flex:1 1 auto;border:none;outline:none;background:transparent;font-size:14.5px;
  font-family:inherit;color:var(--ink);min-width:0}
.n-input input::placeholder{color:var(--muted)}
.n-switch{flex:0 0 auto;width:46px;height:27px;border-radius:14px;background:#333b48;position:relative;cursor:pointer;transition:background .16s}
.n-switch.on{background:var(--accent)}
.n-switch i{position:absolute;top:2.5px;left:2.5px;width:22px;height:22px;border-radius:50%;background:#fff;
  transition:transform .16s}
.n-switch.on i{transform:translateX(19px);background:#111}
.n-radio{flex:0 0 auto;width:22px;height:22px;border-radius:50%;border:1.8px solid #3d4553;position:relative}
.n-radio.on{border-color:var(--accent);background:var(--accent)}
.n-radio.on:after{content:"";position:absolute;left:7px;top:4px;width:5px;height:9px;
  border:2px solid #111;border-top:0;border-left:0;transform:rotate(42deg)}

/* ---------------- hero + rings ---------------- */
.hero{margin:6px 16px 4px;padding:20px;border-radius:var(--r);background:
  radial-gradient(120% 130% at 100% 0%,#20301a 0%,#161a21 58%);border:1px solid var(--line)}
.hero .he-k{font-size:11.5px;letter-spacing:1.3px;text-transform:uppercase;color:var(--accent);font-weight:800}
.hero .he-t{font:800 25px/1.15 var(--disp);margin-top:9px;letter-spacing:-.7px}
.hero .he-s{font-size:13px;color:var(--ink2);margin-top:8px;line-height:1.6}
.hero .he-row{display:flex;align-items:center;gap:16px;margin-top:14px}

.ring{flex:0 0 auto;position:relative;width:84px;height:84px}
.ring svg{transform:rotate(-90deg)}
.ring .rg-t{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .rg-n{font:800 20px/1 var(--disp);letter-spacing:-.5px}
.ring .rg-l{font-size:8.5px;color:var(--muted);margin-top:3px;text-transform:uppercase;letter-spacing:.2px}

.stats{display:flex;gap:9px;padding:4px 16px}
.stat{flex:1 1 0;background:var(--card);border:1px solid var(--line);border-radius:var(--r2);padding:13px 12px}
.stat .st-n{font:800 20px/1 var(--disp);letter-spacing:-.6px;font-variant-numeric:tabular-nums}
.stat .st-l{font-size:11px;color:var(--muted);margin-top:6px}
.stat.acc .st-n{color:var(--accent)}

.bars{margin:8px 16px;padding:16px 14px 10px;background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
.bars .bs-row{display:flex;align-items:flex-end;gap:8px;height:104px}
.bars .bs-b{flex:1 1 0;display:flex;flex-direction:column;align-items:center;gap:7px;height:100%;justify-content:flex-end}
.bars .bs-fill{width:100%;border-radius:6px 6px 3px 3px;background:linear-gradient(180deg,#3f4d29,#2a3320);min-height:3px}
.bars .bs-b.on .bs-fill{background:linear-gradient(180deg,var(--accent),#8fae2f)}
.bars .bs-l{font-size:10.5px;color:var(--muted);font-weight:600}
.bars .bs-hd{display:flex;justify-content:space-between;margin-bottom:12px;align-items:baseline}
.bars .bs-hd b{font:800 19px/1 var(--disp);letter-spacing:-.5px}
.bars .bs-hd span{font-size:11.5px;color:var(--muted)}

/* ---------------- live session ---------------- */
.now{margin:8px 16px;padding:18px;border-radius:var(--r);background:var(--card);border:1px solid var(--line2)}
.now .nw-k{font-size:11px;letter-spacing:1.3px;text-transform:uppercase;color:var(--accent);font-weight:800}
.now .nw-n{font:800 24px/1.15 var(--disp);margin-top:8px;letter-spacing:-.6px}
.now .nw-s{font-size:12.5px;color:var(--ink2);margin-top:7px}
.dots{display:flex;gap:6px;margin-top:14px}
.dots i{flex:1 1 0;height:5px;border-radius:3px;background:#2b3341}
.dots i.done{background:var(--accent)}
.dots i.on{background:var(--ink2)}

.bigstep{display:flex;align-items:center;gap:12px;padding:12px 16px}
.bigstep .bs-lab{flex:0 0 54px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;font-weight:700}
.bigstep .bs-val{flex:1 1 auto;text-align:center;font:800 30px/1 var(--disp);letter-spacing:-1px;
  font-variant-numeric:tabular-nums}
.bigstep .bs-val small{font-size:14px;color:var(--ink2);font-weight:650;margin-left:3px}
.bigstep .kb{width:46px;height:46px;border-radius:14px;background:var(--card2);color:var(--ink);
  display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto;border:1px solid var(--line2)}
.bigstep .kb:active{background:#2a3240}

.setrow{display:flex;align-items:center;gap:12px;padding:11px 16px;border-bottom:1px solid var(--line)}
.setrow:last-child{border-bottom:none}
.setrow .sr-i{flex:0 0 26px;height:26px;border-radius:8px;background:var(--card2);color:var(--ink2);
  display:flex;align-items:center;justify-content:center;font:700 12px/1 var(--mono)}
.setrow.done .sr-i{background:var(--accent-s);color:var(--accent)}
.setrow .sr-m{flex:1 1 auto;font-size:14.5px;font-weight:600;font-variant-numeric:tabular-nums}
.setrow .sr-s{font-size:11.5px;color:var(--muted);margin-top:3px;font-weight:400}
.setrow .sr-v{flex:0 0 auto;font-size:12px;color:var(--muted)}
.setrow .sr-v.pb{color:var(--accent);font-weight:800}

.plates{display:flex;gap:6px;flex-wrap:wrap;padding:4px 16px 12px;align-items:center}
.plate{display:inline-flex;align-items:center;justify-content:center;height:26px;padding:0 10px;border-radius:6px;
  font:800 11.5px/1 var(--mono);background:var(--card2);color:var(--ink);border:1px solid var(--line2)}
.plate.p25{background:#3b1f24;border-color:#59303a;color:#ff9aa8}
.plate.p20{background:#1c2a3f;border-color:#2c4468;color:#8fb8ff}
.plate.p15{background:#3a2f18;border-color:#584a26;color:#ffd58a}
.plate.p10{background:#1e3324;border-color:#2d4c37;color:#8fe0ac}
.plate.bar{background:transparent;color:var(--muted)}

.tag{display:inline-flex;align-items:center;padding:3px 9px;border-radius:20px;font-size:11px;
  font-weight:700;background:var(--card2);color:var(--ink2)}
.tag.acc{background:var(--accent-s);color:var(--accent)}
.tag.good{background:#12301f;color:var(--good)}
.tag.hot{background:#3a2016;color:var(--hot)}

.exicon{flex:0 0 auto;width:42px;height:42px;border-radius:12px;display:flex;align-items:center;
  justify-content:center;background:var(--card2);color:var(--accent)}

.n-tabbar{flex:0 0 auto;height:60px;background:#0f1319;border-top:1px solid var(--line);display:flex;z-index:30}
.n-tabbar .tb{flex:1 1 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  color:var(--muted);font-size:10.5px;cursor:pointer;font-weight:650}
.n-tabbar .tb i{display:flex}
.n-tabbar .tb.on{color:var(--accent)}

.n-mask{position:absolute;inset:0;background:rgba(0,0,0,.62);z-index:70;display:flex;align-items:flex-end}
.n-sheet{width:100%;max-height:80%;background:var(--card);border-radius:22px 22px 0 0;display:flex;
  flex-direction:column;overflow:hidden;animation:up .18s ease-out;border-top:1px solid var(--line2)}
@keyframes up{from{transform:translateY(24px)}to{transform:none}}
.n-sheet .sh-hd{padding:16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.n-sheet .sh-hd .t{font:750 17px/1.2 var(--disp)}
.n-sheet .sh-bd{flex:1 1 auto;overflow-y:auto;min-height:0}
.n-sheet .sh-bd::-webkit-scrollbar{width:0}
.n-toast{position:absolute;left:50%;bottom:124px;transform:translateX(-50%);background:var(--accent);color:#111;
  padding:11px 18px;border-radius:12px;font-size:13px;font-weight:700;z-index:90;max-width:82%;text-align:center}
.dialog{margin:auto;width:82%;background:var(--card);border:1px solid var(--line2);border-radius:18px;overflow:hidden}

#hud{position:fixed;top:14px;left:14px;width:310px;max-height:calc(100% - 28px);overflow:auto;
  background:#11151b;color:#c8cde0;border-radius:12px;padding:12px;
  font:11.5px/1.5 var(--mono);z-index:200;box-shadow:0 10px 30px rgba(0,0,0,.5)}
#hud h4{margin:0 0 8px;font-size:12px;color:#fff}
#hud .k{color:#7b8399}
#hud pre{margin:6px 0 0;white-space:pre-wrap;word-break:break-word;color:#c9f24a;max-height:250px;overflow:auto}
#hud button{background:#232838;border:none;color:#c8cde0;border-radius:6px;padding:5px 9px;margin:2px 4px 2px 0;font:inherit;cursor:pointer}
#hud.off{display:none}
</style>
</head>
<body>
<div id="device">
  <div id="notch"></div>
  <div id="screen">
    <div class="statusbar" id="sb">
      <div id="sb-clock">18:40</div>
      <div class="sb-r">
        <svg width="17" height="12" viewBox="0 0 17 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="4.6" y="5.5" width="3" height="6.5" rx="1"/><rect x="9.2" y="3" width="3" height="9" rx="1"/><rect x="13.8" y="0" width="3" height="12" rx="1"/></svg>
        <svg width="15" height="12" viewBox="0 0 15 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M1 4.2a9 9 0 0 1 13 0"/><path d="M3.4 6.9a5.6 5.6 0 0 1 8.2 0"/><circle cx="7.5" cy="10" r=".9" fill="currentColor" stroke="none"/></svg>
        <span class="sb-bat"><i></i></span>
      </div>
    </div>
    <div id="app"></div>
  </div>
</div>
<div id="hud" class="off"></div>

<script id="engine">
/* ===========================================================================
 * ENGINE — pure, deterministic, DOM-free.
 *
 * Every mass is an integer in GRAMS. Kilos and pounds are two renderings of
 * the same integer, so switching units is a display change and never a data
 * change. Volume is the sum of mass x reps over completed sets. Duration is
 * the sum of what you did: SET_SECONDS per logged set plus the rest you took.
 * ======================================================================== */
(function(root){
'use strict';

var ENV_ID  = 'ironwood_gym';
var VERSION = '1.0.0';
var CLOCK0  = 1120;          /* 18:40, the time the app was opened */
var SET_SECONDS = 45;        /* how long a working set is counted as taking */
var BAR_G   = 20000;         /* an Olympic bar */
var PLATES  = [25000, 20000, 15000, 10000, 5000, 2500, 1250];
var STEP_G  = 2500;          /* the weight stepper moves in 2.5 kg */
var TODAY   = 'Thursday';

/* ------------------------------------------------------------- utilities */
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function pad2(n){ return (n < 10 ? '0' : '') + n; }
function hhmm(m){ m = ((m % 1440) + 1440) % 1440; return pad2(Math.floor(m/60)) + ':' + pad2(m%60); }
function mmss(sec){ return Math.floor(sec/60) + ':' + pad2(sec % 60); }
function sum(a){ var s = 0; for (var i=0;i<a.length;i++) s += a[i]; return s; }
function lcg(seed){ var s=(seed>>>0)||1; return function(){ s=(s*1664525+1013904223)>>>0; return s/4294967296; }; }
function shuffled(list, seed){
  if (!seed) return list.slice();
  var r = lcg(seed), a = list.slice();
  for (var i=a.length-1;i>0;i--){ var j = Math.floor(r()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
function getPath(o, path){
  var cur = o, parts = String(path).split('.');
  for (var i=0;i<parts.length;i++){
    var k = parts[i], m = k.match(/^(.*?)\[(\d+)\]$/);
    if (m){ cur = cur ? cur[m[1]] : undefined; cur = cur ? cur[+m[2]] : undefined; }
    else cur = cur ? cur[k] : undefined;
    if (cur === undefined) return undefined;
  }
  return cur;
}
function setPath(o, path, value){
  var parts = String(path).split('.'), cur = o;
  for (var i=0;i<parts.length-1;i++){
    var k = parts[i], m = k.match(/^(.*?)\[(\d+)\]$/);
    cur = m ? cur[m[1]][+m[2]] : (cur[k] = cur[k] || {});
  }
  var lastK = parts[parts.length-1], lm = lastK.match(/^(.*?)\[(\d+)\]$/);
  if (lm) cur[lm[1]][+lm[2]] = value; else cur[lastK] = value;
  return o;
}

/* --------------------------------------------------------------- units */
/* grams -> tenths of a kilo / tenths of a pound, in integers only */
function kgTenths(g){ return Math.round(g / 100); }
function lbTenths(g){ return Math.round(g * 22046 / 1000000); }
function fmtTenths(t){
  var whole = Math.floor(Math.abs(t) / 10), dec = Math.abs(t) % 10;
  return (t < 0 ? '-' : '') + whole + (dec ? '.' + dec : '');
}
function mass(g, units){
  if (g === 0) return 'bodyweight';
  return fmtTenths(units === 'lb' ? lbTenths(g) : kgTenths(g)) + ' ' + (units === 'lb' ? 'lb' : 'kg');
}
function massNum(g, units){ return fmtTenths(units === 'lb' ? lbTenths(g) : kgTenths(g)); }
function volumeText(g, units){
  /* volume gets big, so it is shown in whole units */
  var n = units === 'lb' ? Math.round(lbTenths(g) / 10) : Math.round(kgTenths(g) / 10);
  var s = String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return s + ' ' + (units === 'lb' ? 'lb' : 'kg');
}
/* greedy plate maths on one side of the bar */
function plateBreakdown(g){
  if (g <= BAR_G) return null;
  var side = (g - BAR_G) / 2, out = [], rest = side;
  if (side !== Math.floor(side)) return null;
  PLATES.forEach(function(p){
    var n = Math.floor(rest / p);
    if (n > 0) { out.push({plate:p, n:n}); rest -= n * p; }
  });
  return rest === 0 ? out : null;
}

/* ===========================================================================
 * THE CATALOGUE
 * ======================================================================== */
var GROUPS = [

/* a set only counts towards volume if it moved a mass */
function setVolume(s){ return s.w * s.r; }
function entryVolume(e){ return sum(e.sets.map(setVolume)); }
function sessionVolume(s){ return sum((s.entries || []).map(entryVolume)); }
function sessionSets(s){ return sum((s.entries || []).map(function(e){ return e.sets.length; })); }
function sessionReps(s){
  return sum((s.entries || []).map(function(e){ return sum(e.sets.map(function(x){ return x.r; })); }));
}
function weekVolume(st, week){
  return sum(st.history.filter(function(s){ return s.week === week; }).map(sessionVolume));
}
function weekSessions(st, week){
  return st.history.filter(function(s){ return s.week === week; }).length;
}
/* the heaviest completed set ever logged for a lift; for bodyweight work the
 * mass is zero everywhere, so the tie-break on reps is what actually ranks */
function bestSet(st, exId){
  var best = null;
  st.history.forEach(function(s){
    (s.entries || []).forEach(function(e){
      if (e.ex !== exId) return;
      e.sets.forEach(function(x){
        if (!best || x.w > best.w || (x.w === best.w && x.r > best.r))
          best = {w:x.w, r:x.r, date:s.date, session:s.name};
      });
    });
  });
  return best;
}
function lastTimeOn(st, exId){
  for (var i = st.history.length - 1; i >= 0; i--){
    var s = st.history[i];
    for (var j = 0; j < (s.entries || []).length; j++)
      if (s.entries[j].ex === exId) return {session:s, entry:s.entries[j]};
  }
  return null;
}
function isPB(st, exId, w, r){
  var b = bestSet(st, exId);
  if (b && !(w > b.w || (w === b.w && r > b.r))) return false;
  /* the second identical set of the day is not a second personal best */
  var live = st.session ? st.session.entries.filter(function(e){ return e.ex === exId; })[0] : null;
  if (live) {
    for (var i = 0; i < live.sets.length; i++){
      var x = live.sets[i];
      if (!(w > x.w || (w === x.w && r > x.r))) return false;
    }
  }
  return true;
}
function allPBs(st){
  var out = {};
  EXERCISES.forEach(function(e){
    var b = bestSet(st, e.id);
    if (b) out[e.id] = b;
  });
  return out;
}

function createInitialState(seed){

    /* the seed permutes which order the library offers equally valid lifts in */
    libraryOrder:shuffled(EXERCISES.map(function(e){ return e.id; }), seed),
    settings:{units:'kg', restSeconds:90, weeklyTarget:3, plateHelper:true, notifyRest:true}
  };
}
function route(st){ return st.ui.stack[st.ui.stack.length - 1]; }
function push(st, name, params){ st.ui.stack.push({name:name, params:params || {}}); st.ui.sheet = null; }
function pop(st){ if (st.ui.stack.length > 1) st.ui.stack.pop(); }
function toast(st, t){ st.ui.toast = t; }
function units(st){ return st.settings.units; }
function curEntry(st){ return st.session ? st.session.entries[st.session.idx] : null; }
function sessionOf(st, id){ for (var i=0;i<st.history.length;i++) if (st.history[i].id === id) return st.history[i]; return null; }

/* ===========================================================================
 * REDUCER
 * ======================================================================== */
function reduce(prev, action){
  var st = clone(prev), A = action || {};
  st.ui.toast = null;
  st.meta.steps += 1;

  switch (A.type) {

  case 'NOOP': break;
  case 'FINISH': st.meta.finished = true; st.meta.answer = A.answer === undefined ? null : A.answer; break;

  /* ---- navigation ---- */
  case 'NAV': push(st, A.to, A.params); break;
  case 'BACK':
    if (st.ui.sheet) st.ui.sheet = null;
    else if (st.ui.confirm) st.ui.confirm = null;
    else pop(st);
    break;
  case 'TAB': {
    var roots = {today:'today', routines:'routines', history:'history', progress:'progress'};
    st.ui.tab = A.tab; st.ui.sheet = null; st.ui.confirm = null;
    st.ui.stack = [{name:roots[A.tab] || 'today', params:{}}];
    break;
  }
  case 'HOME':
    st.ui.tab = 'today'; st.ui.stack = [{name:'today', params:{}}];
    st.ui.sheet = null; st.ui.confirm = null;
    break;
  case 'SET_INPUT': st.ui.inputs[A.field] = A.value; break;
  case 'OPEN_SHEET': st.ui.sheet = {type:A.sheet, id:A.id || null}; break;
  case 'CLOSE_SHEET': st.ui.sheet = null; break;
  case 'CONFIRM_NO': st.ui.confirm = null; break;
  case 'CONFIRM_YES': {
    var yes = st.ui.confirm && st.ui.confirm.yes; st.ui.confirm = null;
    if (yes) { var keep = st.meta.steps; var out = reduce(st, yes); out.meta.steps = keep; return out; }
    break;
  }

  /* ---- routines ---- */
  case 'ROUTINE_ADD_EX': {
    var rt = routine(st, A.routine);
    if (!rt) break;
    if (rt.items.filter(function(i){ return i.ex === A.ex; }).length) {
      toast(st, exName(A.ex) + ' is already in ' + rt.name);
      st.ui.sheet = null;
      break;
    }
    var ex = exercise(A.ex);
    rt.items.push({ex:A.ex, sets:3, reps:ex.timed ? 45 : 10,
                   weight:ex.kit === 'bodyweight' ? 0 : 20000});
    st.ui.sheet = null;
    toast(st, exName(A.ex) + ' added to ' + rt.name);
    break;
  }
  case 'ROUTINE_RM_EX': {
    var rt2 = routine(st, A.routine);
    if (!rt2) break;
    var before = rt2.items.length;
    rt2.items = rt2.items.filter(function(i){ return i.ex !== A.ex; });
    if (rt2.items.length < before) toast(st, exName(A.ex) + ' removed from ' + rt2.name);
    break;
  }
  case 'TARGET_SETS': {
    var rt3 = routine(st, A.routine);
    if (!rt3) break;
    rt3.items.forEach(function(i){
      if (i.ex === A.ex) i.sets = Math.max(1, Math.min(8, i.sets + A.delta));
    });
    break;
  }

  /* ---- the live session ---- */
  case 'SESSION_START': {
    if (st.session) { toast(st, 'A workout is already running'); break; }
    var rt4 = routine(st, A.routine);
    if (!rt4) break;
    st.session = {
      routine:rt4.id, name:rt4.name, started:st.meta.clock, elapsed:0, idx:0, restTaken:0,
      entries:rt4.items.map(function(i){
        return {ex:i.ex, target:{sets:i.sets, reps:i.reps, weight:i.weight}, sets:[]};
      })
    };
    var first = rt4.items[0];
    st.session.weight = first ? first.weight : 20000;
    st.session.reps   = first ? first.reps : 8;
    st.ui.stack = [{name:'session', params:{}}];
    st.ui.tab = 'today';
    break;
  }
  case 'W_STEP': {
    if (!st.session) break;
    st.session.weight = Math.max(0, st.session.weight + A.delta * STEP_G);
    break;
  }
  case 'R_STEP': {
    if (!st.session) break;
    var timed = (exercise(curEntry(st).ex) || {}).timed;
    st.session.reps = Math.max(1, st.session.reps + A.delta * (timed ? 5 : 1));
    break;
  }
  case 'LOG_SET': {
    if (!st.session) break;
    var e = curEntry(st);
    var pb = isPB(st, e.ex, st.session.weight, st.session.reps);
    e.sets.push({w:st.session.weight, r:st.session.reps, pb:pb});
    st.session.elapsed += SET_SECONDS;
    toast(st, pb ? 'New personal best on ' + exName(e.ex) + '!'
                 : 'Set ' + e.sets.length + ' logged');
    break;
  }
  case 'UNDO_SET': {
    if (!st.session) break;
    var e2 = curEntry(st);
    if (!e2.sets.length) { toast(st, 'Nothing to undo'); break; }
    e2.sets.pop();
    st.session.elapsed = Math.max(0, st.session.elapsed - SET_SECONDS);
    toast(st, 'Last set removed');
    break;
  }
  case 'REST': {
    if (!st.session) break;
    st.session.elapsed += st.settings.restSeconds;
    st.session.restTaken += 1;
    toast(st, 'Rested ' + mmss(st.settings.restSeconds));
    break;
  }
  case 'GOTO_EX': {
    if (!st.session) break;
    var i2 = A.index;
    if (i2 < 0 || i2 >= st.session.entries.length) break;
    st.session.idx = i2;
    var t = st.session.entries[i2].target;
    st.session.weight = t.weight; st.session.reps = t.reps;
    break;
  }
  case 'SESSION_FINISH':
    if (!st.session) break;
    push(st, 'summary', {});
    break;
  case 'SESSION_SAVE': {
    if (!st.session) break;
    var s = st.session;
    var saved = {id:'s_' + (st.history.length + 1), routine:s.routine, name:s.name, week:0,
                 date:TODAY.slice(0,3) + ' 20 Feb', duration:s.elapsed,
                 entries:s.entries.filter(function(x){ return x.sets.length; })
                          .map(function(x){ return {ex:x.ex, sets:x.sets.map(function(y){
                            return {w:y.w, r:y.r}; })}; })};
    st.history.push(saved);
    st.session = null;
    st.ui.tab = 'history';
    st.ui.stack = [{name:'history', params:{}}, {name:'session_detail', params:{id:saved.id}}];
    toast(st, s.name + ' saved · ' + volumeText(sessionVolume(saved), units(st)));
    break;
  }
  case 'SESSION_DISCARD':
    if (!st.session) break;
    st.ui.confirm = {title:'Throw this workout away?',
      text:'Every set you logged in this session goes with it. There is no undo.',
      okText:'Discard', yes:{type:'SESSION_DISCARD_YES'}};
    break;
  case 'SESSION_DISCARD_YES':
    st.session = null;
    st.ui.tab = 'today'; st.ui.stack = [{name:'today', params:{}}];
    toast(st, 'Workout discarded');
    break;

  /* ---- settings ---- */
  case 'SET_UNITS': st.settings.units = A.units; break;
  case 'SET_REST':  st.settings.restSeconds = A.seconds; break;
  case 'SET_TARGET':
    st.settings.weeklyTarget = Math.max(1, Math.min(7, st.settings.weeklyTarget + A.delta));
    break;
  case 'SET_TOGGLE': st.settings[A.key] = !st.settings[A.key]; break;

  default: break;
  }
  return st;
}

function N(t, o){ o = o || {}; o.t = t; return o; }
function txt(s, cls){ return N('text', {text:s, cls:cls || ''}); }
function row(id, text, o){
  o = o || {}; o.id = id; o.text = text;
  if (o.arrow === undefined) o.arrow = !!o.act;
  return N('row', o);
}
function btn(id, text, act, cls, disabled){
  return N('btn', {id:id, text:text, act:act, cls:cls || '', disabled:!!disabled});
}
function iconbtn(id, ic, act, cls){ return N('iconbtn', {id:id, icon:ic, act:act, cls:cls || ''}); }
function appbar(title, o){ o = o || {}; o.title = title; return N('appbar', o); }
function tabbar(st){
  var items = [
    {id:'tab_today',    text:'Today',    icon:'flame',   tab:'today'},
    {id:'tab_routines', text:'Workouts', icon:'list',    tab:'routines'},
    {id:'tab_history',  text:'History',  icon:'clock',   tab:'history'},
    {id:'tab_progress', text:'Progress', icon:'chart',   tab:'progress'}
  ].map(function(i){
    return {id:i.id, text:i.text, icon:i.icon, on:(st.ui.tab === i.tab), act:{type:'TAB', tab:i.tab}};
  });
  return N('tabbar', {id:'tabbar', items:items});
}
function setLine(st, s, i, exId){
  var u = units(st), ex = exercise(exId);
  var main = ex.timed ? (s.r + ' seconds') : (s.r + ' reps');
  return N('setrow', {id:'set_' + i, index:i + 1, done:true,
    main:(s.w ? mass(s.w, u) + ' x ' + s.r : main),
    sub:s.w ? (ex.timed ? s.r + ' seconds' : s.r + ' reps') + ' · ' + volumeText(s.w * s.r, u) : 'bodyweight',
    val:s.pb ? 'PB' : '', pb:!!s.pb});
}

/* ---------------------------------------------------------------- today */
function scrToday(st){

  var today = st.routines.filter(function(r){ return r.day === TODAY; })[0] || st.routines[0];
  var recent = st.history.slice().reverse().slice(0, 3);
  var squat = bestSet(st, 'ex_squat');
  var body = [
    N('hero', {id:'hero',
      act:st.session ? {type:'NAV', to:'session'} : {type:'NAV', to:'routine', params:{id:today.id}},
      kicker:st.session ? 'Workout in progress' : TODAY + ' evening',
      title:st.session ? st.session.name : today.name,
      sub:st.session
        ? 'On ' + exName(curEntry(st).ex) + ' · ' + mmss(st.session.elapsed) + ' elapsed'
        : today.focus,
      ring:{value:done, total:target, label:'sessions', text:done + '/' + target}}),
    N('stats', {id:'week_stats', c:[
      N('stat', {id:'stat_volume', n:volumeText(weekVolume(st, 0), u), l:'Volume this week', acc:true,
        act:{type:'TAB', tab:'progress'}}),
      N('stat', {id:'stat_sets', n:String(sum(st.history.filter(function(s){ return s.week === 0; })
                                              .map(sessionSets))), l:'Sets this week',
        act:{type:'TAB', tab:'history'}}),
      N('stat', {id:'stat_squat', n:squat ? mass(squat.w, u) : '—', l:'Best squat',
        act:{type:'NAV', to:'exercise', params:{id:'ex_squat'}}})
    ]}),
    N('padded', {c:[st.session
      ? btn('resume_workout', 'Back to your workout', {type:'NAV', to:'session'}, 'hot block')
      : btn('start_today', 'Start ' + today.name, {type:'SESSION_START', routine:today.id}, 'primary block')]}),
    N('sec', {text:'Your main lifts'}),
    N('card', {id:'main_lifts', cls:'flush', c:
      shuffled(['ex_squat','ex_bench','ex_row','ex_ohp'], st.meta.seed).map(function(id){
        var ex = exercise(id), b = bestSet(st, id);
        return row('main_' + id, ex.name, {lead:ex.icon, sub:groupLabel(ex.group) + ' · ' + ex.kit,
          val:b ? mass(b.w, u) : 'no history', valCls:'acc',
          act:{type:'NAV', to:'exercise', params:{id:id}}});
      })}),
    N('sec', {text:'Recent sessions'}),
    N('card', {id:'recent_list', cls:'flush', c: recent.map(function(s){
      return row('recent_' + s.id, s.name, {lead:'dumbbell',
        sub:s.date + ' · ' + sessionSets(s) + ' sets · ' + mmss(s.duration),
        val:volumeText(sessionVolume(s), u), valCls:'strong',
        act:{type:'NAV', to:'session_detail', params:{id:s.id}}});
    })}),
    N('sec', {text:'Weekly volume'}),
    weekBars(st),

  ];
  return N('screen', {id:'scr_today', name:'today', c:[
    appbar('Ironwood', {right:[iconbtn('open_settings', 'gear', {type:'NAV', to:'settings'})]}),
    N('scroll', {id:'today_scroll', c:body}),
    tabbar(st)
  ]});
}
function weekBars(st){
  var u = units(st);
  var vals = [weekVolume(st, 2), weekVolume(st, 1), weekVolume(st, 0)];
  var max = Math.max.apply(null, vals.concat([1]));
  return N('bars', {id:'week_bars', total:volumeText(vals[2], u), caption:'this week',
    bars:[{label:'2 wks ago', v:vals[0], pct:Math.round(vals[0]*100/max), on:false},
          {label:'Last week', v:vals[1], pct:Math.round(vals[1]*100/max), on:false},

    if (grp !== 'all' && e.group !== grp) return false;

           groupLabel(e.group).toLowerCase().indexOf(q) >= 0;

  var chips = [N('chip', {id:'grp_all', text:'All', on:grp === 'all',

        act:{type:'SET_INPUT', field:'lib_group', value:g.id}});
    }));

      N('inputrow', {id:'q_ex', label:'Search', field:'q_ex', value:st.ui.inputs.q_ex || '',

  var body = [

          ' · ' + mmss(s.elapsed) + ' elapsed',

      })}),
    N('chips', {id:'ex_chips', c:s.entries.map(function(x, i){

    N('bigstep', {id:'reps_step', label:ex.timed ? 'Seconds' : 'Reps', value:String(s.reps), unit:'',

/* =======================================================================
 * TRAVERSAL — element index, GUI action interface, text observation
 * ==================================================================== */
var SKIP_KEYS = {act:1, minus:1, plus:1, close:1, yes:1, params:1, meta:1, target:1, ring:1};

function labelOf(n){ return n.text || n.title || n.name || n.label || n.main || ''; }

function collect(n, out){
  if (!n || typeof n !== 'object') return;
  if (Array.isArray(n)) { for (var i=0;i<n.length;i++) collect(n[i], out); return; }
  if (n.t === 'appbar' && n.back) out.push({id:'nav_back', act:{type:'BACK'}, text:'Back', t:'back'});
  if (n.id && n.act)              out.push({id:n.id, act:n.act, text:labelOf(n), t:n.t||'el',
                                            disabled:!!n.disabled,
                                            input:(n.t === 'inputrow')});
  if (n.t === 'mask' && n.close)  out.push({id:n.id, act:n.close, text:'Dismiss overlay', t:'mask'});
  if (n.minusId && n.minus)       out.push({id:n.minusId, act:n.minus, text:'down', t:'step'});
  if (n.plusId  && n.plus)        out.push({id:n.plusId,  act:n.plus,  text:'up',   t:'step'});
  if (n.closeId && n.close)       out.push({id:n.closeId, act:n.close, text:'Close', t:'btn'});
  for (var k in n){
    if (SKIP_KEYS[k]) continue;
    var v = n[k];
    if (v && typeof v === 'object') collect(v, out);
  }
}
function elements(st){
  var rootNode = (st && st.t === 'screen') ? st : screen(st);
  var masks = (rootNode.c || []).filter(function(n){ return n.t === 'mask'; });
  var out = [];
  collect(masks.length ? masks[masks.length-1] : rootNode, out);
  return out;
}
function findEl(st, id){
  var els = elements(st);
  for (var i=0;i<els.length;i++) if (els[i].id === id) return els[i];
  return null;
}
function substitute(act, text){
  var a = clone(act);
  for (var k in a) if (a[k] === '$VALUE') a[k] = text;
  return a;
}
function step(st, a){
  a = a || {};
  var kind = a.action || a.type;
  switch (kind) {
  case 'tap': {
    var el = findEl(st, a.id);
    if (!el) return {state:st, ok:false, error:'ELEMENT_NOT_FOUND: ' + a.id};
    if (el.disabled) return {state:st, ok:false, error:'ELEMENT_DISABLED: ' + a.id};
    return {state:reduce(st, el.act), ok:true};
  }
  case 'type': {
    var e2 = findEl(st, a.id);
    if (!e2) return {state:st, ok:false, error:'ELEMENT_NOT_FOUND: ' + a.id};
    if (!e2.input) return {state:st, ok:false, error:'NOT_A_TEXT_FIELD: ' + a.id};
    return {state:reduce(st, substitute(e2.act, a.text == null ? '' : String(a.text))), ok:true};
  }

/* ------------------------------------------------- text observation (a11y) */
function a11y(st){

  if (st.session) {
    var e = curEntry(st);
    lines.push('# Workout running: ' + st.session.name + ', on ' + exName(e.ex) +
               ' (' + (st.session.idx + 1) + '/' + st.session.entries.length + '), ' +
               e.sets.length + ' of ' + e.target.sets + ' sets done, ' +
               mmss(st.session.elapsed) + ' elapsed. Next set: ' +
               mass(st.session.weight, u) + ' x ' + st.session.reps + '.');
  }
  var masks = (rootNode.c || []).filter(function(n){ return n.t === 'mask'; });
  if (masks.length) lines.push('# An overlay is open. Nothing behind it can be tapped.');
  walkText(masks.length ? masks[masks.length-1] : rootNode, 0, lines, st);
  (rootNode.c || []).forEach(function(n){ if (n.t === 'toast') lines.push('[Toast] ' + n.text); });

}
function tid(n){ return (n && n.id && n.act) ? ' #' + n.id : ''; }
function ind(d){ return new Array(d+1).join('  '); }

function walkText(n, d, out, st){
  if (!n || typeof n !== 'object') return;
  if (Array.isArray(n)) { n.forEach(function(x){ walkText(x, d, out, st); }); return; }
  var line = null;
  switch (n.t) {
  case 'screen': break;
  case 'appbar': line = '[AppBar] ' + (n.title || '') + (n.back ? '   Back #nav_back' : ''); break;
  case 'iconbtn': line = '[IconButton]' + tid(n) + ' ' + n.icon; break;
  case 'inputrow':
    line = '[TextField]' + tid(n) + ' ' + (n.label || '') + ' value="' + (n.value || '') + '"'; break;
  case 'chip':   line = '[Chip]' + tid(n) + ' ' + n.text + (n.on ? '  [selected]' : ''); break;
  case 'btn':    line = '[Button]' + (n.id ? ' #' + n.id : '') + ' ' + n.text + (n.disabled ? ' (disabled)' : ''); break;
  case 'row': {
    var s = '[Row]' + tid(n) + ' ' + (n.text || '');
    if (n.val) s += ' — ' + n.val;
    if (n.sub) s += '   (' + n.sub + ')';
    line = s; break;
  }
  case 'switch': line = '[Toggle]' + tid(n) + ' ' + (n.on ? 'ON' : 'OFF'); break;
  case 'stepper':
    line = '[Stepper] ' + n.value + '  down #' + n.minusId + '  up #' + n.plusId; break;
  case 'hero':
    out.push(ind(d) + '[Hero] ' + n.kicker + ' — ' + n.title + '. ' + n.sub +
             (n.ring ? '  [Ring] ' + n.ring.text + ' ' + n.ring.label : ''));
    return;
  case 'stat':   line = '[Stat] ' + n.l + ': ' + n.n; break;
  case 'bars':
    out.push(ind(d) + '[Chart] ' + n.total + ' ' + n.caption + ' — ' +
             n.bars.map(function(b, i){ return b.label + ' ' + n.alt[i]; }).join(', '));
    return;
  case 'now':
    out.push(ind(d) + '[Now] ' + n.kicker + ' — ' + n.title + '. ' + n.sub);
    return;
  case 'bigstep':
    out.push(ind(d) + '[Input] ' + n.label + ' = ' + n.value + (n.unit ? ' ' + n.unit : '') +
             '   down #' + n.minusId + '   up #' + n.plusId);
    return;
  case 'setrow':
    out.push(ind(d) + '[Set ' + n.index + '] ' + n.main + '   (' + n.sub + ')' +
             (n.pb ? '   PERSONAL BEST' : ''));
    return;
  case 'plates':
    out.push(ind(d) + '[Plates] ' + n.bar + ' plus, each side: ' +
             (n.items.length ? n.items.map(function(p){ return p.text; }).join(' + ') : 'nothing'));
    return;
  case 'pills':   line = n.items.map(function(p){ return '[' + p.text + ']'; }).join(' '); break;
  case 'sec':     line = '— ' + n.text + (n.side ? ' (' + n.side + ')' : '') + ' —'; break;
  case 'text':    line = n.text || null; break;
  case 'tabbar':
    out.push(ind(d) + '[TabBar] ' + n.items.map(function(i){
      return i.text + ' #' + i.id + (i.on ? '[current]' : ''); }).join('  '));
    return;
  case 'sheet':   line = '[Sheet] ' + n.title + '   close #' + n.closeId; break;
  case 'dialog':  line = '[Dialog] ' + (n.title ? n.title + ' — ' : '') + n.text; break;
  case 'mask': case 'toast': line = null; break;
  default:        line = null;
  }
  if (line !== null) out.push(ind(d) + line);
  for (var k in n){
    if (SKIP_KEYS[k]) continue;
    var v = n[k];
    if (v && typeof v === 'object') walkText(v, line !== null ? d+1 : d, out, st);
  }
}

function derive(st){

    rSets[r.name] = sum(r.items.map(function(i){ return i.sets; }));

    units: u,

      weightGrams:s.weight, reps:s.reps, elapsed:s.elapsed, restTaken:s.restTaken,

      + '</div>';
  case 'tabbar':
    return '<div class="n-tabbar"' + tid(n.id) + '>' + n.items.map(function(i){
      return '<div class="tb' + (i.on?' on':'') + '"' + tid(i.id) + bind(i.act) + '>'
        + '<i>' + icon(i.icon, 21) + '</i>' + esc(i.text) + '</div>';
    }).join('') + '</div>';
  case 'mask':  return '<div class="n-mask"' + tid(n.id) + bind(n.close) + '>' + R(n.c) + '</div>';
  case 'sheet':
    return '<div class="n-sheet"' + tid(n.id) + ' data-stop="1"><div class="sh-hd">'
      + '<div class="t">' + esc(n.title) + '</div>'
      + '<div class="iconbtn"' + tid(n.closeId) + bind(n.close) + '>' + icon('close',15) + '</div></div>'
      + '<div class="sh-bd">' + R(n.c) + '</div></div>';
  case 'dialog':
    return '<div class="dialog"' + tid(n.id) + ' data-stop="1">'
      + '<div style="padding:22px 20px 16px;text-align:center">'
      + (n.title ? '<div style="font:750 17px/1.3 var(--disp);margin-bottom:8px">' + esc(n.title) + '</div>' : '')
      + '<div style="font-size:13.5px;color:var(--ink2);line-height:1.55">' + esc(n.text) + '</div></div>'
      + '<div style="display:flex;gap:10px;padding:0 16px 16px">'
      + '<div class="n-btn" style="flex:1"' + tid(n.cancel.id) + bind(n.cancel.act) + '>' + esc(n.cancel.text) + '</div>'
      + '<div class="n-btn primary" style="flex:1"' + tid(n.ok.id) + bind(n.ok.act) + '>' + esc(n.ok.text) + '</div>'
      + '</div></div>';
  case 'toast': return '<div class="n-toast"' + tid(n.id) + '>' + esc(n.text) + '</div>';
  default: return '';
  }
}

var STATE = null;
function paint(){
  ACTS = [];
  app.innerHTML = render(E.screen(STATE));
  document.getElementById('sb-clock').textContent = E.select.hhmm(STATE.meta.clock);
  if (!hud.classList.contains('off')) paintHud();
}
app.addEventListener('click', function(ev){
  var el = ev.target.closest('[data-act]'); if (!el) return;
  if (el.classList.contains('n-mask') && ev.target.closest('[data-stop]')) return;
  var act = ACTS[+el.getAttribute('data-act')]; if (!act) return;
  TRAJ.push({action:'tap', id: el.getAttribute('data-testid') || null});
  STATE = E.reduce(STATE, act); paint();
});
app.addEventListener('input', function(ev){
  var el = ev.target.closest('[data-actt]'); if (!el) return;
  var act = JSON.parse(JSON.stringify(ACTS[+el.getAttribute('data-actt')]));
  for (var k in act) if (act[k] === '$VALUE') act[k] = el.value;
  var id = el.getAttribute('data-testid'), pos = el.selectionStart;
  TRAJ.push({action:'type', id:id, text:el.value});
  STATE = E.reduce(STATE, act); paint();
  var again = id && app.querySelector('[data-testid="' + id + '"]');
  if (again && again.focus) { again.focus(); try { again.setSelectionRange(pos, pos); } catch(e){} }
});

function paintHud(){
  var d = E.derive(STATE);
  hud.innerHTML = '<h4>__ENV__ · ' + E.ENV_ID + ' v' + E.VERSION + '</h4>'
    + '<div><span class="k">route</span> ' + d.route + '  <span class="k">step</span> ' + STATE.meta.steps + '</div>'
    + '<div><span class="k">live</span> ' + d.sessionLive + '  <span class="k">sessions</span> ' + d.sessionCount + '</div>'
    + '<div style="margin-top:8px"><button id="hud-reset">reset</button>'
    + '<button id="hud-a11y">copy a11y</button><button id="hud-state">copy state</button>'
    + '<button id="hud-traj">copy traj</button><button id="hud-hide">hide (h)</button></div>'
    + '<pre>' + esc(E.a11y(STATE)) + '</pre>';
  hud.querySelector('#hud-reset').onclick = function(){ ENVAPI.reset({seed:STATE.meta.seed}); };
  hud.querySelector('#hud-a11y').onclick  = function(){ copy(E.a11y(STATE)); };
  hud.querySelector('#hud-state').onclick = function(){ copy(JSON.stringify(E.snapshot(STATE), null, 2)); };
  hud.querySelector('#hud-traj').onclick  = function(){ copy(JSON.stringify(TRAJ, null, 2)); };
  hud.querySelector('#hud-hide').onclick  = function(){ hud.classList.add('off'); };
}
function copy(t){ try { navigator.clipboard.writeText(t); } catch(e){} }
document.addEventListener('keydown', function(e){
  if (e.key === 'h') { hud.classList.toggle('off'); if (!hud.classList.contains('off')) paintHud(); }
});

var ENVAPI = {
  ENV_ID: E.ENV_ID, VERSION: E.VERSION,
  reset: function(opts){
    opts = opts || {};
    STATE = E.createInitialState(opts.seed || 0);
    if (opts.patch) E.applyPatch(STATE, opts.patch);
    TRAJ = []; paint();
    return E.snapshot(STATE);
  },
  getState:   function(){ return E.snapshot(STATE); },
  setState:   function(s){ STATE = JSON.parse(JSON.stringify(s)); paint(); return true; },
  step:       function(a){ var r = E.step(STATE, a); STATE = r.state; TRAJ.push(a); paint();
                           return {ok:r.ok, error:r.error || null}; },
  dispatch:   function(act){ STATE = E.reduce(STATE, act); paint(); return true; },
  a11y:       function(){ return E.a11y(STATE); },
  elements:   function(){ return E.elements(STATE); },
  route:      function(){ return E.select.route(STATE); },
  trajectory: function(){ return JSON.parse(JSON.stringify(TRAJ)); },
  bounds: function(){
    var base = document.getElementById('screen').getBoundingClientRect(), out = {};
    app.querySelectorAll('[data-testid]').forEach(function(el){
      var r = el.getBoundingClientRect();
      out[el.getAttribute('data-testid')] = {
        x:Math.round(r.left-base.left), y:Math.round(r.top-base.top),
        w:Math.round(r.width), h:Math.round(r.height),
        cx:Math.round(r.left-base.left+r.width/2), cy:Math.round(r.top-base.top+r.height/2)};
    });
    return out;
  }
};
window.__ENV__ = ENVAPI;
var qs = new URLSearchParams(location.search);
if (qs.get('bare') === '1') document.body.classList.add('bare');
if (qs.get('hud')  === '1') hud.classList.remove('off');
ENVAPI.reset({seed: parseInt(qs.get('seed') || '0', 10) || 0});
window.__ENV_READY__ = true;
})();
</script>
