<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Marlin Mail (mocked GUI env)</title>
<!--
  ============================================================================
  Marlin Mail — a single-file H5 email client for agent research.

  Same two-block contract as every environment here (script#engine is a pure,
  DOM-free state machine exported as globalThis.GUI_ENGINE; script#ui renders
  engine.screen(state) and exposes __ENV__).

  What is new here: the core loop is triage, not purchase. That brings
  multi-select with a bulk action bar, folders vs labels (a message lives in
  one folder but carries many labels), read/unread state, snoozing, a compose
  form with three fields, and search with field operators (from: / has:).
  ============================================================================
-->
<style>
:root{
  --bg:#f4f6f9; --card:#fff; --line:#e7ecf2; --line2:#dde5ee;
  --ink:#131a24; --ink2:#5a6675; --muted:#8e9aab;
  --accent:#1f6feb; --accent-d:#1558c0; --accent-s:#e8f1fe;
  --unread:#0b57d0; --star:#f0a92b; --red:#d3402f; --green:#1a7f52; --violet:#7b5cf0;
  --r:14px; --r2:10px;
  --shadow:0 1px 2px rgba(19,26,36,.06),0 8px 24px rgba(19,26,36,.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{background:#dfe5ec;color:var(--ink);
  font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  display:flex;align-items:center;justify-content:center;overflow:hidden}

#device{position:relative;width:390px;height:844px;background:#0f1319;border-radius:46px;padding:5px;
  box-shadow:0 30px 70px rgba(0,0,0,.34);flex:0 0 auto}
#screen{position:relative;width:100%;height:100%;background:var(--bg);border-radius:41px;
  overflow:hidden;display:flex;flex-direction:column}
#notch{position:absolute;top:5px;left:50%;transform:translateX(-50%);width:118px;height:30px;
  background:#0f1319;border-radius:0 0 18px 18px;z-index:60}
body.bare{background:var(--bg)}
body.bare #device{width:390px;height:844px;padding:0;border-radius:0;box-shadow:none;background:var(--bg)}
body.bare #screen{border-radius:0}
body.bare #notch{display:none}
body.bare .n-sheet{animation:none}

.statusbar{height:44px;flex:0 0 44px;display:flex;align-items:flex-end;justify-content:space-between;
  padding:0 22px 6px;font-size:13px;font-weight:600;z-index:50}
.statusbar .sb-r{display:flex;gap:5px;align-items:center}
.sb-bat{width:22px;height:11px;border:1.3px solid currentColor;border-radius:3px;position:relative;opacity:.9}
.sb-bat:after{content:"";position:absolute;right:-3px;top:3px;width:2px;height:5px;background:currentColor;border-radius:0 1px 1px 0}
.sb-bat i{position:absolute;left:1.3px;top:1.3px;bottom:1.3px;width:66%;background:currentColor;border-radius:1px}

#app{flex:1 1 auto;display:flex;flex-direction:column;min-height:0;position:relative}

/* ---------------- chrome ---------------- */
.n-appbar{flex:0 0 auto;min-height:52px;display:flex;align-items:center;gap:8px;padding:6px 10px;
  background:var(--card);border-bottom:1px solid var(--line);z-index:20}
.n-appbar.select{background:var(--accent-s);border-bottom-color:#cbdffb}
.n-appbar .ab-title{flex:1 1 auto;font:650 18px/1.3 -apple-system,sans-serif;letter-spacing:-.3px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-left:4px}
.n-appbar .ab-side{flex:0 0 auto;display:flex;align-items:center;gap:4px}
.iconbtn{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  color:var(--ink2);cursor:pointer}
.iconbtn:active{background:#eef2f7}
.iconbtn.on{color:var(--accent)}
.iconbtn.star.on{color:var(--star)}

.n-scroll{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;padding-bottom:10px}
.n-scroll::-webkit-scrollbar{width:0}

/* ---------------- type ---------------- */
.n-text{padding:2px 16px;color:var(--ink2)}
.n-text.h1{font:700 24px/1.2 -apple-system,sans-serif;color:var(--ink);padding:14px 16px 4px;letter-spacing:-.5px}
.n-text.h2{font:650 17px/1.3 -apple-system,sans-serif;color:var(--ink);padding:14px 16px 4px}
.n-text.body{font-size:14px;padding:6px 16px;line-height:1.65}
.n-text.muted{font-size:12.5px;color:var(--muted);padding:6px 16px}
.n-text.empty{padding:8px 16px 40px;text-align:center;color:var(--muted);font-size:13.5px}
.n-sec{padding:16px 16px 6px;font:600 12px/1 -apple-system,sans-serif;color:var(--muted);
  letter-spacing:1.1px;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center}
.n-space{height:14px}
.n-divider{height:1px;background:var(--line);margin:6px 0}

/* ---------------- message row ---------------- */
.msg{display:flex;gap:12px;padding:12px 14px;background:var(--card);border-bottom:1px solid var(--line);
  cursor:pointer;align-items:flex-start}
.msg:active{background:#f6f9fd}
.msg.unread{background:#fbfcff}
.msg.sel{background:var(--accent-s)}
.m-av{flex:0 0 auto;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font:650 15px/1 -apple-system,sans-serif;color:#fff}
.msg .m-check{flex:0 0 auto;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;background:var(--accent);color:#fff}
.msg .m-body{flex:1 1 auto;min-width:0}
.msg .m-top{display:flex;align-items:baseline;gap:8px}
.msg .m-from{flex:1 1 auto;font-size:14.5px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.msg.unread .m-from{color:var(--ink);font-weight:700}
.msg .m-at{flex:0 0 auto;font-size:11.5px;color:var(--muted)}
.msg.unread .m-at{color:var(--unread);font-weight:650}
.msg .m-subj{font-size:13.5px;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.msg.unread .m-subj{font-weight:650}
.msg .m-prev{font-size:12.5px;color:var(--muted);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.msg .m-meta{display:flex;gap:6px;align-items:center;margin-top:7px;flex-wrap:wrap}
.msg .m-side{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:8px;padding-top:2px}
.msg .m-dot{width:8px;height:8px;border-radius:50%;background:var(--unread)}

.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:20px;font-size:11px;
  font-weight:650;background:#eef2f7;color:var(--ink2)}
.chip .cd{width:7px;height:7px;border-radius:50%}
.chip.attach{background:#f0f3f7;color:var(--muted)}

/* ---------------- rows / cards ---------------- */
.n-card{background:var(--card);border-radius:var(--r);margin:10px 16px;overflow:hidden;
  border:1px solid var(--line)}
.n-card.pad{padding:14px}
.n-card.flush{padding:0}
.n-card.tap{cursor:pointer}
.n-card.tap:active{background:#f6f9fd}
.n-row{display:flex;align-items:center;gap:13px;padding:13px 14px;border-bottom:1px solid var(--line);
  min-height:52px;background:var(--card)}
.n-row:last-child{border-bottom:none}
.n-row.tap{cursor:pointer}
.n-row.tap:active{background:#f6f9fd}
.n-row .r-lead{flex:0 0 auto;width:26px;color:var(--ink2);display:flex;align-items:center;justify-content:center}
.n-row .r-main{flex:1 1 auto;min-width:0}
.n-row .r-label{font-size:14.5px}
.n-row .r-sub{font-size:12px;color:var(--muted);margin-top:2px}
.n-row .r-value{flex:0 0 auto;font-size:13.5px;color:var(--ink2);max-width:150px;text-align:right;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.n-row .r-value.strong{color:var(--ink);font-weight:650}
.n-row .r-value.accent{color:var(--accent);font-weight:700}
.n-row .r-arrow{flex:0 0 auto;color:#c2ccd8;display:flex}

.n-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 20px;
  border-radius:12px;font:650 15px/1 -apple-system,sans-serif;background:#eef2f7;color:var(--ink);
  border:none;cursor:pointer;user-select:none}
.n-btn:active{filter:brightness(.96)}
.n-btn.primary{background:var(--accent);color:#fff}
.n-btn.primary.off{background:#c4d2e2;cursor:not-allowed}
.n-btn.ghost{background:transparent;border:1px solid var(--line2);height:34px;font-size:13px;padding:0 13px;color:var(--ink2)}
.n-btn.danger{background:transparent;border:1px solid #f0c6bf;color:var(--red);height:34px;font-size:13px;padding:0 13px}
.n-btn.block{display:flex;width:100%}
.n-btnrow{display:flex;gap:9px;padding:12px 14px;justify-content:flex-end;align-items:center}

.n-chips{display:flex;gap:8px;padding:9px 16px;overflow-x:auto}
.n-chips::-webkit-scrollbar{height:0}
.n-chip{flex:0 0 auto;height:32px;padding:0 13px;border-radius:16px;background:var(--card);
  border:1px solid var(--line2);display:flex;align-items:center;gap:6px;font-size:13px;
  color:var(--ink2);cursor:pointer;white-space:nowrap;font-weight:550}
.n-chip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:650}

.searchbar{margin:8px 16px;background:var(--card);border:1px solid var(--line2);border-radius:24px;
  display:flex;align-items:center;gap:10px;padding:10px 14px;box-shadow:var(--shadow)}
.searchbar input{flex:1 1 auto;border:none;outline:none;background:transparent;font-size:14.5px;
  font-family:inherit;color:var(--ink);min-width:0}
.searchbar input::placeholder{color:var(--muted)}
.searchbar .sb-clear{flex:0 0 auto;width:22px;height:22px;border-radius:50%;background:#e9eef4;
  color:var(--ink2);display:flex;align-items:center;justify-content:center;cursor:pointer}
.searchbar .sb-go{flex:0 0 auto;width:30px;height:30px;border-radius:50%;background:var(--accent);
  color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer}

.n-input{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);
  background:var(--card)}
.n-input .i-label{flex:0 0 66px;font-size:13px;color:var(--muted);padding-top:3px}
.n-input input,.n-input textarea{flex:1 1 auto;border:none;outline:none;background:transparent;
  font-size:14.5px;font-family:inherit;color:var(--ink);resize:none;min-width:0;line-height:1.6}
.n-input textarea{height:150px}
.n-input input::placeholder,.n-input textarea::placeholder{color:var(--muted)}

.n-switch{flex:0 0 auto;width:46px;height:27px;border-radius:14px;background:#cfd8e3;position:relative;
  cursor:pointer;transition:background .16s}
.n-switch.on{background:var(--green)}
.n-switch i{position:absolute;top:2.5px;left:2.5px;width:22px;height:22px;border-radius:50%;background:#fff;
  transition:transform .16s;box-shadow:0 1px 3px rgba(0,0,0,.22)}
.n-switch.on i{transform:translateX(19px)}
.n-radio{flex:0 0 auto;width:21px;height:21px;border-radius:50%;border:1.8px solid #c9d3e0;position:relative}
.n-radio.on{border-color:var(--accent);background:var(--accent)}
.n-radio.on:after{content:"";position:absolute;left:6.5px;top:3.5px;width:5px;height:9px;
  border:2px solid #fff;border-top:0;border-left:0;transform:rotate(42deg)}
.n-check{flex:0 0 auto;width:22px;height:22px;border-radius:6px;border:1.8px solid #c9d3e0;position:relative;background:#fff}
.n-check.on{border-color:var(--accent);background:var(--accent)}
.n-check.on:after{content:"";position:absolute;left:7px;top:3.5px;width:5px;height:10px;
  border:2px solid #fff;border-top:0;border-left:0;transform:rotate(42deg)}

/* ---------------- bulk action bar ---------------- */
.bulkbar{flex:0 0 auto;background:var(--card);border-top:1px solid var(--line);display:flex;
  padding:8px 6px calc(10px + env(safe-area-inset-bottom));z-index:30;box-shadow:0 -4px 18px rgba(19,26,36,.07)}
.bulkbar .bb{flex:1 1 0;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 2px;
  color:var(--ink2);font-size:10.5px;font-weight:600;cursor:pointer;border-radius:10px}
.bulkbar .bb:active{background:#eef2f7}
.bulkbar .bb.danger{color:var(--red)}
.bulkbar .bb.off{opacity:.35;cursor:not-allowed}

.n-tabbar{flex:0 0 auto;height:58px;background:var(--card);border-top:1px solid var(--line);display:flex;z-index:30}
.n-tabbar .tb{flex:1 1 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--muted);font-size:10.5px;cursor:pointer;font-weight:600;position:relative}
.n-tabbar .tb i{display:flex}
.n-tabbar .tb.on{color:var(--accent)}
.n-tabbar .tb .badge{position:absolute;top:6px;left:50%;margin-left:6px;min-width:16px;height:16px;
  border-radius:8px;background:var(--red);color:#fff;font-size:10px;line-height:16px;text-align:center;padding:0 4px}

.fab{position:absolute;right:18px;bottom:74px;width:56px;height:56px;border-radius:18px;background:var(--accent);
  color:#fff;display:flex;align-items:center;justify-content:center;z-index:40;cursor:pointer;
  box-shadow:0 6px 20px rgba(31,111,235,.4)}
.fab:active{filter:brightness(.94)}

/* ---------------- message detail ---------------- */
.mhead{padding:16px 16px 12px;background:var(--card);border-bottom:1px solid var(--line)}
.mhead .mh-subj{font:700 20px/1.3 -apple-system,sans-serif;letter-spacing:-.3px}
.mhead .mh-labels{margin-top:10px;display:flex;gap:6px;flex-wrap:wrap}
.mhead .mh-from{display:flex;gap:11px;align-items:center;margin-top:14px}
.mhead .mh-name{font-size:14.5px;font-weight:650}
.mhead .mh-mail{font-size:12px;color:var(--muted);margin-top:2px}
.mhead .mh-at{flex:0 0 auto;font-size:11.5px;color:var(--muted)}
.mbody{background:var(--card);padding:16px;font-size:14.5px;line-height:1.72;color:#22303f;white-space:pre-wrap}
.attach{display:flex;gap:9px;padding:0 16px 16px;background:var(--card);flex-wrap:wrap}
.attach .at{display:flex;align-items:center;gap:8px;border:1px solid var(--line2);border-radius:10px;
  padding:8px 12px;font-size:12.5px;color:var(--ink2);cursor:pointer;background:#fbfcfe}
.attach .at:active{background:#eef2f7}

.folderrow{display:flex;align-items:center;gap:13px;padding:13px 14px;border-bottom:1px solid var(--line);
  cursor:pointer;background:var(--card)}
.folderrow:active{background:#f6f9fd}
.folderrow:last-child{border-bottom:none}
.folderrow .f-ico{flex:0 0 auto;width:32px;height:32px;border-radius:9px;display:flex;align-items:center;
  justify-content:center;background:#eef2f7;color:var(--ink2)}
.folderrow.on .f-ico{background:var(--accent-s);color:var(--accent)}
.folderrow .f-name{flex:1 1 auto;font-size:14.5px}
.folderrow.on .f-name{font-weight:700;color:var(--accent)}
.folderrow .f-count{flex:0 0 auto;font-size:12.5px;color:var(--muted);font-weight:650}

.n-toast{position:absolute;left:50%;bottom:112px;transform:translateX(-50%);background:#1b2531;color:#fff;
  padding:11px 18px;border-radius:11px;font-size:13px;z-index:90;max-width:82%;text-align:center;
  display:flex;align-items:center;gap:12px}
.n-toast .undo{color:#8fc0ff;font-weight:700;cursor:pointer}
.n-mask{position:absolute;inset:0;background:rgba(15,20,28,.44);z-index:70;display:flex;align-items:flex-end}
.n-sheet{width:100%;max-height:80%;background:var(--card);border-radius:20px 20px 0 0;display:flex;
  flex-direction:column;overflow:hidden;animation:up .18s ease-out}
@keyframes up{from{transform:translateY(24px)}to{transform:none}}
.n-sheet .sh-hd{padding:16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.n-sheet .sh-hd .t{font:650 17px/1.2 -apple-system,sans-serif}
.n-sheet .sh-bd{flex:1 1 auto;overflow-y:auto;min-height:0}
.n-sheet .sh-bd::-webkit-scrollbar{width:0}
.n-sheet .sh-ft{flex:0 0 auto;border-top:1px solid var(--line);padding:12px 16px 16px}
.dialog{margin:auto;width:80%;background:#fff;border-radius:16px;overflow:hidden}

#hud{position:fixed;top:14px;left:14px;width:310px;max-height:calc(100% - 28px);overflow:auto;
  background:#0f141b;color:#c9d4e1;border-radius:12px;padding:12px;
  font:11.5px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;z-index:200;box-shadow:0 10px 30px rgba(0,0,0,.4)}
#hud h4{margin:0 0 8px;font-size:12px;color:#fff}
#hud .k{color:#7d8b9c}
#hud pre{margin:6px 0 0;white-space:pre-wrap;word-break:break-word;color:#8fd6b0;max-height:250px;overflow:auto}
#hud button{background:#1c2531;border:none;color:#c9d4e1;border-radius:6px;padding:5px 9px;margin:2px 4px 2px 0;font:inherit;cursor:pointer}
#hud.off{display:none}
</style>
</head>
<body>
<div id="device">
  <div id="notch"></div>
  <div id="screen">
    <div class="statusbar" id="sb">
      <div id="sb-clock">08:12</div>
      <div class="sb-r">
        <svg width="17" height="12" viewBox="0 0 17 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="4.6" y="5.5" width="3" height="6.5" rx="1"/><rect x="9.2" y="3" width="3" height="9" rx="1"/><rect x="13.8" y="0" width="3" height="12" rx="1"/></svg>
        <svg width="15" height="12" viewBox="0 0 15 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M1 4.2a9 9 0 0 1 13 0"/><path d="M3.4 6.9a5.6 5.6 0 0 1 8.2 0"/><circle cx="7.5" cy="10" r=".9" fill="currentColor" stroke="none"/></svg>
        <span class="sb-bat"><i></i></span>
      </div>
    </div>
    <div id="app"></div>
  </div>
</div>
<div id="hud" class="off"></div>

<script id="engine">
/* ===========================================================================
 * ENGINE — pure, deterministic, DOM-free.
 * ======================================================================== */
(function (root) {

var VERSION = '1.0.0';

  {id:'m_06', name:'The Overflow', email:'weekly@overflow.dev', at:'16:22', day:'Yesterday',

      if (t.indexOf('label:') === 0) return s.labels.indexOf(t.slice(6)) >= 0;

function row(id, text, o){
  o = o || {};
  return N('row', {id:id, text:text, sub:o.sub, val:o.val, valCls:o.valCls, lead:o.lead,
                   arrow:o.arrow !== false, act:o.act, c:o.c});
}
function btn(id, text, act, cls, disabled){
  return N('btn', {id:id, text:text, act:act, cls:cls||'', disabled:!!disabled});
}
function txt(text, cls){ return N('text', {text:text, cls:cls||'body'}); }
function iconbtn(id, ic, act, cls){ return N('iconbtn', {id:id, icon:ic, act:act, cls:cls||''}); }

function tabbar(st){
  var items = [
    {id:'tab_inbox',    text:'Inbox',    icon:'inbox',  tab:'inbox',    badge:unreadCount(st, 'inbox')},
    {id:'tab_folders',  text:'Folders',  icon:'folder', tab:'folders'},
    {id:'tab_labels',   text:'Labels',   icon:'tag',    tab:'labels'},
    {id:'tab_settings', text:'Settings', icon:'gear',   tab:'settings'}
  ].map(function(i){
    return {id:i.id, text:i.text, icon:i.icon, badge:i.badge || 0,
            on:(st.ui.tab===i.tab), act:{type:'TAB', tab:i.tab}};
  });
  return N('tabbar', {id:'tabbar', items:items});
}

function labelsOn(st, id){
  return mstate(st, id).labels.map(function(k){
    var l = labelOf(st, k); return {key:k, name:l.name, color:l.color};
  });
}
function msgRow(st, id, prefix){
  var m = messageOf(st, id), s = mstate(st, id);
  if (!m) return N('space', {});
  var sel = st.ui.select.ids.indexOf(id) >= 0;
  return N('msgrow', {
    id:(prefix||'') + 'msg_' + id, mid:id,
    from:(m.sentByMe ? 'To: ' + m.name : m.name) || '(no recipient)',
    subject:m.subject || '(no subject)', preview:m.preview, at:m.at, day:m.day,
    unread:!s.read, starred:!!s.starred, selected:sel, hue:hashHue(m.name || m.email || id),
    initial:(m.name || m.email || '?').charAt(0).toUpperCase(),
    labels:labelsOn(st, id), attach:!!(m.attachments && m.attachments.length),
    snoozed:s.snoozed ? (snoozeOpt(s.snoozed) || {}).label : null,
    act:{type:'OPEN_MSG', id:id},
    selId:(prefix||'') + 'sel_' + id, selAct:{type:'SELECT_TOGGLE', id:id},
    starId:(prefix||'') + 'star_' + id, starAct:{type:'TOGGLE_STAR', id:id}
  });
}

function bulkBar(st){
  var n = st.ui.select.ids.length, none = n === 0;
  var anyUnread = st.ui.select.ids.some(function(id){ return !mstate(st, id).read; });
  return N('bulkbar', {id:'bulkbar', items:[
    {id:'bulk_archive', text:'Archive', icon:'archive', off:none, act:{type:'MOVE', folder:'archive'}},
    {id:'bulk_snooze',  text:'Snooze',  icon:'clock',   off:none, act:{type:'OPEN_SHEET', sheet:'snooze'}},
    {id:'bulk_label',   text:'Label',   icon:'tag',     off:none, act:{type:'OPEN_SHEET', sheet:'labels'}},
    {id:'bulk_read',    text:anyUnread ? 'Read' : 'Unread', icon:'mail', off:none,
     act:{type:'SET_READ', read:anyUnread}},
    {id:'bulk_trash',   text:'Trash',   icon:'trash',   off:none, cls:'danger', act:{type:'MOVE', folder:'trash'}}
  ]});
}

function listScreen(st, key, opts){
  opts = opts || {};
  var ids = opts.ids || listFor(st, key);
  var f = folder(key) || {key:key, name:opts.title || key};
  var sel = st.ui.select;
  var bar = sel.on
    ? N('appbar', {id:'appbar', cls:'select', title:sel.ids.length + ' selected',
        left:[iconbtn('sel_cancel', 'close', {type:'SELECT_NONE'})],
        right:[iconbtn('sel_all', 'checkall', {type:'SELECT_ALL', folder:key})]})
    : N('appbar', {id:'appbar', title:f.name, back:!!opts.back,
        right:[iconbtn('open_search', 'search', {type:'NAV', to:'search', params:{}}),
               iconbtn('start_select', 'checkall', {type:'SELECT_START'})]});
  var body = [
    N('chips', {id:'list_filters', c:[
      N('chip', {id:'filter_all',    text:'All',    on:!st.ui.unreadOnly, act:{type:'TOGGLE_UNREAD_ONLY'}}),
      N('chip', {id:'filter_unread', text:'Unread ' + unreadCount(st, key),
                 on:st.ui.unreadOnly, act:{type:'TOGGLE_UNREAD_ONLY'}})
    ].concat(key === 'trash'
      ? [N('chip', {id:'empty_trash', text:'Empty trash', act:{type:'EMPTY_TRASH'}})] : [])})
  ].concat(ids.length
    ? ids.map(function(id){ return msgRow(st, id); })
    : [N('emptystate', {id:'empty', icon:f.icon, text:opts.emptyText || ('Nothing in ' + f.name)})])
   .concat([N('space', {})]);

  var children = [bar, N('scroll', {id:'list_scroll', c:body})];
  if (sel.on) children.push(bulkBar(st));
  else {
    children.push(N('fab', {id:'compose_fab', icon:'pencil', act:{type:'COMPOSE_NEW'}}));
    children.push(tabbar(st));
  }
  return N('screen', {id:'scr_' + key, name:opts.route || key, params:opts.params || {}, c:children});
}

function scrInbox(st){ return listScreen(st, 'inbox', {route:'inbox'}); }
function scrFolder(st, params){
  return listScreen(st, params.key, {route:'folder', back:true, params:{key:params.key}});
}
function scrLabelView(st, params){
  var k = params.key, l = labelOf(st, k);
  var ids = Object.keys(st.mail).filter(function(id){
    var s = st.mail[id]; return s.labels.indexOf(k) >= 0 && s.folder !== 'trash';
  });
  if (st.ui.unreadOnly) ids = ids.filter(function(id){ return !st.mail[id].read; });
  return listScreen(st, k, {ids:shuffled(ids, st.meta.seed), route:'labelView', back:true,
                            title:l.name, params:{key:k},
                            emptyText:'Nothing labelled ' + l.name});
}

function scrMessage(st, params){
  var id = params.id, m = messageOf(st, id), s = mstate(st, id);
  if (!m) return scrInbox(st);
  var tools = [
    iconbtn('msg_archive', 'archive', {type:'MOVE', id:id, folder:'archive'}),
    iconbtn('msg_trash',   'trash',   {type:'MOVE', id:id, folder:'trash'}),
    iconbtn('msg_spam',    'spam',    {type:'MOVE', id:id, folder:'spam'}),
    iconbtn('msg_snooze',  'clock',   {type:'OPEN_SHEET', sheet:'snooze', id:id}),
    iconbtn('msg_star',    s.starred ? 'starfill' : 'star', {type:'TOGGLE_STAR', id:id},
            s.starred ? 'star on' : 'star')
  ];
  return N('screen', {id:'scr_message', name:'message', params:{id:id}, c:[
    N('appbar', {id:'appbar', back:true, title:'', right:tools}),
    N('scroll', {id:'msg_scroll', c:[
      N('mhead', {id:'msg_head', subject:m.subject || '(no subject)',
                  name:m.name || '(no recipient)', email:m.email, at:m.at + ' · ' + m.day,
                  hue:hashHue(m.name || m.email || id),
                  initial:(m.name || m.email || '?').charAt(0).toUpperCase(),
                  labels:labelsOn(st, id),
                  folderName:(folder(s.folder) || {}).name || s.folder,
                  snoozed:s.snoozed ? (snoozeOpt(s.snoozed) || {}).at : null}),
      N('mbody', {id:'msg_body', text:m.body}),
      (m.attachments && m.attachments.length)
        ? N('attach', {id:'msg_attach', items:m.attachments.map(function(a, i){
            return {id:'attach_' + i, name:a.name, size:a.size,
                    act:{type:'EXPLAIN', text:a.name + ' · ' + a.size}};
          })})
        : N('space', {}),
      N('card', {id:'msg_actions', cls:'flush', c:[
        row('msg_label',  'Labels',
            {lead:'tag', val: s.labels.length ? s.labels.length + ' applied' : 'None',
             act:{type:'OPEN_SHEET', sheet:'labels', id:id}}),
        row('msg_unread', s.read ? 'Mark as unread' : 'Mark as read',
            {lead:'mail', act:{type:'SET_READ', id:id, read:!s.read}}),
        row('msg_move',   'Folder', {lead:'folder', val:(folder(s.folder) || {}).name || s.folder,
            act:{type:'OPEN_SHEET', sheet:'move', id:id}})
      ]}),
      N('btnrow', {id:'msg_ops', c:[
        btn('msg_forward', 'Forward', {type:'COMPOSE_NEW'}, 'ghost'),
        btn('msg_reply', 'Reply', {type:'COMPOSE_REPLY', id:id}, 'primary')]}),
      N('space', {})
    ]})
  ]});
}

function scrSearch(st){
  var ids = searchIds(st);
  var body = [
    N('searchbar', {id:'search_input', field:'search', value:st.ui.inputs.search || '',
      placeholder:'Search mail — try from:priya or has:attachment',
      act:{type:'SET_INPUT', field:'search', value:'$VALUE'},
      goId:'search_go', go:{type:'SUBMIT_SEARCH'},
      clearId:(st.ui.query || st.ui.inputs.search) ? 'search_clear' : null,
      clear:{type:'CLEAR_SEARCH'}})
  ];
  if (!st.ui.query) {
    body.push(N('sec', {text:'Operators'}));
    body.push(N('card', {id:'search_help', cls:'flush', c:[
      row('help_from',   'from:priya',      {arrow:false, lead:'user',  sub:'match the sender'}),
      row('help_label',  'label:work',      {arrow:false, lead:'tag',   sub:'match a label'}),
      row('help_attach', 'has:attachment',  {arrow:false, lead:'clip',  sub:'only mail with files'}),
      row('help_unread', 'is:unread',       {arrow:false, lead:'mail',  sub:'only unread mail'})
    ]}));
  } else {
    body.push(txt(ids.length + ' result' + (ids.length === 1 ? '' : 's') + ' for "' + st.ui.query + '"', 'muted'));
    body = body.concat(ids.length
      ? ids.map(function(id){ return msgRow(st, id, 'find_'); })
      : [N('emptystate', {id:'empty', icon:'search', text:'Nothing matches "' + st.ui.query + '"'})]);
  }
  body.push(N('space', {}));
  var children = [appbar('Search', {back:true}), N('scroll', {id:'search_scroll', c:body})];
  if (st.ui.select.on) children.push(bulkBar(st));
  return N('screen', {id:'scr_search', name:'search', c:children});
}

  var ids = id ? [id] : st.ui.select.ids;

    return ids.length > 0 && ids.every(function(x){ return mstate(st, x).labels.indexOf(k) >= 0; });
  };
  return N('sheet', {id:'sheet_labels', title:'Labels · ' + ids.length + ' selected',
    closeId:'sheet_close', close:{type:'CLOSE_SHEET'},
    c: allLabels(st).map(function(l){
      return row('pick_' + l.key, l.name, {arrow:false, dot:l.color,
        act:{type:'LABEL_TOGGLE', id:id, label:l.key},
        c:[N('check', {id:'check_' + l.key, on:applied(l.key),
                       act:{type:'LABEL_TOGGLE', id:id, label:l.key}})]});

function sheetMove(st){

  return N('sheet', {id:'sheet_move', title:'Move to', closeId:'sheet_close', close:{type:'CLOSE_SHEET'},

      return row('move_' + f.key, f.name, {lead:f.icon, act:{type:'MOVE', id:id, folder:f.key}});
    })});

var ROUTES = {
  inbox:scrInbox, folder:scrFolder, labelView:scrLabelView, message:scrMessage,
  compose:scrCompose, search:scrSearch, folders:scrFolders, labels:scrLabels,
  labelNew:scrLabelNew, settings:scrSettings
};

function screen(st){
  var r = route(st), fn = ROUTES[r.name] || scrInbox;
  var rootNode = fn(st, r.params || {});
  rootNode.route = r.name;
  var extra = [];
  if (st.ui.sheet) {
    var sh = st.ui.sheet.type === 'labels' ? sheetLabels(st)
           : st.ui.sheet.type === 'snooze' ? sheetSnooze(st)
           : st.ui.sheet.type === 'move'   ? sheetMove(st) : null;
    if (sh) extra.push(N('mask', {id:'mask', close:{type:'CLOSE_SHEET'}, c:[sh]}));
  }
  if (st.ui.confirm) {
    extra.push(N('mask', {id:'confirm_mask', c:[N('dialog', {id:'confirm_dialog',
      title:st.ui.confirm.title || '', text:st.ui.confirm.text,
      ok: btn('confirm_ok', st.ui.confirm.okText || 'Confirm', {type:'CONFIRM_YES'}, 'primary'),
      cancel: btn('confirm_cancel', 'Cancel', {type:'CONFIRM_NO'}, '')})]}));
  }
  if (st.ui.toast) extra.push(N('toast', {id:'toast', text:st.ui.toast.text,
    undoId:st.ui.toast.undo ? 'toast_undo' : null,
    undo:st.ui.toast.undo ? {type:st.ui.toast.undo} : null}));
  rootNode.c = rootNode.c.concat(extra);
  return rootNode;
}

/* =======================================================================
 * TRAVERSAL — element index, GUI action interface, text observation
 * ==================================================================== */
var SKIP_KEYS = {act:1, selAct:1, starAct:1, go:1, close:1, clear:1, undo:1, yes:1,
                 params:1, meta:1, attachments:1};

function labelText(n){ return n.text || n.title || n.name || n.subject || n.label || ''; }

function collect(n, out){
  if (!n || typeof n !== 'object') return;
  if (Array.isArray(n)) { for (var i=0;i<n.length;i++) collect(n[i], out); return; }
  if (n.t === 'appbar' && n.back) out.push({id:'nav_back', act:{type:'BACK'}, text:'Back', t:'back'});
  if (n.id && n.act)              out.push({id:n.id, act:n.act, text:labelText(n), t:n.t||'el',
                                            disabled:!!(n.disabled || n.off),
                                            input:(n.t==='searchbar'||n.t==='inputrow')});
  if (n.t === 'mask' && n.close)  out.push({id:n.id, act:n.close, text:'Dismiss overlay', t:'mask'});
  if (n.selId  && n.selAct)       out.push({id:n.selId,  act:n.selAct,  text:'Select this message', t:'check'});
  if (n.starId && n.starAct)      out.push({id:n.starId, act:n.starAct, text:'Star this message', t:'btn'});
  if (n.goId   && n.go)           out.push({id:n.goId,   act:n.go,      text:'Search', t:'btn'});
  if (n.clearId&& n.clear)        out.push({id:n.clearId,act:n.clear,   text:'Clear the search', t:'btn'});
  if (n.closeId&& n.close)        out.push({id:n.closeId,act:n.close,   text:'Close', t:'btn'});
  if (n.undoId && n.undo)         out.push({id:n.undoId, act:n.undo,    text:'Undo', t:'btn'});
  for (var k in n){
    if (SKIP_KEYS[k]) continue;
    var v = n[k];
    if (v && typeof v === 'object') collect(v, out);
  }
}
function elements(st){
  var rootNode = (st && st.t === 'screen') ? st : screen(st);
  var masks = (rootNode.c||[]).filter(function(n){ return n.t === 'mask'; });
  var out = [];
  collect(masks.length ? masks[masks.length-1] : rootNode, out);
  /* a toast lives outside the modal layer and stays reachable */
  if (masks.length) (rootNode.c||[]).forEach(function(n){ if (n.t === 'toast') collect(n, out); });
  return out;
}
function findEl(st, id){
  var els = elements(st);
  for (var i=0;i<els.length;i++) if (els[i].id === id) return els[i];
  return null;
}
function substitute(act, text){
  var a = clone(act);
  for (var k in a) if (a[k] === '$VALUE') a[k] = text;
  return a;
}
function step(st, a){
  a = a || {};
  var kind = a.action || a.type;
  switch (kind) {
  case 'tap': {
    var el = findEl(st, a.id);
    if (!el) return {state:st, ok:false, error:'ELEMENT_NOT_FOUND: ' + a.id};
    if (el.disabled) return {state:st, ok:false, error:'ELEMENT_DISABLED: ' + a.id};
    return {state:reduce(st, el.act), ok:true};
  }
  case 'type': {
    var e2 = findEl(st, a.id);
    if (!e2) return {state:st, ok:false, error:'ELEMENT_NOT_FOUND: ' + a.id};
    if (!e2.input) return {state:st, ok:false, error:'NOT_A_TEXT_FIELD: ' + a.id};
    return {state:reduce(st, substitute(e2.act, a.text == null ? '' : String(a.text))), ok:true};
  }
  case 'back':   return {state:reduce(st, {type:'BACK'}), ok:true};
  case 'home':   return {state:reduce(st, {type:'HOME'}), ok:true};
  case 'wait':   return {state:reduce(st, {type:'NOOP'}), ok:true};
  case 'finish': return {state:reduce(st, {type:'FINISH', answer:a.answer}), ok:true};
  case 'raw':    return {state:reduce(st, a.act || {}), ok:true};
  default:       return {state:st, ok:false, error:'UNKNOWN_ACTION: ' + kind};
  }
}

/* ------------------------------------------------- text observation (a11y) */
function a11y(st){
  var rootNode = screen(st), lines = [], r = route(st);
  lines.push('# Screen route=' + r.name + (r.params && (r.params.id || r.params.key)
             ? '(' + (r.params.id || r.params.key) + ')' : '') +
             '  ' + clockStr(st.meta.clock) + '  step ' + st.meta.steps);
  if (st.ui.select.on)
    lines.push('# Selection mode: ' + st.ui.select.ids.length + ' selected — ' +

  case 'sheetfoot':line = null; break;
  case 'dialog':   line = '[Dialog] ' + (n.title ? n.title + ' — ' : '') + n.text; break;

  case 'folderrow':
    return '<div class="folderrow' + (n.on?' on':'') + '"' + tid(n.id) + bind(n.act) + '>'
      + '<div class="f-ico">' + icon(n.icon, 17) + '</div>'
      + '<div class="f-name">' + esc(n.name) + '</div>'
      + '<div class="f-count">' + esc(n.count) + '</div>'
      + '<div class="r-arrow" style="color:#c2ccd8;display:flex">' + icon('arrow',15) + '</div></div>';
  case 'labelrow':
    return '<div class="folderrow"' + tid(n.id) + bind(n.act) + '>'
      + '<div class="f-ico" style="background:' + n.color + '22;color:' + n.color + '">' + icon('tag',17) + '</div>'
      + '<div class="f-name">' + esc(n.name) + '</div>'
      + '<div class="f-count">' + n.count + '</div>'
      + '<div class="r-arrow" style="color:#c2ccd8;display:flex">' + icon('arrow',15) + '</div></div>';

  case 'bulkbar':
    return '<div class="bulkbar"' + tid(n.id) + '>' + n.items.map(function(i){
      return '<div class="bb ' + esc(i.cls||'') + (i.off?' off':'') + '"' + tid(i.id)
        + (i.off?'':bind(i.act)) + '>' + icon(i.icon, 20) + esc(i.text) + '</div>';
    }).join('') + '</div>';

  case 'fab':
    return '<div class="fab"' + tid(n.id) + bind(n.act) + '>' + icon(n.icon, 24) + '</div>';

  case 'tabbar':
    return '<div class="n-tabbar"' + tid(n.id) + '>' + n.items.map(function(i){
      return '<div class="tb' + (i.on?' on':'') + '"' + tid(i.id) + bind(i.act) + '>'
        + '<i>' + icon(i.icon, 21) + '</i>' + esc(i.text)
        + (i.badge ? '<span class="badge">' + i.badge + '</span>' : '') + '</div>';
    }).join('') + '</div>';

  case 'mask':  return '<div class="n-mask"' + tid(n.id) + bind(n.close) + '>' + R(n.c) + '</div>';
  case 'sheet':
    return '<div class="n-sheet"' + tid(n.id) + ' data-stop="1"><div class="sh-hd">'
      + '<div class="t">' + esc(n.title) + '</div>'
      + '<div class="iconbtn"' + tid(n.closeId) + bind(n.close) + '>' + icon('close',15) + '</div></div>'
      + '<div class="sh-bd">' + R(n.c) + '</div>'
      + (n.footer ? '<div class="sh-ft">' + render(n.footer) + '</div>' : '') + '</div>';
  case 'sheetfoot': return render(n.btn);
  case 'dialog':
    return '<div class="dialog"' + tid(n.id) + ' data-stop="1">'
      + '<div style="padding:22px 20px 16px;text-align:center">'
      + (n.title ? '<div style="font:650 17px/1.3 -apple-system,sans-serif;margin-bottom:8px">' + esc(n.title) + '</div>' : '')
      + '<div style="font-size:13.5px;color:var(--ink2);line-height:1.55">' + esc(n.text) + '</div></div>'
      + '<div style="display:flex;gap:10px;padding:0 16px 16px">'
      + '<div class="n-btn" style="flex:1"' + tid(n.cancel.id) + bind(n.cancel.act) + '>' + esc(n.cancel.text) + '</div>'
      + '<div class="n-btn primary" style="flex:1"' + tid(n.ok.id) + bind(n.ok.act) + '>' + esc(n.ok.text) + '</div>'
      + '</div></div>';
  case 'toast':
    return '<div class="n-toast"' + tid(n.id) + '><span>' + esc(n.text) + '</span>'
      + (n.undoId ? '<span class="undo"' + tid(n.undoId) + bind(n.undo) + '>UNDO</span>' : '') + '</div>';
  default: return '';
  }
}

var STATE = null;
function paint(){
  ACTS = [];
  var tree = E.screen(STATE);
  app.innerHTML = render(tree);
  document.getElementById('sb-clock').textContent = E.select.clockStr(STATE.meta.clock);
  if (!hud.classList.contains('off')) paintHud();
}
app.addEventListener('click', function(ev){
  var el = ev.target.closest('[data-act]');
  if (!el) return;
  if (el.classList.contains('n-mask') && ev.target.closest('[data-stop]')) return;
  var act = ACTS[+el.getAttribute('data-act')];
  if (!act) return;
  TRAJ.push({action:'tap', id: el.getAttribute('data-testid') || null});
  STATE = E.reduce(STATE, act); paint();
});
app.addEventListener('keydown', function(ev){
  if (ev.key !== 'Enter') return;
  var el = ev.target.closest('[data-enter]'); if (!el) return;
  var idx = +el.getAttribute('data-enter'); if (idx < 0) return;
  ev.preventDefault();
  var act = ACTS[idx]; if (!act) return;
  TRAJ.push({action:'tap', id:'(enter)'});
  STATE = E.reduce(STATE, act); paint();
});
app.addEventListener('input', function(ev){
  var el = ev.target.closest('[data-actt]'); if (!el) return;
  var act = JSON.parse(JSON.stringify(ACTS[+el.getAttribute('data-actt')]));
  for (var k in act) if (act[k] === '$VALUE') act[k] = el.value;
  var id = el.getAttribute('data-testid'), pos = el.selectionStart;
  TRAJ.push({action:'type', id:id, text:el.value});
  STATE = E.reduce(STATE, act); paint();
  var again = id && app.querySelector('[data-testid="' + id + '"]');
  if (again && again.focus) { again.focus(); try { again.setSelectionRange(pos, pos); } catch(e){} }
});

function paintHud(){
  var d = E.derive(STATE);
  hud.innerHTML = '<h4>__ENV__ · ' + E.ENV_ID + ' v' + E.VERSION + '</h4>'
    + '<div><span class="k">route</span> ' + d.route + '  <span class="k">step</span> ' + STATE.meta.steps
    + '  <span class="k">seed</span> ' + STATE.meta.seed + '</div>'
    + '<div><span class="k">inbox</span> ' + d.inboxCount + ' (' + d.inboxUnread + ' unread)'
    + '  <span class="k">sel</span> ' + d.selectionCount + '</div>'
    + '<div style="margin-top:8px"><button id="hud-reset">reset</button>'
    + '<button id="hud-a11y">copy a11y</button><button id="hud-state">copy state</button>'
    + '<button id="hud-traj">copy traj</button><button id="hud-hide">hide (h)</button></div>'
    + '<pre>' + esc(E.a11y(STATE)) + '</pre>';
  hud.querySelector('#hud-reset').onclick = function(){ ENVAPI.reset({seed:STATE.meta.seed}); };
  hud.querySelector('#hud-a11y').onclick  = function(){ copy(E.a11y(STATE)); };
  hud.querySelector('#hud-state').onclick = function(){ copy(JSON.stringify(E.snapshot(STATE), null, 2)); };
  hud.querySelector('#hud-traj').onclick  = function(){ copy(JSON.stringify(TRAJ, null, 2)); };
  hud.querySelector('#hud-hide').onclick  = function(){ hud.classList.add('off'); };
}
function copy(t){ try { navigator.clipboard.writeText(t); } catch(e){} }
document.addEventListener('keydown', function(e){
  if (e.key === 'h') { hud.classList.toggle('off'); if (!hud.classList.contains('off')) paintHud(); }
});

var ENVAPI = {
  ENV_ID: E.ENV_ID, VERSION: E.VERSION,
  reset: function(opts){
    opts = opts || {};
    STATE = E.createInitialState(opts.seed || 0);
    if (opts.patch) E.applyPatch(STATE, opts.patch);
    TRAJ = []; paint();
    return E.snapshot(STATE);
  },
  getState:   function(){ return E.snapshot(STATE); },
  setState:   function(s){ STATE = JSON.parse(JSON.stringify(s)); paint(); return true; },
  step:       function(a){ var r = E.step(STATE, a); STATE = r.state; TRAJ.push(a); paint();
                           return {ok:r.ok, error:r.error || null}; },
  dispatch:   function(act){ STATE = E.reduce(STATE, act); paint(); return true; },
  a11y:       function(){ return E.a11y(STATE); },
  elements:   function(){ return E.elements(STATE); },
  route:      function(){ return E.select.route(STATE); },
  trajectory: function(){ return JSON.parse(JSON.stringify(TRAJ)); },
  bounds: function(){
    var base = document.getElementById('screen').getBoundingClientRect(), out = {};
    app.querySelectorAll('[data-testid]').forEach(function(el){
      var r = el.getBoundingClientRect();
      out[el.getAttribute('data-testid')] = {
        x:Math.round(r.left-base.left), y:Math.round(r.top-base.top),
        w:Math.round(r.width), h:Math.round(r.height),
        cx:Math.round(r.left-base.left+r.width/2), cy:Math.round(r.top-base.top+r.height/2)};
    });
    return out;
  }
};
window.__ENV__ = ENVAPI;
var qs = new URLSearchParams(location.search);
if (qs.get('bare') === '1') document.body.classList.add('bare');
if (qs.get('hud')  === '1') hud.classList.remove('off');
ENVAPI.reset({seed: parseInt(qs.get('seed') || '0', 10) || 0});
window.__ENV_READY__ = true;
})();
</script>
