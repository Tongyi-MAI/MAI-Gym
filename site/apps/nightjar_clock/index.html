<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>时钟 (mocked GUI env)</title>
<!--
  ============================================================================
  时钟 Clock — a single-file H5 stock-clock app for agent research.

  Same two-block contract as every environment here: script#engine is a pure,
  DOM-free state machine on globalThis.GUI_ENGINE; script#ui renders its screen
  tree and exposes window.__ENV__.

  What is new: nothing on this screen is a stored time. An alarm is a rule —
  a time plus a set of weekdays — and every figure the app shows is the next
  moment that rule fires, worked out from a frozen wall clock of Thursday
  22:47 and sorted against every other alarm. Turning one off, skipping its
  next ring, or moving it by five minutes re-orders the whole list and changes
  how long you have left to sleep.

  The seeded state carries the trap this app always has in real life: the
  earliest-looking alarm, 05:30, is not the one that rings next, because its
  「跳过下一次」is on. And the world clock is genuine timezone arithmetic —
  London is on summer time so it is UTC+1 not UTC+0, Delhi is half an hour off
  the grid, and Sydney has already rolled over into tomorrow.

  Everything is integer minutes inside a 10,080-minute week, so every figure
  is exact and reproducible.
  ============================================================================
-->
<style>
:root{
  --outer:#05070a;
  --bezel:#000000;
  --bg:#000000;
  --card:#131315;
  --card2:#1d222b;
  --line:#232326;
  --line2:#38383c;
  --press:#1d1d20;
  --chev:#48484c;
  --ink:#ffffff;
  --ink2:#a8a8ad;
  --muted:#7c7c82;
  --accent:#ff9f0a;
  --accent-d:#ffb340;
  --accent-s:#2a1e08;
  --on-accent:#000000;
  --good:#30d158;
  --good-s:#0f2a17;
  --warn:#ff9f0a;
  --warn-s:#2a1e08;
  --bad:#ff453a;
  --bad-s:#2c1210;
  --bad-line:#4a1e1a;
  --btn:#1c1c1f;
  --btn-off:#171719;
  --off:#39393d;
  --appbar:#000000;
  --appbar-ink:#f2f5f9;
  --appbar-line:#232326;
  --tabbar:#0a0a0b;
  --scrim:rgba(0,0,0,.7);
  --toast:#232326;
  --toast-ink:#0d1014;
  --hero:linear-gradient(140deg,#1a1a1d,#3a2a08);
  --hero-line:transparent;
  --hero-ink:#ffffff;
  --disp:-apple-system,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif;
  --r:18px; --r2:12px;
  --shadow:0 1px 2px rgba(16,18,26,.05),0 10px 26px rgba(16,18,26,.07);
  --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{background:var(--outer);color:var(--ink);font:14px/1.55 var(--ui);
  display:flex;align-items:center;justify-content:center;overflow:hidden}

#device{position:relative;width:390px;height:844px;background:var(--bezel);border-radius:46px;padding:5px;
  box-shadow:0 30px 70px rgba(0,0,0,.34);flex:0 0 auto}
#screen{position:relative;width:100%;height:100%;background:var(--bg);border-radius:41px;
  overflow:hidden;display:flex;flex-direction:column}
#notch{position:absolute;top:5px;left:50%;transform:translateX(-50%);width:118px;height:30px;
  background:var(--bezel);border-radius:0 0 18px 18px;z-index:60}
body.bare{background:var(--bg)}
body.bare #device{width:390px;height:844px;padding:0;border-radius:0;box-shadow:none;background:var(--bg)}
body.bare #screen{border-radius:0}
body.bare #notch{display:none}
body.bare .n-sheet{animation:none}

.statusbar{height:44px;flex:0 0 44px;display:flex;align-items:flex-end;justify-content:space-between;
  padding:0 22px 6px;font-size:13px;font-weight:600;z-index:50;color:var(--ink)}
.statusbar .sb-r{display:flex;gap:5px;align-items:center}
.sb-bat{width:22px;height:11px;border:1.3px solid currentColor;border-radius:3px;position:relative;opacity:.9}
.sb-bat:after{content:"";position:absolute;right:-3px;top:3px;width:2px;height:5px;background:currentColor;border-radius:0 1px 1px 0}
.sb-bat i{position:absolute;left:1.3px;top:1.3px;bottom:1.3px;width:78%;background:currentColor;border-radius:1px}

#app{flex:1 1 auto;display:flex;flex-direction:column;min-height:0;position:relative}

.n-appbar{flex:0 0 auto;min-height:52px;display:flex;align-items:center;gap:8px;padding:6px 12px;
  background:var(--appbar);color:var(--appbar-ink);z-index:20;border-bottom:1px solid var(--appbar-line)}
.n-appbar .ab-title{flex:1 1 auto;text-align:center;font:650 17px/1.3 var(--disp);letter-spacing:-.2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.n-appbar .ab-side{flex:0 0 auto;min-width:56px;display:flex;align-items:center;gap:2px}
.n-appbar .ab-side.right{justify-content:flex-end}
.n-appbar .iconbtn{color:var(--appbar-ink);opacity:.85}
.iconbtn{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  color:var(--ink2);cursor:pointer}
.iconbtn:active{background:var(--press)}

.n-scroll{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;padding-bottom:10px}
.n-scroll::-webkit-scrollbar{width:0}

.n-text{padding:2px 18px;color:var(--ink2)}
.n-text.h1{font:700 26px/1.18 var(--disp);color:var(--ink);padding:10px 18px 6px;letter-spacing:-.6px}
.n-text.h2{font:650 18px/1.3 var(--disp);color:var(--ink);padding:12px 18px 2px}
.n-text.body{font-size:13.5px;padding:5px 18px;line-height:1.7}
.n-text.muted{font-size:12.5px;color:var(--muted);padding:6px 18px;line-height:1.6}
.n-text.empty{padding:14px 18px 40px;text-align:center;color:var(--muted);font-size:13.5px}
.n-sec{padding:18px 18px 6px;font:700 11.5px/1 var(--ui);color:var(--muted);letter-spacing:1.3px;
  text-transform:uppercase;display:flex;justify-content:space-between;align-items:center;gap:10px}
.n-space{height:16px}

.n-card{background:var(--card);border-radius:var(--r);margin:9px 16px;overflow:hidden;border:1px solid var(--line)}
.n-card.flush{padding:0}
.n-card.pad{padding:14px 16px}
.n-card.tap{cursor:pointer}
.n-card.tap:active{background:var(--press)}

.n-row{display:flex;align-items:center;gap:13px;padding:12px 16px;border-bottom:1px solid var(--line);min-height:54px}
.n-row:last-child{border-bottom:none}
.n-row.tap{cursor:pointer}
.n-row.tap:active{background:var(--press)}
.n-row .r-lead{flex:0 0 auto;width:26px;color:var(--ink2);display:flex;align-items:center;justify-content:center}
.n-row .r-main{flex:1 1 auto;min-width:0}
.n-row .r-label{font-size:14.5px}
.n-row .r-label.strike{text-decoration:line-through;color:var(--muted)}
.n-row .r-sub{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.5}
.n-row .r-value{flex:0 0 auto;font-size:14px;color:var(--ink2);text-align:right;font-variant-numeric:tabular-nums}
.n-row .r-value.strong{color:var(--ink);font-weight:700}
.n-row .r-value.acc{color:var(--accent);font-weight:700}
.n-row .r-value.good{color:var(--good);font-weight:700}
.n-row .r-value.warn{color:var(--warn);font-weight:700}
.n-row .r-value.bad{color:var(--bad);font-weight:700}
.n-row .r-arrow{flex:0 0 auto;color:var(--chev);display:flex}

.n-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:47px;padding:0 20px;
  border-radius:13px;font:650 15px/1 var(--ui);background:var(--btn);color:var(--ink);
  border:none;cursor:pointer;user-select:none}
.n-btn:active{filter:brightness(.97)}
.n-btn.primary{background:var(--accent);color:var(--on-accent)}
.n-btn.primary.off{background:var(--btn-off);color:var(--muted);cursor:not-allowed}
.n-btn.ghost{background:transparent;border:1px solid var(--line2);height:37px;font-size:13px;padding:0 14px;color:var(--ink2)}
.n-btn.danger{background:transparent;border:1px solid var(--bad-line);color:var(--bad);height:37px;font-size:13px;padding:0 14px}
.n-btn.block{display:flex;width:100%}
.n-btnrow{display:flex;gap:10px;padding:12px 16px;justify-content:flex-end;align-items:center;flex-wrap:wrap}

.n-chips{display:flex;gap:8px;padding:8px 16px;overflow-x:auto}
.n-chips::-webkit-scrollbar{height:0}
.n-chip{flex:0 0 auto;height:34px;padding:0 14px;border-radius:11px;background:var(--card);
  border:1px solid var(--line2);display:flex;align-items:center;font-size:13px;
  color:var(--ink2);cursor:pointer;white-space:nowrap;font-weight:600}
.n-chip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}

.n-input{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line);background:var(--card)}
.n-input .i-label{flex:0 0 78px;font-size:13px;color:var(--muted)}
.n-input input{flex:1 1 auto;border:none;outline:none;background:transparent;font-size:14.5px;
  font-family:inherit;color:var(--ink);min-width:0}
.n-input input::placeholder{color:var(--muted)}
.n-switch{flex:0 0 auto;width:46px;height:27px;border-radius:14px;background:var(--off);position:relative;cursor:pointer;transition:background .16s}
.n-switch.on{background:var(--accent)}
.n-switch i{position:absolute;top:2.5px;left:2.5px;width:22px;height:22px;border-radius:50%;background:#fff;
  transition:transform .16s;box-shadow:0 1px 3px rgba(0,0,0,.22)}
.n-switch.on i{transform:translateX(19px)}
.n-check{flex:0 0 auto;width:23px;height:23px;border-radius:7px;border:1.8px solid var(--off);position:relative;background:var(--card)}
.n-check.on{border-color:var(--accent);background:var(--accent)}
.n-check.on:after{content:"";position:absolute;left:7.5px;top:4px;width:5px;height:10px;
  border:2px solid var(--on-accent);border-top:0;border-left:0;transform:rotate(42deg)}
.n-radio{flex:0 0 auto;width:22px;height:22px;border-radius:50%;border:1.8px solid var(--off);position:relative}
.n-radio.on{border-color:var(--accent);background:var(--accent)}
.n-radio.on:after{content:"";position:absolute;left:7px;top:4px;width:5px;height:9px;
  border:2px solid var(--on-accent);border-top:0;border-left:0;transform:rotate(42deg)}

.tag{display:inline-flex;align-items:center;padding:3px 9px;border-radius:20px;font-size:11px;
  font-weight:700;background:var(--btn);color:var(--ink2)}
.tag.acc{background:var(--accent-s);color:var(--accent)}
.tag.good{background:var(--good-s);color:var(--good)}
.tag.warn{background:var(--warn-s);color:var(--warn)}
.tag.bad{background:var(--bad-s);color:var(--bad)}

.n-tabbar{flex:0 0 auto;height:58px;background:var(--tabbar);border-top:1px solid var(--line);display:flex;z-index:30}
.n-tabbar .tb{flex:1 1 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--muted);font-size:10.5px;cursor:pointer;font-weight:600}
.n-tabbar .tb i{display:flex}
.n-tabbar .tb.on{color:var(--accent)}

.n-mask{position:absolute;inset:0;background:var(--scrim);z-index:70;display:flex;align-items:flex-end}
.n-sheet{width:100%;max-height:80%;background:var(--card);border-radius:22px 22px 0 0;display:flex;
  flex-direction:column;overflow:hidden;animation:up .18s ease-out}
@keyframes up{from{transform:translateY(24px)}to{transform:none}}
.n-sheet .sh-hd{padding:16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.n-sheet .sh-hd .t{font:650 17px/1.2 var(--disp)}
.n-sheet .sh-bd{flex:1 1 auto;overflow-y:auto;min-height:0}
.n-sheet .sh-bd::-webkit-scrollbar{width:0}
.n-toast{position:absolute;left:50%;bottom:118px;transform:translateX(-50%);background:var(--toast);
  color:var(--toast-ink);padding:11px 18px;border-radius:11px;font-size:13px;z-index:90;max-width:84%;text-align:center}
.dialog{margin:auto;width:82%;background:var(--card);border-radius:18px;overflow:hidden;border:1px solid var(--line)}

.stats{display:flex;gap:9px;padding:4px 16px}
.stat{flex:1 1 0;background:var(--card);border:1px solid var(--line);border-radius:var(--r2);padding:13px 12px}
.stat.tap{cursor:pointer}
.stat .st-n{font:800 19px/1.1 var(--disp);letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.stat .st-l{font-size:11px;color:var(--muted);margin-top:6px;line-height:1.4}
.stat.acc .st-n{color:var(--accent)}

.hero{margin:8px 16px 4px;padding:18px;border-radius:var(--r);background:var(--hero);
  border:1px solid var(--hero-line);color:var(--hero-ink)}
.hero.tap{cursor:pointer}
.hero .he-k{font-size:11px;letter-spacing:1.3px;text-transform:uppercase;font-weight:800;opacity:.85}
.hero .he-t{font:800 25px/1.16 var(--disp);margin-top:9px;letter-spacing:-.7px}
.hero .he-s{font-size:13px;margin-top:8px;line-height:1.6;opacity:.9}


.alm{display:flex;align-items:center;gap:13px;padding:15px 16px;border-bottom:1px solid var(--line)}
.alm:last-child{border-bottom:none}
.al-m{flex:1 1 auto;min-width:0;cursor:pointer}
.al-t{font:200 42px/1 var(--disp);letter-spacing:-1.5px;font-variant-numeric:tabular-nums}
.alm.off .al-t{color:var(--muted)}
.al-t b{font-size:17px;font-weight:500;margin-left:7px;letter-spacing:0}
.al-s{font-size:13px;color:var(--ink2);margin-top:5px}
.alm.off .al-s{color:var(--muted)}
.al-s em{font-style:normal;color:var(--warn)}
.al-s i{font-style:normal;color:var(--accent)}
.al-n{flex:0 0 auto}

.nextup{margin:12px 16px;padding:16px;border-radius:var(--r);background:var(--card);
  border:1px solid var(--line2)}
.nu-k{font-size:11px;color:var(--muted);letter-spacing:1.2px}
.nu-t{font:200 40px/1 var(--disp);margin-top:9px;letter-spacing:-1.6px;
  font-variant-numeric:tabular-nums}
.nu-t.none{font-size:24px;font-weight:400;color:var(--muted);letter-spacing:0}
.nu-s{font-size:13px;color:var(--ink2);margin-top:10px;line-height:1.6}
.nu-g{display:flex;gap:22px;margin-top:15px;padding-top:14px;border-top:1px solid var(--line)}
.nu-i .v{font:600 16px/1 var(--disp);font-variant-numeric:tabular-nums}
.nu-i .v.warn{color:var(--warn)}
.nu-i .l{font-size:10.5px;color:var(--muted);margin-top:5px}

.wheel{margin:0 16px}
.wh-h{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.wh-m{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:9px}
.wheel div.k{padding:10px 0;text-align:center;border-radius:8px;background:var(--btn);
  font:500 15px/1 var(--disp);cursor:pointer;font-variant-numeric:tabular-nums}
.wheel div.k:active{background:var(--press)}
.wheel div.k.on{background:var(--accent);color:var(--on-accent);font-weight:700}
.wh-l{font-size:11px;color:var(--muted);margin:13px 0 7px;letter-spacing:.6px}

.dows{display:flex;gap:6px;margin:0 16px}
.dows div{flex:1 1 0;aspect-ratio:1/1;border-radius:50%;background:var(--btn);display:flex;
  align-items:center;justify-content:center;font-size:13px;font-weight:600;cursor:pointer;
  color:var(--ink2)}
.dows div:active{background:var(--press)}
.dows div.on{background:var(--accent);color:var(--on-accent)}

.city{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line)}
.city:last-child{border-bottom:none}
.ci-m{flex:1 1 auto;min-width:0}
.ci-d{font-size:11.5px;color:var(--muted)}
.ci-d.tom{color:var(--accent)}
.ci-n{font-size:19px;font-weight:500;margin-top:3px}
.ci-z{font-size:11px;color:var(--muted);margin-top:4px}
.ci-t{flex:0 0 auto;font:200 34px/1 var(--disp);letter-spacing:-1.2px;
  font-variant-numeric:tabular-nums}

.tmr{display:flex;align-items:center;gap:13px;padding:14px 16px;border-bottom:1px solid var(--line)}
.tmr:last-child{border-bottom:none}
.tm-m{flex:1 1 auto;min-width:0}
.tm-t{font:200 32px/1 var(--disp);letter-spacing:-1px;font-variant-numeric:tabular-nums}
.tmr.paused .tm-t{color:var(--muted)}
.tm-s{font-size:12px;color:var(--muted);margin-top:5px}
.tm-b{flex:0 0 auto;display:flex;gap:7px}
.tm-b div{padding:8px 13px;border-radius:16px;background:var(--btn);font-size:13px;
  font-weight:600;cursor:pointer;color:var(--ink)}
.tm-b div:active{background:var(--press)}
.tm-b div.go{background:var(--accent-s);color:var(--accent)}
.tm-b div.rm{color:var(--bad)}

</style>
</head>
<body>
<div id="device">
  <div id="notch"></div>
  <div id="screen">
    <div class="statusbar" id="sb">
      <div id="sb-clock">22:47</div>
      <div class="sb-r">
        <svg width="17" height="12" viewBox="0 0 17 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="4.6" y="5.5" width="3" height="6.5" rx="1"/><rect x="9.2" y="3" width="3" height="9" rx="1"/><rect x="13.8" y="0" width="3" height="12" rx="1"/></svg>
        <svg width="15" height="12" viewBox="0 0 15 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M1 4.2a9 9 0 0 1 13 0"/><path d="M3.4 6.9a5.6 5.6 0 0 1 8.2 0"/><circle cx="7.5" cy="10" r=".9" fill="currentColor" stroke="none"/></svg>
        <span class="sb-bat"><i></i></span>
      </div>
    </div>
    <div id="app"></div>
  </div>
</div>
<div id="hud" class="off"></div>

<script id="engine">
/* ===========================================================================
 * ENGINE — pure, deterministic, DOM-free.
 * 一周 10080 分钟，周一 00:00 是 0，墙上的钟停在周四 22:47。
 * 每个闹钟的「下次响」都是从规则现算的，一个都不存。
 * ======================================================================== */
(function(root){
'use strict';

var ENV_ID  = 'nightjar_clock';
var VERSION = '1.0.0';

/* ------------------------------------------------------------- utilities */
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function pad2(n){ return (n < 10 ? '0' : '') + n; }
function hhmm(m){ m = ((m % 1440) + 1440) % 1440; return pad2(Math.floor(m/60)) + ':' + pad2(m%60); }
function sum(a){ var s = 0; for (var i=0;i<a.length;i++) s += a[i]; return s; }
function clamp(v, lo, hi){ return v < lo ? lo : (v > hi ? hi : v); }
function lcg(seed){ var s=(seed>>>0)||1; return function(){ s=(s*1664525+1013904223)>>>0; return s/4294967296; }; }
function shuffled(list, seed){
  if (!seed) return list.slice();
  var r = lcg(seed), a = list.slice();
  for (var i=a.length-1;i>0;i--){ var j = Math.floor(r()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
function money(p, sym){
  var neg = p < 0; p = Math.abs(p);
  return (neg ? '-' : '') + (sym === undefined ? '\u00a3' : sym) +
         (Math.floor(p/100)).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',') + '.' + pad2(p%100);
}
function getPath(o, path){
  var cur = o, parts = String(path).split('.');
  for (var i=0;i<parts.length;i++){
    var k = parts[i], m = k.match(/^(.*?)\[(\d+)\]$/);
    if (m){ cur = cur ? cur[m[1]] : undefined; cur = cur ? cur[+m[2]] : undefined; }
    else cur = cur ? cur[k] : undefined;
    if (cur === undefined) return undefined;
  }
  return cur;
}
function setPath(o, path, value){
  var parts = String(path).split('.'), cur = o;
  for (var i=0;i<parts.length-1;i++){
    var k = parts[i], m = k.match(/^(.*?)\[(\d+)\]$/);
    cur = m ? cur[m[1]][+m[2]] : (cur[k] = cur[k] || {});
  }
  var lastK = parts[parts.length-1], lm = lastK.match(/^(.*?)\[(\d+)\]$/);
  if (lm) cur[lm[1]][+lm[2]] = value; else cur[lastK] = value;
  return o;
}

/* ------------------------------------------- screen-tree node constructors */
function N(t, o){ o = o || {}; o.t = t; return o; }
function txt(s, cls){ return N('text', {text:s, cls:cls || ''}); }
function row(id, text, o){
  o = o || {}; o.id = id; o.text = text;
  if (o.arrow === undefined) o.arrow = !!o.act;
  return N('row', o);
}
function btn(id, text, act, cls, disabled){
  return N('btn', {id:id, text:text, act:act, cls:cls || '', disabled:!!disabled});
}
function iconbtn(id, ic, act, cls){ return N('iconbtn', {id:id, icon:ic, act:act, cls:cls || ''}); }
function appbar(title, o){ o = o || {}; o.title = title; return N('appbar', o); }
function stepper(id, value, minus, plus){
  return N('stepper', {id:id, value:value, minusId:id + '_dec', plusId:id + '_inc',
                       minus:minus, plus:plus});
}
function sheet(id, title, kids){
  return N('sheet', {id:id, title:title, closeId:id + '_close', close:{type:'CLOSE_SHEET'}, c:kids});
}
function route(st){ return st.ui.stack[st.ui.stack.length - 1]; }
function push(st, name, params){ st.ui.stack.push({name:name, params:params || {}}); st.ui.sheet = null; }
function pop(st){ if (st.ui.stack.length > 1) st.ui.stack.pop(); }
function toast(st, t){ st.ui.toast = t; }

/* ------------------------------------------------------------ 一周的分钟
 * 一周 = 10080 分钟，周一 00:00 是 0。墙上的钟停在周四 22:47。 */
var WEEK = 10080, DAY = 1440;
var DOW = ['周一','周二','周三','周四','周五','周六','周日'];
var DOW_S = ['一','二','三','四','五','六','日'];
var NOW = 3 * DAY + 22 * 60 + 47;          /* 周四 22:47 */
var TODAY_DATE = '8月27日';
function hhmm(m){
  m = ((m % DAY) + DAY) % DAY;
  var h = Math.floor(m / 60), mi = m % 60;
  return (h < 10 ? '0' : '') + h + ':' + (mi < 10 ? '0' : '') + mi;
}
function dowOf(m){ return Math.floor((((m % WEEK) + WEEK) % WEEK) / DAY); }
function stamp(m){ return DOW[dowOf(m)] + ' ' + hhmm(m); }
function span(mins){
  if (mins < 0) mins = 0;
  var h = Math.floor(mins / 60), mi = mins % 60;
  return (h ? h + ' 小时 ' : '') + mi + ' 分钟';
}
function mmss(sec){
  var m = Math.floor(sec / 60), s = sec % 60;
  return m + ':' + (s < 10 ? '0' : '') + s;
}

/* ------------------------------------------------------------ 闹钟 */
function AL(id, hh, mm, days, label, on, skip, snooze){
  return {id:id, at:hh * 60 + mm, days:days, label:label, on:on, skip:!!skip,
          snooze:snooze === undefined ? true : snooze};
}
function alarmOf(st, id){
  for (var i=0;i<st.alarms.length;i++) if (st.alarms[i].id === id) return st.alarms[i];
  return null;
}
/* 这条规则下一次落在什么时候。跳过一次就取第二早的那个。 */
function nextFire(a){
  if (!a.on) return null;
  var days = a.days.length ? a.days : [dowOf(NOW), (dowOf(NOW) + 1) % 7];
  var cands = [];
  days.forEach(function(d){
    var t = d * DAY + a.at;
    if (t <= NOW) t += WEEK;
    cands.push(t);
    cands.push(t + WEEK);
  });
  cands.sort(function(x, y){ return x - y; });
  var uniq = [];
  cands.forEach(function(x){ if (uniq.indexOf(x) < 0) uniq.push(x); });
  if (!a.days.length){
    /* 单次闹钟只落在指定的那一天 */
    var t2 = a.once * DAY + a.at;
    if (t2 <= NOW) t2 += WEEK;
    uniq = [t2, t2 + WEEK];
  }
  return a.skip ? uniq[1] : uniq[0];
}
function untilFire(a){ var t = nextFire(a); return t === null ? null : t - NOW; }
function daysText(a){
  if (!a.days.length) return '不重复 · ' + DOW[a.once];
  if (a.days.length === 7) return '每天';
  var wd = [0,1,2,3,4], we = [5,6];
  var same = function(x, y){ return x.length === y.length && x.every(function(v){ return y.indexOf(v) >= 0; }); };
  if (same(a.days, wd)) return '工作日';
  if (same(a.days, we)) return '周末';
  return a.days.slice().sort(function(x, y){ return x - y; })
          .map(function(d){ return '周' + DOW_S[d]; }).join(' ');
}
function ringing(st){
  return st.alarms.filter(function(a){ return a.on; })
    .map(function(a){ return {a:a, at:nextFire(a), in_:untilFire(a)}; })
    .sort(function(x, y){ return x.at - y.at || (x.a.id < y.a.id ? -1 : 1); });
}
function nextAlarm(st){ var r = ringing(st); return r.length ? r[0] : null; }
function sleepLeft(st){ var n = nextAlarm(st); return n ? n.in_ : null; }

/* ------------------------------------------------------------ 世界时钟
 * 偏移是相对本地（UTC+8）的分钟数，夏令时已经算进去了。 */
function CT(id, name, off, zone, dst){ return {id:id, name:name, off:off, zone:zone, dst:!!dst}; }
var CITIES = [
  CT('c_sh',  '上海',   0,      'UTC+8',    false),
  CT('c_tk',  '东京',   60,     'UTC+9',    false),
  CT('c_sy',  '悉尼',   120,    'UTC+10',   false),
  CT('c_ak',  '奥克兰', 240,    'UTC+12',   false),
  CT('c_dl',  '新德里', -150,   'UTC+5:30', false),
  CT('c_du',  '迪拜',   -240,   'UTC+4',    false),
  CT('c_ld',  '伦敦',   -420,   'UTC+1',    true),
  CT('c_pa',  '巴黎',   -360,   'UTC+2',    true),
  CT('c_ny',  '纽约',   -720,   'UTC-4',    true),
  CT('c_la',  '洛杉矶', -900,   'UTC-7',    true),
  CT('c_sp',  '圣保罗', -660,   'UTC-3',    false)
];
function cityOf(id){ for (var i=0;i<CITIES.length;i++) if (CITIES[i].id === id) return CITIES[i]; return null; }
function cityNow(c){ return NOW + c.off; }
function dayShift(c){
  var a = Math.floor(NOW / DAY), b = Math.floor((NOW + c.off) / DAY);
  return b - a;
}
function shiftText(n){ return n === 0 ? '今天' : (n > 0 ? '明天' : '昨天'); }
/* 本地某个时刻，在某个城市是几点 */
function convert(localMin, cityId){ return localMin + cityOf(cityId).off; }

/* ------------------------------------------------------------ 计时器 */
function TM(id, label, total, left, run){
  return {id:id, label:label, total:total, left:left, run:!!run};
}
function timerOf(st, id){
  for (var i=0;i<st.timers.length;i++) if (st.timers[i].id === id) return st.timers[i];
  return null;
}
function runningTimers(st){ return st.timers.filter(function(t){ return t.run && t.left > 0; }); }
function firstTimer(st){
  var r = runningTimers(st).slice().sort(function(a, b){ return a.left - b.left; });
  return r.length ? r[0] : null;
}
var PRESETS = [60, 180, 300, 600, 1800];

/* ------------------------------------------------------------ 就寝 */
function bedWindow(st){
  var b = st.bedtime;
  var len = b.wake - b.sleep;
  if (len <= 0) len += DAY;
  return len;
}

/* =========================================================== state */
function createInitialState(seed){
  seed = seed || 0;
  var alarms = [
    AL('a_work',  6, 40, [0,1,2,3,4], '上班',  true,  false, true),
    AL('a_early', 5, 30, [0,1,2,3,4], '早班',  true,  true,  true),
    AL('a_wknd',  7, 15, [5,6],       '周末',  true,  false, true),
    AL('a_run',   6,  0, [0,2,4],     '跑步',  false, false, true),
    AL('a_pill', 22,  0, [0,1,2,3,4,5,6], '吃药', true, false, false),
    AL('a_dent',  9, 30, [],          '牙医',  true,  false, true)
  ];
  alarms[5].once = 6;                    /* 单次：周日 */
  return {
    meta:{env:ENV_ID, version:VERSION, seed:seed, steps:0, finished:false, answer:null},
    alarms:alarms,
    timers:[
      TM('t_noodle', '泡面', 180,  72,   true),
      TM('t_oven',   '烤箱', 1500, 1120, true),
      TM('t_wash',   '洗衣', 2700, 2700, false)
    ],
    stopwatch:{running:false, total:2547, laps:[612, 598, 671, 666]},   /* 秒 */
    bedtime:{sleep:23 * 60 + 30, wake:6 * 60 + 40, days:[0,1,2,3,4], on:true, goal:480},
    cities:['c_ld', 'c_ny', 'c_sy', 'c_dl'],
    /* 种子只打乱城市抽屉里备选城市的排列 */
    order:shuffled(CITIES.map(function(c){ return c.id; }), seed),
    ui:{tab:'alarm', stack:[{name:'alarm', params:{}}], sheet:null, confirm:null, inputs:{},
        toast:null},
    settings:{show24:true, snoozeAll:true, bedtimeReminder:true}
  };
}
var SELECT = {
  alarmOf:alarmOf, nextFire:nextFire, untilFire:untilFire, daysText:daysText, ringing:ringing,
  nextAlarm:nextAlarm, sleepLeft:sleepLeft, cityOf:cityOf, cityNow:cityNow, dayShift:dayShift,
  convert:convert, timerOf:timerOf, runningTimers:runningTimers, firstTimer:firstTimer,
  bedWindow:bedWindow, hhmm:hhmm, stamp:stamp, span:span, mmss:mmss,
  cities:CITIES, presets:PRESETS, now:NOW, dow:DOW, route:route
};

/* =========================================================== reducer */
function reduce(prev, action){
  var st = clone(prev), A = action || {};
  st.ui.toast = null;
  st.meta.steps += 1;

  function said(st){
    var n = nextAlarm(st);
    return n ? '下一个是「' + n.a.label + '」' + stamp(n.at) + '，还能睡 ' + span(n.in_)
             : '一个闹钟都不会响了';
  }

  switch (A.type) {

  case 'NOOP': break;
  case 'FINISH': st.meta.finished = true; st.meta.answer = A.answer === undefined ? null : A.answer; break;

  case 'NAV': push(st, A.to, A.params); break;
  case 'BACK':
    if (st.ui.sheet) st.ui.sheet = null;
    else if (st.ui.confirm) st.ui.confirm = null;
    else pop(st);
    break;
  case 'TAB': {
    var roots = {alarm:'alarm', world:'world', timer:'timer', bed:'bed'};
    st.ui.tab = A.tab; st.ui.sheet = null; st.ui.confirm = null;
    st.ui.stack = [{name:roots[A.tab] || 'alarm', params:{}}];
    break;
  }
  case 'HOME':
    st.ui.tab = 'alarm'; st.ui.stack = [{name:'alarm', params:{}}];
    st.ui.sheet = null; st.ui.confirm = null;
    break;
  case 'SET_INPUT': st.ui.inputs[A.field] = A.value; break;
  case 'OPEN_SHEET': st.ui.sheet = {type:A.sheet, id:A.id || null}; break;
  case 'CLOSE_SHEET': st.ui.sheet = null; break;
  case 'CONFIRM_NO': st.ui.confirm = null; break;
  case 'CONFIRM_YES': {
    var yes = st.ui.confirm && st.ui.confirm.yes; st.ui.confirm = null;
    if (yes) { var keep = st.meta.steps; var out = reduce(st, yes); out.meta.steps = keep; return out; }
    break;
  }

  /* ---- 闹钟 ---- */
  case 'TOGGLE_ALARM': {
    var a = alarmOf(st, A.id);
    if (!a) break;
    a.on = !a.on;
    if (!a.on) a.skip = false;
    toast(st, '「' + a.label + '」' + (a.on ? '已开启，' + stamp(nextFire(a)) + '响'
                                            : '已关闭') + '。' + said(st));
    break;
  }
  case 'SET_HOUR': {
    var a2 = alarmOf(st, A.id);
    if (!a2) break;
    a2.at = A.n * 60 + (a2.at % 60);
    toast(st, '「' + a2.label + '」改到 ' + hhmm(a2.at) + '，' + stamp(nextFire(a2)) + '响');
    break;
  }
  case 'SET_MIN': {
    var a3 = alarmOf(st, A.id);
    if (!a3) break;
    a3.at = Math.floor(a3.at / 60) * 60 + A.n;
    toast(st, '「' + a3.label + '」改到 ' + hhmm(a3.at) + '，' + stamp(nextFire(a3)) + '响');
    break;
  }
  case 'NUDGE': {
    var a4 = alarmOf(st, A.id);
    if (!a4) break;
    a4.at = ((a4.at + A.by) % DAY + DAY) % DAY;
    toast(st, '「' + a4.label + '」' + hhmm(a4.at) + '，' + stamp(nextFire(a4)) + '响');
    break;
  }
  case 'TOGGLE_DOW': {
    var a5 = alarmOf(st, A.id);
    if (!a5) break;
    if (!a5.days.length) { toast(st, '这是个单次闹钟，先选一天才能变成重复的'); }
    var i = a5.days.indexOf(A.d);
    if (i >= 0) a5.days.splice(i, 1); else a5.days.push(A.d);
    a5.days.sort(function(x, y){ return x - y; });
    toast(st, '「' + a5.label + '」' + daysText(a5)
              + (a5.on ? '，' + stamp(nextFire(a5)) + '响' : ''));
    break;
  }
  case 'TOGGLE_SKIP': {
    var a6 = alarmOf(st, A.id);
    if (!a6) break;
    if (!a6.on) { toast(st, '「' + a6.label + '」是关着的，没有下一次可跳'); break; }
    a6.skip = !a6.skip;
    toast(st, a6.skip ? '「' + a6.label + '」跳过下一次，改成 ' + stamp(nextFire(a6)) + '响'
                      : '「' + a6.label + '」不跳了，' + stamp(nextFire(a6)) + '响');
    break;
  }
  case 'TOGGLE_SNOOZE': {
    var a7 = alarmOf(st, A.id);
    if (!a7) break;
    a7.snooze = !a7.snooze;
    toast(st, '「' + a7.label + '」贪睡' + (a7.snooze ? '已开' : '已关'));
    break;
  }
  case 'DELETE_ALARM': {
    var a8 = alarmOf(st, A.id);
    if (!a8) break;
    st.ui.confirm = {title:'删掉「' + a8.label + '」？', text:'这个闹钟以后都不会响了。',
      okText:'删除', yes:{type:'DELETE_ALARM_YES', id:A.id}};
    break;
  }
  case 'DELETE_ALARM_YES': {
    st.alarms = st.alarms.filter(function(x){ return x.id !== A.id; });
    if (route(st).name === 'edit') pop(st);
    toast(st, '已删除。' + said(st));
    break;
  }

  /* ---- 世界时钟 ---- */
  case 'ADD_CITY': {
    if (st.cities.indexOf(A.id) >= 0) { toast(st, cityOf(A.id).name + '已经在列表里了'); break; }
    st.cities.push(A.id);
    st.ui.sheet = null;
    toast(st, cityOf(A.id).name + '已添加，那边现在 ' + hhmm(cityNow(cityOf(A.id)))
              + '（' + shiftText(dayShift(cityOf(A.id))) + '）');
    break;
  }
  case 'REMOVE_CITY':
    st.cities = st.cities.filter(function(x){ return x !== A.id; });
    toast(st, cityOf(A.id).name + '已移除');
    break;

  /* ---- 计时器 ---- */
  case 'TIMER_TOGGLE': {
    var t = timerOf(st, A.id);
    if (!t) break;
    if (t.left <= 0) { toast(st, '「' + t.label + '」已经走完了，先重置'); break; }
    t.run = !t.run;
    toast(st, '「' + t.label + '」' + (t.run ? '开始，' + mmss(t.left) + ' 后响，也就是 '
                                              + hhmm(NOW + Math.ceil(t.left / 60))
                                            : '已暂停，停在 ' + mmss(t.left)));
    break;
  }
  case 'TIMER_RESET': {
    var t2 = timerOf(st, A.id);
    if (!t2) break;
    t2.left = t2.total; t2.run = false;
    toast(st, '「' + t2.label + '」重置为 ' + mmss(t2.total));
    break;
  }
  case 'TIMER_ADD': {
    var t3 = timerOf(st, A.id);
    if (!t3) break;
    t3.left += A.sec;
    if (t3.left < 0) t3.left = 0;
    if (t3.left > t3.total) t3.total = t3.left;
    toast(st, '「' + t3.label + '」剩 ' + mmss(t3.left));
    break;
  }
  case 'TIMER_NEW': {
    var n = st.timers.length + 1;
    st.timers.push(TM('t_new' + n, '计时器 ' + n, A.sec, A.sec, true));
    toast(st, '新计时器 ' + mmss(A.sec) + ' 已开始');
    break;
  }
  case 'TIMER_DELETE':
    st.timers = st.timers.filter(function(x){ return x.id !== A.id; });
    toast(st, '已删除');
    break;

  /* ---- 就寝 ---- */
  case 'BED_NUDGE': {
    var b = st.bedtime;
    if (A.which === 'sleep') b.sleep = ((b.sleep + A.by) % DAY + DAY) % DAY;
    else b.wake = ((b.wake + A.by) % DAY + DAY) % DAY;
    toast(st, '睡 ' + hhmm(b.sleep) + ' 起 ' + hhmm(b.wake) + '，一共 ' + span(bedWindow(st))
              + (bedWindow(st) < b.goal ? '，比目标少 ' + span(b.goal - bedWindow(st)) : ''));
    break;
  }
  case 'BED_TOGGLE':
    st.bedtime.on = !st.bedtime.on;
    toast(st, st.bedtime.on ? '就寝提醒已开' : '就寝提醒已关');
    break;

  case 'SET_TOGGLE': st.settings[A.key] = !st.settings[A.key]; break;

  default: break;
  }
  return st;
}

/* =========================================================== screens */
function tabbar(st){
  var items = [
    {id:'tab_alarm', text:'闹钟', icon:'alarm',  tab:'alarm'},
    {id:'tab_world', text:'世界时钟', icon:'globe', tab:'world'},
    {id:'tab_timer', text:'计时器', icon:'timer', tab:'timer'},
    {id:'tab_bed',   text:'就寝', icon:'moon',   tab:'bed'}
  ].map(function(i){
    return {id:i.id, text:i.text, icon:i.icon, on:(st.ui.tab === i.tab), act:{type:'TAB', tab:i.tab}};
  });
  return N('tabbar', {id:'tabbar', items:items});
}
function nextCard(st){
  var n = nextAlarm(st);
  var b = st.bedtime;
  if (!n)
    return N('nextup', {id:'next_up', kicker:'下一个闹钟', time:'没有闹钟会响', none:true,
      sub:'现在是' + DOW[dowOf(NOW)] + ' ' + hhmm(NOW) + '（' + TODAY_DATE + '）。'
          + '开着的闹钟一个都没有。',
      grid:[{v:'—', l:'还能睡'}, {v:st.alarms.length + '', l:'闹钟总数'},
            {v:'0', l:'开着的'}]});
  return N('nextup', {id:'next_up', kicker:'下一个闹钟', none:false,
    time:hhmm(n.at) + ' · ' + DOW[dowOf(n.at)],
    sub:'「' + n.a.label + '」' + daysText(n.a) + '。现在是' + DOW[dowOf(NOW)] + ' '
        + hhmm(NOW) + '（' + TODAY_DATE + '），到它响还有 ' + span(n.in_) + '。',
    grid:[{v:span(n.in_), l:'还能睡', warn:n.in_ < b.goal},
          {v:st.alarms.filter(function(a){ return a.on; }).length + '/' + st.alarms.length,
           l:'开着的闹钟'},
          {v:st.alarms.filter(function(a){ return a.on && a.skip; }).length + '',
           l:'跳过下一次', warn:st.alarms.some(function(a){ return a.on && a.skip; })}]});
}
function alarmRow(st, a){
  var n = a.on ? nextFire(a) : null;
  return N('alm', {id:'alarm_' + a.id, off:!a.on,
    time:hhmm(a.at), label:a.label,
    sub:daysText(a) + (a.on ? (a.skip ? ' · <em>跳过下一次</em> · ' + stamp(n) + '响'
                                      : ' · <i>' + stamp(n) + '响</i>')
                            : ' · 已关闭'),
    on:a.on, swId:'sw_' + a.id, sw:{type:'TOGGLE_ALARM', id:a.id},
    act:{type:'NAV', to:'edit', params:{id:a.id}}});
}

function scrAlarm(st){
  var list = ringing(st).map(function(x){ return x.a; })
    .concat(st.alarms.filter(function(a){ return !a.on; }));
  return N('screen', {id:'scr_alarm', name:'alarm', c:[
    appbar('闹钟'),
    N('scroll', {id:'alarm_scroll', c:[
      nextCard(st),
      N('chips', {id:'world_strip', c: st.order.filter(function(id){
          return st.cities.indexOf(id) >= 0;
        }).map(cityOf).map(function(c){
          return N('chip', {id:'wc_' + c.id, text:c.name + ' ' + hhmm(cityNow(c)),
            on:false, act:{type:'NAV', to:'city', params:{id:c.id}}});
        })}),
      N('sec', {text:'按下次响的先后排', side:st.alarms.length + ' 个'}),
      N('card', {id:'alarm_list', cls:'flush', c: list.map(function(a){
        return alarmRow(st, a);
      })}),
      txt('关掉的闹钟排在最后。「跳过下一次」不会关掉闹钟，只是让它这一次不响——'
          + '所以看着最早的那个不一定是先响的那个。', 'muted'),
      N('space', {})
    ]}),
    tabbar(st)
  ]});
}

function scrEdit(st, params){
  var a = alarmOf(st, params.id);
  if (!a) return scrAlarm(st);
  var hrs = [], mins = [];
  for (var h = 0; h < 24; h++) hrs.push(h);
  for (var m = 0; m < 60; m += 5) mins.push(m);
  return N('screen', {id:'scr_edit', name:'edit', params:params, c:[
    appbar(a.label, {back:true}),
    N('scroll', {id:'edit_scroll', c:[
      N('nextup', {id:'edit_next', kicker:a.on ? '下次响' : '已关闭', none:!a.on,
        time:a.on ? stamp(nextFire(a)) : '不会响',
        sub:a.on ? '距现在 ' + span(untilFire(a)) + '。' + (a.skip ? '「跳过下一次」开着。' : '')
                 : '打开开关才会算下次响的时间。',
        grid:[{v:hhmm(a.at), l:'时间'}, {v:daysText(a), l:'重复'},
              {v:a.snooze ? '开' : '关', l:'贪睡'}]}),
      N('wheel', {id:'time_wheel', hourLabel:'小时', minLabel:'分钟（五分一档）',
        hours:hrs.map(function(h){
          return {id:'hr_' + h, text:(h < 10 ? '0' : '') + h, on:Math.floor(a.at / 60) === h,
                  act:{type:'SET_HOUR', id:a.id, n:h}};

        mins:mins.map(function(m){

var ROUTES = {alarm:scrAlarm, edit:scrEdit, world:scrWorld, city:scrCity, timer:scrTimer,
              bed:scrBed};
function screen(st){
  var r = route(st), fn = ROUTES[r.name] || scrAlarm;
  var rootNode = fn(st, r.params || {});
  rootNode.route = r.name;
  var extra = [];
  if (st.ui.sheet && st.ui.sheet.type === 'city')
    extra.push(N('mask', {id:'mask', close:{type:'CLOSE_SHEET'}, c:[sheetCity(st)]}));
  if (st.ui.confirm)
    extra.push(N('mask', {id:'confirm_mask', c:[N('dialog', {id:'confirm_dialog',
      title:st.ui.confirm.title || '', text:st.ui.confirm.text,
      ok: btn('confirm_ok', st.ui.confirm.okText || '确定', {type:'CONFIRM_YES'}, 'primary'),
      cancel: btn('confirm_cancel', '算了', {type:'CONFIRM_NO'}, '')})]}));
  if (st.ui.toast) extra.push(N('toast', {id:'toast', text:st.ui.toast}));
  rootNode.c = rootNode.c.concat(extra);
  return rootNode;
}

/* =======================================================================
 * TRAVERSAL — element index, GUI action interface, text observation.
 * Identical in every environment here: the screen tree is the only thing
 * that differs, and all three readers below walk that same tree.
 * ==================================================================== */
var SKIP_KEYS = {act:1, minus:1, plus:1, close:1, yes:1, params:1, meta:1, grid:1, laps:1, deps:1};

function labelOf(n){ return n.text || n.title || n.name || n.label || n.main || ''; }

function collect(n, out){
  if (!n || typeof n !== 'object') return;
  if (Array.isArray(n)) { for (var i=0;i<n.length;i++) collect(n[i], out); return; }
  if (n.t === 'appbar' && n.back) out.push({id:'nav_back', act:{type:'BACK'}, text:'Back', t:'back'});
  if (n.id && n.act)              out.push({id:n.id, act:n.act, text:labelOf(n), t:n.t||'el',
                                            disabled:!!n.disabled,
                                            input:(n.t === 'inputrow')});
  if (n.t === 'mask' && n.close)  out.push({id:n.id, act:n.close, text:'Dismiss overlay', t:'mask'});
  for (var k in n){
    /* a node may carry extra buttons as a pair of keys: someId holds the
     * test-id and some holds the action. That is how steppers, sheet close
     * buttons and per-row buttons all get into the element index. */
    if (k.length > 2 && k.slice(-2) === 'Id' && typeof n[k] === 'string'){
      var sib = n[k.slice(0, -2)];
      if (sib && typeof sib === 'object' && sib.type)
        out.push({id:n[k], act:sib, text:k.slice(0, -2), t:'sub'});
    }
    if (SKIP_KEYS[k]) continue;
    var v = n[k];
    if (v && typeof v === 'object') collect(v, out);
  }
}
function elements(st){
  var rootNode = (st && st.t === 'screen') ? st : screen(st);
  var masks = (rootNode.c || []).filter(function(n){ return n.t === 'mask'; });
  var out = [];
  collect(masks.length ? masks[masks.length-1] : rootNode, out);
  return out;
}
function findEl(st, id){
  var els = elements(st);
  for (var i=0;i<els.length;i++) if (els[i].id === id) return els[i];
  return null;
}
function substitute(act, text){
  var a = clone(act);
  for (var k in a) if (a[k] === '$VALUE') a[k] = text;
  return a;
}
function step(st, a){
  a = a || {};
  var kind = a.action || a.type;
  switch (kind) {
  case 'tap': {
    var el = findEl(st, a.id);
    if (!el) return {state:st, ok:false, error:'ELEMENT_NOT_FOUND: ' + a.id};
    if (el.disabled) return {state:st, ok:false, error:'ELEMENT_DISABLED: ' + a.id};
    return {state:reduce(st, el.act), ok:true};
  }
  case 'type': {
    var e2 = findEl(st, a.id);
    if (!e2) return {state:st, ok:false, error:'ELEMENT_NOT_FOUND: ' + a.id};
    if (!e2.input) return {state:st, ok:false, error:'NOT_A_TEXT_FIELD: ' + a.id};
    return {state:reduce(st, substitute(e2.act, a.text == null ? '' : String(a.text))), ok:true};
  }
  case 'back':   return {state:reduce(st, {type:'BACK'}), ok:true};
  case 'home':   return {state:reduce(st, {type:'HOME'}), ok:true};
  case 'wait':   return {state:reduce(st, {type:'NOOP'}), ok:true};
  case 'finish': return {state:reduce(st, {type:'FINISH', answer:a.answer}), ok:true};
  case 'raw':    return {state:reduce(st, a.act || {}), ok:true};
  default:       return {state:st, ok:false, error:'UNKNOWN_ACTION: ' + kind};
  }
}

/* ------------------------------------------------- text observation (a11y) */
function a11y(st){
  var rootNode = screen(st), lines = [], r = route(st);
  lines.push('# Screen route=' + r.name + (r.params && r.params.id ? '(' + r.params.id + ')' : '') +
             '  step ' + st.meta.steps);
  lines.push('# 现在 ' + DOW[dowOf(NOW)] + ' ' + hhmm(NOW) + '。' + (nextAlarm(st) ? '下一个闹钟「' + nextAlarm(st).a.label + '」' + stamp(nextAlarm(st).at) + '，还有 ' + span(nextAlarm(st).in_) : '没有闹钟会响') + '。');
  var masks = (rootNode.c || []).filter(function(n){ return n.t === 'mask'; });
  if (masks.length) lines.push('# An overlay is open. Nothing behind it can be tapped.');
  walkText(masks.length ? masks[masks.length-1] : rootNode, 0, lines, st);
  (rootNode.c || []).forEach(function(n){ if (n.t === 'toast') lines.push('[Toast] ' + n.text); });
  return lines.join('\n');
}
function tid(n){ return (n && n.id && n.act) ? ' #' + n.id : ''; }
function ind(d){ return new Array(d+1).join('  '); }

function walkText(n, d, out, st){
  if (!n || typeof n !== 'object') return;
  if (Array.isArray(n)) { n.forEach(function(x){ walkText(x, d, out, st); }); return; }
  var line = null;
  switch (n.t) {
  case 'screen': break;
  case 'appbar': line = '[AppBar] ' + (n.title || '') + (n.back ? '   Back #nav_back' : ''); break;
  case 'iconbtn': line = '[IconButton]' + tid(n) + ' ' + n.icon; break;
  case 'inputrow':
    line = '[TextField]' + tid(n) + ' ' + (n.label || '') + ' value="' + (n.value || '') + '"'; break;
  case 'chip':   line = '[Chip]' + tid(n) + ' ' + n.text + (n.on ? '  [selected]' : ''); break;
  case 'btn':    line = '[Button]' + (n.id ? ' #' + n.id : '') + ' ' + n.text + (n.disabled ? ' (disabled)' : ''); break;
  case 'row': {
    var s = '[Row]' + tid(n) + ' ' + (n.text || '') + (n.strike ? ' (crossed out)' : '');
    if (n.val) s += ' \u2014 ' + n.val;
    if (n.sub) s += '   (' + n.sub + ')';
    line = s; break;
  }
  case 'switch': line = '[Toggle]' + tid(n) + ' ' + (n.on ? 'ON' : 'OFF'); break;
  case 'check':  line = '[Checkbox]' + tid(n) + ' ' + (n.on ? 'ticked' : 'not ticked'); break;
  case 'radio':  line = '[Radio]' + tid(n) + ' ' + (n.on ? 'selected' : 'not selected'); break;
  case 'stepper':
    line = '[Stepper] ' + n.value + '  down #' + n.minusId + '  up #' + n.plusId; break;
  case 'hero':
    out.push(ind(d) + '[Hero]' + tid(n) + ' ' + n.kicker + ' \u2014 ' + n.title + '. ' + n.sub);
    return;
  case 'stat':   line = '[Stat]' + tid(n) + ' ' + n.l + ': ' + n.n; break;
  case 'pills':  line = n.items.map(function(p){ return '[' + p.text + ']'; }).join(' '); break;
  case 'sec':    line = '\u2014 ' + n.text + (n.side ? ' (' + n.side + ')' : '') + ' \u2014'; break;
  case 'text':   line = n.text || null; break;
  case 'tabbar':
    out.push(ind(d) + '[TabBar] ' + n.items.map(function(i){
      return i.text + ' #' + i.id + (i.on ? '[current]' : ''); }).join('  '));
    return;
  case 'sheet':  line = '[Sheet] ' + n.title + '   close #' + n.closeId; break;
  case 'dialog': line = '[Dialog] ' + (n.title ? n.title + ' \u2014 ' : '') + n.text; break;
  case 'mask': case 'toast': line = null; break;
  default: {
    var extra = walkExtra(n, d, out, st);
    if (extra === true) return;
    line = extra || null;
  }
  }
  if (line !== null) out.push(ind(d) + line);
  for (var k in n){
    if (SKIP_KEYS[k]) continue;
    var v = n[k];
    if (v && typeof v === 'object') walkText(v, line !== null ? d+1 : d, out, st);
  }
}
/* per-environment nodes: return a string to print, true if already printed,
 * or null to ignore */
function walkExtra(n, d, out, st){

  if (n.t === 'nextup'){
    out.push(ind(d) + '[' + n.kicker + '] ' + n.time);
    out.push(ind(d+1) + n.sub);
    n.grid.forEach(function(g){ out.push(ind(d+1) + g.l + '：' + g.v); });
    return true;
  }
  if (n.t === 'alm'){
    out.push(ind(d) + '[闹钟] ' + n.time + ' ' + n.label + '  '
             + n.sub.replace(/<[^>]+>/g, '')
             + '   打开详情 #' + n.id + '   开关 #' + n.swId
             + ' ' + (n.on ? 'ON' : 'OFF'));
    return true;
  }
  if (n.t === 'wheel'){
    out.push(ind(d) + '[' + n.hourLabel + '] ' + n.hours.map(function(h){
      return h.text + '#' + h.id + (h.on ? '*' : ''); }).join(' '));
    out.push(ind(d) + '[' + n.minLabel + '] ' + n.mins.map(function(m){
      return m.text + '#' + m.id + (m.on ? '*' : ''); }).join(' '));
    return true;
  }
  if (n.t === 'dows'){
    out.push(ind(d) + '[重复] ' + n.days.map(function(x){
      return x.text + '#' + x.id + (x.on ? '*' : ''); }).join(' '));
    return true;
  }
  if (n.t === 'city'){
    out.push(ind(d) + '[城市]' + tid(n) + ' ' + n.name + ' ' + n.time + '  ' + n.day
             + '  ' + n.zone);
    return true;
  }
  if (n.t === 'tmr'){
    out.push(ind(d) + '[计时器]' + tid(n) + ' ' + n.label + ' ' + n.time + '  ' + n.sub
             + '   ' + n.goText + ' #' + n.goId + '   ' + n.addText + ' #' + n.addId
             + '   ' + n.rmText + ' #' + n.rmId);
    return true;

  elements:   function(){ return E.elements(STATE); },
