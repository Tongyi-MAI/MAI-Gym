<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Pipit (mocked GUI env)</title>
<!--
  ============================================================================
  Pipit — a single-file H5 language course for agent research.

  Same two-block contract as every environment here: script#engine is a pure,
  DOM-free state machine on globalThis.GUI_ENGINE; script#ui renders its screen
  tree and exposes window.__ENV__.

  What is new: the environment marks the work. Every other environment here
  accepts whatever you tap; this one knows which answer is right, and a wrong
  tap costs a heart, breaks the streak and puts the question back at the end of
  the queue to be asked again. Three hearts and the lesson is over.

  The answers are all in the app. The Words tab is a glossary of every term in
  the course, so a task like "finish unit one without losing a heart" is really
  a task about looking things up before answering — which is exactly the sort of
  two-screen dependency a GUI agent ought to be able to handle.

  Nothing is random: the questions come in a fixed order and a wrong answer goes
  to the back of the same queue, so the same taps always produce the same lesson.
  ============================================================================
-->
<style>
:root{
  --outer:#e3e6ee;
  --bezel:#12151f;
  --bg:#f4f8f4;
  --card:#ffffff;
  --card2:#f2f4f9;
  --line:#e2ece2;
  --line2:#cfe0cf;
  --press:#eef6ee;
  --chev:#b9cfbd;
  --ink:#16241a;
  --ink2:#4d6153;
  --muted:#8ba393;
  --accent:#3f9d54;
  --accent-d:#2f7d41;
  --accent-s:#e6f4e9;
  --on-accent:#ffffff;
  --good:#3f9d54;
  --good-s:#e6f4e9;
  --warn:#d08a19;
  --warn-s:#fbf1de;
  --bad:#d6483f;
  --bad-s:#fdecea;
  --bad-line:#f0c8c4;
  --btn:#eaf2ea;
  --btn-off:#dbe7db;
  --off:#c4d6c7;
  --appbar:#f4f8f4;
  --appbar-ink:#161a27;
  --appbar-line:transparent;
  --tabbar:#ffffff;
  --scrim:rgba(22,36,26,.44);
  --toast:#16241a;
  --toast-ink:#ffffff;
  --hero:linear-gradient(140deg,#2f7d41,#5cb570);
  --hero-line:transparent;
  --hero-ink:#ffffff;
  --disp:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --r:18px; --r2:12px;
  --shadow:0 1px 2px rgba(16,18,26,.05),0 10px 26px rgba(16,18,26,.07);
  --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{background:var(--outer);color:var(--ink);font:14px/1.55 var(--ui);
  display:flex;align-items:center;justify-content:center;overflow:hidden}

#device{position:relative;width:390px;height:844px;background:var(--bezel);border-radius:46px;padding:5px;
  box-shadow:0 30px 70px rgba(0,0,0,.34);flex:0 0 auto}
#screen{position:relative;width:100%;height:100%;background:var(--bg);border-radius:41px;
  overflow:hidden;display:flex;flex-direction:column}
#notch{position:absolute;top:5px;left:50%;transform:translateX(-50%);width:118px;height:30px;
  background:var(--bezel);border-radius:0 0 18px 18px;z-index:60}
body.bare{background:var(--bg)}
body.bare #device{width:390px;height:844px;padding:0;border-radius:0;box-shadow:none;background:var(--bg)}
body.bare #screen{border-radius:0}
body.bare #notch{display:none}
body.bare .n-sheet{animation:none}

.statusbar{height:44px;flex:0 0 44px;display:flex;align-items:flex-end;justify-content:space-between;
  padding:0 22px 6px;font-size:13px;font-weight:600;z-index:50;color:var(--ink)}
.statusbar .sb-r{display:flex;gap:5px;align-items:center}
.sb-bat{width:22px;height:11px;border:1.3px solid currentColor;border-radius:3px;position:relative;opacity:.9}
.sb-bat:after{content:"";position:absolute;right:-3px;top:3px;width:2px;height:5px;background:currentColor;border-radius:0 1px 1px 0}
.sb-bat i{position:absolute;left:1.3px;top:1.3px;bottom:1.3px;width:78%;background:currentColor;border-radius:1px}

#app{flex:1 1 auto;display:flex;flex-direction:column;min-height:0;position:relative}

.n-appbar{flex:0 0 auto;min-height:52px;display:flex;align-items:center;gap:8px;padding:6px 12px;
  background:var(--appbar);color:var(--appbar-ink);z-index:20;border-bottom:1px solid var(--appbar-line)}
.n-appbar .ab-title{flex:1 1 auto;text-align:center;font:650 17px/1.3 var(--disp);letter-spacing:-.2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.n-appbar .ab-side{flex:0 0 auto;min-width:56px;display:flex;align-items:center;gap:2px}
.n-appbar .ab-side.right{justify-content:flex-end}
.n-appbar .iconbtn{color:var(--appbar-ink);opacity:.85}
.iconbtn{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  color:var(--ink2);cursor:pointer}
.iconbtn:active{background:var(--press)}

.n-scroll{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;padding-bottom:10px}
.n-scroll::-webkit-scrollbar{width:0}

.n-text{padding:2px 18px;color:var(--ink2)}
.n-text.h1{font:700 26px/1.18 var(--disp);color:var(--ink);padding:10px 18px 6px;letter-spacing:-.6px}
.n-text.h2{font:650 18px/1.3 var(--disp);color:var(--ink);padding:12px 18px 2px}
.n-text.body{font-size:13.5px;padding:5px 18px;line-height:1.7}
.n-text.muted{font-size:12.5px;color:var(--muted);padding:6px 18px;line-height:1.6}
.n-text.empty{padding:14px 18px 40px;text-align:center;color:var(--muted);font-size:13.5px}
.n-sec{padding:18px 18px 6px;font:700 11.5px/1 var(--ui);color:var(--muted);letter-spacing:1.3px;
  text-transform:uppercase;display:flex;justify-content:space-between;align-items:center;gap:10px}
.n-space{height:16px}

.n-card{background:var(--card);border-radius:var(--r);margin:9px 16px;overflow:hidden;border:1px solid var(--line)}
.n-card.flush{padding:0}
.n-card.pad{padding:14px 16px}
.n-card.tap{cursor:pointer}
.n-card.tap:active{background:var(--press)}

.n-row{display:flex;align-items:center;gap:13px;padding:12px 16px;border-bottom:1px solid var(--line);min-height:54px}
.n-row:last-child{border-bottom:none}
.n-row.tap{cursor:pointer}
.n-row.tap:active{background:var(--press)}
.n-row .r-lead{flex:0 0 auto;width:26px;color:var(--ink2);display:flex;align-items:center;justify-content:center}
.n-row .r-main{flex:1 1 auto;min-width:0}
.n-row .r-label{font-size:14.5px}
.n-row .r-label.strike{text-decoration:line-through;color:var(--muted)}
.n-row .r-sub{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.5}
.n-row .r-value{flex:0 0 auto;font-size:14px;color:var(--ink2);text-align:right;font-variant-numeric:tabular-nums}
.n-row .r-value.strong{color:var(--ink);font-weight:700}
.n-row .r-value.acc{color:var(--accent);font-weight:700}
.n-row .r-value.good{color:var(--good);font-weight:700}
.n-row .r-value.warn{color:var(--warn);font-weight:700}
.n-row .r-value.bad{color:var(--bad);font-weight:700}
.n-row .r-arrow{flex:0 0 auto;color:var(--chev);display:flex}

.n-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:47px;padding:0 20px;
  border-radius:13px;font:650 15px/1 var(--ui);background:var(--btn);color:var(--ink);
  border:none;cursor:pointer;user-select:none}
.n-btn:active{filter:brightness(.97)}
.n-btn.primary{background:var(--accent);color:var(--on-accent)}
.n-btn.primary.off{background:var(--btn-off);color:var(--muted);cursor:not-allowed}
.n-btn.ghost{background:transparent;border:1px solid var(--line2);height:37px;font-size:13px;padding:0 14px;color:var(--ink2)}
.n-btn.danger{background:transparent;border:1px solid var(--bad-line);color:var(--bad);height:37px;font-size:13px;padding:0 14px}
.n-btn.block{display:flex;width:100%}
.n-btnrow{display:flex;gap:10px;padding:12px 16px;justify-content:flex-end;align-items:center;flex-wrap:wrap}

.n-chips{display:flex;gap:8px;padding:8px 16px;overflow-x:auto}
.n-chips::-webkit-scrollbar{height:0}
.n-chip{flex:0 0 auto;height:34px;padding:0 14px;border-radius:11px;background:var(--card);
  border:1px solid var(--line2);display:flex;align-items:center;font-size:13px;
  color:var(--ink2);cursor:pointer;white-space:nowrap;font-weight:600}
.n-chip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}

.n-input{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line);background:var(--card)}
.n-input .i-label{flex:0 0 78px;font-size:13px;color:var(--muted)}
.n-input input{flex:1 1 auto;border:none;outline:none;background:transparent;font-size:14.5px;
  font-family:inherit;color:var(--ink);min-width:0}
.n-input input::placeholder{color:var(--muted)}
.n-switch{flex:0 0 auto;width:46px;height:27px;border-radius:14px;background:var(--off);position:relative;cursor:pointer;transition:background .16s}
.n-switch.on{background:var(--accent)}
.n-switch i{position:absolute;top:2.5px;left:2.5px;width:22px;height:22px;border-radius:50%;background:#fff;
  transition:transform .16s;box-shadow:0 1px 3px rgba(0,0,0,.22)}
.n-switch.on i{transform:translateX(19px)}
.n-check{flex:0 0 auto;width:23px;height:23px;border-radius:7px;border:1.8px solid var(--off);position:relative;background:var(--card)}
.n-check.on{border-color:var(--accent);background:var(--accent)}
.n-check.on:after{content:"";position:absolute;left:7.5px;top:4px;width:5px;height:10px;
  border:2px solid var(--on-accent);border-top:0;border-left:0;transform:rotate(42deg)}
.n-radio{flex:0 0 auto;width:22px;height:22px;border-radius:50%;border:1.8px solid var(--off);position:relative}
.n-radio.on{border-color:var(--accent);background:var(--accent)}
.n-radio.on:after{content:"";position:absolute;left:7px;top:4px;width:5px;height:9px;
  border:2px solid var(--on-accent);border-top:0;border-left:0;transform:rotate(42deg)}

.tag{display:inline-flex;align-items:center;padding:3px 9px;border-radius:20px;font-size:11px;
  font-weight:700;background:var(--btn);color:var(--ink2)}
.tag.acc{background:var(--accent-s);color:var(--accent)}
.tag.good{background:var(--good-s);color:var(--good)}
.tag.warn{background:var(--warn-s);color:var(--warn)}
.tag.bad{background:var(--bad-s);color:var(--bad)}

.n-tabbar{flex:0 0 auto;height:58px;background:var(--tabbar);border-top:1px solid var(--line);display:flex;z-index:30}
.n-tabbar .tb{flex:1 1 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--muted);font-size:10.5px;cursor:pointer;font-weight:600}
.n-tabbar .tb i{display:flex}
.n-tabbar .tb.on{color:var(--accent)}

.n-mask{position:absolute;inset:0;background:var(--scrim);z-index:70;display:flex;align-items:flex-end}
.n-sheet{width:100%;max-height:80%;background:var(--card);border-radius:22px 22px 0 0;display:flex;
  flex-direction:column;overflow:hidden;animation:up .18s ease-out}
@keyframes up{from{transform:translateY(24px)}to{transform:none}}
.n-sheet .sh-hd{padding:16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.n-sheet .sh-hd .t{font:650 17px/1.2 var(--disp)}
.n-sheet .sh-bd{flex:1 1 auto;overflow-y:auto;min-height:0}
.n-sheet .sh-bd::-webkit-scrollbar{width:0}
.n-toast{position:absolute;left:50%;bottom:118px;transform:translateX(-50%);background:var(--toast);
  color:var(--toast-ink);padding:11px 18px;border-radius:11px;font-size:13px;z-index:90;max-width:84%;text-align:center}
.dialog{margin:auto;width:82%;background:var(--card);border-radius:18px;overflow:hidden;border:1px solid var(--line)}

.stats{display:flex;gap:9px;padding:4px 16px}
.stat{flex:1 1 0;background:var(--card);border:1px solid var(--line);border-radius:var(--r2);padding:13px 12px}
.stat.tap{cursor:pointer}
.stat .st-n{font:800 19px/1.1 var(--disp);letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.stat .st-l{font-size:11px;color:var(--muted);margin-top:6px;line-height:1.4}
.stat.acc .st-n{color:var(--accent)}

.hero{margin:8px 16px 4px;padding:18px;border-radius:var(--r);background:var(--hero);
  border:1px solid var(--hero-line);color:var(--hero-ink)}
.hero.tap{cursor:pointer}
.hero .he-k{font-size:11px;letter-spacing:1.3px;text-transform:uppercase;font-weight:800;opacity:.85}
.hero .he-t{font:800 25px/1.16 var(--disp);margin-top:9px;letter-spacing:-.7px}
.hero .he-s{font-size:13px;margin-top:8px;line-height:1.6;opacity:.9}


.path{padding:8px 0 4px}
.unit{margin:12px 16px 4px;padding:14px 16px;border-radius:var(--r);background:var(--hero);color:#fff}
.unit .un-k{font-size:11px;letter-spacing:1.3px;text-transform:uppercase;font-weight:800;opacity:.85}
.unit .un-t{font:800 20px/1.2 var(--disp);margin-top:7px}
.unit .un-s{font-size:12.5px;opacity:.9;margin-top:6px}
.bubbles{display:flex;gap:12px;padding:12px 18px 4px;flex-wrap:wrap}
.bub{width:66px;text-align:center;cursor:pointer}
.bub .bb-c{width:66px;height:66px;border-radius:50%;background:var(--card);border:3px solid var(--line2);
  display:flex;align-items:center;justify-content:center;color:var(--muted)}
.bub.done .bb-c{background:var(--accent);border-color:var(--accent-d);color:#fff}
.bub.next .bb-c{border-color:var(--accent);color:var(--accent)}
.bub .bb-l{font-size:10.5px;color:var(--ink2);margin-top:6px;font-weight:650;line-height:1.3}

.hearts{display:flex;gap:5px;align-items:center}
.hearts i{width:16px;height:14px;display:inline-block;color:var(--bad)}
.qbar{flex:1 1 auto;height:9px;border-radius:5px;background:var(--btn);overflow:hidden;margin:0 12px}
.qbar i{display:block;height:100%;background:var(--accent);border-radius:5px}
.qhead{display:flex;align-items:center;padding:10px 16px 4px}

.prompt{padding:18px 18px 6px}
.prompt .pr-k{font-size:11.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);font-weight:800}
.prompt .pr-t{font:700 25px/1.3 var(--disp);margin-top:10px;letter-spacing:-.4px}
.prompt .pr-s{font-size:13px;color:var(--ink2);margin-top:8px}

.opt{margin:8px 16px;padding:15px 16px;border-radius:14px;background:var(--card);
  border:2px solid var(--line2);cursor:pointer;font-size:15.5px;font-weight:600;
  display:flex;justify-content:space-between;align-items:center}
.opt:active{background:var(--press)}
.opt.on{border-color:var(--accent);background:var(--accent-s)}
.opt.right{border-color:var(--good);background:var(--good-s)}
.opt.wrong{border-color:var(--bad);background:var(--bad-s)}
.opt .op-k{font-size:11px;color:var(--muted);font-weight:700}

.bank{display:flex;flex-wrap:wrap;gap:8px;padding:10px 16px}
.tile{padding:10px 13px;border-radius:11px;background:var(--card);border:1px solid var(--line2);
  font-size:14.5px;font-weight:600;cursor:pointer}
.tile.used{opacity:.32;border-style:dashed}
.built{margin:10px 16px;min-height:56px;border-bottom:2px solid var(--line2);
  display:flex;flex-wrap:wrap;gap:8px;padding:8px 0 12px;align-items:flex-start}
.built .empty{color:var(--muted);font-size:13px;padding-top:8px}

.verdict{margin:10px 16px;padding:14px 16px;border-radius:var(--r);font-size:14px;font-weight:650;
  display:flex;gap:10px;align-items:flex-start;line-height:1.55}
.verdict.right{background:var(--good-s);color:var(--accent-d)}
.verdict.wrong{background:var(--bad-s);color:var(--bad)}
.verdict .vd-s{display:block;font-weight:400;font-size:12.5px;margin-top:5px;opacity:.9}

.ring{position:relative;width:78px;height:78px;flex:0 0 auto}
.ring svg{transform:rotate(-90deg)}
.ring .rg-t{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .rg-n{font:800 18px/1 var(--disp)}
.ring .rg-l{font-size:9px;color:var(--muted);margin-top:3px;text-transform:uppercase;letter-spacing:.4px}

</style>
</head>
<body>
<div id="device">
  <div id="notch"></div>
  <div id="screen">
    <div class="statusbar" id="sb">
      <div id="sb-clock">09:41</div>
      <div class="sb-r">
        <svg width="17" height="12" viewBox="0 0 17 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="4.6" y="5.5" width="3" height="6.5" rx="1"/><rect x="9.2" y="3" width="3" height="9" rx="1"/><rect x="13.8" y="0" width="3" height="12" rx="1"/></svg>
        <svg width="15" height="12" viewBox="0 0 15 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M1 4.2a9 9 0 0 1 13 0"/><path d="M3.4 6.9a5.6 5.6 0 0 1 8.2 0"/><circle cx="7.5" cy="10" r=".9" fill="currentColor" stroke="none"/></svg>
        <span class="sb-bat"><i></i></span>
      </div>
    </div>
    <div id="app"></div>
  </div>
</div>
<div id="hud" class="off"></div>

<script id="engine">
/* ===========================================================================
 * ENGINE — pure, deterministic, DOM-free.
 * The engine holds the answers. A wrong tap costs a heart and requeues the
 * question; three wrong and the lesson ends. Nothing is random.
 * ======================================================================== */
(function(root){
'use strict';

var ENV_ID  = 'pipit_lessons';
var VERSION = '1.0.0';

/* ------------------------------------------------------------- utilities */
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function pad2(n){ return (n < 10 ? '0' : '') + n; }
function hhmm(m){ m = ((m % 1440) + 1440) % 1440; return pad2(Math.floor(m/60)) + ':' + pad2(m%60); }
function sum(a){ var s = 0; for (var i=0;i<a.length;i++) s += a[i]; return s; }
function clamp(v, lo, hi){ return v < lo ? lo : (v > hi ? hi : v); }
function lcg(seed){ var s=(seed>>>0)||1; return function(){ s=(s*1664525+1013904223)>>>0; return s/4294967296; }; }
function shuffled(list, seed){
  if (!seed) return list.slice();
  var r = lcg(seed), a = list.slice();
  for (var i=a.length-1;i>0;i--){ var j = Math.floor(r()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
function money(p, sym){
  var neg = p < 0; p = Math.abs(p);
  return (neg ? '-' : '') + (sym === undefined ? '\u00a3' : sym) +
         (Math.floor(p/100)).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',') + '.' + pad2(p%100);
}
function getPath(o, path){
  var cur = o, parts = String(path).split('.');
  for (var i=0;i<parts.length;i++){
    var k = parts[i], m = k.match(/^(.*?)\[(\d+)\]$/);
    if (m){ cur = cur ? cur[m[1]] : undefined; cur = cur ? cur[+m[2]] : undefined; }
    else cur = cur ? cur[k] : undefined;
    if (cur === undefined) return undefined;
  }
  return cur;
}
function setPath(o, path, value){
  var parts = String(path).split('.'), cur = o;
  for (var i=0;i<parts.length-1;i++){
    var k = parts[i], m = k.match(/^(.*?)\[(\d+)\]$/);
    cur = m ? cur[m[1]][+m[2]] : (cur[k] = cur[k] || {});
  }
  var lastK = parts[parts.length-1], lm = lastK.match(/^(.*?)\[(\d+)\]$/);
  if (lm) cur[lm[1]][+lm[2]] = value; else cur[lastK] = value;
  return o;
}

/* ------------------------------------------- screen-tree node constructors */
function N(t, o){ o = o || {}; o.t = t; return o; }
function txt(s, cls){ return N('text', {text:s, cls:cls || ''}); }
function row(id, text, o){
  o = o || {}; o.id = id; o.text = text;
  if (o.arrow === undefined) o.arrow = !!o.act;
  return N('row', o);
}
function btn(id, text, act, cls, disabled){
  return N('btn', {id:id, text:text, act:act, cls:cls || '', disabled:!!disabled});
}
function iconbtn(id, ic, act, cls){ return N('iconbtn', {id:id, icon:ic, act:act, cls:cls || ''}); }
function appbar(title, o){ o = o || {}; o.title = title; return N('appbar', o); }
function stepper(id, value, minus, plus){
  return N('stepper', {id:id, value:value, minusId:id + '_dec', plusId:id + '_inc',
                       minus:minus, plus:plus});
}
function sheet(id, title, kids){
  return N('sheet', {id:id, title:title, closeId:id + '_close', close:{type:'CLOSE_SHEET'}, c:kids});
}
function route(st){ return st.ui.stack[st.ui.stack.length - 1]; }
function push(st, name, params){ st.ui.stack.push({name:name, params:params || {}}); st.ui.sheet = null; }
function pop(st){ if (st.ui.stack.length > 1) st.ui.stack.pop(); }
function toast(st, t){ st.ui.toast = t; }

/* ------------------------------------------------------------ the course */
function W(id, pt, en, unit, ex, exEn){
  return {id:id, pt:pt, en:en, unit:unit, ex:ex, exEn:exEn};
}
var WORDS = [
  W('w_agua',   'a água',    'the water',   1, 'A água está fria.',      'The water is cold.'),
  W('w_pao',    'o pão',     'the bread',   1, 'O pão é bom.',           'The bread is good.'),
  W('w_leite',  'o leite',   'the milk',    1, 'Eu bebo leite.',         'I drink milk.'),
  W('w_cafe',   'o café',    'the coffee',  1, 'O café está quente.',    'The coffee is hot.'),
  W('w_maca',   'a maçã',    'the apple',   1, 'A maçã é vermelha.',     'The apple is red.'),
  W('w_queijo', 'o queijo',  'the cheese',  1, 'O queijo é salgado.',    'The cheese is salty.'),
  W('w_gato',   'o gato',    'the cat',     2, 'O gato dorme.',          'The cat sleeps.'),
  W('w_cao',    'o cão',     'the dog',     2, 'O cão corre.',           'The dog runs.'),
  W('w_casa',   'a casa',    'the house',   2, 'A casa é grande.',       'The house is big.'),
  W('w_porta',  'a porta',   'the door',    2, 'A porta está aberta.',   'The door is open.'),
  W('w_livro',  'o livro',   'the book',    2, 'Eu leio o livro.',       'I read the book.'),
  W('w_janela', 'a janela',  'the window',  2, 'A janela é pequena.',    'The window is small.'),
  W('w_hoje',   'hoje',      'today',       3, 'Hoje está a chover.',    'It is raining today.'),
  W('w_amanha', 'amanhã',    'tomorrow',    3, 'Amanhã vou trabalhar.',  'Tomorrow I go to work.'),
  W('w_agora',  'agora',     'now',         3, 'Agora não posso.',       'I cannot right now.'),
  W('w_sempre', 'sempre',    'always',      3, 'Ele chega sempre tarde.','He is always late.'),
  W('w_nunca',  'nunca',     'never',       3, 'Nunca comi isso.',       'I have never eaten that.'),
  W('w_talvez', 'talvez',    'maybe',       3, 'Talvez amanhã.',         'Maybe tomorrow.')
];
function wordOf(id){ for (var i=0;i<WORDS.length;i++) if (WORDS[i].id === id) return WORDS[i]; return null; }
function unitWords(u){ return WORDS.filter(function(w){ return w.unit === u; }); }

/* A question is either "which of these means X" or "put the sentence together".
 * The answer is data, and the engine is what checks it. */
function CH(word, wrongs){ return {kind:'choice', word:word, options:[word].concat(wrongs)}; }
function RV(word, wrongs){ return {kind:'reverse', word:word, options:[word].concat(wrongs)}; }
function BK(word, order, extra){ return {kind:'bank', word:word, order:order, extra:extra || []}; }

var LESSONS = [
  {id:'ls_1', unit:1, title:'Bread and water', items:[
    CH('w_agua',  ['w_pao', 'w_leite']),
    CH('w_pao',   ['w_maca', 'w_cafe']),
    RV('w_leite', ['w_agua', 'w_queijo']),
    CH('w_cafe',  ['w_leite', 'w_agua']),
    BK('w_agua',  ['A', 'água', 'está', 'fria'], ['pão', 'gato']),
    RV('w_maca',  ['w_pao', 'w_queijo'])
  ]},
  {id:'ls_2', unit:2, title:'The house and the cat', items:[
    CH('w_gato',  ['w_cao', 'w_casa']),
    CH('w_casa',  ['w_porta', 'w_janela']),
    RV('w_cao',   ['w_gato', 'w_livro']),
    BK('w_porta', ['A', 'porta', 'está', 'aberta'], ['livro', 'hoje']),
    CH('w_livro', ['w_janela', 'w_porta']),
    RV('w_janela',['w_casa', 'w_porta'])
  ]},
  {id:'ls_3', unit:3, title:'Today and tomorrow', items:[
    CH('w_hoje',   ['w_amanha', 'w_agora']),
    CH('w_amanha', ['w_sempre', 'w_hoje']),
    RV('w_nunca',  ['w_sempre', 'w_talvez']),
    BK('w_amanha', ['Amanhã', 'vou', 'trabalhar'], ['hoje', 'nunca']),
    CH('w_sempre', ['w_nunca', 'w_talvez']),
    RV('w_agora',  ['w_hoje', 'w_amanha'])
  ]}
];
function lessonOf(id){ for (var i=0;i<LESSONS.length;i++) if (LESSONS[i].id === id) return LESSONS[i]; return null; }
function itemPrompt(it){
  var w = wordOf(it.word);
  if (it.kind === 'choice')  return {k:'Which one means', t:w.en, s:'Tap the Portuguese for it'};
  if (it.kind === 'reverse') return {k:'What does this mean', t:w.pt, s:'Tap the English for it'};
  return {k:'Put it together', t:w.exEn, s:'Tap the words in the right order'};
}
function itemAnswer(it){
  if (it.kind === 'bank') return it.order.join(' ');
  return it.word;
}
function bankTiles(it){
  return it.order.concat(it.extra).map(function(t, i){ return {word:t, key:'t' + i}; });
}
/* the tiles are laid out in a fixed jumbled order, not the answer order */
function jumble(list){
  var out = [], mid = Math.ceil(list.length / 2);
  for (var i = 0; i < mid; i++){
    out.push(list[list.length - 1 - i]);
    if (i !== list.length - 1 - i) out.push(list[i]);
  }
  return out;
}

/* =========================================================== state */
function createInitialState(seed){
  seed = seed || 0;
  return {
    meta:{env:ENV_ID, version:VERSION, seed:seed, steps:0, finished:false, answer:null},
    /* the seed permutes the order the answer buttons are shown in — never which
     * of them is right */
    optionSeed:seed,
    progress:{ls_1:false, ls_2:false, ls_3:false},
    xp:120, streakDays:4, bestStreak:9,
    seen:{}, wrongWords:['w_queijo', 'w_talvez'],
    session:null,
    ui:{tab:'learn', stack:[{name:'learn', params:{}}], sheet:null, confirm:null, inputs:{},
        toast:null, unit:1, sel:null, built:[], usedTiles:[], verdict:null},
    settings:{dailyGoal:20, sound:true, reminder:true, hardMode:false}
  };
}
function lessonDone(st, id){ return !!st.progress[id]; }
function xpToday(st){ return st.xp - 120; }
function sessionItem(st){
  var s = st.session;
  if (!s || s.pos >= s.queue.length) return null;
  var lesson = lessonOf(s.lesson);
  return lesson.items[s.queue[s.pos]];
}
function optionOrder(st, it){
  return shuffled(it.options.slice(), st.optionSeed + it.options.length);
}
var SELECT = {
  wordOf:wordOf, unitWords:unitWords, lessonOf:lessonOf, itemPrompt:itemPrompt, itemAnswer:itemAnswer,
  sessionItem:sessionItem, optionOrder:optionOrder, bankTiles:bankTiles, jumble:jumble,
  lessonDone:lessonDone, xpToday:xpToday, route:route
};

/* =========================================================== reducer */
function startSession(st, lessonId, practice){
  var lesson = lessonOf(lessonId);
  st.session = {lesson:lessonId, practice:!!practice,
                queue:lesson.items.map(function(x, i){ return i; }),
                pos:0, hearts:3, correct:0, wrong:0, streak:0, best:0,
                asked:0, failed:false, done:false, wrongIds:[]};
  st.ui.sel = null; st.ui.built = []; st.ui.usedTiles = []; st.ui.verdict = null;
}
function markAnswer(st, given){
  var s = st.session, it = sessionItem(st);
  if (!s || !it) return;
  /* remember what was just asked so the marking stays on screen for the last
   * question too, instead of the result page swallowing it */
  s.lastIdx = s.queue[s.pos];
  var right = (given === itemAnswer(it));
  var w = wordOf(it.word);
  s.asked += 1;
  if (right) {
    s.correct += 1; s.streak += 1;
    if (s.streak > s.best) s.best = s.streak;
    st.seen[it.word] = (st.seen[it.word] || 0) + 1;
    st.ui.verdict = {right:true, title:'Right', sub:w.pt + ' — ' + w.en};
    s.pos += 1;
  } else {
    s.wrong += 1; s.streak = 0; s.hearts -= 1;
    if (s.wrongIds.indexOf(it.word) < 0) s.wrongIds.push(it.word);
    if (st.wrongWords.indexOf(it.word) < 0) st.wrongWords.push(it.word);
    st.ui.verdict = {right:false, title:'Not quite',
      sub:'The answer is ' + (it.kind === 'reverse' ? w.en : (it.kind === 'bank' ? it.order.join(' ') : w.pt))};
    /* the question goes to the back of the queue and will be asked again */
    s.queue = s.queue.concat([s.queue[s.pos]]);
    s.pos += 1;
    if (s.hearts <= 0) { s.failed = true; s.done = true; }
  }
  if (!s.failed && s.pos >= s.queue.length) {
    s.done = true;
    if (!s.practice) st.progress[s.lesson] = true;
    st.xp += s.correct * 10 + (s.hearts === 3 ? 20 : 0);
  }
}

function reduce(prev, action){
  var st = clone(prev), A = action || {};
  st.ui.toast = null;
  st.meta.steps += 1;

  switch (A.type) {

  case 'NOOP': break;
  case 'FINISH': st.meta.finished = true; st.meta.answer = A.answer === undefined ? null : A.answer; break;

  case 'NAV': push(st, A.to, A.params); break;
  case 'BACK':
    if (st.ui.sheet) st.ui.sheet = null;
    else if (st.ui.confirm) st.ui.confirm = null;
    else pop(st);
    break;
  case 'TAB': {
    var roots = {learn:'learn', words:'words', practice:'practice', me:'me'};
    st.ui.tab = A.tab; st.ui.sheet = null; st.ui.confirm = null;
    st.ui.stack = [{name:roots[A.tab] || 'learn', params:{}}];
    break;
  }
  case 'HOME':
    st.ui.tab = 'learn'; st.ui.stack = [{name:'learn', params:{}}];
    st.ui.sheet = null; st.ui.confirm = null;
    break;
  case 'SET_INPUT': st.ui.inputs[A.field] = A.value; break;
  case 'OPEN_SHEET': st.ui.sheet = {type:A.sheet, id:A.id || null}; break;
  case 'CLOSE_SHEET': st.ui.sheet = null; break;
  case 'CONFIRM_NO': st.ui.confirm = null; break;
  case 'CONFIRM_YES': {
    var yes = st.ui.confirm && st.ui.confirm.yes; st.ui.confirm = null;
    if (yes) { var keep = st.meta.steps; var out = reduce(st, yes); out.meta.steps = keep; return out; }
    break;
  }
  case 'SET_UNIT': st.ui.unit = A.n; break;

  /* ---- the lesson ---- */
  case 'LESSON_START':
    startSession(st, A.id, false);
    push(st, 'lesson', {id:A.id});
    break;
  case 'PRACTICE_START':
    if (!st.wrongWords.length) { toast(st, 'Nothing to practise — you have not got anything wrong'); break; }
    startSession(st, A.id || 'ls_1', true);
    push(st, 'lesson', {id:st.session.lesson});
    break;
  case 'PICK': st.ui.sel = A.id; break;
  case 'BANK_TAP': {
    if (st.ui.usedTiles.indexOf(A.key) >= 0) break;
    st.ui.built = st.ui.built.concat([A.word]);
    st.ui.usedTiles = st.ui.usedTiles.concat([A.key]);
    break;
  }
  case 'BANK_UNDO': {
    if (!st.ui.built.length) { toast(st, 'Nothing to take back'); break; }
    st.ui.built = st.ui.built.slice(0, -1);
    st.ui.usedTiles = st.ui.usedTiles.slice(0, -1);
    break;
  }
  case 'CHECK': {
    var it = sessionItem(st);
    if (!it || st.ui.verdict) break;
    var given = it.kind === 'bank' ? st.ui.built.join(' ') : st.ui.sel;
    if (!given) { toast(st, 'Pick an answer first'); break; }
    markAnswer(st, given);
    break;
  }
  case 'NEXT': {
    if (!st.ui.verdict) break;
    st.ui.verdict = null; st.ui.sel = null; st.ui.built = []; st.ui.usedTiles = [];
    if (st.session && st.session.done) push(st, 'result', {});
    break;
  }
  case 'QUIT_LESSON':
    st.ui.confirm = {title:'Leave the lesson?', text:'Your progress in this lesson will not be saved.',
      okText:'Leave it', yes:{type:'QUIT_YES'}};
    break;
  case 'QUIT_YES':
    st.session = null;
    st.ui.tab = 'learn'; st.ui.stack = [{name:'learn', params:{}}];
    st.ui.verdict = null; st.ui.sel = null; st.ui.built = []; st.ui.usedTiles = [];
    break;
  case 'RESULT_DONE':
    st.session = null;
    st.ui.tab = 'learn'; st.ui.stack = [{name:'learn', params:{}}];
    break;
  case 'RETRY': {
    var id = st.session ? st.session.lesson : 'ls_1';
    var wasPractice = st.session ? st.session.practice : false;
    startSession(st, id, wasPractice);
    st.ui.stack = [{name:'learn', params:{}}, {name:'lesson', params:{id:id}}];
    break;
  }

  /* ---- words ---- */
  case 'CLEAR_WRONG':
    st.wrongWords = [];
    toast(st, 'Practice list cleared');
    break;

  /* ---- settings ---- */
  case 'SET_GOAL': st.settings.dailyGoal = A.n; break;
  case 'SET_TOGGLE': st.settings[A.key] = !st.settings[A.key]; break;

  default: break;
  }
  return st;
}

/* =========================================================== screens */
function tabbar(st){
  var items = [
    {id:'tab_learn',    text:'Learn',    icon:'book',   tab:'learn'},
    {id:'tab_words',    text:'Words',    icon:'list',   tab:'words'},
    {id:'tab_practice', text:'Practice', icon:'undo',   tab:'practice'},
    {id:'tab_me',       text:'Me',       icon:'user',   tab:'me'}
  ].map(function(i){
    return {id:i.id, text:i.text, icon:i.icon, on:(st.ui.tab === i.tab), act:{type:'TAB', tab:i.tab}};
  });
  return N('tabbar', {id:'tabbar', items:items});
}

function scrLearn(st){
  var goal = st.settings.dailyGoal, today = xpToday(st);
  var body = [
    N('hero', {id:'learn_hero', kicker:'Portuguese', title:st.streakDays + ' day streak',
      sub:today + ' of ' + goal + ' XP today · ' + st.xp + ' XP in total',
      c:[N('ring', {id:'goal_ring', value:today, total:goal, text:today + '/' + goal, label:'today'})]}),
    N('sec', {text:'The course', side:LESSONS.length + ' lessons'})
  ];
  LESSONS.forEach(function(l){
    var done = lessonDone(st, l.id);
    var prev = LESSONS[LESSONS.indexOf(l) - 1];
    var next = !done && (!prev || lessonDone(st, prev.id));
    body.push(N('unit', {id:'unit_' + l.unit, kicker:'Unit ' + l.unit, title:l.title,
      sub:unitWords(l.unit).length + ' words · ' + l.items.length + ' questions'}));
    body.push(N('card', {id:'lcard_' + l.id, cls:'flush', c:[
      row('lesson_' + l.id, done ? 'Practise it again' : 'Start the lesson',
        {lead:done ? 'check' : 'book',
         sub:done ? 'You have finished this one' : (next ? 'This is where you are up to'
                                                          : 'Open — you can do them in any order'),
         val:done ? 'done' : '', valCls:'good',
         act:{type:'LESSON_START', id:l.id}}),
      row('words_' + l.unit, 'The words in this unit',
        {lead:'list', val:unitWords(l.unit).length + '',
         act:{type:'NAV', to:'words', params:{unit:l.unit}}})
    ]}));
  });
  body.push(N('sec', {text:'A few words to warm up with'}));
  body.push(N('card', {id:'warmup', cls:'flush', c:
    shuffled(['w_agua','w_gato','w_hoje','w_livro'], st.meta.seed).map(function(id){
      var w = wordOf(id);
      return row('warm_' + id, w.pt, {lead:'book', sub:'Unit ' + w.unit, val:w.en, valCls:'acc',
        act:{type:'NAV', to:'word', params:{id:id}}});
    })}));
  body.push(txt('The Words tab has every term in the course with its translation. '
                + 'Nothing stops you looking one up before you answer.', 'muted'));
  body.push(N('space', {}));
  return N('screen', {id:'scr_learn', name:'learn', c:[
    appbar('Pipit', {right:[iconbtn('open_settings', 'gear', {type:'NAV', to:'settings'})]}),
    N('scroll', {id:'learn_scroll', c:body}),
    tabbar(st)
  ]});
}

function scrLesson(st, params){
  var s = st.session, it = sessionItem(st);
  if (!s) return scrLearn(st);
  if (!it && st.ui.verdict && s.lastIdx !== undefined && s.lastIdx !== null)
    it = lessonOf(s.lesson).items[s.lastIdx];
  if (!it) return scrResult(st);
  var p = itemPrompt(it), w = wordOf(it.word);
  var body = [
    N('qhead', {id:'qhead', hearts:s.hearts, pct:Math.round(s.pos * 100 / Math.max(1, s.queue.length)),
      closeId:'quit_lesson', close:{type:'QUIT_LESSON'}}),
    N('prompt', {id:'prompt', kicker:p.k, title:p.t, sub:p.s})
  ];
  if (it.kind === 'bank'){
    body.push(N('built', {id:'built', words:st.ui.built}));
    body.push(N('bank', {id:'bank', tiles: jumble(bankTiles(it)).map(function(t){
      return {id:'tile_' + t.key, word:t.word, key:t.key,
        used:st.ui.usedTiles.indexOf(t.key) >= 0,
        act:{type:'BANK_TAP', key:t.key, word:t.word}};
    })}));
    body.push(N('btnrow', {id:'bank_ops', c:[
      btn('bank_undo', 'Take one back', {type:'BANK_UNDO'}, 'ghost')]}));
  } else {
    optionOrder(st, it).forEach(function(id){
      var ow = wordOf(id);
      var label = it.kind === 'reverse' ? ow.en : ow.pt;
      var cls = '';
      if (st.ui.verdict){
        if (id === it.word) cls = 'right';
        else if (id === st.ui.sel) cls = 'wrong';
      } else if (st.ui.sel === id) cls = 'on';
      body.push(N('opt', {id:'opt_' + id, text:label, state:cls,
        act:st.ui.verdict ? null : {type:'PICK', id:id}}));
    });
  }
  if (st.ui.verdict)
    body.push(N('verdict', {id:'verdict', right:st.ui.verdict.right, title:st.ui.verdict.title,
      sub:st.ui.verdict.sub}));
  body.push(N('space', {}));
  return N('screen', {id:'scr_lesson', name:'lesson', params:params, c:[
    N('scroll', {id:'lesson_scroll', c:body}),
    N('bar', {id:'lesson_bar', c:[
      st.ui.verdict
        ? btn('next_q', s.done ? 'See how you did' : 'Next question', {type:'NEXT'}, 'primary block')
        : btn('check', 'Check', {type:'CHECK'}, 'primary block')]})
  ]});
}

function scrResult(st){
  var s = st.session;
  if (!s) return scrLearn(st);
  var l = lessonOf(s.lesson);
  var body = [
    N('hero', {id:'result_hero', kicker:s.failed ? 'Out of hearts' : 'Lesson complete',
      title:s.failed ? 'Have another go' : l.title,
      sub:s.correct + ' right, ' + s.wrong + ' wrong · best run of ' + s.best}),
    N('stats', {id:'result_stats', c:[
      N('stat', {id:'res_correct', n:String(s.correct), l:'Right', acc:true}),
      N('stat', {id:'res_wrong', n:String(s.wrong), l:'Wrong'}),
      N('stat', {id:'res_hearts', n:String(Math.max(0, s.hearts)), l:'Hearts left'})
    ]})
  ];
  if (s.wrongIds.length){
    body.push(N('sec', {text:'Worth another look', side:s.wrongIds.length + ''}));
    body.push(N('card', {id:'wrong_list', cls:'flush', c:s.wrongIds.map(function(id){
      var w = wordOf(id);
      return row('res_word_' + id, w.pt, {lead:'book', sub:w.ex, val:w.en, valCls:'acc',
        act:{type:'NAV', to:'word', params:{id:id}}});
    })}));
  }
  body.push(N('space', {}));
  return N('screen', {id:'scr_result', name:'result', c:[
    appbar(s.failed ? 'Not this time' : 'Nicely done'),
    N('scroll', {id:'result_scroll', c:body}),
    N('bar', {id:'result_bar', c:[
      N('btnrow', {id:'result_ops', c:[
        btn('retry', 'Try it again', {type:'RETRY'}, 'ghost'),
        btn('result_done', 'Back to the course', {type:'RESULT_DONE'}, 'primary')]})]})
  ]});
}

function scrWords(st, params){
  var unit = params && params.unit ? params.unit : st.ui.unit;
  var q = String(st.ui.inputs.q_word || '').trim().toLowerCase();
  var list = WORDS.filter(function(w){
    if (q) return w.pt.toLowerCase().indexOf(q) >= 0 || w.en.toLowerCase().indexOf(q) >= 0;
    return w.unit === unit;
  });
  return N('screen', {id:'scr_words', name:'words', params:params || {}, c:[
    appbar('Words'),
    N('scroll', {id:'words_scroll', c:[
      N('inputrow', {id:'q_word', label:'Search', field:'q_word', value:st.ui.inputs.q_word || '',
        placeholder:'Portuguese or English',
        act:{type:'SET_INPUT', field:'q_word', value:'$VALUE'}}),
      N('chips', {id:'unit_chips', c:[1,2,3].map(function(u){
        return N('chip', {id:'unit_chip_' + u, text:'Unit ' + u, on:!q && unit === u,
          act:{type:'SET_UNIT', n:u}});
      })}),
      N('sec', {text:q ? list.length + ' matches' : 'Unit ' + unit, side:list.length + ' words'}),
      N('card', {id:'word_list', cls:'flush', c: list.length
        ? list.map(function(w){
            return row('word_' + w.id, w.pt, {lead:'book', sub:w.ex, val:w.en, valCls:'acc',
              act:{type:'NAV', to:'word', params:{id:w.id}}});
          })
        : [txt('No word like that in the course.', 'empty')]}),
      N('space', {})
    ]}),
    tabbar(st)
  ]});
}

function scrWord(st, params){
  var w = wordOf(params.id);
  if (!w) return scrWords(st, {});
  return N('screen', {id:'scr_word', name:'word', params:params, c:[

      ]}),

function scrPractice(st){
  var list = st.wrongWords.map(wordOf).filter(Boolean);
  return N('screen', {id:'scr_practice', name:'practice', c:[
    appbar('Practice'),
    N('scroll', {id:'practice_scroll', c:[
      N('sec', {text:'Words you have got wrong', side:list.length + ''}),
      N('card', {id:'practice_list', cls:'flush', c: list.length
        ? list.map(function(w){

  case 'check':  line = '[Checkbox]' + tid(n) + ' ' + (n.on ? 'ticked' : 'not ticked'); break;
  case 'radio':  line = '[Radio]' + tid(n) + ' ' + (n.on ? 'selected' : 'not selected'); break;
  case 'stepper':

  case 'hero':

  case 'pills':  line = n.items.map(function(p){ return '[' + p.text + ']'; }).join(' '); break;
  case 'sec':    line = '\u2014 ' + n.text + (n.side ? ' (' + n.side + ')' : '') + ' \u2014'; break;
  case 'text':   line = n.text || null; break;

  case 'mask': case 'toast': line = null; break;

  }

/* per-environment nodes: return a string to print, true if already printed,

function walkExtra(n, d, out, st){

  if (n.t === 'ring') return '[Ring] ' + n.text + ' ' + n.label;
  if (n.t === 'unit') return '[Unit] ' + n.kicker + ' — ' + n.title + '. ' + n.sub;
  if (n.t === 'qhead')
    return '[Lesson] ' + n.hearts + ' hearts left, ' + n.pct + '% through.   quit #' + n.closeId;
  if (n.t === 'prompt'){
    out.push(ind(d) + '[Question] ' + n.kicker + ': ' + n.title);
    out.push(ind(d+1) + n.sub);

    return '[Your sentence] ' + (n.words.length ? n.words.join(' ') : '(nothing yet)');
  if (n.t === 'bank'){
    out.push(ind(d) + '[Word bank] ' + n.tiles.map(function(t){
      return t.word + ' #' + t.id + (t.used ? '[used]' : ''); }).join('  '));
    return true;
  }

}

  case 'scroll':  return '<div class="n-scroll"' + tid(n.id) + '>' + R(n.c) + '</div>';
  case 'chips':   return '<div class="n-chips"' + tid(n.id) + '>' + R(n.c) + '</div>';
  case 'chip':    return '<div class="n-chip' + (n.on?' on':'') + '"' + tid(n.id) + bind(n.act) + '>' + esc(n.text) + '</div>';
  case 'card':    return '<div class="n-card ' + esc(n.cls||'') + (n.act?' tap':'') + '"' + tid(n.id) + bind(n.act) + '>' + R(n.c) + '</div>';
  case 'padded':  return '<div style="padding:5px 16px">' + R(n.c) + '</div>';
  case 'sec':     return '<div class="n-sec"' + tid(n.id) + '><span>' + esc(n.text) + '</span>'
                       + (n.side ? '<span>' + esc(n.side) + '</span>' : '') + '</div>';
  case 'text':    return '<div class="n-text ' + esc(n.cls||'') + '">' + esc(n.text) + '</div>';
  case 'space':   return '<div class="n-space"></div>';
  case 'row': {
    var inline = [], below = [];
    (n.c||[]).forEach(function(ch){
      (ch.t==='switch'||ch.t==='radio'||ch.t==='check'||ch.t==='stepper'||ch.t==='btn'||ch.t==='iconbtn')
        ? inline.push(ch) : below.push(ch);
    });
    return '<div class="n-row' + (n.act?' tap':'') + '"' + tid(n.id) + bind(n.act) + '>'
      + (n.lead ? '<div class="r-lead"' + (n.leadColour ? ' style="color:' + esc(n.leadColour) + '"' : '')
                + '>' + icon(n.lead, 19) + '</div>' : '')
      + (n.avatar ? avatarHtml(n.avatar) : '')
      + (n.thumb && typeof thumbHtml === 'function' ? thumbHtml(n.thumb) : '')
      + '<div class="r-main"><div class="r-label' + (n.strike?' strike':'') + '">' + esc(n.text) + '</div>'
      + (n.sub ? '<div class="r-sub">' + esc(n.sub) + '</div>' : '') + '</div>'
      + (n.val ? '<div class="r-value ' + esc(n.valCls||'') + '">' + esc(n.val) + '</div>' : '')
      + R(inline)
      + (n.arrow && !inline.length ? '<div class="r-arrow">' + icon('arrow',15) + '</div>' : '')
      + '</div>' + R(below);
  }
  case 'btn':
    return '<div class="n-btn ' + esc(n.cls||'') + (n.disabled?' off':'') + '"' + tid(n.id)
      + (n.disabled?'':bind(n.act)) + '>' + esc(n.text) + '</div>';
  case 'btnrow': return '<div class="n-btnrow"' + tid(n.id) + '>' + R(n.c) + '</div>';
  case 'bar':    return '<div style="flex:0 0 auto;background:var(--card);border-top:1px solid var(--line);'
                      + 'padding:12px 16px 16px;z-index:30"' + tid(n.id) + '>' + R(n.c) + '</div>';
  case 'switch': return '<div class="n-switch' + (n.on?' on':'') + '"' + tid(n.id) + bind(n.act) + '><i></i></div>';
  case 'check':  return '<div class="n-check' + (n.on?' on':'') + '"' + tid(n.id) + bind(n.act) + '></div>';
  case 'radio':  return '<div class="n-radio' + (n.on?' on':'') + '"' + tid(n.id) + bind(n.act) + '></div>';
  case 'inputrow':
    return '<div class="n-input"><div class="i-label">' + esc(n.label) + '</div>'
      + '<input' + tid(n.id) + bindT(n.act) + ' value="' + esc(n.value) + '" placeholder="'
      + esc(n.placeholder) + '"></div>';
  case 'stepper':
    return '<div style="display:flex;align-items:center;gap:8px"' + tid(n.id) + '>'
      + '<div class="iconbtn" style="background:var(--btn);width:30px;height:30px"' + tid(n.minusId) + bind(n.minus) + '>' + icon('minus',14) + '</div>'
      + '<div style="min-width:52px;text-align:center;font-weight:700;font-size:12.5px;font-variant-numeric:tabular-nums">'
      + esc(n.value) + '</div>'
      + '<div class="iconbtn" style="background:var(--btn);width:30px;height:30px"' + tid(n.plusId) + bind(n.plus) + '>' + icon('plus',14) + '</div></div>';
  case 'stats':  return '<div class="stats"' + tid(n.id) + '>' + R(n.c) + '</div>';
  case 'stat':
    return '<div class="stat' + (n.acc?' acc':'') + (n.act?' tap':'') + '"' + tid(n.id) + bind(n.act)
      + '><div class="st-n">' + esc(n.n) + '</div><div class="st-l">' + esc(n.l) + '</div></div>';
  case 'hero':
    return '<div class="hero' + (n.act?' tap':'') + '"' + tid(n.id) + bind(n.act) + '>'
      + '<div class="he-k">' + esc(n.kicker) + '</div>'
      + '<div class="he-t">' + esc(n.title) + '</div>'
      + '<div class="he-s">' + esc(n.sub) + '</div>' + R(n.c) + '</div>';
  case 'pills':
    return '<div style="display:flex;gap:7px;flex-wrap:wrap;padding:8px 18px 4px"' + tid(n.id) + '>'
      + tagsHtml(n.items) + '</div>';
  case 'tabbar':
    return '<div class="n-tabbar"' + tid(n.id) + '>' + n.items.map(function(i){
      return '<div class="tb' + (i.on?' on':'') + '"' + tid(i.id) + bind(i.act) + '>'
        + '<i>' + icon(i.icon, 21) + '</i>' + esc(i.text) + '</div>';
    }).join('') + '</div>';
  case 'mask':  return '<div class="n-mask"' + tid(n.id) + bind(n.close) + '>' + R(n.c) + '</div>';
  case 'sheet':
    return '<div class="n-sheet"' + tid(n.id) + ' data-stop="1"><div class="sh-hd">'
      + '<div class="t">' + esc(n.title) + '</div>'
      + '<div class="iconbtn"' + tid(n.closeId) + bind(n.close) + '>' + icon('close',15) + '</div></div>'
      + '<div class="sh-bd">' + R(n.c) + '</div></div>';
  case 'dialog':
    return '<div class="dialog"' + tid(n.id) + ' data-stop="1">'
      + '<div style="padding:22px 20px 16px;text-align:center">'
      + (n.title ? '<div style="font:650 17px/1.3 var(--disp);margin-bottom:8px">' + esc(n.title) + '</div>' : '')
      + '<div style="font-size:13.5px;color:var(--ink2);line-height:1.55">' + esc(n.text) + '</div></div>'
      + '<div style="display:flex;gap:10px;padding:0 16px 16px">'
      + '<div class="n-btn" style="flex:1"' + tid(n.cancel.id) + bind(n.cancel.act) + '>' + esc(n.cancel.text) + '</div>'
      + '<div class="n-btn primary" style="flex:1"' + tid(n.ok.id) + bind(n.ok.act) + '>' + esc(n.ok.text) + '</div>'
      + '</div></div>';
  case 'toast': return '<div class="n-toast"' + tid(n.id) + '>' + esc(n.text) + '</div>';
  default: return renderExtra(n);
  }
}
function avatarHtml(a){
  return '<div class="av" style="width:38px;height:38px;border-radius:50%;flex:0 0 auto;display:flex;'
    + 'align-items:center;justify-content:center;font:700 14px/1 var(--disp);color:#fff;background:hsl('
    + a.hue + ' 52% 46%)">' + esc(a.initial) + '</div>';
}

function renderExtra(n){
  switch (n.t) {
  case 'ring': return ringHtml(n);
  case 'unit':
    return '<div class="unit"' + tid(n.id) + '><div class="un-k">' + esc(n.kicker) + '</div>'
      + '<div class="un-t">' + esc(n.title) + '</div>'
      + '<div class="un-s">' + esc(n.sub) + '</div></div>';
  case 'qhead': {
    var hearts = '';
    for (var i=0;i<3;i++)
      hearts += '<i style="opacity:' + (i < n.hearts ? 1 : .22) + '">' + icon('heart', 16) + '</i>';
    return '<div class="qhead"' + tid(n.id) + '>'
      + '<div class="iconbtn"' + tid(n.closeId) + bind(n.close) + '>' + icon('close', 17) + '</div>'
      + '<div class="qbar"><i style="width:' + n.pct + '%"></i></div>'
      + '<div class="hearts">' + hearts + '</div></div>';
  }
  case 'prompt':
    return '<div class="prompt"' + tid(n.id) + '><div class="pr-k">' + esc(n.kicker) + '</div>'
      + '<div class="pr-t">' + esc(n.title) + '</div>'
      + '<div class="pr-s">' + esc(n.sub) + '</div></div>';
  case 'opt':
    return '<div class="opt ' + esc(n.state) + '"' + tid(n.id) + bind(n.act) + '>'
      + '<span>' + esc(n.text) + '</span>'
      + (n.state === 'right' ? '<span class="op-k">correct</span>'
         : (n.state === 'wrong' ? '<span class="op-k">you picked this</span>' : '')) + '</div>';
  case 'built':
    return '<div class="built"' + tid(n.id) + '>' + (n.words.length
      ? n.words.map(function(w){ return '<span class="tile">' + esc(w) + '</span>'; }).join('')
      : '<span class="empty">Tap the words below</span>') + '</div>';
  case 'bank':
    return '<div class="bank"' + tid(n.id) + '>' + n.tiles.map(function(t){
      return '<div class="tile' + (t.used?' used':'') + '"' + tid(t.id) + bind(t.act) + '>'
        + esc(t.word) + '</div>';
    }).join('') + '</div>';
  case 'verdict':
    return '<div class="verdict ' + (n.right?'right':'wrong') + '"' + tid(n.id) + '>'
      + icon(n.right ? 'check' : 'close', 18)
      + '<div>' + esc(n.title) + '<span class="vd-s">' + esc(n.sub) + '</span></div></div>';
  default: return '';
  }
}

var STATE = null;
function paint(){
  ACTS = [];
  app.innerHTML = render(E.screen(STATE));
  var c = '';
  if (c) document.getElementById('sb-clock').textContent = c;
  if (!hud.classList.contains('off')) paintHud();
}
app.addEventListener('click', function(ev){
  var el = ev.target.closest('[data-act]'); if (!el) return;
  if (el.classList.contains('n-mask') && ev.target.closest('[data-stop]')) return;
  var act = ACTS[+el.getAttribute('data-act')]; if (!act) return;
  TRAJ.push({action:'tap', id: el.getAttribute('data-testid') || null});
  STATE = E.reduce(STATE, act); paint();
});
app.addEventListener('input', function(ev){
  var el = ev.target.closest('[data-actt]'); if (!el) return;
  var act = JSON.parse(JSON.stringify(ACTS[+el.getAttribute('data-actt')]));
  for (var k in act) if (act[k] === '$VALUE') act[k] = el.value;
  var id = el.getAttribute('data-testid'), pos = el.selectionStart;
  TRAJ.push({action:'type', id:id, text:el.value});
  STATE = E.reduce(STATE, act); paint();
  var again = id && app.querySelector('[data-testid="' + id + '"]');
  if (again && again.focus) { again.focus(); try { again.setSelectionRange(pos, pos); } catch(e){} }
});

function paintHud(){
  var d = E.derive(STATE);
  hud.innerHTML = '<h4>__ENV__ \u00b7 ' + E.ENV_ID + ' v' + E.VERSION + '</h4>'
    + '<div><span class="k">route</span> ' + d.route + '  <span class="k">step</span> ' + STATE.meta.steps + '</div>'
    + '<div><span class="k">xp</span> ' + d.xp + '  <span class="k">hearts</span> ' + (d.session ? d.session.hearts : '-') + '  <span class="k">done</span> ' + d.lessonsDoneCount + '</div>'
    + '<div style="margin-top:8px"><button id="hud-reset">reset</button>'
    + '<button id="hud-a11y">copy a11y</button><button id="hud-state">copy state</button>'
    + '<button id="hud-traj">copy traj</button><button id="hud-hide">hide (h)</button></div>'
    + '<pre>' + esc(E.a11y(STATE)) + '</pre>';
  hud.querySelector('#hud-reset').onclick = function(){ ENVAPI.reset({seed:STATE.meta.seed}); };
  hud.querySelector('#hud-a11y').onclick  = function(){ copy(E.a11y(STATE)); };
  hud.querySelector('#hud-state').onclick = function(){ copy(JSON.stringify(E.snapshot(STATE), null, 2)); };
  hud.querySelector('#hud-traj').onclick  = function(){ copy(JSON.stringify(TRAJ, null, 2)); };
  hud.querySelector('#hud-hide').onclick  = function(){ hud.classList.add('off'); };
}
function copy(t){ try { navigator.clipboard.writeText(t); } catch(e){} }
document.addEventListener('keydown', function(e){
  if (e.key === 'h') { hud.classList.toggle('off'); if (!hud.classList.contains('off')) paintHud(); }
});

var ENVAPI = {
  ENV_ID: E.ENV_ID, VERSION: E.VERSION,
  reset: function(opts){
    opts = opts || {};
    STATE = E.createInitialState(opts.seed || 0);
    if (opts.patch) E.applyPatch(STATE, opts.patch);
    TRAJ = []; paint();
    return E.snapshot(STATE);
  },
  getState:   function(){ return E.snapshot(STATE); },
  setState:   function(s){ STATE = JSON.parse(JSON.stringify(s)); paint(); return true; },
  step:       function(a){ var r = E.step(STATE, a); STATE = r.state; TRAJ.push(a); paint();
                           return {ok:r.ok, error:r.error || null}; },
  dispatch:   function(act){ STATE = E.reduce(STATE, act); paint(); return true; },
  a11y:       function(){ return E.a11y(STATE); },
  elements:   function(){ return E.elements(STATE); },
  route:      function(){ return E.select.route(STATE); },
  trajectory: function(){ return JSON.parse(JSON.stringify(TRAJ)); },
  bounds: function(){
    var base = document.getElementById('screen').getBoundingClientRect(), out = {};
    app.querySelectorAll('[data-testid]').forEach(function(el){
      var r = el.getBoundingClientRect();
      out[el.getAttribute('data-testid')] = {
        x:Math.round(r.left-base.left), y:Math.round(r.top-base.top),
        w:Math.round(r.width), h:Math.round(r.height),
        cx:Math.round(r.left-base.left+r.width/2), cy:Math.round(r.top-base.top+r.height/2)};
    });
    return out;
  }
};
window.__ENV__ = ENVAPI;
var qs = new URLSearchParams(location.search);
if (qs.get('bare') === '1') document.body.classList.add('bare');
if (qs.get('hud')  === '1') hud.classList.remove('off');
ENVAPI.reset({seed: parseInt(qs.get('seed') || '0', 10) || 0});
window.__ENV_READY__ = true;
})();
</script>
