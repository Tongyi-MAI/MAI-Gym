<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Roost · Stays (mocked GUI env)</title>
<!--
  ============================================================================
  Roost — a single-file H5 mobile GUI environment for agent research.

  Same two-block contract as every environment in this repo:

    script#engine  ...  pure state machine. No DOM, no Date.now, no Math.random.
                        Exports globalThis.ROOST_ENGINE and is loaded verbatim
                        by pipeline/runner.mjs inside a node:vm sandbox.
    script#ui      ...  renders engine.screen(state) -> DOM, exposes __ENV__.

  Everything you see is drawn: the illustrations are inline SVG scenes built
  from a small vocabulary (sky, ridge, water, foliage, structure), so the app
  renders identically on a machine with no fonts, no network and no images.
  ============================================================================
-->
<style>
:root{
  --accent:#2f6f5e; --accent-d:#235444; --accent-s:#e7f1ed; --accent-l:#4a9683;
  --bg:#faf8f4; --card:#fff; --line:#eceae3; --line2:#f5f3ee;
  --ink:#1b2a29; --ink2:#5d6c6a; --muted:#98a3a1;
  --gold:#e0a33c; --red:#cf4c3c; --sky:#7fb8d6;
  --r:16px; --r2:12px;
  --shadow:0 1px 2px rgba(24,38,36,.05),0 8px 24px rgba(24,38,36,.06);
  --serif:ui-serif,Georgia,"Iowan Old Style","Times New Roman",serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:#e9e6df;
  font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color:var(--ink);display:flex;align-items:center;justify-content:center;overflow:hidden;
}

/* ---------------- device frame ---------------- */
#device{position:relative;width:390px;height:844px;background:#111;border-radius:46px;padding:5px;
  box-shadow:0 30px 70px rgba(0,0,0,.32);flex:0 0 auto}
#screen{position:relative;width:100%;height:100%;background:var(--bg);border-radius:41px;
  overflow:hidden;display:flex;flex-direction:column}
#notch{position:absolute;top:5px;left:50%;transform:translateX(-50%);width:118px;height:30px;
  background:#111;border-radius:0 0 18px 18px;z-index:60}
body.bare{background:var(--bg)}
body.bare #device{width:390px;height:844px;padding:0;border-radius:0;box-shadow:none;background:var(--bg)}
body.bare #screen{border-radius:0}
body.bare #notch{display:none}
body.bare .n-sheet{animation:none}

/* ---------------- status bar ---------------- */
.statusbar{height:44px;flex:0 0 44px;display:flex;align-items:flex-end;justify-content:space-between;
  padding:0 22px 6px;font-size:13px;font-weight:600;z-index:50;color:var(--ink)}
.statusbar.on-art{color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.3)}
.statusbar .sb-r{display:flex;gap:5px;align-items:center}
.sb-bat{width:22px;height:11px;border:1.3px solid currentColor;border-radius:3px;position:relative;opacity:.9}
.sb-bat:after{content:"";position:absolute;right:-3px;top:3px;width:2px;height:5px;background:currentColor;border-radius:0 1px 1px 0}
.sb-bat i{position:absolute;left:1.3px;top:1.3px;bottom:1.3px;width:72%;background:currentColor;border-radius:1px}

#app{flex:1 1 auto;display:flex;flex-direction:column;min-height:0;position:relative}

/* ---------------- chrome ---------------- */
.n-appbar{flex:0 0 auto;min-height:48px;display:flex;align-items:center;gap:8px;padding:6px 12px;
  background:var(--card);border-bottom:1px solid var(--line);z-index:20}
.n-appbar .ab-title{flex:1 1 auto;text-align:center;font:600 16.5px/1.3 var(--serif);letter-spacing:.2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.n-appbar .ab-side{flex:0 0 auto;min-width:60px;display:flex;align-items:center;gap:6px}
.n-appbar .ab-side.right{justify-content:flex-end}
.n-appbar.plain{background:transparent;border-bottom:none}
.n-appbar.float{position:absolute;top:0;left:0;right:0;background:transparent;border:none;z-index:30}
.iconbtn{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  color:var(--ink);cursor:pointer;background:transparent}
.iconbtn:active{background:#f1efe9}
.iconbtn.glass{background:rgba(255,255,255,.92);box-shadow:0 2px 8px rgba(0,0,0,.14)}
.iconbtn.on{color:var(--red)}

.n-scroll{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;padding-bottom:10px}
.n-scroll::-webkit-scrollbar{width:0}
.n-scroll.flush{padding-bottom:0}

/* ---------------- typography ---------------- */
.n-text{padding:2px 16px;color:var(--ink2)}
.n-text.h1{font:700 25px/1.2 var(--serif);color:var(--ink);padding:18px 16px 6px;letter-spacing:-.2px}
.n-text.h2{font:600 17px/1.3 var(--serif);color:var(--ink);padding:16px 16px 6px}
.n-text.h3{font:600 14px/1.3 -apple-system,sans-serif;color:var(--ink);padding:12px 16px 4px}
.n-text.body{font-size:14px;padding:4px 16px;line-height:1.6}
.n-text.muted{font-size:12.5px;color:var(--muted);padding:4px 16px}
.n-text.eyebrow{font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--accent);
  font-weight:700;padding:14px 16px 2px}
.n-text.empty{padding:8px 16px 40px;text-align:center;color:var(--muted);font-size:13.5px}
.n-sec{padding:16px 16px 6px;font:600 15.5px/1.3 var(--serif);color:var(--ink)}
.n-space{height:16px}
.n-divider{height:1px;background:var(--line);margin:8px 16px}

/* ---------------- illustration ---------------- */
.art{position:relative;overflow:hidden;background:#e8eeec;flex:0 0 auto}
.art svg{width:100%;height:100%;display:block}
.art.rounded{border-radius:var(--r2)}
.scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,251,243,.78) 0%,rgba(255,251,243,.34) 26%,rgba(255,251,243,0) 46%)}
.hero{position:relative;height:246px}
.hero .hero-txt{position:absolute;left:18px;right:18px;top:14px;color:var(--ink)}
.hero .hero-eyebrow{font-size:11px;letter-spacing:1.8px;text-transform:uppercase;color:var(--accent-d);font-weight:800}
.hero .hero-title{font:700 27px/1.14 var(--serif);margin-top:5px;letter-spacing:-.3px}
.hero .hero-sub{font-size:12.5px;color:#4a605c;margin-top:6px;max-width:270px}

.gallery{display:flex;gap:8px;padding:10px 16px;overflow-x:auto}
.gallery::-webkit-scrollbar{height:0}
.gallery .g-item{flex:0 0 auto;width:118px;height:84px;border-radius:10px;overflow:hidden;
  border:1px solid var(--line);cursor:pointer}
.gallery .g-item.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-s)}

/* ---------------- cards ---------------- */
.n-card{background:var(--card);border-radius:var(--r);margin:10px 16px;box-shadow:var(--shadow);overflow:hidden}
.n-card.pad{padding:14px}
.n-card.tap{cursor:pointer;transition:transform .09s}
.n-card.tap:active{transform:scale(.99)}
.n-card.flat{box-shadow:none;border:1px solid var(--line)}

.stay .s-art{height:168px;position:relative}
.stay .s-fav{position:absolute;top:10px;right:10px;z-index:2}
.stay .s-badge{position:absolute;top:10px;left:10px;z-index:2;background:rgba(255,255,255,.94);
  border-radius:20px;padding:4px 10px;font-size:11px;font-weight:700;color:var(--ink);
  box-shadow:0 2px 8px rgba(0,0,0,.12)}
.stay .s-body{padding:12px 14px 14px}
.stay .s-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.stay .s-name{font:600 16px/1.3 var(--serif);flex:1 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stay .s-rate{flex:0 0 auto;font-size:12.5px;color:var(--ink);display:flex;align-items:center;gap:3px}
.stay .s-rate b{font-weight:650}
.stay .s-meta{color:var(--muted);font-size:12.5px;margin-top:4px}
.stay .s-price{margin-top:9px;font-size:14px}
.stay .s-price b{font:700 17px/1 var(--serif)}
.stay .s-price span{color:var(--muted);font-size:12.5px}
.stay .s-tags{margin-top:9px;display:flex;gap:6px;flex-wrap:wrap}

.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:11px;
  font-weight:600;background:var(--line2);color:var(--ink2)}
.pill.good{background:var(--accent-s);color:var(--accent-d)}
.pill.warn{background:#fdf3e2;color:#a5701c}
.pill.mut{background:#f2f1ec;color:var(--muted)}
.pill.live{background:#e9f6f0;color:#1f7a54}
.pill.dead{background:#f4f2f0;color:#9a9a94}

/* ---------------- rows / controls ---------------- */
.n-row{display:flex;align-items:center;gap:12px;padding:14px;background:var(--card);
  border-bottom:1px solid var(--line2);min-height:52px}
.n-row:last-child{border-bottom:none}
.n-row.tap{cursor:pointer}
.n-row.tap:active{background:#faf9f6}
.n-row .r-lead{flex:0 0 auto;width:26px;color:var(--accent);display:flex;align-items:center;justify-content:center}
.n-row .r-main{flex:1 1 auto;min-width:0}
.n-row .r-label{font-size:14.5px}
.n-row .r-sub{font-size:12px;color:var(--muted);margin-top:2px}
.n-row .r-value{flex:0 0 auto;font-size:13.5px;color:var(--ink2);max-width:160px;text-align:right;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.n-row .r-value.strong{color:var(--ink);font-weight:650}
.n-row .r-arrow{flex:0 0 auto;color:#c3c9c7;display:flex}

.n-btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:44px;padding:0 20px;
  border-radius:12px;font-size:15px;font-weight:650;background:var(--line2);color:var(--ink);
  border:none;cursor:pointer;user-select:none}
.n-btn:active{filter:brightness(.96)}
.n-btn.primary{background:var(--accent);color:#fff}
.n-btn.primary.off{background:#cfd6d4;cursor:not-allowed}
.n-btn.ghost{background:transparent;border:1px solid var(--line);height:36px;font-size:13.5px;padding:0 14px;color:var(--ink2)}
.n-btn.danger{background:#fff;border:1px solid #eec4bd;color:var(--red);height:36px;font-size:13.5px;padding:0 14px}
.n-btn.block{display:flex;width:100%}
.n-btn.sm{height:34px;font-size:13.5px;padding:0 14px}
.n-btnrow{display:flex;gap:8px;padding:12px 14px;justify-content:flex-end;align-items:center}

.n-chips{display:flex;gap:8px;padding:10px 16px;overflow-x:auto}
.n-chips::-webkit-scrollbar{height:0}
.n-chip{flex:0 0 auto;height:34px;padding:0 14px;border-radius:18px;background:var(--card);
  border:1px solid var(--line);display:flex;align-items:center;gap:6px;font-size:13px;
  color:var(--ink2);cursor:pointer;white-space:nowrap}
.n-chip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.n-chip .ico{opacity:.9}

.searchbar{margin:10px 16px;background:var(--card);border:1px solid var(--line);border-radius:30px;
  display:flex;align-items:center;gap:10px;padding:10px 14px;box-shadow:var(--shadow)}
.searchbar input{flex:1 1 auto;border:none;outline:none;background:transparent;font-size:14.5px;
  font-family:inherit;color:var(--ink);min-width:0}
.searchbar .sb-go{flex:0 0 auto;width:32px;height:32px;border-radius:50%;background:var(--accent);
  color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer}
.searchbar .sb-clear{flex:0 0 auto;width:22px;height:22px;border-radius:50%;background:#e8e6e0;
  color:var(--ink2);display:flex;align-items:center;justify-content:center;cursor:pointer}

.n-input{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--card);
  border-bottom:1px solid var(--line2)}
.n-input .i-label{flex:0 0 92px;font-size:13px;color:var(--muted)}
.n-input input,.n-input textarea{flex:1 1 auto;border:none;outline:none;background:transparent;
  font-size:14.5px;font-family:inherit;color:var(--ink);resize:none;min-width:0}
.n-input textarea{height:56px;line-height:1.45}

.n-switch{flex:0 0 auto;width:46px;height:27px;border-radius:14px;background:#dcdfdc;position:relative;
  cursor:pointer;transition:background .16s}
.n-switch.on{background:var(--accent)}
.n-switch i{position:absolute;top:2.5px;left:2.5px;width:22px;height:22px;border-radius:50%;background:#fff;
  transition:transform .16s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.n-switch.on i{transform:translateX(19px)}
.n-radio{flex:0 0 auto;width:21px;height:21px;border-radius:50%;border:1.7px solid #d3d8d6;position:relative}
.n-radio.on{border-color:var(--accent);background:var(--accent)}
.n-radio.on:after{content:"";position:absolute;left:6.5px;top:3.5px;width:5px;height:9px;
  border:2px solid #fff;border-top:0;border-left:0;transform:rotate(42deg)}

.n-stepper{display:flex;align-items:center;gap:12px;flex:0 0 auto}
.n-stepper .st-btn{width:30px;height:30px;border-radius:50%;border:1.4px solid #d8dcda;color:var(--ink2);
  display:flex;align-items:center;justify-content:center;cursor:pointer;background:#fff}
.n-stepper .st-btn.off{opacity:.35;cursor:not-allowed}
.n-stepper .st-val{min-width:20px;text-align:center;font-size:15px;font-weight:650}

/* ---------------- amenity grid ---------------- */
.amen{display:grid;grid-template-columns:1fr 1fr;gap:2px 10px;padding:4px 16px 8px}
.amen .a-item{display:flex;align-items:center;gap:9px;padding:9px 0;font-size:13.5px;color:var(--ink2)}
.amen .a-item .ico{color:var(--accent);flex:0 0 auto}
.amen .a-item.off{opacity:.34;text-decoration:line-through}

/* ---------------- reviews ---------------- */
.stars{display:inline-flex;gap:1.5px;color:var(--gold)}
.rsum{padding:16px}
.rsum .rs-top{display:flex;align-items:center;gap:12px}
.rsum .rs-big{font:700 34px/1 var(--serif)}
.rsum .rs-sub{font-size:12.5px;color:var(--muted);margin-top:5px}
.rsum .rs-bars{margin-top:16px;display:grid;gap:9px}
.rsum .rs-row{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--ink2)}
.rsum .rs-row .lbl{flex:0 0 88px}
.rsum .rs-row .track{flex:1 1 auto;display:block;height:5px;border-radius:3px;background:#e7e5dd;overflow:hidden}
.rsum .rs-row .fill{display:block;height:100%;background:var(--accent);border-radius:2px}
.rsum .rs-row .num{flex:0 0 28px;text-align:right;color:var(--ink);font-weight:600}
.rev{padding:14px}
.rev .rv-top{display:flex;align-items:center;gap:10px}
.rev .rv-av{flex:0 0 auto;width:38px;height:38px;border-radius:50%;overflow:hidden;background:var(--line2)}
.rev .rv-who{font-size:14px;font-weight:650}
.rev .rv-meta{font-size:11.5px;color:var(--muted);margin-top:2px;display:flex;align-items:center;gap:6px}
.rev .rv-text{margin-top:10px;font-size:13.5px;line-height:1.62;color:var(--ink2)}
.rev .rv-reply{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--line2);
  font-size:12.5px;color:var(--ink2);line-height:1.55}
.rev .rv-reply b{color:var(--ink)}
.rev .rv-foot{margin-top:11px;display:flex}
.rev .rv-help{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink2);
  border:1px solid var(--line);border-radius:16px;padding:5px 12px;cursor:pointer;background:#fff}
.rev .rv-help.on{border-color:var(--accent);color:var(--accent-d);background:var(--accent-s);font-weight:650}

/* ---------------- host ---------------- */
.host{display:flex;align-items:center;gap:12px;padding:14px}
.host .h-av{flex:0 0 auto;width:48px;height:48px;border-radius:50%;overflow:hidden;background:var(--line2)}
.host .h-name{font:600 15px/1.3 var(--serif)}
.host .h-sub{font-size:12px;color:var(--muted);margin-top:2px}

/* ---------------- calendar ---------------- */
.cal{padding:4px 12px 12px;background:var(--card)}
.cal .c-head{display:flex;align-items:center;justify-content:space-between;padding:8px 4px 12px}
.cal .c-month{font:600 16px/1 var(--serif)}
.cal .c-dow{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:11px;
  color:var(--muted);font-weight:600;padding-bottom:6px}
.cal .c-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px 0}
.cal .c-day{height:42px;display:flex;align-items:center;justify-content:center;font-size:14px;
  cursor:pointer;position:relative;color:var(--ink)}
.cal .c-day.mute{color:#d6dbd9;cursor:not-allowed}
.cal .c-day.blank{cursor:default}
.cal .c-day.in-range{background:var(--accent-s)}
.cal .c-day.edge{color:#fff;font-weight:700}
.cal .c-day.edge:before{content:"";position:absolute;inset:3px 1px;background:var(--accent);border-radius:11px;z-index:0}
.cal .c-day span{position:relative;z-index:1}
.cal .c-day.start.in-range{background:linear-gradient(90deg,transparent 50%,var(--accent-s) 50%)}
.cal .c-day.end.in-range{background:linear-gradient(90deg,var(--accent-s) 50%,transparent 50%)}

/* ---------------- price breakdown ---------------- */
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 16px;font-size:13.5px;color:var(--ink2)}
.kv .v{color:var(--ink)}
.kv.total{padding-top:12px;margin-top:6px;border-top:1px solid var(--line);font-weight:700}
.kv.total .k,.kv.total .v{color:var(--ink);font-size:15.5px}
.kv.save .v{color:var(--accent)}

/* ---------------- bottom bars ---------------- */
.n-bar{flex:0 0 auto;background:var(--card);border-top:1px solid var(--line);padding:10px 16px 12px;
  display:flex;align-items:center;gap:14px;z-index:30;box-shadow:0 -4px 20px rgba(24,38,36,.05)}
.n-bar .bar-txt{flex:1 1 auto;min-width:0}
.n-bar .bar-price{font:700 18px/1.1 var(--serif)}
.n-bar .bar-sub{font-size:11.5px;color:var(--muted);margin-top:3px}
.n-tabbar{flex:0 0 auto;height:58px;background:var(--card);border-top:1px solid var(--line);display:flex;z-index:30}
.n-tabbar .tb{flex:1 1 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--muted);font-size:10.5px;cursor:pointer;font-weight:600}
.n-tabbar .tb i{display:flex}
.n-tabbar .tb.on{color:var(--accent)}

/* ---------------- overlays ---------------- */
.n-mask{position:absolute;inset:0;background:rgba(16,26,25,.42);z-index:70;display:flex;align-items:flex-end}
.n-sheet{width:100%;max-height:82%;background:var(--card);border-radius:20px 20px 0 0;display:flex;
  flex-direction:column;overflow:hidden;animation:up .18s ease-out}
@keyframes up{from{transform:translateY(24px)}to{transform:none}}
.n-sheet .sh-hd{padding:16px 16px 12px;display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--line)}
.n-sheet .sh-hd .t{font:600 17px/1.2 var(--serif)}
.n-sheet .sh-bd{flex:1 1 auto;overflow-y:auto;min-height:0}
.n-sheet .sh-bd::-webkit-scrollbar{width:0}
.n-sheet .sh-ft{flex:0 0 auto;border-top:1px solid var(--line);padding:12px 16px 14px}
.n-toast{position:absolute;left:50%;bottom:120px;transform:translateX(-50%);background:rgba(22,32,31,.93);
  color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;z-index:90;max-width:80%;text-align:center}
.dialog{margin:auto;width:80%;background:#fff;border-radius:16px;overflow:hidden}

/* ---------------- dev HUD ---------------- */
#hud{position:fixed;top:14px;left:14px;width:310px;max-height:calc(100% - 28px);overflow:auto;
  background:#131a19;color:#c9d4d1;border-radius:12px;padding:12px;
  font:11.5px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;z-index:200;box-shadow:0 10px 30px rgba(0,0,0,.4)}
#hud h4{margin:0 0 8px;font-size:12px;color:#fff;letter-spacing:.4px}
#hud .k{color:#7d8b88}
#hud pre{margin:6px 0 0;white-space:pre-wrap;word-break:break-word;color:#9fe0c5;max-height:250px;overflow:auto}
#hud button{background:#23302d;border:none;color:#c9d4d1;border-radius:6px;padding:5px 9px;margin:2px 4px 2px 0;
  font:inherit;cursor:pointer}
#hud button:hover{background:#2f403c}
#hud.off{display:none}
</style>
</head>
<body>
<div id="device">
  <div id="notch"></div>
  <div id="screen">
    <div class="statusbar" id="sb">
      <div id="sb-clock">9:41</div>

  for (var i=a.length-1;i>0;i--){ var j=Math.floor(r()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
function getPath(obj, path){
  var parts = String(path).replace(/\[(\w+|last|-1)\]/g, '.$1').split('.').filter(Boolean), cur = obj;
  for (var i=0;i<parts.length;i++){
    if (cur == null) return undefined;
    var k = parts[i];
    if (Array.isArray(cur) && (k==='last'||k==='-1')) cur = cur[cur.length-1]; else cur = cur[k];
  }
  return cur;
}
function setPath(obj, path, value){
  var parts = String(path).replace(/\[(\w+)\]/g,'.$1').split('.').filter(Boolean), cur = obj;
  for (var i=0;i<parts.length-1;i++){
    var k = parts[i];
    if (cur[k] == null) cur[k] = /^\d+$/.test(parts[i+1]) ? [] : {};
    cur = cur[k];
  }
  cur[parts[parts.length-1]] = value;
  return obj;
}

/* --------------------------------------------------------- world clock */
var TODAY = '2026-06-08';

function tick(c, n){
  var t = c.s + n; c.s = t % 60;
  var m = c.mi + Math.floor(t/60); c.mi = m % 60;
  c.h = (c.h + Math.floor(m/60)) % 24;
  return c;
}
function clockStr(c){ return c.h + ':' + (c.mi<10?'0':'') + c.mi; }

/* ------------------------------------------------------------ pricing */
function promoUsable(st, p, nightlyTotal){
  if (!p) return false;
  if (p.expires < st.meta.today) return false;
  return nightlyTotal >= (p.min || 0);
}
function quote(st, stayId, checkIn, checkOut, addons, promoCode){
  var s = stay(stayId);
  if (!s) return null;
  var nights = Math.max(0, nightsBetween(checkIn, checkOut));
  var nightly = s.nightly * nights;
  var service = Math.round(nightly * 0.12);
  var extras = 0;
  (addons || []).forEach(function(k){
    var a = addon(k); if (!a) return;
    extras += a.per === 'night' ? a.price * nights : a.price;
  });
  var discount = 0, p = promo(promoCode);
  if (p && promoUsable(st, p, nightly)) {
    discount = p.kind === 'pct' ? Math.round(nightly * p.value / 100) : p.value;
  }
  var cleaning = nights ? s.cleaning : 0;
  return {nights:nights, nightly:nightly, cleaning:cleaning, service:service,
          extras:extras, discount:discount,
          total: nightly + cleaning + service + extras - discount};
}
function draftQuote(st){
  var d = st.draft;
  return quote(st, d.stayId, d.checkIn, d.checkOut, d.addons, d.promo);
}
function guestCount(g){ return g.adults + g.children; }
function fitsGuests(st, s){
  var g = st.draft.guests;
  if (guestCount(g) > s.guests) return 'Sleeps ' + s.guests;
  if (g.pets > 0 && s.amenities.indexOf('pets') < 0) return 'No pets';
  return null;
}

/* ------------------------------------------------------------ queries */
function visibleStays(st){
  var list = shuffled(STAYS, st.meta.seed), f = st.ui.filters, q = st.ui.query.toLowerCase();
  if (q) list = list.filter(function(s){
    var hay = [s.name, s.city, s.type, s.host.name, s.blurb,
               s.tags.join(' '),
               s.amenities.map(function(k){ var a = amenity(k); return a ? a.label : k; }).join(' '),
               s.freeCancel ? 'free cancellation' : '',
               s.instant ? 'instant book' : '',
               s.host.superhost ? 'superhost' : ''].join(' ').toLowerCase();
    return q.split(/\s+/).every(function(w){ return hay.indexOf(w) >= 0; });
  });
  if (st.ui.category !== 'all')
    list = list.filter(function(s){ return s.tags.indexOf(st.ui.category) >= 0; });
  if (f.freeCancel) list = list.filter(function(s){ return s.freeCancel; });
  if (f.pets)       list = list.filter(function(s){ return s.amenities.indexOf('pets') >= 0; });
  if (f.instant)    list = list.filter(function(s){ return s.instant; });
  if (f.nearby)     list = list.filter(function(s){ return s.distanceMi <= 1000; });
  if (f.maxPrice)   list = list.filter(function(s){ return s.nightly <= f.maxPrice; });
  if (st.profile.settings.accessibleOnly)
    list = list.filter(function(s){ return s.amenities.indexOf('stepfree') >= 0; });
  if (f.sort === 'price')  list = list.slice().sort(function(a,b){ return a.nightly - b.nightly; });
  if (f.sort === 'rating') list = list.slice().sort(function(a,b){ return b.rating - a.rating; });
  if (f.sort === 'distance') list = list.slice().sort(function(a,b){ return a.distanceMi - b.distanceMi; });
  return list;
}
function route(st){ return st.ui.stack[st.ui.stack.length - 1]; }
function commas(n){ return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
function dist(st, mi){
  return st.profile.settings.units === 'km'
    ? commas(Math.round(mi * 1.609)) + ' km'
    : commas(mi) + ' mi';
}
function sortedReviews(st, stayId){
  var list = reviewsFor(stayId).slice(), k = st.ui.reviewSort;
  if (k === 'high') list.sort(function(a,b){ return b.rating - a.rating || (a.date < b.date ? 1 : -1); });
  else if (k === 'low') list.sort(function(a,b){ return a.rating - b.rating || (a.date < b.date ? 1 : -1); });
  else list.sort(function(a,b){ return a.date < b.date ? 1 : (a.date > b.date ? -1 : 0); });
  return list;
}
function helpfulCount(st, r){ return r.helpful + (st.reviewHelpful[r.id] ? 1 : 0); }
function money(st, usd){
  var c = CURRENCIES[st.profile.settings.currency] || CURRENCIES.USD;
  return c.sym + commas(Math.round(usd * c.rate));
}

var SELECT = { quote:quote, draftQuote:draftQuote, visibleStays:visibleStays, route:route,
               money:money, clockStr:clockStr, nightsBetween:nightsBetween, guestCount:guestCount,
               shortDate:shortDate, longDate:longDate, medDate:medDate, dist:dist,
               reviewsFor:reviewsFor, sortedReviews:sortedReviews, helpfulCount:helpfulCount, fitsGuests:fitsGuests, promoUsable:promoUsable };

/* ------------------------------------------------------------- reducer */
function push(st, name, params){ st.ui.stack.push({name:name, params:params||{}}); st.ui.sheet=null; }
function pop(st){ if (st.ui.stack.length > 1) st.ui.stack.pop(); }
function toast(st, t){ st.ui.toast = t; }
function clampInt(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); }

var GUEST_LIMITS = {adults:[1,12], children:[0,8], pets:[0,3]};
var BRANDS = {'3':'Amex', '4':'Visa', '5':'Mastercard', '6':'Discover'};

function reduce(prev, action){
  var st = clone(prev), A = action || {};
  st.ui.toast = null;
  st.meta.steps += 1;
  tick(st.meta.clock, SECONDS_PER_STEP);

  switch (A.type) {

  /* ---- navigation ---- */
  case 'NAV':  push(st, A.to, A.params); break;
  case 'BACK':
    if (st.ui.confirm) st.ui.confirm = null;
    else if (st.ui.sheet) st.ui.sheet = null;
    else pop(st);
    break;
  case 'TAB':
    st.ui.tab = A.tab; st.ui.sheet = null; st.ui.confirm = null;
    st.ui.stack = [{name: A.tab === 'explore' ? 'home' : A.tab, params:{}}];
    break;
  case 'HOME':
    st.ui.tab = 'explore'; st.ui.stack = [{name:'home', params:{}}];
    st.ui.sheet = null; st.ui.confirm = null;
    break;

  /* ---- search & filtering ---- */
  case 'SET_INPUT': st.ui.inputs[A.field] = A.value; break;
  case 'SUBMIT_SEARCH':
    st.ui.query = String(st.ui.inputs.search || '').trim();
    if (route(st).name !== 'results') push(st, 'results', {});
    break;
  case 'CLEAR_SEARCH': st.ui.query = ''; st.ui.inputs.search = ''; toast(st, 'Search cleared'); break;
  case 'SET_CATEGORY':
    st.ui.category = A.key;
    if (route(st).name !== 'results' && A.key !== 'all') push(st, 'results', {});
    break;
  case 'SET_FILTER': st.ui.filters[A.key] = A.value; break;
  case 'CLEAR_FILTERS':
    st.ui.filters = {sort:'featured', freeCancel:false, pets:false, instant:false,
                     nearby:false, maxPrice:0};
    st.ui.category = 'all';
    toast(st, 'Filters cleared');
    break;

  /* ---- sheets ---- */
  case 'OPEN_SHEET':
    st.ui.sheet = {type:A.sheet};
    if (A.sheet === 'promo') st.ui.inputs.promo = st.draft.promo || '';
    if (A.sheet === 'calendar' && st.draft.checkIn) {
      var ci = parseDate(st.draft.checkIn);
      st.ui.calMonth = {y:ci.y, m:ci.m};
    }
    break;
  case 'CLOSE_SHEET': st.ui.sheet = null; break;
  case 'CONFIRM_NO':  st.ui.confirm = null; break;
  case 'CONFIRM_YES': {
    var yes = st.ui.confirm && st.ui.confirm.yes; st.ui.confirm = null;
    if (yes) { var keep = st.meta.steps, kc = clone(st.meta.clock);
               var out = reduce(st, yes); out.meta.steps = keep; out.meta.clock = kc; return out; }
    break;
  }

  /* ---- calendar ---- */
  case 'CAL_MONTH': {
    var m = st.ui.calMonth.m + A.delta, y = st.ui.calMonth.y;
    if (m < 1) { m = 12; y -= 1; }
    if (m > 12) { m = 1; y += 1; }
    st.ui.calMonth = {y:y, m:m};
    break;
  }
  case 'CAL_PICK': {
    var d = A.date;
    if (d < st.meta.today) { toast(st, 'That date has already passed'); break; }
    var dr = st.draft;
    if (!dr.checkIn || dr.checkOut || d <= dr.checkIn) { dr.checkIn = d; dr.checkOut = null; }
    else { dr.checkOut = d; }
    break;
  }
  case 'CAL_CLEAR': st.draft.checkIn = null; st.draft.checkOut = null; break;

  /* ---- guests ---- */
  case 'GUESTS': {
    var lim = GUEST_LIMITS[A.key]; if (!lim) break;
    st.draft.guests[A.key] = clampInt(st.draft.guests[A.key] + A.delta, lim[0], lim[1]);
    break;
  }

  /* ---- stays ---- */
  case 'FAV': {
    var i = st.wishlist.indexOf(A.stayId);
    if (i >= 0) { st.wishlist.splice(i, 1); toast(st, 'Removed from wishlist'); }
    else { st.wishlist.push(A.stayId); toast(st, 'Saved to wishlist'); }
    break;
  }
  case 'SET_GALLERY': st.ui.gallery = A.idx; break;
  case 'OPEN_REVIEWS':
    st.ui.reviewSort = 'recent';
    push(st, 'reviews', {id:A.stayId});
    break;
  case 'SET_REVIEW_SORT': st.ui.reviewSort = A.key; break;
  case 'REVIEW_HELPFUL': {
    var rv = review(A.id); if (!rv) break;
    if (st.reviewHelpful[A.id]) { delete st.reviewHelpful[A.id]; toast(st, 'Removed your vote'); }
    else { st.reviewHelpful[A.id] = true; toast(st, 'Marked as helpful'); }
    break;
  }
  case 'OPEN_STAY':
    st.ui.gallery = 0;
    push(st, 'stay', {id:A.stayId});
    break;
  case 'RESERVE': {
    var s = stay(A.stayId); if (!s) break;
    if (!st.draft.checkIn || !st.draft.checkOut) { toast(st, 'Choose your dates first'); break; }
    var bad = fitsGuests(st, s);
    if (bad) { toast(st, 'This stay does not fit your party (' + bad + ')'); break; }
    st.draft.stayId = A.stayId;
    if (!st.draft.paymentId) st.draft.paymentId = st.defaultPaymentId;
    st.ui.inputs.note = st.draft.note || '';
    push(st, 'booking', {});
    break;
  }

  /* ---- booking ---- */
  case 'TOGGLE_ADDON': {
    var k = A.key, arr = st.draft.addons, j = arr.indexOf(k);
    if (j >= 0) arr.splice(j, 1); else arr.push(k);
    arr.sort();
    break;
  }
  case 'SET_DRAFT': st.draft[A.key] = A.value; break;
  case 'APPLY_PROMO': {
    var code = String(st.ui.inputs.promo || '').trim().toUpperCase();
    var p = promo(code);
    if (!p) { toast(st, 'That code is not valid'); break; }
    var q0 = quote(st, st.draft.stayId, st.draft.checkIn, st.draft.checkOut, st.draft.addons, null);
    if (p.expires < st.meta.today) { toast(st, 'That code expired on ' + p.expires); break; }
    if (q0 && q0.nightly < (p.min || 0)) { toast(st, 'Code needs a nightly total of at least $' + p.min); break; }
    st.draft.promo = p.code;
    st.ui.sheet = null;
    toast(st, p.label + ' applied');
    break;
  }
  case 'CLEAR_PROMO': st.draft.promo = null; st.ui.inputs.promo = ''; break;

  /* ---- payment methods ---- */
  case 'PICK_PAYMENT': st.draft.paymentId = A.id; pop(st); break;
  case 'SET_DEFAULT_PAYMENT':
    if (byId(st.payments, A.id)) { st.defaultPaymentId = A.id; toast(st, 'Default payment updated'); }
    break;
  case 'CARD_NEW':
    st.ui.inputs.card_number = ''; st.ui.inputs.card_name = st.profile.name.toUpperCase();
    st.ui.inputs.card_exp = '';
    push(st, 'addCard', {});
    break;
  case 'CARD_SAVE': {
    var num = String(st.ui.inputs.card_number || '').replace(/\s|-/g, '');
    var nm  = String(st.ui.inputs.card_name || '').trim();
    var exp = String(st.ui.inputs.card_exp || '').trim();
    if (num.length < 12 || /\D/.test(num)) { toast(st, 'Enter a valid card number'); break; }
    if (!nm) { toast(st, 'Enter the name on the card'); break; }
    if (!/^\d{2}\/\d{2}$/.test(exp)) { toast(st, 'Expiry must look like MM/YY'); break; }
    var nid = 'pm_new' + st.meta.cardSeq; st.meta.cardSeq += 1;
    st.payments.push({id:nid, brand: BRANDS[num.charAt(0)] || 'Card',
                      last4: num.slice(-4), name: nm, exp: exp});
    pop(st);
    toast(st, 'Card added');
    break;
  }
  case 'CARD_DELETE': {
    if (st.payments.length <= 1) { toast(st, 'Keep at least one payment method'); break; }
    st.payments = st.payments.filter(function(p){ return p.id !== A.id; });
    if (st.defaultPaymentId === A.id) st.defaultPaymentId = st.payments[0].id;
    if (st.draft.paymentId === A.id) st.draft.paymentId = st.defaultPaymentId;
    toast(st, 'Card removed');
    break;
  }

  /* ---- confirm the booking ---- */
  case 'CONFIRM_BOOKING': {
    var d2 = st.draft, s2 = stay(d2.stayId);
    if (!s2) { toast(st, 'Pick a stay first'); break; }
    if (!d2.checkIn || !d2.checkOut) { toast(st, 'Choose your dates first'); break; }
    var bad2 = fitsGuests(st, s2);
    if (bad2) { toast(st, 'This stay does not fit your party (' + bad2 + ')'); break; }
    if (!d2.paymentId) { toast(st, 'Choose a payment method'); break; }
    var q = draftQuote(st);
    var bid = 'b_' + (2000 + st.meta.bookingSeq); st.meta.bookingSeq += 1;
    st.bookings.push({
      id: bid, stayId: s2.id, stayName: s2.name, city: s2.city, status:'upcoming',
      checkIn: d2.checkIn, checkOut: d2.checkOut, nights: q.nights,
      guests: clone(d2.guests), addons: d2.addons.slice().sort(), promo: d2.promo || null,
      note: d2.note || '',
      price: {nights:q.nights, nightly:q.nightly, cleaning:q.cleaning, service:q.service,
              extras:q.extras, discount:q.discount},
      total: q.total, paymentId: d2.paymentId, bookedAt: st.meta.today
    });
    st.draft = {stayId:null, checkIn:null, checkOut:null,
                guests:{adults:2, children:0, pets:0}, addons:[], promo:null, note:'', paymentId:null};
    st.ui.sheet = null;
    st.ui.tab = 'trips';
    st.ui.stack = [{name:'trips', params:{}}, {name:'confirmed', params:{id:bid}}];
    break;
  }

  /* ---- trips ---- */
  case 'CANCEL_TRIP': {
    var b = byId(st.bookings, A.id); if (!b) break;
    if (b.status !== 'upcoming') { toast(st, 'Only upcoming trips can be cancelled'); break; }
    var s3 = stay(b.stayId);
    st.ui.confirm = {
      title:'Cancel this trip?',
      text: s3 && s3.freeCancel
        ? 'Free cancellation applies, so you will be refunded in full.'
        : 'This host does not offer free cancellation. The cleaning fee will not be refunded.',
      okText:'Cancel trip', yes:{type:'CANCEL_TRIP_OK', id:A.id}
    };
    break;
  }
  case 'CANCEL_TRIP_OK': {
    var b2 = byId(st.bookings, A.id);
    if (b2 && b2.status === 'upcoming') { b2.status = 'cancelled'; toast(st, 'Trip cancelled'); }
    break;
  }
  case 'REBOOK': {
    var b3 = byId(st.bookings, A.id); if (!b3) break;
    st.draft = {stayId:null, checkIn:null, checkOut:null, guests:clone(b3.guests),
                addons:[], promo:null, note:'', paymentId:null};
    st.ui.gallery = 0;
    st.ui.tab = 'explore';
    st.ui.stack = [{name:'home', params:{}}, {name:'stay', params:{id:b3.stayId}}];
    break;
  }

  /* ---- settings ---- */
  case 'SET_SETTING':    st.profile.settings[A.key] = A.value; break;
  case 'TOGGLE_SETTING': st.profile.settings[A.key] = !st.profile.settings[A.key]; break;

  case 'FINISH':
    st.meta.answer = (A.answer === undefined ? null : A.answer);
    st.meta.finished = true;
    break;
  case 'NOOP': default: break;
  }
  return st;
}

var SCENE_ALT = {

  canyon:'Illustration: a white casita tucked against red sandstone fins in late afternoon light',
  mountain:'Illustration: a timber chalet below snow-capped alpine peaks on a clear morning',
  barn:'Illustration: a red converted dairy barn on golden prairie at sunset',
  airstream:'Illustration: a silver Airstream trailer on a desert flat below red rocks',
  coast:'Illustration: a shingled cottage on a green headland above breaking surf',
  travel:'Illustration: layered ridges, a winding road and a camper van under a rising sun',
  living:'Illustration: a living room with a sofa, rug, plant and a window onto hills',
  bed:'Illustration: a bedroom with a made bed, a side lamp and a bright window',
  empty:'Illustration: a signpost on an empty hillside',
  confirmed:'Illustration: a packed suitcase under a sunrise with confetti'
};
function galleryOf(s){ return [s.art, 'living', 'bed']; }

function N(t, o){ o = o || {}; o.t = t; return o; }
function appbar(title, o){
  o = o || {};
  return N('appbar', {id:'appbar', title:title, back:!!o.back, cls:o.cls||'', right:o.right||[], left:o.left||[]});
}
function row(id, label, o){

                   arrow:o.arrow !== false, act:o.act, cls:o.cls, c:o.c});
}
function btn(id, text, act, cls, disabled){

}
function txt(text, cls){ return N('text', {text:text, cls:cls||'body'}); }
function art(scene, hue, o){
  o = o || {};
  return N('art', {id:o.id, scene:scene, hue:hue, alt:SCENE_ALT[scene]||'Illustration',
                   h:o.h||160, cls:o.cls||'', act:o.act});

function tabbar(st){

    {id:'tab_explore', text:'Explore', icon:'compass', tab:'explore'},

}

function dateLabel(st){
  var d = st.draft;
  if (!d.checkIn) return 'Add dates';

  return shortDate(d.checkIn) + ' — ' + shortDate(d.checkOut);
}
function guestLabel(st){
  var g = st.draft.guests, parts = [g.adults + ' adult' + (g.adults>1?'s':'')];
  if (g.children) parts.push(g.children + ' child' + (g.children>1?'ren':''));
  if (g.pets) parts.push(g.pets + ' pet' + (g.pets>1?'s':''));
  return parts.join(', ');
}

function stayCard(st, s, prefix){
  var faved = st.wishlist.indexOf(s.id) >= 0;
  var tags = [];
  if (s.freeCancel) tags.push({text:'Free cancellation', cls:'good'});
  if (s.instant)    tags.push({text:'Instant book', cls:'live'});
  if (s.amenities.indexOf('pets') >= 0) tags.push({text:'Pets welcome', cls:''});
  return N('staycard', {
    id: prefix + s.id, act:{type:'OPEN_STAY', stayId:s.id},
    scene:s.art, hue:s.hue, alt:SCENE_ALT[s.art],
    name:s.name, city:s.city, type:s.type, rating:s.rating, reviews:s.reviews,
    nightly:money(st, s.nightly), beds:s.beds, guests:s.guests,
    distance:dist(st, s.distanceMi) + ' away',
    badge: s.host.superhost ? 'Superhost' : null,
    favId: 'fav_' + prefix + s.id, faved: faved, favAct:{type:'FAV', stayId:s.id},
    tags: tags
  });
}

  rootNode.c = rootNode.c.concat(extra);

/* =======================================================================
 * TRAVERSAL — element index, GUI action interface, text observation
 * ==================================================================== */
var SKIP_KEYS = {act:1, minus:1, plus:1, go:1, close:1, prev:1, next:1, favAct:1, helpfulAct:1,
                 yes:1, params:1, meta:1, guests:1, price:1, tags:1, status:1, reply:1, scores:1};

function labelOf(n){ return n.text || n.title || n.name || n.label || ''; }

function collect(n, out){
  if (!n || typeof n !== 'object') return;
  if (Array.isArray(n)) { for (var i=0;i<n.length;i++) collect(n[i], out); return; }
  if (n.t === 'appbar' && n.back) out.push({id:'nav_back', act:{type:'BACK'}, text:'Back', t:'back'});
  if (n.id && n.act)              out.push({id:n.id, act:n.act, text:labelOf(n), t:n.t||'el',
                                            disabled:!!n.disabled,
                                            input:(n.t==='searchbar'||n.t==='inputrow')});
  if (n.t === 'mask' && n.close)  out.push({id:n.id, act:n.close, text:'Dismiss overlay', t:'mask'});
  if (n.minusId && n.minus)       out.push({id:n.minusId, act:n.minus, text:'minus', t:'stepper',
                                            disabled:!!n.minusOff});
  if (n.plusId  && n.plus)        out.push({id:n.plusId,  act:n.plus,  text:'plus',  t:'stepper',
                                            disabled:!!n.plusOff});
  if (n.goId    && n.go)          out.push({id:n.goId,    act:n.go,    text:'Search', t:'btn'});
  if (n.clearId && n.clear)       out.push({id:n.clearId, act:n.clear, text:'Clear the search', t:'btn'});
  if (n.closeId && n.close)       out.push({id:n.closeId, act:n.close, text:'Close',  t:'btn'});
  if (n.prevId  && n.prev)        out.push({id:n.prevId,  act:n.prev,  text:'Previous month', t:'btn'});
  if (n.nextId  && n.next)        out.push({id:n.nextId,  act:n.next,  text:'Next month',     t:'btn'});
  if (n.helpfulId && n.helpfulAct) out.push({id:n.helpfulId, act:n.helpfulAct,
                                             text:(n.helpful?'Remove helpful vote':'Mark helpful'), t:'btn'});
  if (n.favId   && n.favAct)      out.push({id:n.favId,   act:n.favAct,
                                            text:(n.faved?'Remove from':'Save to')+' wishlist', t:'btn'});
  for (var k in n){
    if (SKIP_KEYS[k]) continue;
    var v = n[k];
    if (v && typeof v === 'object') collect(v, out);
  }
}

/* modal semantics: an open sheet or dialog swallows everything behind it */
function elements(st){
  var rootNode = (st && st.t === 'screen') ? st : screen(st);
  var masks = (rootNode.c||[]).filter(function(n){ return n.t === 'mask'; });
  var out = [];
  collect(masks.length ? masks[masks.length-1] : rootNode, out);
  return out;
}
function findEl(st, id){
  var els = elements(st);
  for (var i=0;i<els.length;i++) if (els[i].id === id) return els[i];
  return null;
}
function substitute(act, text){
  var a = clone(act);
  for (var k in a) if (a[k] === '$VALUE') a[k] = text;
  return a;
}

function step(st, a){
  a = a || {};
  var kind = a.action || a.type;
  switch (kind) {
  case 'tap': {
    var el = findEl(st, a.id);
    if (!el) return {state:st, ok:false, error:'ELEMENT_NOT_FOUND: ' + a.id};
    if (el.disabled) return {state:st, ok:false, error:'ELEMENT_DISABLED: ' + a.id};
    return {state:reduce(st, el.act), ok:true};
  }
  case 'type': {
    var e2 = findEl(st, a.id);
    if (!e2) return {state:st, ok:false, error:'ELEMENT_NOT_FOUND: ' + a.id};
    if (!e2.input) return {state:st, ok:false, error:'NOT_A_TEXT_FIELD: ' + a.id};
    return {state:reduce(st, substitute(e2.act, a.text == null ? '' : String(a.text))), ok:true};
  }
  case 'back':   return {state:reduce(st, {type:'BACK'}), ok:true};
  case 'home':   return {state:reduce(st, {type:'HOME'}), ok:true};
  case 'wait':   return {state:reduce(st, {type:'NOOP'}), ok:true};
  case 'finish': return {state:reduce(st, {type:'FINISH', answer:a.answer}), ok:true};
  case 'raw':    return {state:reduce(st, a.act || {}), ok:true};
  default:       return {state:st, ok:false, error:'UNKNOWN_ACTION: ' + kind};
  }
}

/* ------------------------------------------------- text observation (a11y) */
function a11y(st){
  var rootNode = screen(st), lines = [], r = route(st);
  lines.push('# Screen route=' + r.name + (r.params && r.params.id ? '(' + r.params.id + ')' : '') +
             '  ' + clockStr(st.meta.clock) + '  today ' + st.meta.today + '  step ' + st.meta.steps);
  var masks = (rootNode.c||[]).filter(function(n){ return n.t==='mask'; });
  if (masks.length) lines.push('# An overlay is open. Nothing behind it can be tapped.');
  walkText(masks.length ? masks[masks.length-1] : rootNode, 0, lines, st);
  (rootNode.c||[]).forEach(function(n){ if (n.t==='toast') lines.push('[Toast] ' + n.text); });
  return lines.join('\n');
}
function tid(n){ return (n && n.id && n.act) ? ' #'+n.id : ''; }
function ind(d){ return new Array(d+1).join('  '); }

function walkText(n, d, out, st){
  if (!n || typeof n !== 'object') return;
  if (Array.isArray(n)) { n.forEach(function(x){ walkText(x, d, out, st); }); return; }
  var line = null;
  switch (n.t) {
  case 'screen': break;
  case 'appbar':
    line = '[AppBar] ' + (n.title || '(no title)') + (n.back ? '   Back #nav_back' : ''); break;
  case 'searchbar':
    line = '[TextField]' + tid(n) + ' placeholder="' + n.placeholder + '" value="' + (n.value||'') +
           '"   Search button #' + n.goId +
           (n.clearId ? '   Clear #' + n.clearId : ''); break;
  case 'inputrow':
    line = '[TextField]' + tid(n) + ' ' + (n.label||'') + ' value="' + (n.value||'') +
           '" placeholder="' + (n.placeholder||'') + '"'; break;
  case 'chip':   line = '[Chip]' + tid(n) + ' ' + n.text + (n.on ? '  [selected]' : ''); break;
  case 'btn':    line = '[Button]' + (n.id ? ' #'+n.id : '') + ' ' + n.text +
                        (n.disabled ? '  (disabled)' : ''); break;
  case 'row': {
    var s = '[Row]' + tid(n) + ' ' + (n.text||'');
    if (n.val) s += ' = ' + n.val;
    if (n.sub) s += '   (' + n.sub + ')';
    line = s; break;
  }
  case 'switch': line = '[Toggle]' + tid(n) + ' ' + (n.on ? 'ON' : 'OFF'); break;
  case 'radio':  line = '[Radio]' + tid(n) + ' ' + (n.on ? 'selected' : 'not selected'); break;
  case 'favbtn': line = '[HeartButton]' + tid(n) + ' ' + (n.on ? 'saved' : 'not saved'); break;
  case 'stepper':
    line = '[Stepper] value=' + n.value +
           (n.minusId ? '  minus #'+n.minusId + (n.minusOff?'(disabled)':'') : '') +
           (n.plusId  ? '  plus #'+n.plusId  + (n.plusOff ?'(disabled)':'') : ''); break;
  case 'hero':
    out.push(ind(d) + '[Hero] ' + n.title + ' — ' + n.sub);
    out.push(ind(d) + '  ' + n.alt);
    return;
  case 'art':    line = n.alt; break;
  case 'gallery':
    out.push(ind(d) + '[Gallery] ' + n.items.map(function(g){
      return '#' + g.id + (g.on ? '(showing)' : ''); }).join('  '));
    n.items.forEach(function(g){ out.push(ind(d+1) + (g.on ? '> ' : '  ') + g.alt); });
    return;
  case 'staycard':
    out.push(ind(d) + '[Stay]' + tid(n) + ' ' + n.name + '  ' + n.nightly + '/night  ' +
             n.rating + ' (' + n.reviews + ' reviews)  ' + n.city +
             '  sleeps ' + n.guests + (n.badge ? '  ' + n.badge : '') +
             '   heart #' + n.favId + (n.faved ? '(saved)' : ''));
    if (n.tags && n.tags.length)
      out.push(ind(d+1) + n.tags.map(function(t){ return '[' + t.text + ']'; }).join(' '));
    out.push(ind(d+1) + n.alt);
    return;
  case 'rateline':
    line = '[Rating]' + tid(n) + ' ' + n.rating + ' stars, ' + n.reviews + ' reviews · ' + n.city
         + (n.distance ? ' · ' + n.distance : '')
         + (n.act ? '  (tap to read the reviews)' : ''); break;
  case 'ratingsummary':
    out.push(ind(d) + '[RatingSummary] ' + n.rating + ' overall from ' + n.reviews + ' reviews');
    out.push(ind(d+1) + n.scores.map(function(x){ return x.label + ' ' + x.value.toFixed(1); }).join('  ·  '));
    return;
  case 'review':
    out.push(ind(d) + '[Review] ' + n.author + ' · ' + n.date + ' · ' + n.rating + ' of 5 stars');
    out.push(ind(d+1) + '"' + n.text + '"');
    if (n.reply) out.push(ind(d+1) + 'Host reply from ' + n.reply.by + ': "' + n.reply.text + '"');
    out.push(ind(d+1) + 'Helpful (' + n.count + ')' + (n.helpful ? ' [you voted]' : '') +
             '  #' + n.helpfulId);
    return;
  case 'pills':
    line = n.items.map(function(p){ return '[' + p.text + ']'; }).join(' '); break;
  case 'host':   line = '[Host] ' + n.name + ' — ' + n.sub; break;
  case 'amenities':
    out.push(ind(d) + '[Amenities] ' + n.items.map(function(a){
      return a.label + (a.off ? ' (not offered)' : ''); }).join(', '));
    return;
  case 'empty':
    out.push(ind(d) + '[Empty] ' + n.text);
    out.push(ind(d+1) + n.alt);
    break;
  case 'tripsummary':
    out.push(ind(d) + '[Stay] ' + n.name + ' · ' + n.city + ' · ' + n.rating + ' (' + n.reviews + ')');
    out.push(ind(d+1) + n.alt);
    return;
  case 'tripline':
    out.push(ind(d) + '[Trip]' + tid(n) + ' ' + n.name + ' · ' + n.city + ' · ' + n.dates +
             ' · ' + n.status.text + ' · ' + n.total);
    out.push(ind(d+1) + n.alt);
    return;
  case 'calendar':
    out.push(ind(d) + '[Calendar] ' + n.month + '   prev #' + n.prevId + '   next #' + n.nextId);
    out.push(ind(d+1) + 'selectable: ' + n.cells.filter(function(c){ return c.act; })
      .map(function(c){
        return '#' + c.id + (c.edge ? '*' : '') + (c.inRange && !c.edge ? '~' : '');
      }).join(' '));
    out.push(ind(d+1) + '(* = check-in/check-out, ~ = inside the selected range, past dates omitted)');
    return;
  case 'barprice':
    line = '[PriceBar] ' + n.price + ' ' + n.unit + (n.sub ? ' — ' + n.sub : ''); break;
  case 'kv':      line = '  ' + n.k + ': ' + n.v; break;
  case 'sec':     line = '— ' + n.text + ' —'; break;
  case 'text':    line = n.text || null; break;
  case 'tabbar':
    out.push(ind(d) + '[TabBar] ' + n.items.map(function(i){
      return i.text + ' #' + i.id + (i.on ? '(current)' : ''); }).join('  '));
    return;
  case 'sheet':   line = '[Sheet] ' + n.title + '   close #' + n.closeId; break;
  case 'sheetfoot': line = n.label ? '[SheetFooter] ' + n.label : null; break;
  case 'dialog':  line = '[Dialog] ' + (n.title ? n.title + ' — ' : '') + n.text; break;
  case 'mask': case 'toast': line = null; break;
  default:        line = null;
  }
  if (line !== null) out.push(ind(d) + line);
  for (var k in n){
    if (SKIP_KEYS[k]) continue;
    var v = n[k];
    if (v && typeof v === 'object') walkText(v, line !== null ? d+1 : d, out, st);
  }
}

/* --------------------------------------------------------- derived view */
function derive(st){
  var last = st.bookings.length ? st.bookings[st.bookings.length - 1] : null;
  return {
    route: route(st).name,
    today: st.meta.today,
    bookingCount: st.bookings.length,
    lastBooking: last,
    lastBookingPayment: last ? (byId(st.payments, last.paymentId) || null) : null,
    lastBookingStay: last ? stay(last.stayId) : null,
    upcomingIds: st.bookings.filter(function(b){ return b.status==='upcoming'; })
                            .map(function(b){ return b.id; }),
    wishlistNames: st.wishlist.map(function(id){ var s = stay(id); return s ? s.name : id; }),
    helpfulReviewIds: Object.keys(st.reviewHelpful).filter(function(k){ return st.reviewHelpful[k]; }).sort(),
    helpfulReviewAuthors: Object.keys(st.reviewHelpful)
      .filter(function(k){ return st.reviewHelpful[k]; })
      .map(function(k){ var r = review(k); return r ? r.author : k; }).sort(),
    nearestStay: STAYS.slice().sort(function(a,b){ return a.distanceMi - b.distanceMi; })[0].name,
    defaultPayment: byId(st.payments, st.defaultPaymentId) || null,
    paymentBrands: st.payments.map(function(p){ return p.brand; }),
    draftNights: nightsBetween(st.draft.checkIn, st.draft.checkOut),
    draftQuote: draftQuote(st),
    finished: !!st.meta.finished,
    answer: st.meta.answer
  };
}
function snapshot(st){ var o = clone(st); o.derived = derive(st); return o; }

function applyPatch(st, patch){
  (patch || []).forEach(function(p){ setPath(st, p.path, clone(p.value)); });
  return st;
}

var ENGINE = {
  ENV_ID: ENV_ID, VERSION: VERSION, CATALOG: CATALOG,
  createInitialState: createInitialState,

function icon(name, size, cls){
  var d = SVG[name]; if (!d) return '';
  var filled = (name === 'heart' || name === 'star') && cls && cls.indexOf('fill') >= 0;
  return '<span class="ico ' + (cls||'') + '" style="width:' + (size||18) + 'px;height:' + (size||18) + 'px;display:inline-flex">'
    + '<svg viewBox="0 0 24 24" width="100%" height="100%" fill="' + (filled ? 'currentColor' : 'none')
    + '" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">'
    + d + '</svg></span>';
}

/* -------------------------------------------------------------- renderer */
var ACTS = [], TRAJ = [];
function bind(a){ if (!a) return ''; ACTS.push(a); return ' data-act="' + (ACTS.length-1) + '"'; }
function bindT(a){ if (!a) return ''; ACTS.push(a); return ' data-actt="' + (ACTS.length-1) + '"'; }
function tid(id){ return id ? ' data-testid="' + esc(id) + '"' : ''; }
function R(list){ return (list||[]).map(render).join(''); }
function starRow(n, size){                 /* NB: `stars()` is the night-sky scene helper */
  var out = '<span class="stars">';
  for (var i = 1; i <= 5; i++)
    out += icon('star', size || 12, i <= n ? 'fill' : '');
  return out + '</span>';
}
function artBox(scene, hue, h, cls, extra){
  return '<div class="art ' + (cls||'') + '"' + (extra||'') + ' style="height:' + h + 'px">'
       + artSvg(scene, hue) + '</div>';
}

function render(n){
  if (!n || typeof n !== 'object') return '';
  if (Array.isArray(n)) return R(n);
  switch (n.t) {

  case 'screen': return R(n.c);

  case 'appbar': {
    var glassCls = n.cls === 'float' ? ' glass' : '';
    var left = (n.back
      ? '<div class="iconbtn' + glassCls + '" data-testid="nav_back"' + bind({type:'BACK'}) + '>' + icon('back',20) + '</div>'
      : '') + R(n.left);
    return '<div class="n-appbar ' + esc(n.cls||'') + '"' + tid(n.id) + '>'
         + '<div class="ab-side">' + left + '</div>'
         + '<div class="ab-title">' + esc(n.title) + '</div>'
         + '<div class="ab-side right">' + R(n.right) + '</div></div>';
  }
  case 'favbtn':
    return '<div class="iconbtn glass' + (n.on ? ' on' : '') + '"' + tid(n.id) + bind(n.act) + '>'
         + icon('heart', 19, n.on ? 'fill' : '') + '</div>';

  case 'searchbar': {
    /* the submit action is stashed on the input too, so pressing Enter works */
    var goIdx = n.go ? (ACTS.push(n.go) - 1) : -1;
    return '<div class="searchbar">' + icon('search', 17, 'muted')
         + '<input' + tid(n.id) + bindT(n.act) + ' data-enter="' + goIdx + '"'
         + ' value="' + esc(n.value) + '" placeholder="' + esc(n.placeholder) + '">'
         + (n.clearId ? '<div class="sb-clear"' + tid(n.clearId) + bind(n.clear) + '>'
                        + icon('close', 12) + '</div>' : '')
         + '<div class="sb-go"' + tid(n.goId) + ' data-act="' + goIdx + '">' + icon('arrow', 16) + '</div>'
         + '</div>';
  }

  case 'inputrow':
    return '<div class="n-input">' + '<div class="i-label">' + esc(n.label) + '</div>'
         + (n.multiline
            ? '<textarea' + tid(n.id) + bindT(n.act) + ' placeholder="' + esc(n.placeholder) + '">' + esc(n.value) + '</textarea>'
            : '<input' + tid(n.id) + bindT(n.act) + ' value="' + esc(n.value) + '" placeholder="' + esc(n.placeholder) + '">')
         + '</div>';

  case 'scroll':  return '<div class="n-scroll ' + esc(n.cls||'') + '"' + tid(n.id) + '>' + R(n.c) + '</div>';
  case 'chips':   return '<div class="n-chips"' + tid(n.id) + '>' + R(n.c) + '</div>';
  case 'chip':    return '<div class="n-chip' + (n.on?' on':'') + '"' + tid(n.id) + bind(n.act) + '>'
                       + (n.icon ? icon(n.icon, 15) : '') + esc(n.text) + '</div>';
  case 'card':    return '<div class="n-card ' + esc(n.cls||'') + (n.act?' tap':'') + '"' + tid(n.id) + bind(n.act) + '>'
                       + R(n.c) + '</div>';
  case 'padded':  return '<div style="padding:0 16px">' + R(n.c) + '</div>';
  case 'sec':     return '<div class="n-sec">' + esc(n.text) + '</div>';
  case 'text':    return '<div class="n-text ' + esc(n.cls||'') + '">' + esc(n.text) + '</div>';
  case 'space':   return '<div class="n-space"></div>';
  case 'divider': return '<div class="n-divider"></div>';
  case 'label':   return '<span style="flex:1 1 auto;font-size:12px;color:var(--muted)">' + esc(n.text||'') + '</span>';

  case 'row': {
    var inline = [], below = [];
    (n.c||[]).forEach(function(ch){
      (ch.t==='switch'||ch.t==='radio'||ch.t==='stepper'||ch.t==='btn') ? inline.push(ch) : below.push(ch);
    });
    return '<div class="n-row' + (n.act?' tap':'') + '"' + tid(n.id) + bind(n.act) + '>'
      + (n.lead ? '<div class="r-lead">' + icon(n.lead, 19) + '</div>' : '')
      + '<div class="r-main"><div class="r-label">' + esc(n.text) + '</div>'
      + (n.sub ? '<div class="r-sub">' + esc(n.sub) + '</div>' : '') + '</div>'
      + (n.val ? '<div class="r-value ' + esc(n.valCls||'') + '">' + esc(n.val) + '</div>' : '')
      + R(inline)
      + (n.arrow && !inline.length ? '<div class="r-arrow">' + icon('arrow', 15) + '</div>' : '')
      + '</div>' + R(below);
  }

  case 'btn':
    return '<div class="n-btn ' + esc(n.cls||'') + (n.disabled?' off':'') + '"' + tid(n.id)
         + (n.disabled ? '' : bind(n.act)) + '>' + esc(n.text) + '</div>';
  case 'btnrow': return '<div class="n-btnrow"' + tid(n.id) + '>' + R(n.c) + '</div>';

  case 'stepper':
    return '<div class="n-stepper"' + tid(n.id) + '>'
      + '<div class="st-btn' + (n.minusOff?' off':'') + '"' + tid(n.minusId) + (n.minusOff?'':bind(n.minus)) + '>'
      + icon('minus',14) + '</div>'
      + '<div class="st-val">' + n.value + '</div>'
      + '<div class="st-btn' + (n.plusOff?' off':'') + '"' + tid(n.plusId) + (n.plusOff?'':bind(n.plus)) + '>'
      + icon('plus',14) + '</div></div>';
  case 'switch': return '<div class="n-switch' + (n.on?' on':'') + '"' + tid(n.id) + bind(n.act) + '><i></i></div>';
  case 'radio':  return '<div class="n-radio' + (n.on?' on':'') + '"' + tid(n.id) + bind(n.act) + '></div>';

  case 'tabbar':
    return '<div class="n-tabbar"' + tid(n.id) + '>' + n.items.map(function(i){
      return '<div class="tb' + (i.on?' on':'') + '"' + tid(i.id) + bind(i.act) + '>'
           + '<i>' + icon(i.icon, 21) + '</i>' + esc(i.text) + '</div>';
    }).join('') + '</div>';

  case 'bar':      return '<div class="n-bar"' + tid(n.id) + '>' + R(n.c) + '</div>';
  case 'barprice':
    return '<div class="bar-txt"' + tid(n.id) + '><div class="bar-price">' + esc(n.price)
         + ' <span style="font:400 12px/1 inherit;color:var(--muted)">' + esc(n.unit) + '</span></div>'
         + '<div class="bar-sub">' + esc(n.sub||'') + '</div></div>';

  case 'hero':
    return '<div class="hero art"' + tid(n.id) + '>' + artSvg(n.scene, n.hue) + '<div class="scrim"></div>'
         + '<div class="hero-txt"><div class="hero-eyebrow">' + esc(n.eyebrow) + '</div>'
         + '<div class="hero-title">' + esc(n.title) + '</div>'
         + '<div class="hero-sub">' + esc(n.sub) + '</div></div></div>';

  case 'art': return artBox(n.scene, n.hue, n.h, n.cls, tid(n.id) + bind(n.act));

  case 'gallery':
    return '<div class="gallery"' + tid(n.id) + '>' + n.items.map(function(g){
      return '<div class="g-item' + (g.on?' on':'') + '"' + tid(g.id) + bind(g.act) + '>'
           + artSvg(g.scene, g.hue) + '</div>';
    }).join('') + '</div>';

  case 'staycard':
    return '<div class="n-card stay tap"' + tid(n.id) + bind(n.act) + '>'
      + '<div class="s-art art">' + artSvg(n.scene, n.hue)
      + (n.badge ? '<div class="s-badge">' + esc(n.badge) + '</div>' : '')
      + '<div class="s-fav"><div class="iconbtn glass' + (n.faved?' on':'') + '"' + tid(n.favId)
      + bind(n.favAct) + '>' + icon('heart', 18, n.faved ? 'fill' : '') + '</div></div></div>'
      + '<div class="s-body"><div class="s-top"><div class="s-name">' + esc(n.name) + '</div>'
      + '<div class="s-rate">' + icon('star', 13, 'gold') + '<b>' + n.rating + '</b>'
      + '<span style="color:var(--muted)">(' + n.reviews + ')</span></div></div>'
      + '<div class="s-meta">' + esc(n.city) + ' · ' + esc(n.type) + ' · sleeps ' + n.guests + '</div>'
      + '<div class="s-meta" style="display:flex;align-items:center;gap:5px">' + icon('pin', 12)
      + esc(n.distance) + '</div>'
      + '<div class="s-price"><b>' + esc(n.nightly) + '</b> <span>night</span></div>'
      + (n.tags && n.tags.length ? '<div class="s-tags">' + n.tags.map(function(t){
          return '<span class="pill ' + (t.cls||'') + '">' + esc(t.text) + '</span>'; }).join('') + '</div>' : '')
      + '</div></div>';

  case 'rateline':
    return '<div class="n-text"' + tid(n.id) + bind(n.act)
      + ' style="padding:2px 16px 10px' + (n.act ? ';cursor:pointer' : '') + '">'
      + '<div style="display:flex;align-items:center;gap:6px">'
      + icon('star', 14, 'fill') + '<b style="color:var(--ink)">' + n.rating + '</b>'
      + '<span style="color:var(--muted)">· ' + n.reviews + ' reviews · ' + esc(n.city) + '</span>'
      + (n.act ? '<span style="margin-left:auto;color:#c3c9c7;display:flex">' + icon('arrow',14) + '</span>' : '')
      + '</div>'
      + (n.distance ? '<div style="display:flex;align-items:center;gap:6px;margin-top:6px;color:var(--muted);font-size:12.5px">'
                      + icon('pin', 13) + esc(n.distance) + '</div>' : '')

      + '<div class="rs-top"><div class="rs-big">' + n.rating + '</div><div>'
      + starRow(Math.round(n.rating), 14)
      + '<div class="rs-sub">' + n.reviews + ' reviews</div></div></div>'
      + '<div class="rs-bars">' + n.scores.map(function(x){
          return '<div class="rs-row"><span class="lbl">' + esc(x.label) + '</span>'
               + '<span class="track"><span class="fill" style="width:' + (x.value / 5 * 100) + '%"></span></span>'
               + '<span class="num">' + x.value.toFixed(1) + '</span></div>';
        }).join('') + '</div></div>';

  case 'review':
    return '<div class="rev"' + tid(n.id) + '>'
      + '<div class="rv-top"><div class="rv-av">' + avatarSvg(n.avatar) + '</div><div>'
      + '<div class="rv-who">' + esc(n.author) + '</div>'
      + '<div class="rv-meta">' + starRow(n.rating, 11) + '<span>' + esc(n.date) + '</span></div>'
      + '</div></div>'
      + '<div class="rv-text">' + esc(n.text) + '</div>'
      + (n.reply ? '<div class="rv-reply"><b>Reply from ' + esc(n.reply.by) + '</b><br>'
                   + esc(n.reply.text) + '</div>' : '')
      + '<div class="rv-foot"><div class="rv-help' + (n.helpful ? ' on' : '') + '"'
      + tid(n.helpfulId) + bind(n.helpfulAct) + '>'
      + icon('check', 13) + 'Helpful (' + n.count + ')</div></div></div>';

  case 'pills':
    return '<div style="display:flex;gap:6px;flex-wrap:wrap;padding:4px 16px 10px"' + tid(n.id) + '>'
      + n.items.map(function(p){ return '<span class="pill ' + (p.cls||'') + '">' + esc(p.text) + '</span>'; }).join('')
      + '</div>';

  case 'host':
    return '<div class="host"' + tid(n.id) + '><div class="h-av">' + avatarSvg(n.avatar) + '</div>'
      + '<div><div class="h-name">' + esc(n.name) + '</div><div class="h-sub">' + esc(n.sub) + '</div></div></div>';

  case 'amenities':
    return '<div class="amen"' + tid(n.id) + '>' + n.items.map(function(a){
      return '<div class="a-item' + (a.off?' off':'') + '">' + icon(a.icon, 18) + esc(a.label) + '</div>';
    }).join('') + '</div>';

  case 'empty':
    return '<div style="padding:24px 16px 8px"' + tid(n.id) + '>'
      + artBox(n.scene, n.hue, 180, 'rounded')
      + '<div class="n-text empty">' + esc(n.text) + '</div>'
      + (n.btn ? '<div style="display:flex;justify-content:center">' + render(n.btn) + '</div>' : '')
      + '</div>';

  case 'tripsummary':
    return '<div class="n-card" style="display:flex;gap:12px;padding:12px"' + tid(n.id) + '>'
      + '<div class="art rounded" style="width:92px;height:80px;flex:0 0 auto">' + artSvg(n.scene, n.hue) + '</div>'
      + '<div style="min-width:0;display:flex;flex-direction:column;justify-content:center">'
      + '<div style="font:600 16px/1.3 var(--serif)">' + esc(n.name) + '</div>'
      + '<div style="color:var(--muted);font-size:12.5px;margin-top:3px">' + esc(n.city) + '</div>'
      + '<div style="display:flex;align-items:center;gap:4px;font-size:12.5px;margin-top:5px">'
      + icon('star',12,'gold') + '<b>' + n.rating + '</b><span style="color:var(--muted)">(' + n.reviews + ')</span>'
      + '</div></div></div>';

  case 'tripline':
    return '<div style="display:flex;gap:12px;padding:12px;cursor:pointer"' + tid(n.id) + bind(n.act) + '>'
      + '<div class="art rounded" style="width:88px;height:76px;flex:0 0 auto">' + artSvg(n.scene, n.hue) + '</div>'
      + '<div style="flex:1 1 auto;min-width:0">'
      + '<div style="display:flex;justify-content:space-between;gap:8px;align-items:baseline">'
      + '<div style="font:600 15.5px/1.3 var(--serif);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'
      + esc(n.name) + '</div><span class="pill ' + n.status.cls + '">' + esc(n.status.text) + '</span></div>'
      + '<div style="color:var(--muted);font-size:12.5px;margin-top:4px">' + esc(n.city) + '</div>'
      + '<div style="font-size:13px;margin-top:6px">' + esc(n.dates) + '</div>'
      + '<div style="font-size:13px;margin-top:3px;color:var(--muted)">' + esc(n.total) + ' total</div>'
      + '</div></div>';

  case 'calendar': {
    var cells = n.cells.map(function(c){
      if (c.blank) return '<div class="c-day blank"></div>';
      var cls = 'c-day' + (c.past ? ' mute' : '') + (c.inRange ? ' in-range' : '')
              + (c.edge ? ' edge' : '') + (c.start ? ' start' : '') + (c.end ? ' end' : '');
      return '<div class="' + cls + '"' + tid(c.id) + (c.act ? bind(c.act) : '') + '><span>' + c.day + '</span></div>';
    }).join('');
    return '<div class="cal"' + tid(n.id) + '>'
      + '<div class="c-head"><div class="iconbtn"' + tid(n.prevId) + bind(n.prev) + '>' + icon('back',18) + '</div>'
      + '<div class="c-month">' + esc(n.month) + '</div>'
      + '<div class="iconbtn"' + tid(n.nextId) + bind(n.next) + '>' + icon('arrow',18) + '</div></div>'
      + '<div class="c-dow">' + n.dow.map(function(d){ return '<div>' + d.charAt(0) + '</div>'; }).join('') + '</div>'
      + '<div class="c-grid">' + cells + '</div></div>';
  }

  case 'kv':
    return '<div class="kv ' + esc(n.cls||'') + '"><span class="k">' + esc(n.k) + '</span>'
         + '<span class="v">' + esc(n.v) + '</span></div>';

  case 'mask':  return '<div class="n-mask"' + tid(n.id) + bind(n.close) + '>' + R(n.c) + '</div>';
  case 'sheet':
    return '<div class="n-sheet"' + tid(n.id) + ' data-stop="1"><div class="sh-hd">'
      + '<div class="t">' + esc(n.title) + '</div>'
      + '<div class="iconbtn"' + tid(n.closeId) + bind(n.close) + '>' + icon('close',15) + '</div></div>'
      + '<div class="sh-bd">' + R(n.c) + '</div>'
      + (n.footer ? '<div class="sh-ft">' + render(n.footer) + '</div>' : '') + '</div>';
  case 'sheetfoot':
    return '<div style="display:flex;align-items:center;gap:10px"' + tid(n.id) + '>'
      + '<div style="flex:1 1 auto;font-size:12.5px;color:var(--ink2);min-width:0">' + esc(n.label||'') + '</div>'
      + (n.left ? render(n.left) : '') + render(n.btn) + '</div>';
  case 'dialog':
    return '<div class="dialog"' + tid(n.id) + ' data-stop="1">'
      + '<div style="padding:22px 20px 16px;text-align:center">'
      + (n.title ? '<div style="font:600 17px/1.3 var(--serif);margin-bottom:8px">' + esc(n.title) + '</div>' : '')
      + '<div style="font-size:13.5px;color:var(--ink2);line-height:1.55">' + esc(n.text) + '</div></div>'
      + '<div style="display:flex;gap:10px;padding:0 16px 16px">'
      + '<div class="n-btn" style="flex:1"' + tid(n.cancel.id) + bind(n.cancel.act) + '>' + esc(n.cancel.text) + '</div>'
      + '<div class="n-btn primary" style="flex:1"' + tid(n.ok.id) + bind(n.ok.act) + '>' + esc(n.ok.text) + '</div>'
      + '</div></div>';
  case 'toast': return '<div class="n-toast"' + tid(n.id) + '>' + esc(n.text) + '</div>';
  default: return '';
  }
}

/* ------------------------------------------------------------------ paint */
var STATE = null;
function paint(){
  ACTS = []; uidSeq = 0;
  var tree = E.screen(STATE);
  app.innerHTML = render(tree);
  document.getElementById('sb-clock').textContent = E.select.clockStr(STATE.meta.clock);
  sb.className = 'statusbar' + (tree.route === 'stay' ? ' on-art' : '');
  if (!hud.classList.contains('off')) paintHud();
}

app.addEventListener('click', function(ev){
  var el = ev.target.closest('[data-act]');
  if (!el) return;
  if (el.classList.contains('n-mask') && ev.target.closest('[data-stop]')) return;
  var act = ACTS[+el.getAttribute('data-act')];
  if (!act) return;
  TRAJ.push({action:'tap', id: el.getAttribute('data-testid') || null});
  STATE = E.reduce(STATE, act);
  paint();
});
app.addEventListener('keydown', function(ev){
  if (ev.key !== 'Enter') return;
  var el = ev.target.closest('[data-enter]');
  if (!el) return;
  var idx = +el.getAttribute('data-enter');
  if (idx < 0) return;
  ev.preventDefault();
  var act = ACTS[idx];
  if (!act) return;
  TRAJ.push({action:'tap', id:'(enter)'});
  STATE = E.reduce(STATE, act);
  paint();
});
app.addEventListener('input', function(ev){
  var el = ev.target.closest('[data-actt]');
  if (!el) return;
  var act = JSON.parse(JSON.stringify(ACTS[+el.getAttribute('data-actt')]));
  for (var k in act) if (act[k] === '$VALUE') act[k] = el.value;
  var id = el.getAttribute('data-testid'), pos = el.selectionStart;
  TRAJ.push({action:'type', id:id, text:el.value});
  STATE = E.reduce(STATE, act);
  paint();
  var again = id && app.querySelector('[data-testid="' + id + '"]');
  if (again && again.focus) { again.focus(); try { again.setSelectionRange(pos, pos); } catch(e){} }
});

/* ---------------------------------------------------------------- dev HUD */
function paintHud(){
  var d = E.derive(STATE);
  hud.innerHTML = '<h4>__ENV__ · ' + E.ENV_ID + ' v' + E.VERSION + '</h4>'
    + '<div><span class="k">route</span> ' + d.route + '  <span class="k">step</span> ' + STATE.meta.steps
    + '  <span class="k">seed</span> ' + STATE.meta.seed + '</div>'
    + '<div><span class="k">dates</span> ' + (STATE.draft.checkIn || '—') + ' → ' + (STATE.draft.checkOut || '—')
    + '  <span class="k">bookings</span> ' + d.bookingCount + '</div>'
    + '<div style="margin-top:8px">'
    + '<button id="hud-reset">reset</button><button id="hud-a11y">copy a11y</button>'
    + '<button id="hud-state">copy state</button><button id="hud-traj">copy traj</button>'
    + '<button id="hud-hide">hide (h)</button></div>'
    + '<pre>' + esc(E.a11y(STATE)) + '</pre>';
  hud.querySelector('#hud-reset').onclick = function(){ ENVAPI.reset({seed:STATE.meta.seed}); };
  hud.querySelector('#hud-a11y').onclick  = function(){ copy(E.a11y(STATE)); };
  hud.querySelector('#hud-state').onclick = function(){ copy(JSON.stringify(E.snapshot(STATE), null, 2)); };
  hud.querySelector('#hud-traj').onclick  = function(){ copy(JSON.stringify(TRAJ, null, 2)); };
  hud.querySelector('#hud-hide').onclick  = function(){ hud.classList.add('off'); };
}
function copy(t){ try { navigator.clipboard.writeText(t); } catch(e){} }
document.addEventListener('keydown', function(e){
  if (e.key === 'h') { hud.classList.toggle('off'); if (!hud.classList.contains('off')) paintHud(); }
});

/* ------------------------------------------------------- window.__ENV__ */
var ENVAPI = {
  ENV_ID: E.ENV_ID, VERSION: E.VERSION,
  reset: function(opts){
    opts = opts || {};
    STATE = E.createInitialState(opts.seed || 0);
    if (opts.patch) E.applyPatch(STATE, opts.patch);
    TRAJ = []; paint();
    return E.snapshot(STATE);
  },
  getState:   function(){ return E.snapshot(STATE); },
  setState:   function(s){ STATE = JSON.parse(JSON.stringify(s)); paint(); return true; },
  step:       function(a){ var r = E.step(STATE, a); STATE = r.state; TRAJ.push(a); paint();
                           return {ok:r.ok, error:r.error || null}; },
  dispatch:   function(act){ STATE = E.reduce(STATE, act); paint(); return true; },
  a11y:       function(){ return E.a11y(STATE); },
  elements:   function(){ return E.elements(STATE); },
  route:      function(){ return E.select.route(STATE); },
  trajectory: function(){ return JSON.parse(JSON.stringify(TRAJ)); },
  bounds: function(){
    var base = document.getElementById('screen').getBoundingClientRect(), out = {};
    app.querySelectorAll('[data-testid]').forEach(function(el){
      var r = el.getBoundingClientRect();
      out[el.getAttribute('data-testid')] = {
        x:Math.round(r.left-base.left), y:Math.round(r.top-base.top),
        w:Math.round(r.width), h:Math.round(r.height),
        cx:Math.round(r.left-base.left+r.width/2), cy:Math.round(r.top-base.top+r.height/2)};
    });
    return out;
  }
};
window.__ENV__ = ENVAPI;

var qs = new URLSearchParams(location.search);
if (qs.get('bare') === '1') document.body.classList.add('bare');
if (qs.get('hud')  === '1') hud.classList.remove('off');
ENVAPI.reset({seed: parseInt(qs.get('seed') || '0', 10) || 0});
window.__ENV_READY__ = true;
})();
</script>
