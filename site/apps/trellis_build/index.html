<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Trellis (mocked GUI env)</title>
<!--
  ============================================================================
  Trellis — a single-file H5 build planner for agent research.

  Same two-block contract as every environment here: script#engine is a pure,
  DOM-free state machine on globalThis.GUI_ENGINE; script#ui renders its screen
  tree and exposes window.__ENV__.

  What is new: nothing on screen is a stored number. Twelve jobs, each with a
  duration and a list of jobs that must finish first, and every figure the app
  shows — the day each job can start, the day it must start, its float, the
  finish date, which jobs are on the critical path — is a forward and backward
  pass over that graph, recomputed from scratch on every action.

  Two levers act on it. A job can be paid to go faster, up to a limit, at its
  own price per day; and two of the dependencies are preferences rather than
  physics and can be dropped. Both are traps as often as they are answers:
  money spent on a job with float buys nothing at all, and shortening the
  critical path moves it somewhere else, so the second day costs a different
  amount from the first.
  ============================================================================
-->
<style>
:root{
  --outer:#05070a;
  --bezel:#000000;
  --bg:#0c1420;
  --card:#132133;
  --card2:#1d222b;
  --line:#1f3450;
  --line2:#2b4667;
  --press:#1a2c43;
  --chev:#3d5876;
  --ink:#e8f0f8;
  --ink2:#9fb4cb;
  --muted:#6c8299;
  --accent:#38bdf8;
  --accent-d:#7dd3fc;
  --accent-s:#10293c;
  --on-accent:#04121d;
  --good:#4ade80;
  --good-s:#10291c;
  --warn:#fbbf24;
  --warn-s:#2c2410;
  --bad:#fb7185;
  --bad-s:#31151f;
  --bad-line:#4d2230;
  --btn:#1c2e45;
  --btn-off:#182739;
  --off:#2b4667;
  --appbar:#0c1420;
  --appbar-ink:#f2f5f9;
  --appbar-line:#1f3450;
  --tabbar:#0f1b2a;
  --scrim:rgba(4,10,18,.66);
  --toast:#1f3450;
  --toast-ink:#0d1014;
  --hero:linear-gradient(140deg,#0e2438,#1c4a6b);
  --hero-line:#1f3450;
  --hero-ink:#e8f0f8;
  --disp:"SF Mono",ui-monospace,"Roboto Mono",Menlo,Consolas,monospace;
  --r:18px; --r2:12px;
  --shadow:0 1px 2px rgba(16,18,26,.05),0 10px 26px rgba(16,18,26,.07);
  --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{background:var(--outer);color:var(--ink);font:14px/1.55 var(--ui);
  display:flex;align-items:center;justify-content:center;overflow:hidden}

#device{position:relative;width:390px;height:844px;background:var(--bezel);border-radius:46px;padding:5px;
  box-shadow:0 30px 70px rgba(0,0,0,.34);flex:0 0 auto}
#screen{position:relative;width:100%;height:100%;background:var(--bg);border-radius:41px;
  overflow:hidden;display:flex;flex-direction:column}
#notch{position:absolute;top:5px;left:50%;transform:translateX(-50%);width:118px;height:30px;
  background:var(--bezel);border-radius:0 0 18px 18px;z-index:60}
body.bare{background:var(--bg)}
body.bare #device{width:390px;height:844px;padding:0;border-radius:0;box-shadow:none;background:var(--bg)}
body.bare #screen{border-radius:0}
body.bare #notch{display:none}
body.bare .n-sheet{animation:none}

.statusbar{height:44px;flex:0 0 44px;display:flex;align-items:flex-end;justify-content:space-between;
  padding:0 22px 6px;font-size:13px;font-weight:600;z-index:50;color:var(--ink)}
.statusbar .sb-r{display:flex;gap:5px;align-items:center}
.sb-bat{width:22px;height:11px;border:1.3px solid currentColor;border-radius:3px;position:relative;opacity:.9}
.sb-bat:after{content:"";position:absolute;right:-3px;top:3px;width:2px;height:5px;background:currentColor;border-radius:0 1px 1px 0}
.sb-bat i{position:absolute;left:1.3px;top:1.3px;bottom:1.3px;width:78%;background:currentColor;border-radius:1px}

#app{flex:1 1 auto;display:flex;flex-direction:column;min-height:0;position:relative}

.n-appbar{flex:0 0 auto;min-height:52px;display:flex;align-items:center;gap:8px;padding:6px 12px;
  background:var(--appbar);color:var(--appbar-ink);z-index:20;border-bottom:1px solid var(--appbar-line)}
.n-appbar .ab-title{flex:1 1 auto;text-align:center;font:650 17px/1.3 var(--disp);letter-spacing:-.2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.n-appbar .ab-side{flex:0 0 auto;min-width:56px;display:flex;align-items:center;gap:2px}
.n-appbar .ab-side.right{justify-content:flex-end}
.n-appbar .iconbtn{color:var(--appbar-ink);opacity:.85}
.iconbtn{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  color:var(--ink2);cursor:pointer}
.iconbtn:active{background:var(--press)}

.n-scroll{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;padding-bottom:10px}
.n-scroll::-webkit-scrollbar{width:0}

.n-text{padding:2px 18px;color:var(--ink2)}
.n-text.h1{font:700 26px/1.18 var(--disp);color:var(--ink);padding:10px 18px 6px;letter-spacing:-.6px}
.n-text.h2{font:650 18px/1.3 var(--disp);color:var(--ink);padding:12px 18px 2px}
.n-text.body{font-size:13.5px;padding:5px 18px;line-height:1.7}
.n-text.muted{font-size:12.5px;color:var(--muted);padding:6px 18px;line-height:1.6}
.n-text.empty{padding:14px 18px 40px;text-align:center;color:var(--muted);font-size:13.5px}
.n-sec{padding:18px 18px 6px;font:700 11.5px/1 var(--ui);color:var(--muted);letter-spacing:1.3px;
  text-transform:uppercase;display:flex;justify-content:space-between;align-items:center;gap:10px}
.n-space{height:16px}

.n-card{background:var(--card);border-radius:var(--r);margin:9px 16px;overflow:hidden;border:1px solid var(--line)}
.n-card.flush{padding:0}
.n-card.pad{padding:14px 16px}
.n-card.tap{cursor:pointer}
.n-card.tap:active{background:var(--press)}

.n-row{display:flex;align-items:center;gap:13px;padding:12px 16px;border-bottom:1px solid var(--line);min-height:54px}
.n-row:last-child{border-bottom:none}
.n-row.tap{cursor:pointer}
.n-row.tap:active{background:var(--press)}
.n-row .r-lead{flex:0 0 auto;width:26px;color:var(--ink2);display:flex;align-items:center;justify-content:center}
.n-row .r-main{flex:1 1 auto;min-width:0}
.n-row .r-label{font-size:14.5px}
.n-row .r-label.strike{text-decoration:line-through;color:var(--muted)}
.n-row .r-sub{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.5}
.n-row .r-value{flex:0 0 auto;font-size:14px;color:var(--ink2);text-align:right;font-variant-numeric:tabular-nums}
.n-row .r-value.strong{color:var(--ink);font-weight:700}
.n-row .r-value.acc{color:var(--accent);font-weight:700}
.n-row .r-value.good{color:var(--good);font-weight:700}
.n-row .r-value.warn{color:var(--warn);font-weight:700}
.n-row .r-value.bad{color:var(--bad);font-weight:700}
.n-row .r-arrow{flex:0 0 auto;color:var(--chev);display:flex}

.n-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:47px;padding:0 20px;
  border-radius:13px;font:650 15px/1 var(--ui);background:var(--btn);color:var(--ink);
  border:none;cursor:pointer;user-select:none}
.n-btn:active{filter:brightness(.97)}
.n-btn.primary{background:var(--accent);color:var(--on-accent)}
.n-btn.primary.off{background:var(--btn-off);color:var(--muted);cursor:not-allowed}
.n-btn.ghost{background:transparent;border:1px solid var(--line2);height:37px;font-size:13px;padding:0 14px;color:var(--ink2)}
.n-btn.danger{background:transparent;border:1px solid var(--bad-line);color:var(--bad);height:37px;font-size:13px;padding:0 14px}
.n-btn.block{display:flex;width:100%}
.n-btnrow{display:flex;gap:10px;padding:12px 16px;justify-content:flex-end;align-items:center;flex-wrap:wrap}

.n-chips{display:flex;gap:8px;padding:8px 16px;overflow-x:auto}
.n-chips::-webkit-scrollbar{height:0}
.n-chip{flex:0 0 auto;height:34px;padding:0 14px;border-radius:11px;background:var(--card);
  border:1px solid var(--line2);display:flex;align-items:center;font-size:13px;
  color:var(--ink2);cursor:pointer;white-space:nowrap;font-weight:600}
.n-chip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}

.n-input{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line);background:var(--card)}
.n-input .i-label{flex:0 0 78px;font-size:13px;color:var(--muted)}
.n-input input{flex:1 1 auto;border:none;outline:none;background:transparent;font-size:14.5px;
  font-family:inherit;color:var(--ink);min-width:0}
.n-input input::placeholder{color:var(--muted)}
.n-switch{flex:0 0 auto;width:46px;height:27px;border-radius:14px;background:var(--off);position:relative;cursor:pointer;transition:background .16s}
.n-switch.on{background:var(--accent)}
.n-switch i{position:absolute;top:2.5px;left:2.5px;width:22px;height:22px;border-radius:50%;background:#fff;
  transition:transform .16s;box-shadow:0 1px 3px rgba(0,0,0,.22)}
.n-switch.on i{transform:translateX(19px)}
.n-check{flex:0 0 auto;width:23px;height:23px;border-radius:7px;border:1.8px solid var(--off);position:relative;background:var(--card)}
.n-check.on{border-color:var(--accent);background:var(--accent)}
.n-check.on:after{content:"";position:absolute;left:7.5px;top:4px;width:5px;height:10px;
  border:2px solid var(--on-accent);border-top:0;border-left:0;transform:rotate(42deg)}
.n-radio{flex:0 0 auto;width:22px;height:22px;border-radius:50%;border:1.8px solid var(--off);position:relative}
.n-radio.on{border-color:var(--accent);background:var(--accent)}
.n-radio.on:after{content:"";position:absolute;left:7px;top:4px;width:5px;height:9px;
  border:2px solid var(--on-accent);border-top:0;border-left:0;transform:rotate(42deg)}

.tag{display:inline-flex;align-items:center;padding:3px 9px;border-radius:20px;font-size:11px;
  font-weight:700;background:var(--btn);color:var(--ink2)}
.tag.acc{background:var(--accent-s);color:var(--accent)}
.tag.good{background:var(--good-s);color:var(--good)}
.tag.warn{background:var(--warn-s);color:var(--warn)}
.tag.bad{background:var(--bad-s);color:var(--bad)}

.n-tabbar{flex:0 0 auto;height:58px;background:var(--tabbar);border-top:1px solid var(--line);display:flex;z-index:30}
.n-tabbar .tb{flex:1 1 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--muted);font-size:10.5px;cursor:pointer;font-weight:600}
.n-tabbar .tb i{display:flex}
.n-tabbar .tb.on{color:var(--accent)}

.n-mask{position:absolute;inset:0;background:var(--scrim);z-index:70;display:flex;align-items:flex-end}
.n-sheet{width:100%;max-height:80%;background:var(--card);border-radius:22px 22px 0 0;display:flex;
  flex-direction:column;overflow:hidden;animation:up .18s ease-out}
@keyframes up{from{transform:translateY(24px)}to{transform:none}}
.n-sheet .sh-hd{padding:16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.n-sheet .sh-hd .t{font:650 17px/1.2 var(--disp)}
.n-sheet .sh-bd{flex:1 1 auto;overflow-y:auto;min-height:0}
.n-sheet .sh-bd::-webkit-scrollbar{width:0}
.n-toast{position:absolute;left:50%;bottom:118px;transform:translateX(-50%);background:var(--toast);
  color:var(--toast-ink);padding:11px 18px;border-radius:11px;font-size:13px;z-index:90;max-width:84%;text-align:center}
.dialog{margin:auto;width:82%;background:var(--card);border-radius:18px;overflow:hidden;border:1px solid var(--line)}

.stats{display:flex;gap:9px;padding:4px 16px}
.stat{flex:1 1 0;background:var(--card);border:1px solid var(--line);border-radius:var(--r2);padding:13px 12px}
.stat.tap{cursor:pointer}
.stat .st-n{font:800 19px/1.1 var(--disp);letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.stat .st-l{font-size:11px;color:var(--muted);margin-top:6px;line-height:1.4}
.stat.acc .st-n{color:var(--accent)}

.hero{margin:8px 16px 4px;padding:18px;border-radius:var(--r);background:var(--hero);
  border:1px solid var(--hero-line);color:var(--hero-ink)}
.hero.tap{cursor:pointer}
.hero .he-k{font-size:11px;letter-spacing:1.3px;text-transform:uppercase;font-weight:800;opacity:.85}
.hero .he-t{font:800 25px/1.16 var(--disp);margin-top:9px;letter-spacing:-.7px}
.hero .he-s{font-size:13px;margin-top:8px;line-height:1.6;opacity:.9}


.n-scroll{background-image:linear-gradient(var(--line) 1px,transparent 1px),
  linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:26px 26px;
  background-position:-1px -1px;background-attachment:local}
.n-card,.sumc,.gantt,.gr-wrap{background-color:var(--card)}

.sumc{margin:12px 16px;padding:16px;border:1px solid var(--line2);border-radius:var(--r);
  position:relative;overflow:hidden}
.sumc:before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent)}
.sumc .su-k{font:600 10.5px/1 var(--disp);letter-spacing:1.6px;text-transform:uppercase;
  color:var(--muted)}
.sumc .su-n{font:700 34px/1 var(--disp);letter-spacing:-1px;margin-top:11px}
.sumc .su-d{font-size:13px;color:var(--accent);margin-top:8px;font-family:var(--disp)}
.sumc .su-g{display:flex;gap:22px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.sumc .su-i .v{font:700 15px/1 var(--disp)}
.sumc .su-i .l{font-size:10.5px;color:var(--muted);margin-top:5px;letter-spacing:.4px}
.sumc .su-i.on .v{color:var(--warn)}

.gantt{margin:0 16px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.gt-r{display:block;padding:10px 13px;border-bottom:1px solid var(--line);cursor:pointer}
.gt-r:last-child{border-bottom:none}
.gt-r:active{background:var(--press)}
.gt-h{display:flex;align-items:baseline;gap:8px}
.gt-n{flex:1 1 auto;font-size:13.5px;font-weight:600}
.gt-n.crit{color:var(--warn)}
.gt-t{font:600 10px/1 var(--disp);letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.gt-track{position:relative;height:15px;margin-top:9px;border-radius:3px;background:var(--btn-off)}
.gt-track i{position:absolute;top:0;bottom:0;border-radius:3px;background:var(--accent)}
.gt-track i.crit{background:var(--warn)}
.gt-track u{position:absolute;top:4px;bottom:4px;border-radius:2px;
  background:repeating-linear-gradient(45deg,var(--line2),var(--line2) 3px,transparent 3px,transparent 6px)}
.gt-track b{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--bad)}
.gt-s{font:500 10.5px/1 var(--disp);color:var(--muted);margin-top:8px;letter-spacing:.3px}
.gt-s em{font-style:normal;color:var(--good)}
.gt-s s{text-decoration:none;color:var(--accent-d)}

.gr-wrap{margin:0 16px;border:1px solid var(--line);border-radius:var(--r);padding:4px 0;
  overflow-x:auto}
.gr{position:relative;display:block}
.gr .gnode{position:absolute;box-sizing:border-box;border:1px solid var(--line2);border-radius:7px;
  background:var(--btn);display:flex;flex-direction:column;justify-content:center;
  padding:0 7px;cursor:pointer;overflow:hidden}
.gr .gnode:active{background:var(--press)}
.gr .gnode.crit{border-color:var(--warn);background:var(--warn-s)}
.gr .gnode .gn-n{font-size:10.5px;font-weight:700;line-height:1.25;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gr .gnode .gn-d{font:600 9.5px/1 var(--disp);color:var(--muted);margin-top:3px}
.gr .gnode.crit .gn-d{color:var(--warn)}
.gr svg{position:absolute;left:0;top:0;pointer-events:none}

.legend{display:flex;gap:14px;padding:9px 16px;font-size:10.5px;color:var(--muted);
  font-family:var(--disp);letter-spacing:.3px}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:12px;height:5px;border-radius:2px;display:block}

</style>
</head>
<body>
<div id="device">
  <div id="notch"></div>
  <div id="screen">
    <div class="statusbar" id="sb">
      <div id="sb-clock">07:45</div>
      <div class="sb-r">
        <svg width="17" height="12" viewBox="0 0 17 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="4.6" y="5.5" width="3" height="6.5" rx="1"/><rect x="9.2" y="3" width="3" height="9" rx="1"/><rect x="13.8" y="0" width="3" height="12" rx="1"/></svg>
        <svg width="15" height="12" viewBox="0 0 15 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M1 4.2a9 9 0 0 1 13 0"/><path d="M3.4 6.9a5.6 5.6 0 0 1 8.2 0"/><circle cx="7.5" cy="10" r=".9" fill="currentColor" stroke="none"/></svg>
        <span class="sb-bat"><i></i></span>
      </div>
    </div>
    <div id="app"></div>
  </div>
</div>
<div id="hud" class="off"></div>

<script id="engine">
/* ===========================================================================
 * ENGINE — pure, deterministic, DOM-free.
 * Durations are integer days and money is integer pence. Every schedule
 * figure is recomputed by schedule(); none of them is ever stored.
 * ======================================================================== */
(function(root){
'use strict';

var ENV_ID  = 'trellis_build';
var VERSION = '1.0.0';

/* ------------------------------------------------------------- utilities */
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function pad2(n){ return (n < 10 ? '0' : '') + n; }
function hhmm(m){ m = ((m % 1440) + 1440) % 1440; return pad2(Math.floor(m/60)) + ':' + pad2(m%60); }
function sum(a){ var s = 0; for (var i=0;i<a.length;i++) s += a[i]; return s; }
function clamp(v, lo, hi){ return v < lo ? lo : (v > hi ? hi : v); }
function lcg(seed){ var s=(seed>>>0)||1; return function(){ s=(s*1664525+1013904223)>>>0; return s/4294967296; }; }
function shuffled(list, seed){
  if (!seed) return list.slice();
  var r = lcg(seed), a = list.slice();
  for (var i=a.length-1;i>0;i--){ var j = Math.floor(r()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
function money(p, sym){
  var neg = p < 0; p = Math.abs(p);
  return (neg ? '-' : '') + (sym === undefined ? '\u00a3' : sym) +
         (Math.floor(p/100)).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',') + '.' + pad2(p%100);
}
function getPath(o, path){
  var cur = o, parts = String(path).split('.');
  for (var i=0;i<parts.length;i++){
    var k = parts[i], m = k.match(/^(.*?)\[(\d+)\]$/);
    if (m){ cur = cur ? cur[m[1]] : undefined; cur = cur ? cur[+m[2]] : undefined; }
    else cur = cur ? cur[k] : undefined;
    if (cur === undefined) return undefined;
  }
  return cur;
}
function setPath(o, path, value){
  var parts = String(path).split('.'), cur = o;
  for (var i=0;i<parts.length-1;i++){
    var k = parts[i], m = k.match(/^(.*?)\[(\d+)\]$/);
    cur = m ? cur[m[1]][+m[2]] : (cur[k] = cur[k] || {});
  }
  var lastK = parts[parts.length-1], lm = lastK.match(/^(.*?)\[(\d+)\]$/);
  if (lm) cur[lm[1]][+lm[2]] = value; else cur[lastK] = value;
  return o;
}

/* ------------------------------------------- screen-tree node constructors */
function N(t, o){ o = o || {}; o.t = t; return o; }
function txt(s, cls){ return N('text', {text:s, cls:cls || ''}); }
function row(id, text, o){
  o = o || {}; o.id = id; o.text = text;
  if (o.arrow === undefined) o.arrow = !!o.act;
  return N('row', o);
}
function btn(id, text, act, cls, disabled){
  return N('btn', {id:id, text:text, act:act, cls:cls || '', disabled:!!disabled});
}
function iconbtn(id, ic, act, cls){ return N('iconbtn', {id:id, icon:ic, act:act, cls:cls || ''}); }
function appbar(title, o){ o = o || {}; o.title = title; return N('appbar', o); }
function stepper(id, value, minus, plus){
  return N('stepper', {id:id, value:value, minusId:id + '_dec', plusId:id + '_inc',
                       minus:minus, plus:plus});
}
function sheet(id, title, kids){
  return N('sheet', {id:id, title:title, closeId:id + '_close', close:{type:'CLOSE_SHEET'}, c:kids});
}
function route(st){ return st.ui.stack[st.ui.stack.length - 1]; }
function push(st, name, params){ st.ui.stack.push({name:name, params:params || {}}); st.ui.sheet = null; }
function pop(st){ if (st.ui.stack.length > 1) st.ui.stack.pop(); }
function toast(st, t){ st.ui.toast = t; }

/* ------------------------------------------------------ the build graph */
function DEP(id, soft){ return {id:id, soft:!!soft}; }
function TK(id, name, trade, days, deps, crashMax, crashCost, note){
  return {id:id, name:name, trade:trade, days:days, deps:deps, crashMax:crashMax,
          crashCost:crashCost, note:note || ''};
}
var TASKS = [
  TK('t_strip',   'Strip out',            'Demolition', 3, [], 1, 15000,
     'Skip on the drive, everything out to brick.'),
  TK('t_rewire',  'Rewire',               'Electrics',  5, [DEP('t_strip')], 2, 22000,
     'A second pair of hands is what the extra money buys.'),
  TK('t_plumb',   'First-fix plumbing',   'Plumbing',   4, [DEP('t_strip')], 1, 26000,
     'Pipework in the walls and floor before anything is closed up.'),
  TK('t_plaster', 'Plastering',           'Plastering', 4, [DEP('t_rewire'), DEP('t_plumb')], 2, 18000,
     'Two plasterers instead of one.'),
  TK('t_floor',   'Floor screed',         'Flooring',   2, [DEP('t_plumb')], 0, 0,
     'Poured in a day and a half, call it two.'),
  TK('t_dry',     'Screed drying',        'Waiting',    5, [DEP('t_floor')], 0, 0,
     'It dries when it dries. There is nothing to buy here.'),
  TK('t_joinery', 'Kitchen units',        'Joinery',    5, [DEP('t_plaster')], 2, 30000,
     'Carcasses and doors.'),
  TK('t_tile',    'Tiling',               'Tiling',     3, [DEP('t_plaster')], 1, 14000,
     'Splashback and the utility floor.'),
  TK('t_paint',   'Painting',             'Decorating', 4, [DEP('t_plaster'), DEP('t_dry', true)], 2, 11000,
     'Two coats everywhere.'),
  TK('t_worktop', 'Worktop template and fit', 'Joinery', 4, [DEP('t_joinery')], 1, 35000,
     'Templated on day one, fitted on the last.'),
  TK('t_second',  'Second-fix electrics', 'Electrics',  2,
     [DEP('t_joinery'), DEP('t_tile', true), DEP('t_paint', true)], 1, 20000,
     'Sockets, switches, the extractor.'),
  TK('t_snag',    'Snagging',             'Site',       2,
     [DEP('t_worktop'), DEP('t_second'), DEP('t_dry')], 0, 0,
     'The list nobody enjoys.')
];
var TRADES = TASKS.map(function(t){ return t.trade; })
                  .filter(function(v, i, a){ return a.indexOf(v) === i; });
function taskOf(id){ for (var i=0;i<TASKS.length;i++) if (TASKS[i].id === id) return TASKS[i]; return null; }
function depKey(t, d){ return t.id + '>' + d.id; }
function softDeps(){
  var out = [];
  TASKS.forEach(function(t){ t.deps.forEach(function(d){ if (d.soft) out.push({t:t, d:d}); }); });
  return out;
}
function dropped(st, t, d){ return !!st.dropped[depKey(t, d)]; }
function liveDeps(st, t){
  return t.deps.filter(function(d){ return !(d.soft && dropped(st, t, d)); });
}
function daysOf(st, t){ return t.days - (st.crash[t.id] || 0); }
function crashedBy(st, t){ return st.crash[t.id] || 0; }
function crashSpend(st){
  var n = 0;
  TASKS.forEach(function(t){ n += crashedBy(st, t) * t.crashCost; });
  return n;
}

/* forward pass, then backward pass. TASKS is already in topological order,
 * which the reducer never changes, so one sweep each way is enough. */
function schedule(st){
  var es = {}, ef = {}, ls = {}, lf = {}, i, t;
  for (i = 0; i < TASKS.length; i++){
    t = TASKS[i];
    var start = 0;
    liveDeps(st, t).forEach(function(d){ if (ef[d.id] > start) start = ef[d.id]; });
    es[t.id] = start; ef[t.id] = start + daysOf(st, t);
  }
  var total = 0;
  TASKS.forEach(function(x){ if (ef[x.id] > total) total = ef[x.id]; });
  for (i = TASKS.length - 1; i >= 0; i--){
    t = TASKS[i];
    var end = total;
    TASKS.forEach(function(o){
      liveDeps(st, o).forEach(function(d){ if (d.id === t.id && ls[o.id] < end) end = ls[o.id]; });
    });
    lf[t.id] = end; ls[t.id] = end - daysOf(st, t);
  }
  var slack = {}, crit = [];
  TASKS.forEach(function(x){
    slack[x.id] = ls[x.id] - es[x.id];
    if (slack[x.id] === 0) crit.push(x.id);
  });
  return {es:es, ef:ef, ls:ls, lf:lf, slack:slack, crit:crit, total:total};
}
function isCrit(st, id){ return schedule(st).slack[id] === 0; }

/* ------------------------------------------------------------- the diary */
var DOW = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
var MONTHS = [['Apr',30], ['May',31], ['Jun',30], ['Jul',31], ['Aug',31]];
function calOffset(st, workDay){
  if (st.settings.workWeekends) return workDay;
  return Math.floor(workDay / 5) * 7 + (workDay % 5);
}
function dateOf(off){                      /* day 0 is Monday 6 April */
  var d = 6 + off, mi = 0;
  while (d > MONTHS[mi][1]) { d -= MONTHS[mi][1]; mi += 1; }
  return DOW[off % 7] + ' ' + d + ' ' + MONTHS[mi][0];
}
function startDate(st){ return dateOf(calOffset(st, 0)); }
function finishDate(st){ return dateOf(calOffset(st, schedule(st).total - 1)); }
function calendarDays(st){ return calOffset(st, schedule(st).total - 1) + 1; }
function dayLabel(st, workDay){ return dateOf(calOffset(st, workDay)); }

/* =========================================================== state */
function createInitialState(seed){
  seed = seed || 0;
  return {
    meta:{env:ENV_ID, version:VERSION, seed:seed, steps:0, finished:false, answer:null},
    crash:{},          /* task id -> days bought off */
    dropped:{},        /* 'task>dep' -> true, soft dependencies only */
    /* the seed permutes the order the trades are offered in, nothing else */
    order:shuffled(TRADES, seed),
    ui:{tab:'plan', stack:[{name:'plan', params:{}}], sheet:null, confirm:null, inputs:{},
        toast:null, filter:'all'},
    settings:{workWeekends:false, showFloat:true, warnSlip:true}
  };
}
var SELECT = {
  taskOf:taskOf, schedule:schedule, daysOf:daysOf, crashedBy:crashedBy, crashSpend:crashSpend,
  liveDeps:liveDeps, dropped:dropped, softDeps:softDeps, depKey:depKey, isCrit:isCrit,
  finishDate:finishDate, startDate:startDate, calendarDays:calendarDays, dayLabel:dayLabel,
  route:route, tasks:TASKS
};

/* =========================================================== reducer */
function reduce(prev, action){
  var st = clone(prev), A = action || {};
  st.ui.toast = null;
  st.meta.steps += 1;

  function slip(before, after, what){
    if (!st.settings.warnSlip) { toast(st, what); return; }
    if (after === before) toast(st, what + ' — the finish date does not move');
    else if (after < before) toast(st, what + ' — finish pulls in to day ' + after);
    else toast(st, what + ' — finish slips to day ' + after);
  }

  switch (A.type) {

  case 'NOOP': break;
  case 'FINISH': st.meta.finished = true; st.meta.answer = A.answer === undefined ? null : A.answer; break;

  case 'NAV': push(st, A.to, A.params); break;
  case 'BACK':
    if (st.ui.sheet) st.ui.sheet = null;
    else if (st.ui.confirm) st.ui.confirm = null;
    else pop(st);
    break;
  case 'TAB': {
    var roots = {plan:'plan', chain:'chain', trades:'trades', settings:'settings'};
    st.ui.tab = A.tab; st.ui.sheet = null; st.ui.confirm = null;
    st.ui.stack = [{name:roots[A.tab] || 'plan', params:{}}];
    break;
  }
  case 'HOME':
    st.ui.tab = 'plan'; st.ui.stack = [{name:'plan', params:{}}];
    st.ui.sheet = null; st.ui.confirm = null;
    break;
  case 'SET_INPUT': st.ui.inputs[A.field] = A.value; break;
  case 'OPEN_SHEET': st.ui.sheet = {type:A.sheet, id:A.id || null}; break;
  case 'CLOSE_SHEET': st.ui.sheet = null; break;
  case 'CONFIRM_NO': st.ui.confirm = null; break;
  case 'CONFIRM_YES': {
    var yes = st.ui.confirm && st.ui.confirm.yes; st.ui.confirm = null;
    if (yes) { var keep = st.meta.steps; var out = reduce(st, yes); out.meta.steps = keep; return out; }
    break;
  }
  case 'FILTER': st.ui.filter = A.id; break;
  case 'FILTER_TRADE':
    st.ui.tab = 'plan';
    st.ui.stack = [{name:'plan', params:{}}];
    st.ui.filter = A.id;
    break;

  /* ---- paying a job to go faster ---- */
  case 'CRASH': {
    var t = taskOf(A.id);
    if (!t) break;
    var was = schedule(st).total;
    var have = st.crash[t.id] || 0;
    var want = Math.max(0, Math.min(t.crashMax, have + (A.by || 0)));
    if (t.crashMax === 0) { toast(st, t.name + ' cannot be bought forward'); break; }
    if (want === have) {
      toast(st, want === 0 ? t.name + ' is already at its full length'
                           : t.name + ' is already as short as it goes');
      break;
    }
    st.crash[t.id] = want;
    var now = schedule(st).total;
    slip(was, now, t.name + ' set to ' + daysOf(st, t) + ' days, ' + money(crashSpend(st)) + ' spent');
    break;
  }
  case 'CRASH_RESET':
    st.ui.confirm = {title:'Put every job back to full length?',
      text:'Everything you have paid to speed up goes back to its original duration.',
      okText:'Undo it all', yes:{type:'CRASH_RESET_YES'}};
    break;
  case 'CRASH_RESET_YES': {
    var was2 = schedule(st).total;
    st.crash = {};
    slip(was2, schedule(st).total, 'Every job back to full length');
    break;
  }

  /* ---- dropping a dependency that is only a preference ---- */
  case 'DROP_DEP': {
    var t2 = taskOf(A.id), d2 = null;
    if (!t2) break;
    t2.deps.forEach(function(d){ if (d.id === A.dep) d2 = d; });
    if (!d2) break;
    if (!d2.soft) { toast(st, taskOf(A.dep).name + ' really does have to finish first'); break; }
    var k = depKey(t2, d2), was3 = schedule(st).total;
    if (st.dropped[k]) { delete st.dropped[k]; }
    else st.dropped[k] = true;
    slip(was3, schedule(st).total,
         (st.dropped[k] ? 'Dropped ' : 'Restored ') + taskOf(A.dep).name + ' before ' + t2.name);
    break;
  }

  case 'SET_TOGGLE': st.settings[A.key] = !st.settings[A.key];
    if (A.key === 'workWeekends')
      toast(st, st.settings.workWeekends ? 'Seven-day weeks — finish ' + finishDate(st)
                                         : 'Back to five-day weeks — finish ' + finishDate(st));
    break;

  default: break;
  }
  return st;
}

/* =========================================================== screens */
function tabbar(st){
  var items = [
    {id:'tab_plan',     text:'Plan',     icon:'chart',  tab:'plan'},
    {id:'tab_chain',    text:'Chain',    icon:'share',  tab:'chain'},
    {id:'tab_trades',   text:'Trades',   icon:'user',   tab:'trades'},
    {id:'tab_settings', text:'Site',     icon:'gear',   tab:'settings'}
  ].map(function(i){
    return {id:i.id, text:i.text, icon:i.icon, on:(st.ui.tab === i.tab), act:{type:'TAB', tab:i.tab}};
  });
  return N('tabbar', {id:'tabbar', items:items});
}
function summary(st){
  var s = schedule(st);
  return N('sum', {id:'summary', kicker:'Finish on', days:s.total + ' working days',
    date:finishDate(st),
    grid:[{v:s.crit.length + ' of ' + TASKS.length, l:'on the critical path', on:true},
          {v:money(crashSpend(st)), l:'spent going faster', on:crashSpend(st) > 0},
          {v:calendarDays(st) + ' days', l:'on the calendar', on:false}]});
}
function ganttRow(st, t, s){
  var crit = s.slack[t.id] === 0;
  var span = Math.max(1, s.total);
  var d = daysOf(st, t);
  return N('gt', {id:'job_' + t.id, name:t.name, trade:t.trade, crit:crit,
    left:Math.round(s.es[t.id] * 100 / span), width:Math.max(3, Math.round(d * 100 / span)),
    slackLeft:Math.round(s.ef[t.id] * 100 / span),
    slackWidth:st.settings.showFloat ? Math.round(s.slack[t.id] * 100 / span) : 0,
    sub:'day ' + s.es[t.id] + '–' + s.ef[t.id] + '  ·  ' + d + 'd'
        + (crashedBy(st, t) ? ' (' + t.days + 'd − ' + crashedBy(st, t) + ')' : '')
        + '  ·  ' + (crit ? 'no float' : s.slack[t.id] + 'd float'),
    act:{type:'NAV', to:'job', params:{id:t.id}}});
}

function scrPlan(st){
  var s = schedule(st);
  var f = st.ui.filter;
  var list = TASKS.filter(function(t){
    if (f === 'crit') return s.slack[t.id] === 0;
    if (f === 'float') return s.slack[t.id] > 0;
    if (f === 'buy') return t.crashMax > crashedBy(st, t);
    if (TRADES.indexOf(f) >= 0) return t.trade === f;
    return true;
  });
  return N('screen', {id:'scr_plan', name:'plan', c:[
    appbar('Trellis'),
    N('scroll', {id:'plan_scroll', c:[
      summary(st),
      N('chips', {id:'plan_chips', c:[['all','Every job'], ['crit','Critical path'],
                                      ['float','Has float'], ['buy','Can go faster']]
        .concat(TRADES.indexOf(f) >= 0 ? [[f, f]] : [])
        .map(function(x){
          return N('chip', {id:'f_' + x[0], text:x[1], on:f === x[0], act:{type:'FILTER', id:x[0]}});
        })}),
      N('sec', {text:'Trades on site'}),
      N('chips', {id:'trade_strip', c: st.order.map(function(tr){
        return N('chip', {id:'tr_' + tr.toLowerCase(), text:tr, on:f === tr,
          act:{type:'FILTER_TRADE', id:tr}});
      })}),
      N('legend', {id:'legend', marks:[{c:'crit', t:'critical'}, {c:'norm', t:'has float'},
                                       {c:'slack', t:'float'}]}),
      N('gantt', {id:'gantt', c:list.map(function(t){ return ganttRow(st, t, s); })}),
      N('padded', {c:[btn('reset_crash', 'Undo everything paid for', {type:'CRASH_RESET'},
                          'block', crashSpend(st) === 0)]}),
      N('space', {})
    ]}),
    tabbar(st)
  ]});
}

/* the graph is laid out here, in the engine, so the picture and the text
 * observation describe exactly the same arrangement */
function levels(st){
  var lv = {}, out = [];
  TASKS.forEach(function(t){
    var n = 0;
    liveDeps(st, t).forEach(function(d){ if (lv[d.id] + 1 > n) n = lv[d.id] + 1; });
    lv[t.id] = n;
    if (!out[n]) out[n] = [];
    out[n].push(t);
  });
  return out;
}
function graphNode(st, t, x, y, w, h, s){
  return {id:'node_' + t.id, name:t.name, days:daysOf(st, t) + 'd',
          crit:s.slack[t.id] === 0, x:x, y:y, w:w, h:h,
          act:{type:'NAV', to:'job', params:{id:t.id}}};
}
function graph(st){
  var s = schedule(st), lv = levels(st);
  var W = 358, H = 44, GAP = 7, ROW = 74, nodes = [], pos = {};
  lv.forEach(function(rowTasks, li){
    var k = rowTasks.length;
    var w = Math.min(96, Math.floor((W - (k - 1) * GAP) / k));
    var x0 = Math.round((W - (k * w + (k - 1) * GAP)) / 2);
    rowTasks.forEach(function(t, i){
      var x = x0 + i * (w + GAP), y = 14 + li * ROW;
      pos[t.id] = {cx:x + w / 2, top:y, bot:y + H};
      nodes.push(graphNode(st, t, x, y, w, H, s));
    });
  });
  var edges = [];
  TASKS.forEach(function(t){
    liveDeps(st, t).forEach(function(d){
      var a = pos[d.id], b = pos[t.id];
      if (!a || !b) return;
      edges.push({x1:a.cx, y1:a.bot, x2:b.cx, y2:b.top,
                  crit:s.slack[t.id] === 0 && s.slack[d.id] === 0 && s.ef[d.id] === s.es[t.id]});
    });
  });
  return {nodes:nodes, edges:edges, height:14 + lv.length * ROW - (ROW - H) + 14,
          levels:lv.map(function(r){ return r.map(function(t){ return t.name; }); })};
}

function scrChain(st){
  var g = graph(st), s = schedule(st);
  var soft = softDeps();
  return N('screen', {id:'scr_chain', name:'chain', c:[
    appbar('What waits for what'),
    N('scroll', {id:'chain_scroll', c:[
      N('legend', {id:'chain_legend', marks:[{c:'crit', t:'critical path'},
                                             {c:'norm', t:'has float'}]}),
      N('graph', {id:'graph', nodes:g.nodes, edges:g.edges, height:g.height, levels:g.levels}),
      N('sec', {text:'Dependencies that are only a preference'}),
      N('card', {id:'soft_list', cls:'flush', c: soft.map(function(x){
        var off = dropped(st, x.t, x.d);
        return row('soft_' + x.t.id + '_' + x.d.id,
          taskOf(x.d.id).name + ' before ' + x.t.name,
          {lead:'share', sub:off ? 'dropped — they can overlap'
                                 : 'kept — ' + x.t.name + ' waits for it',
           arrow:false,
           c:[N('switch', {id:'sw_' + x.t.id + '_' + x.d.id, on:!off,
                act:{type:'DROP_DEP', id:x.t.id, dep:x.d.id}})]});
      })}),
      txt('Dropping one of these is free. Whether it buys a single day is another question — '
          + 'it only helps if that dependency is what the job is actually waiting on.', 'muted'),
      N('sec', {text:'Longest chain'}),
      N('card', {id:'crit_list', cls:'flush', c: s.crit.map(function(id){
        var t = taskOf(id);
        return row('crit_' + id, t.name, {lead:'arrow', sub:'day ' + s.es[id] + '–' + s.ef[id],
          val:daysOf(st, t) + 'd', valCls:'warn',
          act:{type:'NAV', to:'job', params:{id:id}}});
      })}),
      N('space', {})
    ]}),
    tabbar(st)
  ]});
}

function scrJob(st, params){
  var t = taskOf(params.id);
  if (!t) return scrPlan(st);
  var s = schedule(st), crit = s.slack[t.id] === 0;
  var after = TASKS.filter(function(o){
    var yes = false;
    liveDeps(st, o).forEach(function(d){ if (d.id === t.id) yes = true; });
    return yes;
  });
  var body = [
    N('hero', {id:'job_hero', kicker:t.trade.toUpperCase(), title:t.name,
      sub:'day ' + s.es[t.id] + ' to ' + s.ef[t.id] + '  ·  ' + dayLabel(st, s.es[t.id])}),
    N('stats', {id:'job_stats', c:[
      N('stat', {id:'st_len', n:daysOf(st, t) + 'd', l:'length', acc:crashedBy(st, t) > 0}),
      N('stat', {id:'st_float', n:s.slack[t.id] + 'd', l:'float', acc:!crit}),
      N('stat', {id:'st_late', n:'day ' + s.ls[t.id], l:'latest start'})
    ]}),
    txt(crit ? 'This job is on the critical path. Every day it takes is a day on the build.'
             : 'This job has ' + s.slack[t.id] + ' days of float. Making it shorter does not '
               + 'move the finish date at all.', crit ? 'warn' : 'muted'),
    txt(t.note, 'body'),
    N('sec', {text:'Pay it forward'})
  ];
  if (t.crashMax === 0) {
    body.push(N('card', {id:'no_crash', cls:'flush', c:[
      row('crash_none', 'Nothing to buy', {lead:'close', sub:'This job takes what it takes.',
        arrow:false})]}));
  } else {
    body.push(N('card', {id:'crash_card', cls:'flush', c:[
      row('crash_row', 'Days bought off',
        {sub:money(t.crashCost) + ' a day, ' + t.crashMax + ' available', arrow:false,
         c:[stepper('crash_' + t.id, crashedBy(st, t) + ' / ' + t.crashMax,
              {type:'CRASH', id:t.id, by:-1}, {type:'CRASH', id:t.id, by:1})]}),
      row('crash_cost', 'Spent on this job',
        {lead:'money', val:money(crashedBy(st, t) * t.crashCost),
         valCls:crashedBy(st, t) ? 'acc' : '', arrow:false,
         sub:crit ? 'buys days off the build' : 'would not move the finish date'})]}));
  }
  body.push(N('sec', {text:'Waits for'}));
  body.push(N('card', {id:'job_deps', cls:'flush', c: t.deps.length
    ? t.deps.map(function(d){
        var off = d.soft && dropped(st, t, d);
        return row('dep_' + d.id, taskOf(d.id).name,
          {lead:'arrow', sub:(d.soft ? 'a preference' : 'has to finish first')
             + (off ? ' — dropped' : '') + ' · ends day ' + s.ef[d.id],
           val:off ? 'dropped' : '', valCls:'muted',
           act:{type:'NAV', to:'job', params:{id:d.id}}});
      })
    : [txt('Nothing. It can start on day one.', 'empty')]}));
  body.push(N('sec', {text:'Holds up'}));
  body.push(N('card', {id:'job_after', cls:'flush', c: after.length
    ? after.map(function(o){
        return row('nxt_' + o.id, o.name, {lead:'arrow', sub:'starts day ' + s.es[o.id],
          act:{type:'NAV', to:'job', params:{id:o.id}}});
      })
    : [txt('Nothing waits for it.', 'empty')]}));
  body.push(N('space', {}));
  return N('screen', {id:'scr_job', name:'job', params:params, c:[
    appbar(t.name, {back:true}),
    N('scroll', {id:'job_scroll', c:body})
  ]});
}

function scrTrades(st){
  var s = schedule(st);
  return N('screen', {id:'scr_trades', name:'trades', c:[
    appbar('Trades'),
    N('scroll', {id:'trades_scroll', c:[
      N('sec', {text:'Who is on site, and when'}),
      N('card', {id:'trade_list', cls:'flush', c: st.order.map(function(tr){
        var mine = TASKS.filter(function(t){ return t.trade === tr; });
        var days = sum(mine.map(function(t){ return daysOf(st, t); }));
        var onCrit = mine.filter(function(t){ return s.slack[t.id] === 0; }).length;
        var first = Math.min.apply(null, mine.map(function(t){ return s.es[t.id]; }));
        var last  = Math.max.apply(null, mine.map(function(t){ return s.ef[t.id]; }));
        return row('trade_' + tr.toLowerCase(), tr,
          {lead:'user', sub:mine.length + ' job' + (mine.length > 1 ? 's' : '')
             + ' · day ' + first + '–' + last
             + (onCrit ? ' · ' + onCrit + ' on the critical path' : ' · all have float'),
           val:days + 'd', valCls:onCrit ? 'warn' : '',
           act:{type:'FILTER_TRADE', id:tr}});
      })}),

    n.grid.forEach(function(g){ out.push(ind(d+1) + g.v + ' ' + g.l); });
    return true;

      + (n.thumb && typeof thumbHtml === 'function' ? thumbHtml(n.thumb) : '')
      + '<div class="r-main"><div class="r-label' + (n.strike?' strike':'') + '">' + esc(n.text) + '</div>'
      + (n.sub ? '<div class="r-sub">' + esc(n.sub) + '</div>' : '') + '</div>'
      + (n.val ? '<div class="r-value ' + esc(n.valCls||'') + '">' + esc(n.val) + '</div>' : '')
      + R(inline)
      + (n.arrow && !inline.length ? '<div class="r-arrow">' + icon('arrow',15) + '</div>' : '')
      + '</div>' + R(below);
  }
  case 'btn':
    return '<div class="n-btn ' + esc(n.cls||'') + (n.disabled?' off':'') + '"' + tid(n.id)
      + (n.disabled?'':bind(n.act)) + '>' + esc(n.text) + '</div>';
  case 'btnrow': return '<div class="n-btnrow"' + tid(n.id) + '>' + R(n.c) + '</div>';
  case 'bar':    return '<div style="flex:0 0 auto;background:var(--card);border-top:1px solid var(--line);'
                      + 'padding:12px 16px 16px;z-index:30"' + tid(n.id) + '>' + R(n.c) + '</div>';
  case 'switch': return '<div class="n-switch' + (n.on?' on':'') + '"' + tid(n.id) + bind(n.act) + '><i></i></div>';
  case 'check':  return '<div class="n-check' + (n.on?' on':'') + '"' + tid(n.id) + bind(n.act) + '></div>';
  case 'radio':  return '<div class="n-radio' + (n.on?' on':'') + '"' + tid(n.id) + bind(n.act) + '></div>';
  case 'inputrow':
    return '<div class="n-input"><div class="i-label">' + esc(n.label) + '</div>'
      + '<input' + tid(n.id) + bindT(n.act) + ' value="' + esc(n.value) + '" placeholder="'
      + esc(n.placeholder) + '"></div>';
  case 'stepper':
    return '<div style="display:flex;align-items:center;gap:8px"' + tid(n.id) + '>'
      + '<div class="iconbtn" style="background:var(--btn);width:30px;height:30px"' + tid(n.minusId) + bind(n.minus) + '>' + icon('minus',14) + '</div>'
      + '<div style="min-width:52px;text-align:center;font-weight:700;font-size:12.5px;font-variant-numeric:tabular-nums">'
      + esc(n.value) + '</div>'
      + '<div class="iconbtn" style="background:var(--btn);width:30px;height:30px"' + tid(n.plusId) + bind(n.plus) + '>' + icon('plus',14) + '</div></div>';
  case 'stats':  return '<div class="stats"' + tid(n.id) + '>' + R(n.c) + '</div>';
  case 'stat':
    return '<div class="stat' + (n.acc?' acc':'') + (n.act?' tap':'') + '"' + tid(n.id) + bind(n.act)
      + '><div class="st-n">' + esc(n.n) + '</div><div class="st-l">' + esc(n.l) + '</div></div>';
  case 'hero':
    return '<div class="hero' + (n.act?' tap':'') + '"' + tid(n.id) + bind(n.act) + '>'
      + '<div class="he-k">' + esc(n.kicker) + '</div>'
      + '<div class="he-t">' + esc(n.title) + '</div>'
      + '<div class="he-s">' + esc(n.sub) + '</div>' + R(n.c) + '</div>';
  case 'pills':
    return '<div style="display:flex;gap:7px;flex-wrap:wrap;padding:8px 18px 4px"' + tid(n.id) + '>'
      + tagsHtml(n.items) + '</div>';
  case 'tabbar':
    return '<div class="n-tabbar"' + tid(n.id) + '>' + n.items.map(function(i){
      return '<div class="tb' + (i.on?' on':'') + '"' + tid(i.id) + bind(i.act) + '>'
        + '<i>' + icon(i.icon, 21) + '</i>' + esc(i.text) + '</div>';
    }).join('') + '</div>';
  case 'mask':  return '<div class="n-mask"' + tid(n.id) + bind(n.close) + '>' + R(n.c) + '</div>';
  case 'sheet':
    return '<div class="n-sheet"' + tid(n.id) + ' data-stop="1"><div class="sh-hd">'
      + '<div class="t">' + esc(n.title) + '</div>'
      + '<div class="iconbtn"' + tid(n.closeId) + bind(n.close) + '>' + icon('close',15) + '</div></div>'
      + '<div class="sh-bd">' + R(n.c) + '</div></div>';
  case 'dialog':
    return '<div class="dialog"' + tid(n.id) + ' data-stop="1">'
      + '<div style="padding:22px 20px 16px;text-align:center">'
      + (n.title ? '<div style="font:650 17px/1.3 var(--disp);margin-bottom:8px">' + esc(n.title) + '</div>' : '')
      + '<div style="font-size:13.5px;color:var(--ink2);line-height:1.55">' + esc(n.text) + '</div></div>'
      + '<div style="display:flex;gap:10px;padding:0 16px 16px">'
      + '<div class="n-btn" style="flex:1"' + tid(n.cancel.id) + bind(n.cancel.act) + '>' + esc(n.cancel.text) + '</div>'
      + '<div class="n-btn primary" style="flex:1"' + tid(n.ok.id) + bind(n.ok.act) + '>' + esc(n.ok.text) + '</div>'
      + '</div></div>';
  case 'toast': return '<div class="n-toast"' + tid(n.id) + '>' + esc(n.text) + '</div>';
  default: return renderExtra(n);
  }
}
function avatarHtml(a){
  return '<div class="av" style="width:38px;height:38px;border-radius:50%;flex:0 0 auto;display:flex;'
    + 'align-items:center;justify-content:center;font:700 14px/1 var(--disp);color:#fff;background:hsl('
    + a.hue + ' 52% 46%)">' + esc(a.initial) + '</div>';
}

function renderExtra(n){
  switch (n.t) {
  case 'sum':
    return '<div class="sumc"' + tid(n.id) + '><div class="su-k">' + esc(n.kicker) + '</div>'
      + '<div class="su-n">' + esc(n.days) + '</div>'
      + '<div class="su-d">' + esc(n.date) + '</div>'
      + '<div class="su-g">' + n.grid.map(function(g){
          return '<div class="su-i' + (g.on?' on':'') + '"><div class="v">' + esc(g.v)
            + '</div><div class="l">' + esc(g.l) + '</div></div>';
        }).join('') + '</div></div>';
  case 'gantt':
    return '<div class="gantt"' + tid(n.id) + '>' + R(n.c) + '</div>';
  case 'gt':
    return '<div class="gt-r"' + tid(n.id) + bind(n.act) + '>'
      + '<div class="gt-h"><div class="gt-n' + (n.crit?' crit':'') + '">' + esc(n.name) + '</div>'
      + '<div class="gt-t">' + esc(n.trade) + '</div></div>'
      + '<div class="gt-track">'
      + (n.slackWidth > 0 ? '<u style="left:' + n.slackLeft + '%;width:' + n.slackWidth + '%"></u>' : '')
      + '<i class="' + (n.crit?'crit':'') + '" style="left:' + n.left + '%;width:' + n.width + '%"></i>'
      + '</div><div class="gt-s">' + esc(n.sub) + '</div></div>';
  case 'legend':
    return '<div class="legend"' + tid(n.id) + '>' + n.marks.map(function(x){
      var c = x.c === 'crit' ? 'var(--warn)' : (x.c === 'slack' ? 'var(--line2)' : 'var(--accent)');
      return '<span><i style="background:' + c + '"></i>' + esc(x.t) + '</span>';
    }).join('') + '</div>';
  case 'graph': {
    var svg = '<svg width="358" height="' + n.height + '" viewBox="0 0 358 ' + n.height + '">'
      + n.edges.map(function(e){
          var my = (e.y1 + e.y2) / 2;
          return '<path d="M' + e.x1 + ' ' + e.y1 + ' C ' + e.x1 + ' ' + my + ', '
            + e.x2 + ' ' + my + ', ' + e.x2 + ' ' + e.y2 + '" fill="none" stroke="'
            + (e.crit ? 'var(--warn)' : 'var(--line2)') + '" stroke-width="'
            + (e.crit ? 1.8 : 1.2) + '"/>';
        }).join('') + '</svg>';
    return '<div class="gr-wrap"><div class="gr" style="width:358px;height:' + n.height + 'px"'
      + tid(n.id) + '>' + svg + n.nodes.map(function(g){
        return '<div class="gnode' + (g.crit?' crit':'') + '" style="left:' + g.x + 'px;top:'
          + g.y + 'px;width:' + g.w + 'px;height:' + g.h + 'px"' + tid(g.id) + bind(g.act)
          + '><div class="gn-n">' + esc(g.name) + '</div><div class="gn-d">' + esc(g.days)
          + '</div></div>';
      }).join('') + '</div></div>';
  }
  default: return '';
  }
}

var STATE = null;
function paint(){
  ACTS = [];
  app.innerHTML = render(E.screen(STATE));
  var c = '';
  if (c) document.getElementById('sb-clock').textContent = c;
  if (!hud.classList.contains('off')) paintHud();
}
app.addEventListener('click', function(ev){
  var el = ev.target.closest('[data-act]'); if (!el) return;
  if (el.classList.contains('n-mask') && ev.target.closest('[data-stop]')) return;
  var act = ACTS[+el.getAttribute('data-act')]; if (!act) return;
  TRAJ.push({action:'tap', id: el.getAttribute('data-testid') || null});
  STATE = E.reduce(STATE, act); paint();
});
app.addEventListener('input', function(ev){
  var el = ev.target.closest('[data-actt]'); if (!el) return;
  var act = JSON.parse(JSON.stringify(ACTS[+el.getAttribute('data-actt')]));
  for (var k in act) if (act[k] === '$VALUE') act[k] = el.value;
  var id = el.getAttribute('data-testid'), pos = el.selectionStart;
  TRAJ.push({action:'type', id:id, text:el.value});
  STATE = E.reduce(STATE, act); paint();
  var again = id && app.querySelector('[data-testid="' + id + '"]');
  if (again && again.focus) { again.focus(); try { again.setSelectionRange(pos, pos); } catch(e){} }
});

function paintHud(){
  var d = E.derive(STATE);
  hud.innerHTML = '<h4>__ENV__ \u00b7 ' + E.ENV_ID + ' v' + E.VERSION + '</h4>'
    + '<div><span class="k">route</span> ' + d.route + '  <span class="k">step</span> ' + STATE.meta.steps + '</div>'
    + '<div><span class="k">days</span> ' + d.projectDays + '  <span class="k">spend</span> ' + d.crashSpend + '  <span class="k">crit</span> ' + d.criticalCount + '</div>'
    + '<div style="margin-top:8px"><button id="hud-reset">reset</button>'
    + '<button id="hud-a11y">copy a11y</button><button id="hud-state">copy state</button>'
    + '<button id="hud-traj">copy traj</button><button id="hud-hide">hide (h)</button></div>'
    + '<pre>' + esc(E.a11y(STATE)) + '</pre>';
  hud.querySelector('#hud-reset').onclick = function(){ ENVAPI.reset({seed:STATE.meta.seed}); };
  hud.querySelector('#hud-a11y').onclick  = function(){ copy(E.a11y(STATE)); };
  hud.querySelector('#hud-state').onclick = function(){ copy(JSON.stringify(E.snapshot(STATE), null, 2)); };
  hud.querySelector('#hud-traj').onclick  = function(){ copy(JSON.stringify(TRAJ, null, 2)); };
  hud.querySelector('#hud-hide').onclick  = function(){ hud.classList.add('off'); };
}
function copy(t){ try { navigator.clipboard.writeText(t); } catch(e){} }
document.addEventListener('keydown', function(e){
  if (e.key === 'h') { hud.classList.toggle('off'); if (!hud.classList.contains('off')) paintHud(); }
});

var ENVAPI = {
  ENV_ID: E.ENV_ID, VERSION: E.VERSION,
  reset: function(opts){
    opts = opts || {};
    STATE = E.createInitialState(opts.seed || 0);
    if (opts.patch) E.applyPatch(STATE, opts.patch);
    TRAJ = []; paint();
    return E.snapshot(STATE);
  },
  getState:   function(){ return E.snapshot(STATE); },
  setState:   function(s){ STATE = JSON.parse(JSON.stringify(s)); paint(); return true; },
  step:       function(a){ var r = E.step(STATE, a); STATE = r.state; TRAJ.push(a); paint();
                           return {ok:r.ok, error:r.error || null}; },
  dispatch:   function(act){ STATE = E.reduce(STATE, act); paint(); return true; },
  a11y:       function(){ return E.a11y(STATE); },
  elements:   function(){ return E.elements(STATE); },
  route:      function(){ return E.select.route(STATE); },
  trajectory: function(){ return JSON.parse(JSON.stringify(TRAJ)); },
  bounds: function(){
    var base = document.getElementById('screen').getBoundingClientRect(), out = {};
    app.querySelectorAll('[data-testid]').forEach(function(el){
      var r = el.getBoundingClientRect();
      out[el.getAttribute('data-testid')] = {
        x:Math.round(r.left-base.left), y:Math.round(r.top-base.top),
        w:Math.round(r.width), h:Math.round(r.height),
        cx:Math.round(r.left-base.left+r.width/2), cy:Math.round(r.top-base.top+r.height/2)};
    });
    return out;
  }
};
window.__ENV__ = ENVAPI;
var qs = new URLSearchParams(location.search);
if (qs.get('bare') === '1') document.body.classList.add('bare');
if (qs.get('hud')  === '1') hud.classList.remove('off');
ENVAPI.reset({seed: parseInt(qs.get('seed') || '0', 10) || 0});
window.__ENV_READY__ = true;
})();
</script>
